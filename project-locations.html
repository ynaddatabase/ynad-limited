<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Locations Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden;font-family:Poppins,sans-serif;background:#fff}
#mapRoot{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
#leafletMap{position:absolute;inset:0;z-index:1}
.leaflet-marker-pane{z-index:600!important}.leaflet-popup-pane{z-index:700!important}.leaflet-control-container{z-index:800!important}
#filterPanel{position:absolute;top:60px;left:14px;width:270px;max-width:calc(100% - 28px);z-index:1000;background:#fff;border:1px solid #eef0f3;border-radius:16px;box-shadow:0 14px 36px rgba(15,23,42,.16);overflow:hidden;transition:transform .35s,opacity .25s}
#filterPanel.collapsed{transform:translateX(-300px);opacity:0;pointer-events:none}
#filterPanelHeader{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;background:linear-gradient(135deg,#fff7ed,#fff);border-bottom:1px solid #fde9c8}
#filterPanelHeader h3{margin:0;color:#b45309;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
#filterPanelHeader button{width:26px;height:26px;border:0;border-radius:50%;background:#fff;color:#94a3b8;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.1)}
#filterPanelHeader button:hover{background:#d97706;color:#fff}
#filterPanelBody{max-height:62vh;overflow:auto;padding:16px 15px}
.filter-group{margin-bottom:14px}
.filter-group-title{display:flex;align-items:center;gap:6px;margin-bottom:6px;color:#64748b;font-size:10px;font-weight:600}
.filter-group-title i{display:flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:5px;background:#fff3e0;color:#d97706;font-size:9px}
.filter-select,.filter-input{width:100%;box-sizing:border-box;padding:9px 11px;border:1.5px solid #e6eaef;border-radius:9px;background:#f8fafc;color:#1e293b;font-family:inherit;font-size:12px;outline:0}
.filter-select:focus,.filter-input:focus{border-color:#d97706;box-shadow:0 0 0 3px rgba(217,119,6,.14)}
.mode-select{border:0;background:transparent;color:#94a3b8;font:inherit;font-size:10px;cursor:pointer;outline:0}
.range-row{display:none;align-items:center;gap:6px}.range-row.show{display:flex}
#filterResetBtn{width:100%;padding:10px;border:0;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
#filterCount{margin-top:11px;color:#94a3b8;font-size:10.5px;text-align:center;padding:7px;background:#f8fafc;border:1px solid #eef0f3;border-radius:999px}
#filterCount strong{color:#334155}
#filterToggleBtn{position:absolute;top:60px;left:14px;z-index:1000;width:40px;height:40px;border:0;border-radius:7px;background:#fff;color:#d97706;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.22)}
#filterToggleBtn.show{display:flex}
.map-style{position:absolute;top:14px;left:14px;z-index:900;display:flex;width:150px;background:#eef1f5;border-radius:999px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.map-style button{position:relative;z-index:2;flex:1;border:0;background:transparent;color:#64748b;padding:8px 0;font:inherit;font-size:11px;font-weight:600;border-radius:999px;cursor:pointer;transition:color .25s}
.map-style button.active{color:#fff}
#mapStyleThumb{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);background:linear-gradient(135deg,#d97706,#b45309);border-radius:999px;transition:transform .3s;z-index:1}
.map-style.sat #mapStyleThumb{transform:translateX(100%)}
.fullscreen-btn,.map-reset-btn{position:absolute;right:14px;z-index:1001;width:40px;height:40px;border:0;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.fullscreen-btn{top:14px;border-radius:4px;color:#555}
.map-reset-btn{top:62px;border-radius:50%;color:#d97706}
.map-reset-btn:hover{background:#d97706;color:#fff}
.map-controls{position:absolute;right:14px;bottom:56px;z-index:1000;width:178px;height:128px}
.map-controls .ctrl{transition:opacity .25s,transform .25s}
.map-controls.collapsed .ctrl:not(.map-open):not(.street-btn){opacity:0;transform:scale(.55);pointer-events:none}
.ctrl{position:absolute;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#555;box-shadow:0 2px 7px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;padding:0}
.ctrl:hover{background:#f5f5f5}
.pan-up{top:0;left:44px}.pan-left{top:44px;left:0}.map-open{top:44px;left:44px}.pan-right{top:44px;left:88px}.pan-down{top:88px;left:44px}
.zoom-in{top:0;left:138px}.zoom-out{top:44px;left:138px}
.street-btn{top:88px;left:138px;border-radius:4px;color:#e2a600;font-size:19px}
#mapLegend{position:absolute;left:14px;bottom:12px;z-index:1000;padding:8px 12px;background:rgba(255,255,255,.97);border:1px solid #ddd;border-radius:7px;box-shadow:0 4px 15px rgba(0,0,0,.12);display:flex;gap:12px;font-size:11px}
.legend-button{display:flex;align-items:center;gap:5px;border:0;background:transparent;font:inherit;color:#334155;padding:0;cursor:pointer}
.legend-dot{width:10px;height:10px;border-radius:50%}
.leaflet-marker-icon.project-marker-icon{overflow:visible!important;background:none;border:0}
.project-pin{width:44px;height:56px}
.project-pin svg{width:44px;height:56px;overflow:visible;filter:drop-shadow(0 4px 5px rgba(15,23,42,.35));transition:transform .18s,filter .18s;transform-origin:50% 95%}
.project-pin:hover svg{transform:translateY(-3px) scale(1.1);filter:drop-shadow(0 8px 9px rgba(15,23,42,.4))}
.district-label-icon{background:transparent!important;border:0!important}
.district-label{display:inline-block;padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.72);color:#334155;font-size:9px;font-weight:600;text-transform:uppercase;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none}
.division-tooltip{padding:5px 10px;border:0;border-radius:7px;background:#0f172a;color:#fff;font-family:Poppins,sans-serif;font-size:11px;font-weight:600}
:root{--pp-bg:#fff;--pp-fg:#334155;--pp-mut:#94a3b8}
html.dark{--pp-bg:#1e293b;--pp-fg:#e2e8f0;--pp-mut:#94a3b8}
.leaflet-popup-content-wrapper{border-radius:14px;background:var(--pp-bg);color:var(--pp-fg);box-shadow:0 12px 30px rgba(0,0,0,.28)}
.leaflet-popup-tip{background:var(--pp-bg)}
.leaflet-popup-content{margin:0;width:250px!important}
.leaflet-container a.leaflet-popup-close-button{color:var(--pp-mut)}
.popup-head{padding:12px 14px 6px}
.popup-row{display:flex;justify-content:space-between;gap:12px;padding:4px 14px;font-size:11px;color:var(--pp-fg)}
.popup-row span:first-child{color:var(--pp-mut);flex-shrink:0}
.popup-row span:last-child{text-align:right;font-weight:500;word-break:break-word}
.popup-status{display:inline-block;padding:3px 11px;border-radius:999px;color:#fff;font-size:10px;font-weight:700}
.popup-map{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 8px 8px;padding:9px 0;border-radius:10px;color:#fff!important;font-size:12px;font-weight:600;text-decoration:none;box-shadow:0 4px 10px rgba(0,0,0,.18);transition:filter .15s,transform .15s}
.popup-map:hover{filter:brightness(1.08);transform:translateY(-1px)}
.popup-map .gm{display:flex;width:22px;height:22px;border-radius:50%;background:#fff;align-items:center;justify-content:center}
.popup-map .gm svg{width:15px;height:15px}
.popup-actions{display:flex;gap:8px;margin:10px 8px 8px}
.popup-actions .popup-map{flex:1;margin:0}
.project-pin{transform-origin:50% 96%}
.pin-in{animation:pinIn .45s cubic-bezier(.2,.9,.3,1.25) both}
.pin-out{animation:pinOut .3s ease-in forwards;pointer-events:none}
@keyframes pinIn{from{transform:scale(0) translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes pinOut{to{transform:scale(0) translateY(12px);opacity:0}}
#mapLoadingState{position:absolute;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;background:#fff;color:#64748b;font-size:12px}
#zoomHint{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:900;padding:5px 12px;background:rgba(255,255,255,.92);border:1px solid #eee;border-radius:999px;color:#64748b;font-size:11px;pointer-events:none;white-space:nowrap}
@media(max-width:640px){#filterPanel{width:230px}.map-controls{right:8px;bottom:48px;transform:scale(.9);transform-origin:bottom right}#zoomHint{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="pinDefs"></defs></svg>
<div id="mapRoot">
<div id="leafletMap"></div>
<div id="mapLoadingState"><i class="fa-solid fa-spinner fa-spin" style="margin-right:8px;color:#d97706"></i>Loading project locations...</div>
<div id="zoomHint">Use Ctrl + Scroll to zoom the map</div>
<div class="map-style" id="mapStyleSwitch"><div id="mapStyleThumb"></div>
<button id="mapBtn" class="active" onclick="setMapType('map')">Map</button>
<button id="satBtn" onclick="setMapType('sat')">Satellite</button></div>
<button id="filterToggleBtn" onclick="toggleFilterPanel()" title="Filter"><i class="fa-solid fa-sliders"></i></button>
<button class="fullscreen-btn" onclick="fullscreenMap()" title="Fullscreen"><i id="fullscreenIcon" class="fa-solid fa-expand"></i></button>
<button class="map-reset-btn" onclick="resetMapView()" title="Recenter"><i class="fa-solid fa-location-crosshairs"></i></button>

<div id="filterPanel" class="collapsed">
<div id="filterPanelHeader"><h3><i class="fa-solid fa-filter"></i> Filter Projects</h3><button onclick="toggleFilterPanel()" title="Close"><i class="fa-solid fa-xmark"></i></button></div>
<div id="filterPanelBody">
<div class="filter-group"><div class="filter-group-title"><i class="fa-solid fa-layer-group"></i>Category</div>
<select id="filterCategory" class="filter-select" onchange="applyFilters()"><option value="">All Categories</option><option>Masjid</option><option>Madrasa</option><option>Markaz</option><option>Orphanage</option><option>Ablution</option><option>Water Well</option><option>Clinic</option></select></div>
<div class="filter-group"><div class="filter-group-title"><i class="fa-solid fa-circle-notch"></i>Status</div>
<select id="filterStatus" class="filter-select" onchange="applyFilters()"><option value="">All Statuses</option><option>Ongoing</option><option>Completed</option><option>Upcoming</option></select></div>
<div class="filter-group"><div class="filter-group-title"><i class="fa-solid fa-building"></i>Organization</div><input type="text" id="filterOrganization" class="filter-input" oninput="applyFilters()" placeholder="e.g. WAMY"></div>
<div class="filter-group"><div class="filter-group-title"><i class="fa-solid fa-hand-holding-heart"></i>Donor Name / ID</div><input type="text" id="filterDonor" class="filter-input" oninput="applyFilters()" placeholder="Name or ID"></div>
<div class="filter-group"><div class="filter-group-title"><i class="fa-solid fa-earth-asia"></i>Donated Country</div><input type="text" id="filterCountry" class="filter-input" list="worldCountryList" oninput="applyFilters()" placeholder="Enter country name"><datalist id="worldCountryList"></datalist></div>
<div class="filter-group"><div class="filter-group-title"><i class="fa-solid fa-coins"></i>Cost <select id="costMode" class="mode-select" onchange="onModeChange('cost')"><option value="exact">Exact Cost</option><option value="range">Cost Range</option></select></div>
<div id="costExactWrap"><input type="number" id="filterCostExact" class="filter-input" oninput="applyFilters()" placeholder="Enter exact cost"></div>
<div id="costRangeWrap" class="range-row"><input type="number" id="filterCostMin" class="filter-input" oninput="applyFilters()" placeholder="Min"><span>—</span><input type="number" id="filterCostMax" class="filter-input" oninput="applyFilters()" placeholder="Max"></div></div>
<div class="filter-group"><div class="filter-group-title"><i class="fa-solid fa-location-dot"></i>BD District</div><input type="text" id="filterDistrict" class="filter-input" list="bdDistrictList" oninput="applyFilters()" placeholder="Enter district name"><datalist id="bdDistrictList"></datalist></div>
<div class="filter-group"><div class="filter-group-title"><i class="fa-solid fa-calendar-days"></i>Date <select id="dateMode" class="mode-select" onchange="onModeChange('date')"><option value="exact">Exact Date</option><option value="range">Date Range</option></select></div>
<div id="dateExactWrap"><input type="date" id="filterDateExact" class="filter-input" onchange="applyFilters()"></div>
<div id="dateRangeWrap" class="range-row"><input type="date" id="filterDateMin" class="filter-input" onchange="applyFilters()"><span>—</span><input type="date" id="filterDateMax" class="filter-input" onchange="applyFilters()"></div></div>
<div class="filter-group"><div class="filter-group-title"><i class="fa-solid fa-helmet-safety"></i>Engineer Name / ID</div><input type="text" id="filterEngineer" class="filter-input" oninput="applyFilters()" placeholder="Name or ID"></div>
<button id="filterResetBtn" onclick="resetFilters()">Reset Filters</button>
<div id="filterCount"><strong>0</strong> of <strong>0</strong> projects shown</div>
</div></div>

<div class="map-controls" id="mapControls">
<button class="ctrl pan-up" data-dx="0" data-dy="-1"><i class="fa-solid fa-chevron-up"></i></button>
<button class="ctrl zoom-in"><i class="fa-solid fa-plus"></i></button>
<button class="ctrl pan-left" data-dx="-1" data-dy="0"><i class="fa-solid fa-chevron-left"></i></button>
<button class="ctrl map-open" onclick="toggleControls()"><i id="mapOpenIcon" class="fa-solid fa-up-right-and-down-left-from-center"></i></button>
<button class="ctrl pan-right" data-dx="1" data-dy="0"><i class="fa-solid fa-chevron-right"></i></button>
<button class="ctrl pan-down" data-dx="0" data-dy="1"><i class="fa-solid fa-chevron-down"></i></button>
<button class="ctrl zoom-out"><i class="fa-solid fa-minus"></i></button>
<button class="ctrl street-btn" onclick="openGoogleMaps()"><i class="fa-solid fa-street-view"></i></button>
</div>
<div id="mapLegend">
<button class="legend-button" onclick="setStatusFromSummary('Ongoing')"><span class="legend-dot" style="background:#f59e0b"></span>Ongoing <b id="legendCountOngoing">0</b></button>
<button class="legend-button" onclick="setStatusFromSummary('Completed')"><span class="legend-dot" style="background:#16a34a"></span>Completed <b id="legendCountCompleted">0</b></button>
<button class="legend-button" onclick="setStatusFromSummary('Upcoming')"><span class="legend-dot" style="background:#2563eb"></span>Upcoming <b id="legendCountUpcoming">0</b></button>
</div>
</div>

<script>
const SUPABASE_URL='https://zjbvnwawdgdncthktqtx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_KLOwVeJVKzC8Lo2slNnH0A_PdhW5BlT';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
/* Status colours: change here and pins + legend popup follow */
const COLORS={Ongoing:'#f59e0b',Completed:'#16a34a',Upcoming:'#2563eb'};
const OTHER='#64748b';
let map,markerLayer,allProjects=[],mapLayer,satLayer,labelsLayer,districtLabelsLayer,bdBoundaryLayer,divisionLayer,bdMaskPolygon;
let initialMapCenter=L.latLng(23.8103,90.4125),initialMapZoom=8;

/* >>> PASTE your existing BD_COUNTRY_RINGS array here (replace the [] ). Empty = no outside-fade, everything else still works. <<< */
const BD_COUNTRY_RINGS=[];

const DIVISION_SERVICE_BASE='https://services5.arcgis.com/FKwcDz27wRAj4HUT/ArcGIS/rest/services/Administrative_Divisions_of_Bangladesh_WFL1/FeatureServer';
const DIVISION_LAYERS=[{name:'Chattogram',id:0},{name:'Barishal',id:2},{name:'Khulna',id:3},{name:'Dhaka',id:4},{name:'Rajshahi',id:5},{name:'Sylhet',id:6},{name:'Mymensingh',id:7},{name:'Rangpur',id:8}];
const DIVISION_COLORS={Dhaka:'#d97706',Chattogram:'#0891b2',Khulna:'#16a34a',Rajshahi:'#7c3aed',Rangpur:'#dc2626',Barishal:'#2563eb',Sylhet:'#db2777',Mymensingh:'#65a30d'};
const DISTRICT_GEOJSON_URL='https://raw.githubusercontent.com/Cipher-Text/geo-vault/main/data/bd/geojson/districts.geojson';

/* Built-in district centres: pins always show even if a project has no coordinates */
const DIST_XY={};
"Bagerhat:22.66,89.79;Bandarban:22.19,92.22;Barguna:22.15,90.12;Barishal:22.70,90.37;Bhola:22.69,90.65;Bogura:24.85,89.37;Brahmanbaria:23.96,91.11;Chandpur:23.23,90.65;Chattogram:22.36,91.78;Chuadanga:23.64,88.85;Cox's Bazar:21.45,91.98;Cumilla:23.46,91.18;Dhaka:23.81,90.41;Dinajpur:25.63,88.64;Faridpur:23.60,89.84;Feni:23.02,91.40;Gaibandha:25.33,89.53;Gazipur:24.00,90.42;Gopalganj:23.01,89.83;Habiganj:24.38,91.42;Jamalpur:24.92,89.94;Jashore:23.17,89.21;Jhalokati:22.64,90.20;Jhenaidah:23.54,89.17;Joypurhat:25.10,89.02;Khagrachhari:23.12,91.98;Khulna:22.82,89.55;Kishoreganj:24.43,90.78;Kurigram:25.81,89.64;Kushtia:23.90,89.12;Lakshmipur:22.94,90.84;Lalmonirhat:25.99,89.45;Madaripur:23.17,90.20;Magura:23.49,89.42;Manikganj:23.86,90.00;Meherpur:23.76,88.63;Moulvibazar:24.48,91.77;Munshiganj:23.55,90.53;Mymensingh:24.75,90.41;Naogaon:24.80,88.94;Narail:23.17,89.50;Narayanganj:23.62,90.50;Narsingdi:23.92,90.72;Natore:24.41,89.00;Netrokona:24.87,90.73;Nilphamari:25.93,88.86;Noakhali:22.87,91.10;Pabna:24.00,89.25;Panchagarh:26.34,88.55;Patuakhali:22.36,90.33;Pirojpur:22.58,89.97;Rajbari:23.76,89.64;Rajshahi:24.37,88.60;Rangamati:22.73,92.30;Rangpur:25.75,89.25;Satkhira:22.72,89.07;Shariatpur:23.24,90.43;Sherpur:25.02,90.02;Sirajganj:24.45,89.70;Sunamganj:25.07,91.40;Sylhet:24.90,91.87;Tangail:24.25,89.92;Thakurgaon:26.03,88.46".split(';').forEach(s=>{const[n,c]=s.split(':'),[a,b]=c.split(',');DIST_XY[dKey(n)]=[+a,+b];});
const ALIAS={comilla:'cumilla',chittagong:'chattogram',barisal:'barishal',bogra:'bogura',jessore:'jashore',coxsbazar:'coxsbazar',coxbazar:'coxsbazar',maulvibazar:'moulvibazar',jhalakathi:'jhalokati',jhalakati:'jhalokati',khagrachari:'khagrachhari',khagrachhari:'khagrachhari',brahmanbaria:'brahmanbaria',netrakona:'netrokona',nawabganj:'chapainawabganj'};
function dKey(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/[^a-z0-9]+/g,'');}
function districtXY(name){
  const parts=String(name||'').split(/[,/()-]/).map(s=>s.trim()).filter(Boolean);
  for(const part of parts){let k=dKey(part);k=ALIAS[k]||k;if(DIST_XY[k])return DIST_XY[k];}
  const all=dKey(name);
  for(const k in DIST_XY){if(all&&all.includes(k))return DIST_XY[k];}
  return null;
}

/* ---------- helpers ---------- */
function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function normalizeStatus(v){
  const s=String(v==null?'':v).trim().toLowerCase();
  if(s==='ongoing'||s==='on going'||s==='running'||s==='in progress')return'Ongoing';
  if(s==='completed'||s==='complete'||s==='done'||s==='finished')return'Completed';
  if(s==='upcoming'||s==='pending'||s==='planned')return'Upcoming';
  return String(v==null?'':v).trim();
}
const statusColor=s=>COLORS[normalizeStatus(s)]||OTHER;
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const t=p<0?0:255,a=Math.abs(p);
  r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);
  return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function buildPinGradients(){
  const all={...COLORS,Other:OTHER};
  document.getElementById('pinDefs').innerHTML=Object.keys(all).map(k=>{const c=all[k];
    return`<linearGradient id="pg-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(c,.38)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${shade(c,-.32)}"/></linearGradient>`;}).join('');
}
function num(v){if(v==null||String(v).trim()==='')return NaN;return Number(v);}
function inBD(la,ln){return la>=20&&la<=27&&ln>=88&&ln<=93;}

function getCoords(link){
  if(link==null)return null;
  let s=String(link).trim();if(!s)return null;
  try{s=decodeURIComponent(s);}catch(e){}
  const pats=[/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/,/[?&#](?:q|query|ll|center|destination)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/i,/(-?\d{1,3}\.\d{3,})\s*[,;|\s]\s*(-?\d{1,3}\.\d{3,})/];
  for(const re of pats){
    const m=s.match(re);if(!m)continue;
    const a=+m[1],b=+m[2];
    if(inBD(a,b))return{lat:a,lng:b};
    if(inBD(b,a))return{lat:b,lng:a};
  }
  return null;
}
function getProjectCoords(p){
  /* FIX: Number(null) is 0, so empty lat/lng used to become (0,0) and zoomed the map to the whole world */
  const pairs=[['latitude','longitude'],['lat','lng'],['lat','lon'],['project_latitude','project_longitude'],['location_lat','location_lng']];
  for(const[lk,gk]of pairs){
    const la=num(p[lk]),ln=num(p[gk]);
    if(inBD(la,ln))return{lat:la,lng:ln};
    if(inBD(ln,la))return{lat:ln,lng:la};
  }
  for(const k of Object.keys(p)){
    if(!/link|map|url|location|coord/i.test(k))continue;
    const c=getCoords(p[k]);if(c)return c;
  }
  return null;
}

/* Give every project a display position; overlapping pins are spread on a small spiral so none hide behind another */
function placeAll(){
  const groups={};
  allProjects.forEach(p=>{
    let base=null,approx=false;
    if(Number.isFinite(p._lat)&&Number.isFinite(p._lng))base=[p._lat,p._lng];
    else{const d=districtXY(p.district);if(d){base=d;approx=true;}}
    p._base=base;p._approxLocation=approx;p._plat=p._plng=null;
    if(!base)return;
    const key=base[0].toFixed(4)+','+base[1].toFixed(4);
    (groups[key]=groups[key]||[]).push(p);
  });
  Object.values(groups).forEach(list=>{
    list.forEach((p,i)=>{
      if(list.length===1){p._plat=p._base[0];p._plng=p._base[1];return;}
      const step=p._approxLocation?0.014:0.0009,ang=i*2.39996,r=step*Math.sqrt(i);
      p._plat=p._base[0]+r*Math.sin(ang);
      p._plng=p._base[1]+r*Math.cos(ang)*1.08;
    });
  });
}

/* ---------- premium pin ---------- */
function makePin(p,index){
  const st=normalizeStatus(p.status),c=statusColor(st),g=COLORS[st]?st:'Other';
  const n=markerNumber(p,p._k),fs=n.length>3?9.5:n.length>2?11:12.5;
  return L.divIcon({className:'project-marker-icon',iconSize:[44,56],iconAnchor:[22,54],popupAnchor:[0,-48],
  html:`<div class="project-pin pin-in" style="animation-delay:${Math.min((index||0)*10,380)}ms" title="${esc(p.project_name||st||'Project')}"><svg viewBox="0 0 44 56" aria-hidden="true">
<ellipse cx="22" cy="53.5" rx="8" ry="2.4" fill="rgba(15,23,42,.3)"/>
<path d="M22 2C11.5 2 3 10.4 3 20.8c0 14.2 19 31.7 19 31.7s19-17.5 19-31.7C41 10.4 32.5 2 22 2Z" fill="url(#pg-${g})" stroke="#fff" stroke-width="2"/>
<path d="M8.5 15C11.5 7.5 19.5 4 27 6.2 18.5 6.2 12.5 9.8 8.5 15Z" fill="rgba(255,255,255,.38)"/>
<circle cx="22" cy="20.5" r="11.2" fill="#fff"/>
<circle cx="22" cy="20.5" r="9.2" fill="none" stroke="${c}" stroke-opacity=".28" stroke-width="1.2"/>
<text x="22" y="${20.5+fs*0.36}" text-anchor="middle" font-family="Poppins,sans-serif" font-size="${fs}" font-weight="700" fill="${shade(c,-.18)}">${esc(n)}</text></svg></div>`});
}
function markerNumber(p,index){
  for(const v of[p?.bd_number,p?.ho_number,p?.project_number,p?.project_id,p?.id]){
    if(v==null||String(v).trim()==='')continue;
    const d=String(v).match(/\d+/g);
    if(d&&d.join('')){const j=d.join('');return j.length>4?j.slice(-4):j;}
  }
  return String(index+1);
}
function mapUrl(p){
  if(Number.isFinite(p._lat)&&Number.isFinite(p._lng))return`https://www.google.com/maps/search/?api=1&query=${p._lat},${p._lng}`;
  for(const k of Object.keys(p)){if(/link|url/i.test(k)&&/^https?:/i.test(String(p[k])))return String(p[k]);}
  return p._base?`https://www.google.com/maps/search/?api=1&query=${p._base[0]},${p._base[1]}`:'';
}
/* Details page is built in: project_view.html. Edit that file any time, the map always opens it as project_view.html?id=<id>.
   It is resolved against your website (parent page / referrer), so it works even when this map sits inside an iframe.
   If project_view.html lives somewhere else, set SITE_BASE, e.g. 'https://ynad.unaux.com/'. */
const DETAIL_PAGE='project_view.html',SITE_BASE='';
function detailUrl(p){
  const own=p.detail_url||p.page_url||p.details_url;if(own)return String(own);
  const id=p.id!=null?p.id:(p.bd_number||p.ho_number||p._k);
  let base=SITE_BASE;
  if(!base){try{base=parent.location.href;}catch(e){base=document.referrer||location.href;}}
  try{return new URL(`${DETAIL_PAGE}?id=${encodeURIComponent(id)}`,base).href;}
  catch(e){return`${DETAIL_PAGE}?id=${encodeURIComponent(id)}`;}
}
function popup(p){
  const st=normalizeStatus(p.status),c=statusColor(st);
  const pick=(...ks)=>{for(const k of ks){if(p[k]!=null&&String(p[k]).trim()!=='')return p[k];}return'';};
  const row=(l,v)=>v!==''?`<div class="popup-row"><span>${l}</span><span>${esc(v)}</span></div>`:'';
  const url=mapUrl(p);
  return`<div><div class="popup-head"><span class="popup-status" style="background:${c}">${esc(st||'N/A')}</span></div>`
  +row('Official Name',pick('official_name','project_name','name','title'))
  +row('Local Name',pick('local_name','project_local_name','local_project_name','name_local','bangla_name','name_bn'))
  +row('Category',pick('category','project_type'))
  +row('Organization',pick('organization','organisation','org'))
  +row('Donated Country',pick('donated_country','country'))
  +row('Location',pick('district'))
  +row('HO Code',pick('ho_number','ho_code'))
  +row('BD Code',pick('bd_number','bd_code'))
  +`<div class="popup-actions">`
  +(url?`<a class="popup-map" href="${esc(url)}" target="_blank" rel="noopener" style="background:${c}"><span class="gm"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z" fill="#ea4335"/><circle cx="12" cy="9" r="2.8" fill="#fff"/></svg></span><span>Map</span></a>`:'')
  +`<a class="popup-map" href="${esc(detailUrl(p))}" target="_blank" rel="noopener" style="background:${shade(c,-.35)}" title="Full history, images and details"><span class="gm"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z" fill="${c}"/><path d="M14 3v5h5" fill="#fff" fill-opacity=".55"/><path d="M10 13h6M10 16.5h6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span><span>Details</span></a>`
  +`</div></div>`;
}
/* Dark mode: follows ?theme=dark, OS setting, parent page (same-origin) or postMessage({theme:'dark'|'light'}) */
function setTheme(d){document.documentElement.classList.toggle('dark',!!d);}
function initTheme(){
  const q=new URLSearchParams(location.search).get('theme'),mq=matchMedia('(prefers-color-scheme: dark)');
  if(q)setTheme(q==='dark');
  else{setTheme(mq.matches);if(mq.addEventListener)mq.addEventListener('change',e=>setTheme(e.matches));}
  addEventListener('message',e=>{const t=e.data&&e.data.theme;if(t)setTheme(t==='dark');});
  try{
    const r=parent.document.documentElement,b=parent.document.body;
    const chk=()=>/dark/i.test(r.className+' '+b.className)||r.dataset.theme==='dark'||r.dataset.bsTheme==='dark'||b.dataset.theme==='dark';
    setTheme(chk());
    const o=new MutationObserver(()=>setTheme(chk()));
    o.observe(r,{attributes:true});o.observe(b,{attributes:true});
  }catch(e){}
}

/* ---------- filters (FIX: tolerant matching, any column name, safe cost/date compare) ---------- */
const KEYS={
  category:['category','project_type','type'],
  organization:['organization','organisation','org','org_name'],
  donor:['donor_name','donor_id','donor','donor_code'],
  country:['donated_country','country','donor_country'],
  district:['district','bd_district','location_district'],
  engineer:['engineer_name','engineer_id','engineer']
};
const clean=v=>String(v==null?'':v).trim().toLowerCase();
const alnum=v=>clean(v).replace(/[^a-z0-9]+/g,'');
function hay(p,field){
  const keys=KEYS[field];
  if(!keys.some(k=>k in p))return clean(JSON.stringify(p)); /* column name differs: search the whole record */
  return clean(keys.map(k=>p[k]).filter(v=>v!=null).join(' '));
}
function textMatch(p,field,q){
  q=clean(q);if(!q)return true;
  let h=hay(p,field);
  if(field==='category'&&!h.trim())h=clean(p.project_name);
  return h.includes(q)||alnum(h).includes(alnum(q));
}
function getFiltered(){
  const g=id=>document.getElementById(id).value;
  const status=normalizeStatus(g('filterStatus'));
  const costMode=g('costMode'),dateMode=g('dateMode');
  const cEx=parseFloat(g('filterCostExact')),cMin=parseFloat(g('filterCostMin')),cMax=parseFloat(g('filterCostMax'));
  const dEx=g('filterDateExact'),dMin=g('filterDateMin'),dMax=g('filterDateMax');
  return allProjects.filter(p=>{
    if(status&&normalizeStatus(p.status)!==status)return false;
    if(!textMatch(p,'category',g('filterCategory')))return false;
    if(!textMatch(p,'organization',g('filterOrganization')))return false;
    if(!textMatch(p,'donor',g('filterDonor')))return false;
    if(!textMatch(p,'country',g('filterCountry')))return false;
    if(!textMatch(p,'district',g('filterDistrict')))return false;
    if(!textMatch(p,'engineer',g('filterEngineer')))return false;
    const cost=num(String(p.cost==null?'':p.cost).replace(/[^\d.\-]/g,''));
    if(costMode==='exact'){if(Number.isFinite(cEx)&&cost!==cEx)return false;}
    else{
      if(Number.isFinite(cMin)&&!(cost>=cMin))return false;
      if(Number.isFinite(cMax)&&!(cost<=cMax))return false;
    }
    const d=String(p.opening_date||'').slice(0,10);
    if(dateMode==='exact'){if(dEx&&d!==dEx)return false;}
    else{
      if(dMin&&(!d||d<dMin))return false;
      if(dMax&&(!d||d>dMax))return false;
    }
    return true;
  });
}
function updateStatusSummary(){
  const c={Ongoing:0,Completed:0,Upcoming:0};
  allProjects.forEach(p=>{const s=normalizeStatus(p.status);if(s in c)c[s]++;});
  Object.keys(c).forEach(k=>{const el=document.getElementById('legendCount'+k);if(el)el.textContent=c[k];});
}
function setStatusFromSummary(s){
  const f=document.getElementById('filterStatus');
  f.value=f.value===s?'':s;applyFilters();
}
const markers=new Map();
const pinEl=m=>{const e=m.getElement();return e&&e.querySelector('.project-pin');};
function applyFilters(){
  const data=getFiltered(),want=new Set();
  updateStatusSummary();
  let i=0;
  data.forEach(p=>{
    if(!Number.isFinite(p._plat))return;
    want.add(p._k);
    const e=markers.get(p._k);
    if(e){
      if(e.leaving){clearTimeout(e.t);e.leaving=false;const el=pinEl(e.m);if(el){el.classList.remove('pin-out','pin-in');void el.offsetWidth;el.classList.add('pin-in');}}
      return;
    }
    const m=L.marker([p._plat,p._plng],{icon:makePin(p,i++),pane:'projectMarkersPane',riseOnHover:true}).bindPopup(popup(p)).addTo(markerLayer);
    markers.set(p._k,{m,leaving:false});
  });
  markers.forEach((e,k)=>{
    if(want.has(k)||e.leaving)return;
    e.leaving=true;e.m.closePopup();
    const el=pinEl(e.m);if(el)el.classList.add('pin-out');
    e.t=setTimeout(()=>{markerLayer.removeLayer(e.m);markers.delete(k);},320);
  });
  const n=document.querySelectorAll('#filterCount strong');
  n[0].textContent=data.length;n[1].textContent=allProjects.length;
}
function clearFilterInputs(){
  ['filterCategory','filterStatus','filterOrganization','filterDonor','filterCountry','filterCostExact','filterCostMin','filterCostMax','filterDistrict','filterDateExact','filterDateMin','filterDateMax','filterEngineer'].forEach(id=>{document.getElementById(id).value='';});
  ['cost','date'].forEach(k=>{document.getElementById(k+'Mode').value='exact';document.getElementById(k+'ExactWrap').style.display='block';document.getElementById(k+'RangeWrap').classList.remove('show');});
}
function onModeChange(k){
  const range=document.getElementById(k+'Mode').value==='range',K=k[0].toUpperCase()+k.slice(1);
  document.getElementById(k+'ExactWrap').style.display=range?'none':'block';
  document.getElementById(k+'RangeWrap').classList.toggle('show',range);
  ['filter'+K+'Exact','filter'+K+'Min','filter'+K+'Max'].forEach(id=>document.getElementById(id).value='');
  applyFilters();
}
function resetFilters(){clearFilterInputs();applyFilters();}
function toggleFilterPanel(){
  const panel=document.getElementById('filterPanel'),btn=document.getElementById('filterToggleBtn');
  const opening=panel.classList.contains('collapsed');
  panel.classList.toggle('collapsed',!opening);btn.classList.toggle('show',!opening);
}

/* ---------- boundaries ---------- */
function addBangladeshHighlight(){
  if(bdBoundaryLayer)map.removeLayer(bdBoundaryLayer);
  bdBoundaryLayer=L.layerGroup().addTo(map);
  if(!BD_COUNTRY_RINGS.length)return;
  bdMaskPolygon=L.polygon([[[85,-190],[85,190],[-85,190],[-85,-190]],...BD_COUNTRY_RINGS],{stroke:false,fillColor:'#eef2f6',fillOpacity:.62,interactive:false}).addTo(bdBoundaryLayer);
  L.polygon(BD_COUNTRY_RINGS,{fill:false,color:'#d97706',weight:1.8,opacity:.75,interactive:false}).addTo(bdBoundaryLayer);
}
function applyMaskStyle(type){if(bdMaskPolygon)bdMaskPolygon.setStyle({fillOpacity:type==='sat'?.82:.62});}
async function loadDivisionBoundaries(){
  divisionLayer=L.layerGroup().addTo(map);
  await Promise.all(DIVISION_LAYERS.map(async({name,id})=>{
    try{
      const r=await fetch(`${DIVISION_SERVICE_BASE}/${id}/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&f=geojson`,{cache:'force-cache'});
      if(!r.ok)throw new Error(r.status);
      const color=DIVISION_COLORS[name]||'#64748b';
      L.geoJSON(await r.json(),{
        pane:'divisionPane',
        style:()=>({color,weight:1,opacity:0,fillColor:color,fillOpacity:0}),
        onEachFeature:(f,l)=>{
          l.bindTooltip(name,{sticky:true,className:'division-tooltip'});
          l.on('mouseover',function(){this.setStyle({weight:1.6,opacity:.45,fillOpacity:.08});});
          l.on('mouseout',function(){this.setStyle({weight:1,opacity:0,fillOpacity:0});});
        }
      }).addTo(divisionLayer);
    }catch(e){console.warn('Division boundary failed:',name,e);}
  }));
}
async function loadDistrictBoundaries(){
  try{
    const r=await fetch(DISTRICT_GEOJSON_URL,{cache:'force-cache'});
    if(!r.ok)throw new Error(r.status);
    L.geoJSON(await r.json(),{
      pane:'districtPane',
      style:()=>({fill:false,color:'#64748b',weight:1,opacity:.72}),
      onEachFeature:(f,l)=>{
        const pr=f.properties||{},name=pr.name||pr.NAME_2||pr.NAME||pr.district||pr.shapeName||'';
        if(!name)return;
        L.marker(l.getBounds().getCenter(),{icon:L.divIcon({className:'district-label-icon',html:`<span class="district-label">${esc(name)}</span>`,iconSize:[0,0]}),interactive:false}).addTo(districtLabelsLayer);
      }
    }).addTo(map);
  }catch(e){console.warn('District boundary failed:',e);}
}

/* ---------- map controls ---------- */
function panMap(x,y){const s=map.getSize();map.panBy([x*s.x*.28,y*s.y*.28],{animate:true,duration:.4});}
function bindHold(el,action,ms){
  let t=null;
  const stop=()=>{if(t){clearInterval(t);t=null;}};
  el.addEventListener('pointerdown',e=>{e.preventDefault();stop();action();t=setInterval(action,ms);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
}
function setupPanHold(){
  document.querySelectorAll('.map-controls .ctrl[data-dx]').forEach(b=>{const dx=+b.dataset.dx,dy=+b.dataset.dy;bindHold(b,()=>panMap(dx,dy),260);});
  bindHold(document.querySelector('.zoom-in'),()=>map.zoomIn(),350);
  bindHold(document.querySelector('.zoom-out'),()=>map.zoomOut(),350);
}
function resetMapView(){map.flyTo(initialMapCenter,initialMapZoom,{duration:.7});}
function fullscreenMap(){
  const root=document.getElementById('mapRoot');
  if(!document.fullscreenElement){if(root.requestFullscreen)root.requestFullscreen();}else document.exitFullscreen();
}
document.addEventListener('fullscreenchange',()=>{
  document.getElementById('fullscreenIcon').className=document.fullscreenElement?'fa-solid fa-compress':'fa-solid fa-expand';
  setTimeout(()=>map.invalidateSize(),300);
});
function toggleControls(){
  const c=document.getElementById('mapControls').classList.toggle('collapsed');
  document.getElementById('mapOpenIcon').className=c?'fa-solid fa-up-right-and-down-left-from-center':'fa-solid fa-down-left-and-up-right-to-center';
}
function openGoogleMaps(){const c=map.getCenter();window.open(`https://www.google.com/maps/@${c.lat},${c.lng},15z`,'_blank');}
function setMapType(type){
  const sat=type==='sat';
  if(sat){map.removeLayer(mapLayer);satLayer.addTo(map);labelsLayer.addTo(map);}
  else{map.removeLayer(satLayer);map.removeLayer(labelsLayer);mapLayer.addTo(map);}
  document.getElementById('satBtn').classList.toggle('active',sat);
  document.getElementById('mapBtn').classList.toggle('active',!sat);
  document.getElementById('mapStyleSwitch').classList.toggle('sat',sat);
  applyMaskStyle(type);
}

function populateReferenceLists(){

}
async function loadData(){
  const loading=document.getElementById('mapLoadingState');
  const{data,error}=await supabaseClient.from('projects').select('*');
  if(error){console.error(error);loading.innerHTML='Unable to load project data';return;}
  allProjects=(data||[]).map((p,i)=>{
    const c=getProjectCoords(p);
    return{...p,_k:i,status:normalizeStatus(p.status),_lat:c?c.lat:null,_lng:c?c.lng:null};
  });
  placeAll();
  clearFilterInputs();
  populateReferenceLists();
  applyFilters();
  loading.style.display='none';
}

function init(){
  initTheme();buildPinGradients();
  map=L.map('leafletMap',{zoomControl:false,scrollWheelZoom:false,doubleClickZoom:true}).setView([23.8103,90.4125],8);
  initialMapCenter=map.getCenter();initialMapZoom=map.getZoom();
  document.getElementById('leafletMap').addEventListener('wheel',e=>{
    if(!(e.ctrlKey||e.metaKey))return;
    e.preventDefault();
    const ll=map.containerPointToLatLng(map.mouseEventToContainerPoint(e));
    map.setZoomAround(ll,map.getZoom()+(e.deltaY<0?1:-1),{animate:true});
  },{passive:false});
  mapLayer=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
  satLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'&copy; Esri, Maxar, Earthstar Geographics'});
  [['labelsPane',350,'none'],['divisionPane',410,'auto'],['districtPane',420,'none'],['projectMarkersPane',650,'auto']].forEach(([n,z,pe])=>{map.createPane(n);map.getPane(n).style.zIndex=z;map.getPane(n).style.pointerEvents=pe;});
  labelsLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,pane:'labelsPane',attribution:'&copy; Esri'});
  mapLayer.addTo(map);
  markerLayer=L.layerGroup().addTo(map);
  districtLabelsLayer=L.layerGroup().addTo(map);
  addBangladeshHighlight();
  loadDivisionBoundaries();
  loadDistrictBoundaries();
  clearFilterInputs();
  document.getElementById('filterToggleBtn').classList.add('show');
  document.getElementById('mapControls').classList.add('collapsed');
  /* keep clicks inside the panel from reaching the map */
  L.DomEvent.disableClickPropagation(document.getElementById('filterPanel'));
  L.DomEvent.disableScrollPropagation(document.getElementById('filterPanel'));
  loadData();
  setupPanHold();
  setTimeout(()=>map.invalidateSize({animate:false}),900);
}
document.addEventListener('DOMContentLoaded',init);
