<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Locations Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden;font-family:Poppins,sans-serif}
body{background:#fff}
iframe{display:block!important;width:100%;border:0!important;margin:0!important;padding:0!important}
#mapRoot{position:relative;width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;overflow:hidden;background:#fff}
#leafletMap{position:absolute;inset:0;left:0;width:100%;height:100%;z-index:1}
.leaflet-marker-pane{z-index:600!important}
.leaflet-shadow-pane{z-index:500!important}
.leaflet-popup-pane{z-index:700!important}
.leaflet-control-container{z-index:800!important}

#filterPanel{position:absolute;top:60px;left:14px;width:270px;max-width:calc(100% - 28px);z-index:1000;background:#fff;border:1px solid #eef0f3;border-radius:16px;box-shadow:0 14px 36px rgba(15,23,42,.16);overflow:hidden;transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .25s}
#filterPanel.collapsed{transform:translateX(-300px);opacity:0;pointer-events:none}
#filterPanelHeader{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;background:linear-gradient(135deg,#fff7ed,#ffffff);border-bottom:1px solid #fde9c8}
#filterPanelHeader h3{margin:0;color:#b45309;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
#filterPanelHeader button{width:26px;height:26px;border:0;border-radius:50%;background:#fff;color:#94a3b8;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:background .15s,color .15s,transform .15s}
#filterPanelHeader button:hover{background:#d97706;color:#fff;transform:rotate(90deg)}
#filterPanelBody{max-height:62vh;overflow:auto;padding:16px 15px}
.filter-group{margin-bottom:16px}
.filter-group-title{display:flex;align-items:center;gap:6px;margin-bottom:7px;color:#64748b;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.filter-group-title i{display:flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:5px;background:#fff3e0;color:#d97706;font-size:9px}
.filter-select{width:100%;box-sizing:border-box;padding:9px 30px 9px 11px;border:1.5px solid #e6eaef;border-radius:9px;background:#f8fafc url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>") no-repeat right 9px center/12px 12px;color:#1e293b;font-family:inherit;font-size:11.5px;outline:0;cursor:pointer;appearance:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s,background-color .15s}
.filter-select:hover{border-color:#d1d8e0;background-color:#f1f5f9}
.filter-select:focus{border-color:#d97706;box-shadow:0 0 0 3px rgba(217,119,6,.14)}
.filter-select.caps,.filter-input.caps{text-transform:uppercase}
.filter-input{width:100%;box-sizing:border-box;padding:9px 11px;border:1.5px solid #e6eaef;border-radius:9px;background:#f8fafc;color:#1e293b;font-family:inherit;font-size:11.5px;outline:0;transition:border-color .15s,box-shadow .15s}
.filter-input:hover{border-color:#d1d8e0;background-color:#f1f5f9}
.filter-input:focus{border-color:#d97706;box-shadow:0 0 0 3px rgba(217,119,6,.14)}
.filter-input::placeholder{color:#a8b0bb;text-transform:uppercase}
.mode-select{border:0;background:transparent;color:#94a3b8;font-family:inherit;font-size:9px;font-weight:500;text-transform:uppercase;cursor:pointer;outline:0;padding:0;margin-left:2px}
.range-row{display:none;align-items:center;gap:6px}
.range-row.show{display:flex}
.range-row span{color:#94a3b8;font-size:11px}
#filterResetBtn{width:100%;padding:10px;border:0;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff;font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 14px rgba(217,119,6,.3);transition:opacity .15s,transform .15s}
#filterResetBtn:hover{opacity:.92;transform:translateY(-1px)}
#filterResetBtn:active{transform:translateY(0)}
#filterCount{margin-top:11px;color:#94a3b8;font-size:10px;text-align:center;padding:7px;background:#f8fafc;border:1px solid #eef0f3;border-radius:999px}
#filterCount strong{color:#334155}

#filterToggleBtn{position:absolute;top:60px;left:14px;z-index:1000;width:40px;height:40px;border:0;border-radius:7px;background:#fff;color:#d97706;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.22)}
#filterToggleBtn.show{display:flex}
#filterToggleBtn:hover{background:#d97706;color:#fff}

.map-style{position:absolute;top:14px;left:14px;z-index:900;display:flex;align-items:center;width:150px;background:#eef1f5;border-radius:999px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.map-style button{position:relative;z-index:2;flex:1;border:0;background:transparent;color:#64748b;padding:8px 0;font-size:11px;font-weight:600;letter-spacing:.02em;border-radius:999px;cursor:pointer;transition:color .25s}
.map-style button.active{color:#fff}
.map-style button:hover:not(.active){color:#334155}
#mapStyleThumb{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);background:linear-gradient(135deg,#d97706,#b45309);border-radius:999px;transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 6px rgba(217,119,6,.35);z-index:1}
.map-style.sat #mapStyleThumb{transform:translateX(100%)}

.fullscreen-btn{position:absolute;top:14px;right:14px;z-index:1001;width:40px;height:40px;border:0;border-radius:4px;background:#fff;color:#555;box-shadow:0 2px 7px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.fullscreen-btn:hover{background:#f5f5f5;color:#222}

.map-controls{position:absolute;right:14px;bottom:56px;z-index:1000;width:178px;height:128px}
.map-controls .ctrl{transition:opacity .25s ease,transform .25s ease,background .15s,color .15s,box-shadow .15s}
.map-controls.collapsed .ctrl:not(.map-open):not(.street-btn){opacity:0;transform:scale(.55);pointer-events:none}
.ctrl{position:absolute;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#555;box-shadow:0 2px 7px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;padding:0;transition:background .15s,color .15s,box-shadow .15s}
.ctrl:hover{background:#f5f5f5;color:#222;box-shadow:0 3px 10px rgba(0,0,0,.24)}
.pan-up{top:0;left:44px}
.pan-left{top:44px;left:0}
.map-open{top:44px;left:44px}
.pan-right{top:44px;left:88px}
.pan-down{top:88px;left:44px}
.zoom-in{top:0;left:138px}
.zoom-out{top:44px;left:138px}
.street-btn{top:88px;left:138px;width:40px;height:40px;border-radius:4px;color:#e2a600;font-size:19px}

#mapLegend{position:absolute;left:14px;bottom:12px;z-index:1000;padding:8px 12px;background:rgba(255,255,255,.97);border:1px solid #ddd;border-radius:7px;box-shadow:0 4px 15px rgba(0,0,0,.12);display:flex;gap:12px;font-size:10px}
.legend-item{display:flex;align-items:center;gap:5px;color:#334155}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.project-pin{position:relative;width:34px;height:40px;display:flex;align-items:center;justify-content:center}
.project-pin svg{position:absolute;top:0;left:0;width:34px;height:40px}
.pin-label{position:relative;top:-6px;color:#fff;font-size:8.5px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.4);pointer-events:none}
.project-pin:hover svg{filter:brightness(1.12) drop-shadow(0 4px 8px rgba(0,0,0,.3))}

/* Bangladesh boundary overlay: outline highlight + optional district labels (English names only). */
.district-label-icon{background:transparent!important;border:0!important}
.district-label{display:inline-block;padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.72);color:#334155;font-size:9px;font-weight:600;letter-spacing:.025em;line-height:1.2;text-transform:uppercase;white-space:nowrap;text-align:center;box-shadow:0 1px 4px rgba(15,23,42,.08);pointer-events:none;transform:translate(-50%,-50%)}
html.dark .district-label{background:rgba(15,23,42,.76);color:#e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.22)}

.division-tooltip{padding:5px 10px;border:0;border-radius:7px;background:#0f172a;color:#fff;font-family:Poppins,sans-serif;font-size:11px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.division-tooltip::before{border-top-color:#0f172a}

.leaflet-popup-content-wrapper{border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.2)}
.leaflet-popup-content{margin:0;width:220px!important}
.popup-title{padding:10px 12px 4px;font-size:12px;font-weight:600;color:#0f172a}
.popup-row{display:flex;justify-content:space-between;gap:8px;padding:3px 12px;font-size:10px;color:#475569}
.popup-row span:first-child{color:#94a3b8;font-size:9px}
.popup-status{display:inline-block;margin:6px 12px 10px;padding:3px 9px;border-radius:999px;color:#fff;font-size:9px;font-weight:700}

#mapLoadingState{position:absolute;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;background:#fff;color:#64748b;font-size:12px}
#mapLoadingState i{margin-right:8px;color:#d97706}

#zoomHint{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:900;padding:5px 12px;background:rgba(255,255,255,.92);border:1px solid #eee;border-radius:999px;color:#64748b;font-size:10.5px;box-shadow:0 2px 8px rgba(0,0,0,.1);pointer-events:none;white-space:nowrap}

@media(max-width:640px){
#filterPanel{width:230px}
#filterPanel.collapsed{transform:translateX(-260px)}
#filterToggleBtn{top:60px}
.fullscreen-btn{top:8px;right:8px}
.map-controls{right:8px;bottom:48px;transform:scale(.9);transform-origin:bottom right}
}
</style>
</head>

<body>
<div id="mapRoot">
<div id="leafletMap"></div>

<div id="mapLoadingState">
<i class="fa-solid fa-spinner fa-spin"></i>Loading project locations...
</div>

<div id="zoomHint">Use Ctrl + Scroll to zoom the map</div>

<div class="map-style" id="mapStyleSwitch">
<div id="mapStyleThumb"></div>
<button id="mapBtn" class="active" onclick="setMapType('map')">Map</button>
<button id="satBtn" onclick="setMapType('sat')">Satellite</button>
</div>

<button id="filterToggleBtn" onclick="toggleFilterPanel()" title="Filter">
<i class="fa-solid fa-sliders"></i>
</button>

<button class="fullscreen-btn" onclick="fullscreenMap()" title="Fullscreen">
<i id="fullscreenIcon" class="fa-solid fa-expand"></i>
</button>

<div id="filterPanel" class="collapsed">
<div id="filterPanelHeader">
<h3><i class="fa-solid fa-filter"></i> Filter Projects</h3>
<button onclick="toggleFilterPanel()" title="Close"><i class="fa-solid fa-xmark"></i></button>
</div>

<div id="filterPanelBody">

<div class="filter-group">
<div class="filter-group-title"><i class="fa-solid fa-layer-group"></i>Category</div>
<select id="filterCategory" class="filter-select caps" onchange="applyFilters()">
<option value="">All Categories</option>
<option value="Masjid">Masjid</option>
<option value="Madrasa">Madrasa</option>
<option value="Markaz">Markaz</option>
<option value="Orphanage">Orphanage</option>
<option value="Ablution">Ablution</option>
<option value="Water Well">Water Well</option>
<option value="Clinic">Clinic</option>
</select>
</div>

<div class="filter-group">
<div class="filter-group-title"><i class="fa-solid fa-circle-notch"></i>Status</div>
<select id="filterStatus" class="filter-select" onchange="applyFilters()">
<option value="">All Statuses</option>
<option>Ongoing</option>
<option>Completed</option>
<option>Upcoming</option>
</select>
</div>

<div class="filter-group">
<div class="filter-group-title"><i class="fa-solid fa-building"></i>Organization</div>
<input type="text" id="filterOrganization" class="filter-input caps" oninput="applyFilters()" placeholder="e.g. WAMY">
</div>

<div class="filter-group">
<div class="filter-group-title"><i class="fa-solid fa-hand-holding-heart"></i>Donor Name / ID</div>
<input type="text" id="filterDonor" class="filter-input caps" oninput="applyFilters()" placeholder="Name or ID">
</div>

<div class="filter-group">
<div class="filter-group-title"><i class="fa-solid fa-earth-asia"></i>Donated Country</div>
<input type="text" id="filterCountry" class="filter-input caps" list="worldCountryList" oninput="applyFilters()" placeholder="Enter country name">
<datalist id="worldCountryList"></datalist>
</div>

<div class="filter-group">
<div class="filter-group-title"><i class="fa-solid fa-coins"></i>Cost
<select id="costMode" class="mode-select" onchange="onCostModeChange()">
<option value="exact" selected>Exact Cost</option>
<option value="range">Cost Range</option>
</select></div>
<div id="costExactWrap"><input type="number" id="filterCostExact" class="filter-input" oninput="applyFilters()" placeholder="750000"></div>
<div id="costRangeWrap" class="range-row">
<input type="number" id="filterCostMin" class="filter-input" oninput="applyFilters()" placeholder="500000">
<span>—</span>
<input type="number" id="filterCostMax" class="filter-input" oninput="applyFilters()" placeholder="1800000">
</div>
</div>

<div class="filter-group">
<div class="filter-group-title"><i class="fa-solid fa-location-dot"></i>BD District</div>
<input type="text" id="filterDistrict" class="filter-input caps" list="bdDistrictList" oninput="applyFilters()" placeholder="Enter district name">
<datalist id="bdDistrictList"></datalist>
</div>

<div class="filter-group">
<div class="filter-group-title"><i class="fa-solid fa-calendar-days"></i>Date
<select id="dateMode" class="mode-select" onchange="onDateModeChange()">
<option value="exact" selected>Exact Date</option>
<option value="range">Date Range</option>
</select></div>
<div id="dateExactWrap"><input type="date" id="filterDateExact" class="filter-input" onchange="applyFilters()"></div>
<div id="dateRangeWrap" class="range-row">
<input type="date" id="filterDateMin" class="filter-input" onchange="applyFilters()">
<span>—</span>
<input type="date" id="filterDateMax" class="filter-input" onchange="applyFilters()">
</div>
</div>

<div class="filter-group">
<div class="filter-group-title"><i class="fa-solid fa-helmet-safety"></i>Engineer Name / ID</div>
<input type="text" id="filterEngineer" class="filter-input caps" oninput="applyFilters()" placeholder="Name or ID">
</div>

<button id="filterResetBtn" onclick="resetFilters()">Reset Filters</button>
<div id="filterCount"><strong>0</strong> of <strong>0</strong> projects shown</div>
</div>
</div>

<div class="map-controls" id="mapControls">

<button class="ctrl pan-up" data-dx="0" data-dy="-1" title="Move Up">
<i class="fa-solid fa-chevron-up"></i>
</button>

<button class="ctrl zoom-in" title="Zoom In">
<i class="fa-solid fa-plus"></i>
</button>

<button class="ctrl pan-left" data-dx="-1" data-dy="0" title="Move Left">
<i class="fa-solid fa-chevron-left"></i>
</button>

<button class="ctrl map-open" onclick="toggleControls()" title="Minimize / Expand controls">
<i id="mapOpenIcon" class="fa-solid fa-up-right-and-down-left-from-center"></i>
</button>

<button class="ctrl pan-right" data-dx="1" data-dy="0" title="Move Right">
<i class="fa-solid fa-chevron-right"></i>
</button>

<button class="ctrl pan-down" data-dx="0" data-dy="1" title="Move Down">
<i class="fa-solid fa-chevron-down"></i>
</button>

<button class="ctrl zoom-out" title="Zoom Out">
<i class="fa-solid fa-minus"></i>
</button>

<button class="ctrl street-btn" onclick="openGoogleMaps()" title="Google Maps">
<i class="fa-solid fa-street-view"></i>
</button>

</div>

<div id="mapLegend">
<div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>Ongoing</div>
<div class="legend-item"><span class="legend-dot" style="background:#16a34a"></span>Completed</div>
<div class="legend-item"><span class="legend-dot" style="background:#2563eb"></span>Upcoming</div>
</div>
</div>

<script>
const SUPABASE_URL='https://zjbvnwawdgdncthktqtx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_KLOwVeJVKzC8Lo2slNnH0A_PdhW5BlT';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const COLORS={Ongoing:'#f59e0b',Completed:'#16a34a',Upcoming:'#2563eb'};
let map,markerLayer,allProjects=[],mapLayer,satLayer,labelsLayer,districtBoundaryLayer,districtLabelsLayer,bdBoundaryLayer,divisionLayer,bdMaskPolygon;

/* Country outline remains local for fast rendering. Division boundaries are
   loaded from a current Bangladesh administrative division FeatureServer
   so each project is visually placed inside the correct division boundary. */

/* >>> IMPORTANT: replace the line below with your ORIGINAL "const BD_COUNTRY_RINGS=[[[...]]];" line (unchanged). <<< */
const BD_COUNTRY_RINGS=[/* PASTE YOUR ORIGINAL BD_COUNTRY_RINGS DATA HERE */];

const DIVISION_SERVICE_BASE='https://services5.arcgis.com/FKwcDz27wRAj4HUT/ArcGIS/rest/services/Administrative_Divisions_of_Bangladesh_WFL1/FeatureServer';
const DIVISION_LAYERS=[
  {name:'Chattogram',id:0},
  {name:'Barishal',id:2},
  {name:'Khulna',id:3},
  {name:'Dhaka',id:4},
  {name:'Rajshahi',id:5},
  {name:'Sylhet',id:6},
  {name:'Mymensingh',id:7},
  {name:'Rangpur',id:8}
];

const DIVISION_COLORS={
Dhaka:'#d97706',
Chattogram:'#0891b2',
Khulna:'#16a34a',
Rajshahi:'#7c3aed',
Rangpur:'#dc2626',
Barishal:'#2563eb',
Sylhet:'#db2777',
Mymensingh:'#65a30d'
};

function drawBoundaryHighlight(rings){
if(bdBoundaryLayer){map.removeLayer(bdBoundaryLayer);}
bdBoundaryLayer=L.layerGroup().addTo(map);
if(!rings.length)return;

const worldRing=[[85,-190],[85,190],[-85,190],[-85,-190]];
bdMaskPolygon=L.polygon([worldRing,...rings],{
stroke:false,
fillColor:'#eef2f6',
fillOpacity:0.62,
interactive:false
}).addTo(bdBoundaryLayer);

L.polygon(rings,{
fill:false,
color:'#d97706',
weight:1.8,
opacity:0.75,
interactive:false
}).addTo(bdBoundaryLayer);
}

/* BD-r baire-r ongsho fade: Map-e halka, Satellite-e dark */
function applyMaskStyle(type){
if(!bdMaskPolygon)return;
if(type==='sat'){
bdMaskPolygon.setStyle({fillColor:'#0b1220',fillOpacity:0.62});
}else{
bdMaskPolygon.setStyle({fillColor:'#eef2f6',fillOpacity:0.62});
}
}

function addBangladeshHighlight(){
drawBoundaryHighlight(BD_COUNTRY_RINGS);
}

async function loadDivisionBoundaries(){
if(divisionLayer){map.removeLayer(divisionLayer);}
divisionLayer=L.layerGroup().addTo(map);

await Promise.all(DIVISION_LAYERS.map(async ({name,id})=>{
  try{
    const url=`${DIVISION_SERVICE_BASE}/${id}/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&f=geojson`;
    const response=await fetch(url,{cache:'force-cache'});
    if(!response.ok)throw new Error(`Division GeoJSON HTTP ${response.status}`);
    const geojson=await response.json();
    const color=DIVISION_COLORS[name]||'#64748b';

    L.geoJSON(geojson,{
      style:()=>({
        color:color,
        weight:1.6,
        opacity:0.72,
        fillColor:color,
        fillOpacity:0.045,
        interactive:true
      }),
      onEachFeature:(feature,layer)=>{
        layer.bindTooltip(name,{sticky:true,className:'division-tooltip'});
        layer.on('mouseover',function(){
          this.setStyle({weight:3,opacity:0.98,fillOpacity:0.20});
          this.bringToFront();
        });
        layer.on('mouseout',function(){
          this.setStyle({weight:1.6,opacity:0.72,fillOpacity:0.045});
        });
      }
    }).addTo(divisionLayer);
  }catch(err){
    console.warn(`Division boundary could not be loaded for ${name}:`,err);
  }
}));
}

const DISTRICT_GEOJSON_URL='https://raw.githubusercontent.com/Cipher-Text/geo-vault/main/data/bd/geojson/districts.geojson';

function districtName(feature){
/* English name only - deliberately skip any bn_name / Bangla fields so
   labels on the map stay in English regardless of what the source data
   contains. */
const p=feature&&feature.properties?feature.properties:{};
return p.name||p.NAME_2||p.NAME||p.district||p.DISTRICT||p.shapeName||p.shape_name||'';
}

function addDistrictLabel(layer,name){
if(!name)return;
const center=layer.getBounds().getCenter();
L.marker(center,{
icon:L.divIcon({className:'district-label-icon',html:`<span class="district-label">${esc(name)}</span>`,iconSize:[0,0],iconAnchor:[0,0]}),
interactive:false,
zIndexOffset:150
}).addTo(districtLabelsLayer);
}

async function loadDistrictBoundaries(){
try{
const response=await fetch(DISTRICT_GEOJSON_URL,{cache:'force-cache'});
if(!response.ok)throw new Error(`District GeoJSON HTTP ${response.status}`);
const geojson=await response.json();

districtBoundaryLayer=L.geoJSON(geojson,{
style:()=>({fill:false,color:'#64748b',weight:1,opacity:.72,interactive:false}),
onEachFeature:(feature,layer)=>addDistrictLabel(layer,districtName(feature))
}).addTo(map);

districtBoundaryLayer.bringToFront();
}catch(err){
console.warn('District boundary layer could not be loaded:',err);
}
}

function esc(s){
return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getCoords(link){
if(!link||typeof link!=='string')return null;
try{
const s=decodeURIComponent(link);
let m=s.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/);
if(m)return{lat:+m[1],lng:+m[2]};
m=s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
if(m)return{lat:+m[1],lng:+m[2]};
m=s.match(/[?&](?:q|query|ll)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/);
if(m)return{lat:+m[1],lng:+m[2]};
m=s.match(/(-?\d{1,3}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})/);
if(m)return{lat:+m[1],lng:+m[2]};
}catch(e){}
return null;
}

function shortCode(n){
if(!n)return'?';
const w=String(n).trim().split(/\s+/).filter(Boolean);
return w.length===1?w[0].slice(0,3).toUpperCase():w.map(x=>x[0]).join('').slice(0,4).toUpperCase();
}

/* ---------- Filter logic ---------- */
function toggleMode(modeId,exactId,rangeId,clearIds){
const range=document.getElementById(modeId).value==='range';
document.getElementById(exactId).style.display=range?'none':'block';
document.getElementById(rangeId).classList.toggle('show',range);
clearIds.forEach(id=>document.getElementById(id).value='');
applyFilters();
}
function onCostModeChange(){
const range=document.getElementById('costMode').value==='range';
toggleMode('costMode','costExactWrap','costRangeWrap',range?['filterCostExact']:['filterCostMin','filterCostMax']);
}
function onDateModeChange(){
const range=document.getElementById('dateMode').value==='range';
toggleMode('dateMode','dateExactWrap','dateRangeWrap',range?['filterDateExact']:['filterDateMin','filterDateMax']);
}

function getFiltered(){
const v=id=>document.getElementById(id).value.trim().toLowerCase();
const category=v('filterCategory'),status=document.getElementById('filterStatus').value;
const organization=v('filterOrganization'),donor=v('filterDonor'),country=v('filterCountry');
const district=v('filterDistrict'),engineer=v('filterEngineer');

const costMode=document.getElementById('costMode').value;
const costExact=parseFloat(document.getElementById('filterCostExact').value);
const costMin=parseFloat(document.getElementById('filterCostMin').value);
const costMax=parseFloat(document.getElementById('filterCostMax').value);

const dateMode=document.getElementById('dateMode').value;
const dateExact=document.getElementById('filterDateExact').value;
const dateMin=document.getElementById('filterDateMin').value;
const dateMax=document.getElementById('filterDateMax').value;

return allProjects.filter(p=>{
if(category&&String(p.category||p.project_type||'').toLowerCase()!==category)return false;
if(status&&p.status!==status)return false;
if(organization&&!String(p.organization||'').toLowerCase().includes(organization))return false;
if(donor&&!`${p.donor_name||''} ${p.donor_id||''}`.toLowerCase().includes(donor))return false;
if(country&&!String(p.donated_country||'').toLowerCase().includes(country))return false;
if(district&&!String(p.district||'').toLowerCase().includes(district))return false;
if(engineer&&!`${p.engineer_name||''} ${p.engineer_id||''}`.toLowerCase().includes(engineer))return false;

const cost=(p.cost===null||p.cost===undefined||p.cost==='')?null:Number(p.cost);
if(costMode==='exact'){
if(!isNaN(costExact)&&(cost===null||cost!==costExact))return false;
}else{
if(!isNaN(costMin)&&(cost===null||cost<costMin))return false;
if(!isNaN(costMax)&&(cost===null||cost>costMax))return false;
}

if(dateMode==='exact'){
if(dateExact&&p.opening_date!==dateExact)return false;
}else{
if(dateMin&&(!p.opening_date||p.opening_date<dateMin))return false;
if(dateMax&&(!p.opening_date||p.opening_date>dateMax))return false;
}
return true;
});
}

function applyFilters(){
const data=getFiltered();
markerLayer.clearLayers();
const bounds=[];
data.forEach(p=>{
L.marker([p._lat,p._lng],{icon:makePin(p)})
.bindPopup(popup(p))
.addTo(markerLayer);
bounds.push([p._lat,p._lng]);
});
const n=document.querySelectorAll('#filterCount strong');
n[0].textContent=data.length;
n[1].textContent=allProjects.length;
if(bounds.length)map.fitBounds(bounds,{padding:[40,40],maxZoom:12,animate:true});
}

function resetFilters(){
['filterCategory','filterStatus','filterOrganization','filterDonor','filterCountry','filterCostExact','filterCostMin','filterCostMax','filterDistrict','filterDateExact','filterDateMin','filterDateMax','filterEngineer'].forEach(id=>document.getElementById(id).value='');
document.getElementById('costMode').value='exact';
document.getElementById('dateMode').value='exact';
document.getElementById('costExactWrap').style.display='block';
document.getElementById('costRangeWrap').classList.remove('show');
document.getElementById('dateExactWrap').style.display='block';
document.getElementById('dateRangeWrap').classList.remove('show');
applyFilters();
}

function zoomIn(){map.zoomIn()}
function zoomOut(){map.zoomOut()}
function panMap(x,y){
const size=map.getSize();
const amtX=size.x*0.28;
const amtY=size.y*0.28;
map.panBy([x*amtX,y*amtY],{animate:true,duration:0.4,easeLinearity:0.4});
}

let panHoldInterval=null;
function bindHold(el,action,interval){
let timer=null;
const start=(e)=>{
e.preventDefault();
if(timer)clearInterval(timer);
action();
timer=setInterval(action,interval);
};
const stop=()=>{if(timer){clearInterval(timer);timer=null;}};
el.addEventListener('pointerdown',start);
el.addEventListener('pointerup',stop);
el.addEventListener('pointerleave',stop);
el.addEventListener('pointercancel',stop);
}
function setupPanHold(){
document.querySelectorAll('.map-controls .ctrl[data-dx]').forEach(btn=>{
const dx=parseFloat(btn.dataset.dx),dy=parseFloat(btn.dataset.dy);
bindHold(btn,()=>panMap(dx,dy),260);
});
const zin=document.querySelector('.zoom-in');
const zout=document.querySelector('.zoom-out');
if(zin)bindHold(zin,()=>map.zoomIn(),350);
if(zout)bindHold(zout,()=>map.zoomOut(),350);
}

function locateMap(){
if(allProjects.length){
const p=allProjects[0];
map.setView([p._lat,p._lng],map.getZoom());
}
}

function fullscreenMap(){
const root=document.getElementById('mapRoot');
const icon=document.getElementById('fullscreenIcon');
if(!document.fullscreenElement){
if(root.requestFullscreen)root.requestFullscreen();
icon.className='fa-solid fa-compress';
}else{
document.exitFullscreen();
icon.className='fa-solid fa-expand';
}
setTimeout(()=>map.invalidateSize(),300);
}

document.addEventListener('fullscreenchange',()=>{
const icon=document.getElementById('fullscreenIcon');
if(document.fullscreenElement)icon.className='fa-solid fa-compress';
else icon.className='fa-solid fa-expand';
setTimeout(()=>map.invalidateSize(),300);
});

function toggleControls(){
const controls=document.getElementById('mapControls');
const icon=document.getElementById('mapOpenIcon');
const collapsed=controls.classList.toggle('collapsed');
icon.className=collapsed?'fa-solid fa-up-right-and-down-left-from-center':'fa-solid fa-down-left-and-up-right-to-center';
}

function openGoogleMaps(){
const c=map.getCenter();
window.open(`https://www.google.com/maps/@${c.lat},${c.lng},15z`,'_blank');
}

function setMapType(type){
const switchEl=document.getElementById('mapStyleSwitch');
if(type==='sat'){
map.removeLayer(mapLayer);
satLayer.addTo(map);
labelsLayer.addTo(map);
document.getElementById('satBtn').classList.add('active');
document.getElementById('mapBtn').classList.remove('active');
switchEl.classList.add('sat');
}else{
map.removeLayer(satLayer);
map.removeLayer(labelsLayer);
mapLayer.addTo(map);
document.getElementById('mapBtn').classList.add('active');
document.getElementById('satBtn').classList.remove('active');
switchEl.classList.remove('sat');
}
applyMaskStyle(type);
}

async function loadData(){
const loading=document.getElementById('mapLoadingState');
const{data,error}=await supabaseClient.from('projects').select('*');
loading.style.display='none';
if(error){
console.error('Project loading error:',error);
return;
}

allProjects=(data||[]).map(p=>{
const c=getCoords(p.location_link);
return c?{...p,_lat:c.lat,_lng:c.lng}:null;
}).filter(Boolean);

populateReferenceLists();
applyFilters();
}

function init(){
map=L.map('leafletMap',{
zoomControl:false,
attributionControl:true,
scrollWheelZoom:false,
doubleClickZoom:true,
dragging:true,
touchZoom:true,
boxZoom:true
}).setView([23.8103,90.4125],8);

const mapEl=document.getElementById('leafletMap');
mapEl.addEventListener('wheel',function(e){
if(!(e.ctrlKey||e.metaKey))return;
e.preventDefault();
const point=map.mouseEventToContainerPoint(e);
const latlng=map.containerPointToLatLng(point);
const newZoom=e.deltaY<0?map.getZoom()+1:map.getZoom()-1;
map.setZoomAround(latlng,newZoom,{animate:true});
},{passive:false});

mapLayer=L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'&copy; OpenStreetMap contributors'
});

satLayer=L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
maxZoom:19,
attribution:'&copy; Esri, Maxar, Earthstar Geographics, GIS User Community'
});

/* Place / district / country names on top of satellite imagery.
   z-index 350 = BELOW the fade overlay (400), so labels outside BD get faded too. */
map.createPane('labelsPane');
map.getPane('labelsPane').style.zIndex=350;
map.getPane('labelsPane').style.pointerEvents='none';

labelsLayer=L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
{
maxZoom:19,
pane:'labelsPane',
attribution:'&copy; Esri'
});

mapLayer.addTo(map);
markerLayer=L.layerGroup().addTo(map);
districtLabelsLayer=L.layerGroup().addTo(map);
addBangladeshHighlight();
applyMaskStyle('map');
loadDivisionBoundaries();
loadDistrictBoundaries();

document.getElementById('filterPanel').classList.add('collapsed');
document.getElementById('filterToggleBtn').classList.add('show');
document.getElementById('mapControls').classList.add('collapsed');

loadData();
setTimeout(()=>map.invalidateSize({animate:false}),300);
setupPanHold();
}

document.addEventListener('DOMContentLoaded',init);
</script>
