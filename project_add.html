<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YNAD System — Project Record</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script>
tailwind.config = {
  darkMode: 'media',
  theme: {
    extend: {
      colors: {
        brand: {
          50: '#fff7ed',
          100: '#ffedd5',
          400: '#fb923c',
          500: '#f97316',
          600: '#ea580c',
          700: '#c2410c',
          900: '#7c2d12',
          glow: '#ff8c00'
        }
      },
      boxShadow: {
        'neon': '0 0 30px -5px rgba(255, 140, 0, 0.4)',
        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.2)'

<style>
  body {
    background-color: #070709;
    color: #f8fafc;
    background-image: 
      radial-gradient(at 0% 0%, rgba(234, 88, 12, 0.18) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(255, 140, 0, 0.12) 0px, transparent 50%);
    background-attachment: fixed;
  }
  input:not([type="url"]):not([type="file"]):not([type="date"]), select, textarea {
    text-transform: uppercase;
  }
  .glass-panel {
    background: rgba(18, 18, 22, 0.8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 140, 0, 0.2);
  }
  .field {
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 140, 0, 0.25);
    color: #f8fafc;
  }
  .field:focus, .field:not(:placeholder-shown) {
    background: rgba(255, 255, 255, 0.16);
    border-color: #ff8c00;
    box-shadow: 0 0 15px rgba(255, 140, 0, 0.35);
  }
  .label { 
    display: block; 
    font-size: 0.7rem; 
    font-weight: 800; 
    text-transform: uppercase; 
    letter-spacing: 0.05em; 
    color: #fb923c; 
    margin-bottom: 0.45rem; 
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c2410c; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #9a3412; }

  html, body { margin: 0; padding: 0; }

  /* Sticky header: flush to top, fully opaque so nothing can bleed through behind it */
  #topHeader {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #0d0d10;
  }

  /* Scroll Knob */
  .scroll-knob {
    width: 44px;
    height: 44px;
    cursor: pointer;
    touch-action: none;
    flex-shrink: 0;
  }
  .scroll-knob svg { display: block; }
  #knobProgress {
    transition: stroke-dashoffset 0.05s linear;
  }
  #knobPointer {
    transition: transform 0.05s linear;
  }
</style>
</head>

<script>
/* ---- Supabase Connection ---- */
const SUPABASE_URL = 'https://zjbvnwawdgdncthktqtx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_KLOwVeJVKzC8Lo2slNnH0A_PdhW5BlT';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

document.getElementById('pUpdate').addEventListener('input', function (e) {
  this.value = this.value.replace(/[^0-9]/g, '');
});
document.getElementById('pDonorId').addEventListener('input', function (e) {
  this.value = this.value.replace(/[^0-9]/g, '');
});

const openingDateInput = document.getElementById('pOpening');
const openedDateInput = document.getElementById('pOpened');
const delayReasonContainer = document.getElementById('delayReasonSection');
const delayDisplay = document.getElementById('delayDisplay');

function calculateDelay() {
  const d1 = new Date(openingDateInput.value);
  const d2 = new Date(openedDateInput.value);

  if (openingDateInput.value && openedDateInput.value && d2 > d1) {
    let months = (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
    let days = d2.getDate() - d1.getDate();
    
    if (days < 0) {
      months--;
      days += new Date(d2.getFullYear(), d2.getMonth(), 0).getDate();
    }
    
    let resultText = '';
    if (months > 0) resultText += `${months} MONTH${months > 1 ? 'S' : ''} `;
    if (days > 0 || months === 0) resultText += `${days} DAY${days > 1 ? 'S' : ''} `;
    
    delayDisplay.textContent = `${resultText.trim()} DELAY`;
    delayReasonContainer.classList.remove('hidden');
  } else {
    delayReasonContainer.classList.add('hidden');
  }
}

openingDateInput.addEventListener('change', calculateDelay);
openedDateInput.addEventListener('change', calculateDelay);

/* ---- Category -> BD-Number Prefix Lock ---- */
const categorySelect = document.getElementById('pCategory');
const bdPrefixBadge = document.getElementById('bdPrefixBadge');
const bdDigitsInput = document.getElementById('pBdDigits');
const bdHiddenInput = document.getElementById('pBd');

function updateBdPrefix() {
  const selectedOption = categorySelect.options[categorySelect.selectedIndex];
  const prefix = selectedOption ? selectedOption.getAttribute('data-prefix') : null;

  if (prefix) {
    bdPrefixBadge.textContent = prefix;
    bdDigitsInput.disabled = false;
    bdDigitsInput.placeholder = '123';
  } else {
    bdPrefixBadge.textContent = 'SELECT CATEGORY';
    bdDigitsInput.disabled = true;
    bdDigitsInput.value = '';
  }
  syncBdHiddenValue();
}

function syncBdHiddenValue() {
  const prefix = bdPrefixBadge.textContent;
  const digits = bdDigitsInput.value.trim();
  bdHiddenInput.value = (digits && prefix !== 'SELECT CATEGORY') ? `${prefix}-${digits}` : '';
}

bdDigitsInput.addEventListener('input', function () {
  this.value = this.value.replace(/[^0-9]/g, '');
  syncBdHiddenValue();
});
categorySelect.addEventListener('change', updateBdPrefix);
updateBdPrefix();

document.getElementById('projectForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const photosInput = document.getElementById('pPhotos');
  if (photosInput.files.length > 10) {
    alert('YOU CAN UPLOAD A MAXIMUM OF 10 PHOTOS!');
    return;
  }

  // Category must be selected (this also locks the BD-Number prefix)
  if (!categorySelect.value || !bdDigitsInput.value.trim()) {
    alert('PLEASE SELECT A PROJECT CATEGORY AND ENTER THE BD-NUMBER DIGITS!');
    return;
  }
  syncBdHiddenValue();

  const submitBtn = document.querySelector('#projectForm button[type="submit"]');
  const originalBtnHtml = submitBtn.innerHTML;
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...';

  // NOTE: Photos / Documents / Video are not uploaded yet — Supabase Storage
  // setup is the next step. For now we save all the text/number/date fields.
  const record = {
    project_name: document.getElementById('pName').value.trim(),
    category: document.getElementById('pCategory').value,
    bd_number: document.getElementById('pBd').value,
    ho_number: document.getElementById('pHo').value.trim(),
    status: document.getElementById('pStatus').value,
    organization: document.getElementById('pOrg').value.trim() || null,
    donor_name: document.getElementById('pDonor').value.trim() || null,
    donor_id: document.getElementById('pDonorId').value.trim() || null,
    donated_country: document.getElementById('pCountry').value.trim() || null,
    project_cost: document.getElementById('pCost').value.trim() ? Number(document.getElementById('pCost').value.trim()) : null,
    district: document.getElementById('pDistrict').value.trim() || null,
    location_link: document.getElementById('pLocation').value.trim() || null,
    approval_date: document.getElementById('pApproval').value || null,
    start_date: document.getElementById('pStart').value || null,
    opening_date: document.getElementById('pOpening').value || null,
    opened_date: document.getElementById('pOpened').value || null,
    engineer_name: document.getElementById('pEngineer').value.trim() || null,
    update_notes: document.getElementById('pUpdate').value.trim() || null,
    delay_reason: document.getElementById('pDelayReason').value.trim() || null,
    video_link: document.getElementById('pVideo').value.trim() || null
  };

  const { data, error } = await supabaseClient.from('projects').insert([record]).select();

  submitBtn.disabled = false;
  submitBtn.innerHTML = originalBtnHtml;

  if (error) {
    console.error(error);
    alert('SAVE FAILED: ' + error.message);
    return;
  }

  alert('PROJECT RECORD SUCCESSFULLY SAVED TO SUPABASE!');
  document.getElementById('projectForm').reset();
  updateBdPrefix();
  delayReasonContainer.classList.add('hidden');
});

/* ---- Rotating Scroll Knob ---- */
(function () {
  const knob = document.getElementById('scrollKnob');
  const knobProgress = document.getElementById('knobProgress');
  const knobPointer = document.getElementById('knobPointer');
  const CIRCUMFERENCE = 2 * Math.PI * 26; // matches r=26 in the SVG

  function getScrollableHeight() {
    return Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
  }

  function updateKnobFromScroll() {
    const progress = Math.min(Math.max(window.scrollY / getScrollableHeight(), 0), 1);
    const angle = progress * 360;
    knobPointer.setAttribute('transform', `rotate(${angle} 30 30)`);
    knobProgress.style.strokeDashoffset = CIRCUMFERENCE - progress * CIRCUMFERENCE;
  }

  function scrollFromPointer(clientX, clientY) {
    const rect = knob.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let angle = Math.atan2(clientX - cx, -(clientY - cy)) * (180 / Math.PI);
    if (angle < 0) angle += 360;
    const progress = angle / 360;
    window.scrollTo({ top: progress * getScrollableHeight(), behavior: 'auto' });
  }

  let dragging = false;

  knob.addEventListener('mousedown', function (e) {
    dragging = true;
    scrollFromPointer(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', function (e) {
    if (dragging) scrollFromPointer(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', function () { dragging = false; });

  knob.addEventListener('touchstart', function (e) {
    dragging = true;
    const t = e.touches[0];
    scrollFromPointer(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (dragging) {
      const t = e.touches[0];
      scrollFromPointer(t.clientX, t.clientY);
    }
  }, { passive: true });
  window.addEventListener('touchend', function () { dragging = false; });

  window.addEventListener('scroll', updateKnobFromScroll);
  window.addEventListener('resize', updateKnobFromScroll);
  updateKnobFromScroll();
})();
</script>
