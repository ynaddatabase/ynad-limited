<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YNAD System — Project Record</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script>
tailwind.config = {
  darkMode: 'media',
  theme: {
    extend: {
      colors: {
        brand: {
          50: '#fff7ed',
          100: '#ffedd5',
          400: '#fb923c',
          500: '#f97316',
          600: '#ea580c',
          700: '#c2410c',
          900: '#7c2d12',
          glow: '#ff8c00'
        }
      },
      boxShadow: {
        'neon': '0 0 30px -5px rgba(255, 140, 0, 0.4)',
        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.2)'
      }
    }
  }
}
</script>
<style>
  body {
    background-color: #070709;
    color: #f8fafc;
    background-image: 
      radial-gradient(at 0% 0%, rgba(234, 88, 12, 0.18) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(255, 140, 0, 0.12) 0px, transparent 50%);
    background-attachment: fixed;
  }
  input:not([type="url"]):not([type="file"]):not([type="date"]), select, textarea {
    text-transform: uppercase;
  }
  .glass-panel {
    background: rgba(18, 18, 22, 0.8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 140, 0, 0.2);
  }
  .field {
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 140, 0, 0.25);
    color: #f8fafc;
  }
  .field:focus, .field:not(:placeholder-shown) {
    background: rgba(255, 255, 255, 0.16);
    border-color: #ff8c00;
    box-shadow: 0 0 15px rgba(255, 140, 0, 0.35);
  }
  .label { 
    display: block; 
    font-size: 0.7rem; 
    font-weight: 800; 
    text-transform: uppercase; 
    letter-spacing: 0.05em; 
    color: #fb923c; 
    margin-bottom: 0.45rem; 
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c2410c; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #9a3412; }

  html, body { margin: 0; padding: 0; }

  /* Sticky header: flush to top, fully opaque so nothing can bleed through behind it */
  #topHeader {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #0d0d10;
  }

  /* Scroll Knob */
  .scroll-knob {
    width: 44px;
    height: 44px;
    cursor: pointer;
    touch-action: none;
    flex-shrink: 0;
  }
  .scroll-knob svg { display: block; }
  #knobProgress {
    transition: stroke-dashoffset 0.05s linear;
  }
  #knobPointer {
    transition: transform 0.05s linear;
  }

  /* Header window-control buttons — sit inline in the header row, never float outside it */
  .win-btn {
    display: grid;
    place-items: center;
    border-radius: 9999px;
    border: 1px solid rgba(255, 140, 0, 0.25);
    background: rgba(255, 140, 0, 0.08);
    color: #fb923c;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .win-btn:hover { background: rgba(255, 140, 0, 0.18); color: #ffb877; }
  #closeBtn:hover { color: #f87171; border-color: rgba(248, 113, 113, 0.35); background: rgba(248, 113, 113, 0.12); }

  /* Form completion progress bar — thick pill, inset 0.5in from each side, % centered inside */
  #formProgressTrack {
    position: relative;
    flex: 1 1 auto;
    height: 22px;
    margin-left: 0.5in;
    margin-right: 0.5in;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 140, 0, 0.18);
    overflow: hidden;
  }
  #formProgressFill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(234, 88, 12, 0.65), rgba(255, 140, 0, 0.65));
    transition: width 0.35s ease;
  }
  #formProgressLabel {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    pointer-events: none;
  }

  @media (max-width: 640px) {
    #formProgressTrack { margin-left: 0.2in; margin-right: 0.2in; height: 18px; }
    #formProgressLabel { font-size: 9px; }
  }

  /* Toast notification — replaces native browser alert()/confirm() popups */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 80;
    max-width: calc(100vw - 32px);
  }
  #toast .toast-inner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: 12px;
    background: rgba(18, 18, 22, 0.95);
    border: 1px solid rgba(255, 140, 0, 0.3);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), 0 0 20px -5px rgba(255, 140, 0, 0.25);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #f8fafc;
    white-space: normal;
  }
  #toast.error .toast-inner { border-color: rgba(248, 113, 113, 0.4); }
</style>
</head>

<body class="antialiased selection:bg-orange-500 selection:text-white">

<!-- Restore tab: appears only when the panel has been closed via the X button -->
<button id="restoreTab" type="button" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[70] items-center gap-2 px-4 py-2 rounded-full bg-gradient-to-r from-orange-600 to-amber-500 text-black text-xs font-black uppercase tracking-widest shadow-neon hover:from-orange-500 hover:to-amber-400 transition">
  <i class="fa-solid fa-plus"></i> Project Add
</button>

<!-- Toast notification -->
<div id="toast" class="hidden">
  <div class="toast-inner">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMessage">Saved</span>
  </div>
</div>

<div class="min-h-screen flex flex-col items-center p-4 sm:p-8">

  <main class="w-full max-w-4xl">
    <!-- Top Header -->
    <header id="topHeader" class="rounded-3xl px-6 py-4 sm:px-7 sm:py-4 mb-8 shadow-neon">
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-3 flex-shrink-0">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-400 text-black font-black grid place-items-center shadow-neon">
            <i class="fa-solid fa-plus text-lg animate-pulse"></i>
          </div>
          <div>
            <h1 class="text-lg sm:text-xl font-normal tracking-tight text-white uppercase whitespace-nowrap">Project Add</h1>
          </div>
        </div>

        <!-- Form completion progress: thick pill with centered %, inset from both edges -->
        <div id="formProgressTrack">
          <div id="formProgressFill"></div>
          <span id="formProgressLabel">0%</span>
        </div>

        <div class="flex items-center gap-2 flex-shrink-0">
          <!-- Minimize: collapses the form body, header stays visible, data is preserved -->
          <button id="minimizeBtn" type="button" title="Minimize" class="win-btn w-8 h-8">
            <i class="fa-solid fa-minus text-[10px]"></i>
          </button>
          <!-- Close: hides the whole panel, a small tab lets you reopen it in the same state -->
          <button id="closeBtn" type="button" title="Close" class="win-btn w-7 h-7">
            <i class="fa-solid fa-xmark text-[10px]"></i>
          </button>
          <!-- Rotating scroll knob: rotates as the page scrolls, click/drag to scroll -->
          <div id="scrollKnob" class="scroll-knob" title="Drag to scroll">
            <svg viewBox="0 0 60 60" width="44" height="44">
              <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,140,0,0.2)" stroke-width="3"/>
              <circle id="knobProgress" cx="30" cy="30" r="26" fill="none" stroke="#ff8c00" stroke-width="3" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36" transform="rotate(-90 30 30)"/>
              <g id="knobPointer">
                <line x1="30" y1="30" x2="30" y2="10" stroke="#ff8c00" stroke-width="3" stroke-linecap="round"/>
                <circle cx="30" cy="30" r="3" fill="#ff8c00"/>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </header>

    <form id="projectForm" class="space-y-6" autocomplete="off">

      <!-- Section 1: General Info -->
      <section class="glass-panel rounded-3xl p-6 sm:p-8">
        <h3 class="text-sm font-extrabold uppercase tracking-wider text-orange-500 mb-4 pb-2 border-b border-orange-500/20">01. General Identity & Status</h3>
        <div class="grid sm:grid-cols-2 gap-5">
          <div class="sm:col-span-2">
            <label class="label">Project Name <span class="text-red-500">*</span></label>
            <input id="pName" required autocomplete="off" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="ENTER PROJECT NAME">
          </div>
          <div class="sm:col-span-2">
            <label class="label">Project Category <span class="text-red-500">*</span></label>
            <select id="pCategory" required class="field w-full rounded-xl px-4 py-3 text-sm">
              <option value="" class="bg-zinc-900 text-white">SELECT CATEGORY</option>
              <option value="MASJID" data-prefix="M" class="bg-zinc-900 text-white">MASJID</option>
              <option value="MARKAZ" data-prefix="MRZ" class="bg-zinc-900 text-white">MARKAZ</option>
              <option value="MADRASA" data-prefix="MDS" class="bg-zinc-900 text-white">MADRASA</option>
              <option value="ORPHANAGE" data-prefix="ORP" class="bg-zinc-900 text-white">ORPHANAGE</option>
              <option value="ABLUTION CENTER" data-prefix="AB" class="bg-zinc-900 text-white">ABLUTION CENTER</option>
              <option value="WATER WELL" data-prefix="W" class="bg-zinc-900 text-white">WATER WELL</option>
              <option value="CLINIC" data-prefix="CLN" class="bg-zinc-900 text-white">CLINIC</option>
            </select>
          </div>
          <div>
            <label class="label">BD-Number <span class="text-red-500">*</span></label>
            <div class="field w-full rounded-xl flex items-stretch overflow-hidden pr-1">
              <span id="bdPrefixBadge" class="flex items-center px-3 text-sm font-black text-orange-400 bg-orange-500/10 border-r border-orange-500/25 select-none whitespace-nowrap">SELECT CATEGORY</span>
              <input id="pBdDigits" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" disabled class="w-full bg-transparent px-3 py-3 text-sm outline-none border-none disabled:cursor-not-allowed disabled:opacity-40" placeholder="123">
            </div>
            <input type="hidden" id="pBd">
          </div>
          <div>
            <label class="label">HO-Number <span class="text-red-500">*</span></label>
            <div class="field w-full rounded-xl flex items-stretch overflow-hidden pr-1">
              <span class="flex items-center px-3 text-sm font-black text-orange-400 bg-orange-500/10 border-r border-orange-500/25 select-none whitespace-nowrap">HO</span>
              <input id="pHoDigits" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="w-full bg-transparent px-3 py-3 text-sm outline-none border-none" placeholder="12345">
            </div>
            <input type="hidden" id="pHo">
          </div>
          <div>
            <label class="label">Status <span class="text-red-500">*</span></label>
            <select id="pStatus" required class="field w-full rounded-xl px-4 py-3 text-sm">
              <option value="" class="bg-zinc-900 text-white">SELECT STATUS</option>
              <option value="Ongoing" class="bg-zinc-900 text-white">ONGOING</option>
              <option value="Completed" class="bg-zinc-900 text-white">COMPLETED</option>
              <option value="Upcoming" class="bg-zinc-900 text-white">UPCOMING</option>
            </select>
          </div>
          <div>
            <label class="label">Organization Name</label>
            <input id="pOrg" autocomplete="off" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="ORGANIZATION NAME">
          </div>
          <div>
            <label class="label">Donor Name</label>
            <input id="pDonor" autocomplete="off" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="DONOR NAME">
          </div>
          <div>
            <label class="label">Donor ID (Digits Only)</label>
            <input id="pDonorId" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="12345">
          </div>
          <div>
            <label class="label">Donated Country Name</label>
            <input id="pCountry" list="countryList" autocomplete="off" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="ENTER COUNTRY NAME">
            <datalist id="countryList">
              <option value="AFGHANISTAN"><option value="ALBANIA"><option value="ALGERIA"><option value="ANDORRA"><option value="ANGOLA"><option value="ANTIGUA AND BARBUDA"><option value="ARGENTINA"><option value="ARMENIA"><option value="AUSTRALIA"><option value="AUSTRIA"><option value="AZERBAIJAN"><option value="BAHAMAS"><option value="BAHRAIN"><option value="BANGLADESH"><option value="BARBADOS"><option value="BELARUS"><option value="BELGIUM"><option value="BELIZE"><option value="BENIN"><option value="BHUTAN"><option value="BOLIVIA"><option value="BOSNIA AND HERZEGOVINA"><option value="BOTSWANA"><option value="BRAZIL"><option value="BRUNEI"><option value="BULGARIA"><option value="BURKINA FASO"><option value="BURUNDI"><option value="CABO VERDE"><option value="CAMBODIA"><option value="CAMEROON"><option value="CANADA"><option value="CENTRAL AFRICAN REPUBLIC"><option value="CHAD"><option value="CHILE"><option value="CHINA"><option value="COLOMBIA"><option value="COMOROS"><option value="CONGO"><option value="COSTA RICA"><option value="CROATIA"><option value="CUBA"><option value="CYPRUS"><option value="CZECHIA"><option value="DENMARK"><option value="DJIBOUTI"><option value="DOMINICA"><option value="DOMINICAN REPUBLIC"><option value="ECUADOR"><option value="EGYPT"><option value="EL SALVADOR"><option value="EQUATORIAL GUINEA"><option value="ERITREA"><option value="ESTONIA"><option value="ESWATINI"><option value="ETHIOPIA"><option value="FIJI"><option value="FINLAND"><option value="FRANCE"><option value="GABON"><option value="GAMBIA"><option value="GEORGIA"><option value="GERMANY"><option value="GHANA"><option value="GREECE"><option value="GRENADA"><option value="GUATEMALA"><option value="GUINEA"><option value="GUINEA-BISSAU"><option value="GUYANA"><option value="HAITI"><option value="HONDURAS"><option value="HUNGARY"><option value="ICELAND"><option value="INDIA"><option value="INDONESIA"><option value="IRAN"><option value="IRAQ"><option value="IRELAND"><option value="ISRAEL"><option value="ITALY"><option value="IVORY COAST"><option value="JAMAICA"><option value="JAPAN"><option value="JORDAN"><option value="KAZAKHSTAN"><option value="KENYA"><option value="KIRIBATI"><option value="KUWAIT"><option value="KYRGYZSTAN"><option value="LAOS"><option value="LATVIA"><option value="LEBANON"><option value="LESOTHO"><option value="LIBERIA"><option value="LIBYA"><option value="LIECHTENSTEIN"><option value="LITHUANIA"><option value="LUXEMBOURG"><option value="MADAGASCAR"><option value="MALAWI"><option value="MALAYSIA"><option value="MALDIVES"><option value="MALI"><option value="MALTA"><option value="MARSHALL ISLANDS"><option value="MAURITANIA"><option value="MAURITIUS"><option value="MEXICO"><option value="MICRONESIA"><option value="MOLDOVA"><option value="MONACO"><option value="MONGOLIA"><option value="MONTENEGRO"><option value="MOROCCO"><option value="MOZAMBIQUE"><option value="MYANMAR"><option value="NAMIBIA"><option value="NAURU"><option value="NEPAL"><option value="NETHERLANDS"><option value="NEW ZEALAND"><option value="NICARAGUA"><option value="NIGER"><option value="NIGERIA"><option value="NORTH KOREA"><option value="NORTH MACEDONIA"><option value="NORWAY"><option value="OMAN"><option value="PAKISTAN"><option value="PALAU"><option value="PALESTINE"><option value="PANAMA"><option value="PAPUA NEW GUINEA"><option value="PARAGUAY"><option value="PERU"><option value="PHILIPPINES"><option value="POLAND"><option value="PORTUGAL"><option value="QATAR"><option value="ROMANIA"><option value="RUSSIA"><option value="RWANDA"><option value="SAINT KITTS AND NEVIS"><option value="SAINT LUCIA"><option value="SAINT VINCENT AND THE GRENADINES"><option value="SAMOA"><option value="SAN MARINO"><option value="SAO TOME AND PRINCIPE"><option value="SAUDI ARABIA"><option value="SENEGAL"><option value="SERBIA"><option value="SEYCHELLES"><option value="SIERRA LEONE"><option value="SINGAPORE"><option value="SLOVAKIA"><option value="SLOVENIA"><option value="SOLOMON ISLANDS"><option value="SOMALIA"><option value="SOUTH AFRICA"><option value="SOUTH KOREA"><option value="SOUTH SUDAN"><option value="SPAIN"><option value="SRI LANKA"><option value="SUDAN"><option value="SURINAME"><option value="SWEDEN"><option value="SWITZERLAND"><option value="SYRIA"><option value="TAIWAN"><option value="TAJIKISTAN"><option value="TANZANIA"><option value="THAILAND"><option value="TIMOR-LESTE"><option value="TOGO"><option value="TONGA"><option value="TRINIDAD AND TOBAGO"><option value="TUNISIA"><option value="TURKEY"><option value="TURKMENISTAN"><option value="TUVALU"><option value="UAE"><option value="UGANDA"><option value="UKRAINE"><option value="UNITED KINGDOM"><option value="UNITED STATES"><option value="URUGUAY"><option value="UZBEKISTAN"><option value="VANUATU"><option value="VATICAN CITY"><option value="VENEZUELA"><option value="VIETNAM"><option value="YEMEN"><option value="ZAMBIA"><option value="ZIMBABWE">
            </datalist>
          </div>
          <div>
            <label class="label">Project Cost (BDT)</label>
            <input id="pCost" type="text" inputmode="decimal" autocomplete="off" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="ENTER PROJECT COST">
          </div>
        </div>
      </section>

      <!-- Section 2: Location & District -->
      <section class="glass-panel rounded-3xl p-6 sm:p-8">
        <h3 class="text-sm font-extrabold uppercase tracking-wider text-orange-500 mb-4 pb-2 border-b border-orange-500/20">02. Geo-Location & District</h3>
        <div class="grid sm:grid-cols-2 gap-5">
          <div>
            <label class="label">BD District (Type to search)</label>
            <input id="pDistrict" list="districtList" autocomplete="off" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="TYPE DISTRICT NAME...">
            <datalist id="districtList">
              <option value="BAGERHAT"><option value="BANDARBAN"><option value="BARGUNA"><option value="BARISHAL"><option value="BHOLA"><option value="BOGURA"><option value="BRAHMANBARIA"><option value="CHANDPUR"><option value="CHATTOGRAM"><option value="CHUADANGA"><option value="COX'S BAZAR"><option value="CUMILLA"><option value="DHAKA"><option value="DINAJPUR"><option value="FARIDPUR"><option value="FENI"><option value="GAIBANDHA"><option value="GAZIPUR"><option value="GOPALGANJ"><option value="HABIGANJ"><option value="JAMALPUR"><option value="JASHORE"><option value="JHALOKATI"><option value="JHENAIDAH"><option value="JOYPURHAT"><option value="KHAGRACHHARI"><option value="KHULNA"><option value="KISHOREGANJ"><option value="KURIGRAM"><option value="KUSHTIA"><option value="LAKSHMIPUR"><option value="LALMONIRHAT"><option value="MADARIPUR"><option value="MAGURA"><option value="MANIKGANJ"><option value="MEHERPUR"><option value="MOULVIBAZAR"><option value="MUNSHIGANJ"><option value="MYMENSINGH"><option value="NAOGAON"><option value="NARAIL"><option value="NARAYANGANJ"><option value="NARSINGDI"><option value="NATORE"><option value="NETROKONA"><option value="NILPHAMARI"><option value="NOAKHALI"><option value="PABNA"><option value="PANCHAGARH"><option value="PATUAKHALI"><option value="PIROJPUR"><option value="RAJBARI"><option value="RAJSHAHI"><option value="RANGAMATI"><option value="RANGPUR"><option value="SATKHIRA"><option value="SHARIATPUR"><option value="SHERPUR"><option value="SIRAJGANJ"><option value="SUNAMGANJ"><option value="SYLHET"><option value="TANGAIL"><option value="THAKURGAON">
            </datalist>
          </div>
          <div>
            <label class="label">Location (Google Map Link)</label>
            <input id="pLocation" type="url" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="PASTE MAP LOCATION LINK">
          </div>
        </div>
      </section>

      <!-- Section 3: Timeline & Management -->
      <section class="glass-panel rounded-3xl p-6 sm:p-8">
        <h3 class="text-sm font-extrabold uppercase tracking-wider text-orange-500 mb-4 pb-2 border-b border-orange-500/20">03. Timeline, Management & Notes</h3>
        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-5" id="timelineDatesGrid">
          <div id="fieldApproval"><label class="label">Approval Date</label><input id="pApproval" type="date" class="field w-full rounded-xl px-4 py-3 text-sm"></div>
          <div id="fieldStart"><label class="label">Start Date</label><input id="pStart" type="date" class="field w-full rounded-xl px-4 py-3 text-sm"></div>
          <div id="fieldOpening"><label class="label">Opening Date</label><input id="pOpening" type="date" class="field w-full rounded-xl px-4 py-3 text-sm"></div>
          <div id="fieldOpened"><label class="label">Opened Date</label><input id="pOpened" type="date" class="field w-full rounded-xl px-4 py-3 text-sm"></div>
        </div>
        <div class="grid sm:grid-cols-2 gap-5">
          <div>
            <label class="label">Assigned Site Engineer</label>
            <input id="pEngineer" autocomplete="off" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="ENGINEER NAME">
          </div>
          <div>
            <label class="label">Update Status / Notes (Digits Only)</label>
            <input id="pUpdate" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="ENTER DIGITS ONLY (E.G. 513)">
          </div>
          
          <!-- Reason for Delay -->
          <div id="delayReasonSection" class="sm:col-span-2 hidden space-y-2">
            <div class="flex items-center gap-3">
              <label class="label text-red-400 mb-0">Reason for Delay</label>
              <span id="delayDisplay" class="text-[10px] font-extrabold text-orange-400 bg-orange-950/60 border border-orange-500/30 px-3 py-0.5 rounded-full"></span>
            </div>
            <textarea id="pDelayReason" rows="2" class="field w-full rounded-xl px-4 py-3 text-sm resize-none border-red-500/40" placeholder="PROVIDE REASON FOR DELAY..."></textarea>
          </div>
        </div>
      </section>

      <!-- Section 4: Media & Documents -->
      <section class="glass-panel rounded-3xl p-6 sm:p-8">
        <h3 class="text-sm font-extrabold uppercase tracking-wider text-orange-500 mb-4 pb-2 border-b border-orange-500/20">04. Media, Photos & Documents</h3>
        <div class="grid sm:grid-cols-2 gap-5">
          <div>
            <label class="label">Documents (PDF / JPG / PNG)</label>
            <input id="pDocs" type="file" accept=".pdf,image/jpeg,image/png" class="field w-full rounded-xl px-3 py-2 text-xs">
          </div>
          <div>
            <label class="label">C-Photo (Single Photo)</label>

<script>
/* ---- Supabase Connection ---- */
const SUPABASE_URL = 'https://zjbvnwawdgdncthktqtx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_KLOwVeJVKzC8Lo2slNnH0A_PdhW5BlT';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

// NOTE: change this to match the actual Storage bucket name in your Supabase project.

/* ---- Toast notifications (replaces native alert()/confirm() popups) ---- */
const toastEl = document.getElementById('toast');
const toastIcon = document.getElementById('toastIcon');
const toastMessage = document.getElementById('toastMessage');
let toastTimer = null;

function showToast(message, type = 'success') {
  clearTimeout(toastTimer);
  toastMessage.textContent = message;
  toastEl.classList.toggle('error', type === 'error');
  toastIcon.className = type === 'error'
    ? 'fa-solid fa-circle-exclamation text-red-400'
    : 'fa-solid fa-circle-check text-emerald-400';
  toastEl.classList.remove('hidden');
  toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 2800);
}

document.getElementById('pUpdate').addEventListener('input', function (e) {
  this.value = this.value.replace(/[^0-9]/g, '');
});
document.getElementById('pDonorId').addEventListener('input', function (e) {
  this.value = this.value.replace(/[^0-9]/g, '');
});

const openingDateInput = document.getElementById('pOpening');
const openedDateInput = document.getElementById('pOpened');
const delayReasonContainer = document.getElementById('delayReasonSection');
const delayDisplay = document.getElementById('delayDisplay');

function calculateDelay() {
  const d1 = new Date(openingDateInput.value);
  const d2 = new Date(openedDateInput.value);

  if (openingDateInput.value && openedDateInput.value && d2 > d1) {
    let months = (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
    let days = d2.getDate() - d1.getDate();
    
    if (days < 0) {
      months--;
      days += new Date(d2.getFullYear(), d2.getMonth(), 0).getDate();
    }
    
    let resultText = '';
    if (months > 0) resultText += `${months} MONTH${months > 1 ? 'S' : ''} `;
    if (days > 0 || months === 0) resultText += `${days} DAY${days > 1 ? 'S' : ''} `;
    
    delayDisplay.textContent = `${resultText.trim()} DELAY`;
    delayReasonContainer.classList.remove('hidden');
  } else {
    delayReasonContainer.classList.add('hidden');
  }
}

openingDateInput.addEventListener('change', calculateDelay);
openedDateInput.addEventListener('change', calculateDelay);

/* ---- Category -> BD-Number Prefix Lock ---- */
const categorySelect = document.getElementById('pCategory');
const bdPrefixBadge = document.getElementById('bdPrefixBadge');
const bdDigitsInput = document.getElementById('pBdDigits');

function updateBdPrefix() {
  const selectedOption = categorySelect.options[categorySelect.selectedIndex];
  const prefix = selectedOption ? selectedOption.getAttribute('data-prefix') : null;

  if (prefix) {
    bdPrefixBadge.textContent = prefix;
    bdDigitsInput.disabled = false;

  } else {
    bdPrefixBadge.textContent = 'SELECT CATEGORY';

  syncBdHiddenValue();
}

function syncBdHiddenValue() {
  const prefix = bdPrefixBadge.textContent;
  const digits = bdDigitsInput.value.trim();
  bdHiddenInput.value = (digits && prefix !== 'SELECT CATEGORY') ? `${prefix}-${digits}` : '';
}

bdDigitsInput.addEventListener('input', function () {

});

/* ---- Status -> Timeline Fields Visibility ---- */
const statusSelect = document.getElementById('pStatus');

const fieldOpening = document.getElementById('fieldOpening');
const fieldOpened = document.getElementById('fieldOpened');

function setFieldVisible(fieldWrapper, visible) {
  fieldWrapper.classList.toggle('hidden', !visible);
  if (!visible) {
    const input = fieldWrapper.querySelector('input');
    if (input) input.value = '';
  }
}

function updateTimelineFieldsVisibility() {
  const status = statusSelect.value;

  if (status === 'Ongoing') {
    setFieldVisible(fieldApproval, true);
    setFieldVisible(fieldStart, true);
    setFieldVisible(fieldOpening, false);
    setFieldVisible(fieldOpened, false);
  } else if (status === 'Completed') {
    setFieldVisible(fieldApproval, true);
    setFieldVisible(fieldStart, true);
    setFieldVisible(fieldOpening, true);
    setFieldVisible(fieldOpened, true);
  } else if (status === 'Upcoming') {
    setFieldVisible(fieldApproval, true);
    setFieldVisible(fieldStart, false);
    setFieldVisible(fieldOpening, false);
    setFieldVisible(fieldOpened, false);
  } else {
    // No status selected yet — show all fields
    setFieldVisible(fieldApproval, true);
    setFieldVisible(fieldStart, true);
    setFieldVisible(fieldOpening, true);
    setFieldVisible(fieldOpened, true);
  }

  calculateDelay();
  updateRawMediaVisibility();
  updateFormProgress();
}

/* ---- Raw Media Section Visibility (only for Ongoing / Completed) ---- */

function updateRawMediaVisibility() {

/* ---- Form Completion Progress Bar (thick pill, % centered, header-inset) ---- */
const formProgressFill = document.getElementById('formProgressFill');
const formProgressLabel = document.getElementById('formProgressLabel');
const projectFormEl = document.getElementById('projectForm');

function updateFormProgress() {
  const trackedFields = Array.from(projectFormEl.querySelectorAll('input, select, textarea')).filter(el => {
    if (el.type === 'hidden') return false;
    if (el.disabled) return false;
    if (el.closest('.hidden')) return false; // skip fields hidden by Status logic
    return true;
  });

  let filledCount = 0;
  trackedFields.forEach(el => {
    if (el.type === 'file') {
      if (el.files && el.files.length > 0) filledCount++;
    } else if (el.value && el.value.trim() !== '') {
      filledCount++;
    }
  });

  const percent = trackedFields.length ? Math.round((filledCount / trackedFields.length) * 100) : 0;
  formProgressFill.style.width = percent + '%';
  formProgressLabel.textContent = percent + '%';
}

projectFormEl.addEventListener('input', updateFormProgress);
projectFormEl.addEventListener('change', updateFormProgress);
updateFormProgress();

/* ---- File Upload Helpers (Supabase Storage) ---- */

// Builds a safe, unique storage path for one file inside a folder.
function buildStoragePath(folder, file) {
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  return `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safeName}`;
}

// Uploads a single file and returns its public URL.
async function uploadFileAndGetUrl(folder, file) {
  const path = buildStoragePath(folder, file);
  const { error: uploadError } = await supabaseClient
    .storage
    .from(STORAGE_BUCKET)
    .upload(path, file, { cacheControl: '3600', upsert: false });

  if (uploadError) {
    throw new Error(`Upload failed for "${file.name}": ${uploadError.message}`);
  }

  const { data: publicUrlData } = supabaseClient
    .storage
    .from(STORAGE_BUCKET)
    .getPublicUrl(path);

  return publicUrlData.publicUrl;
}

// Uploads multiple files (sequentially) and returns an array of public URLs.
async function uploadMultipleFilesAndGetUrls(folder, fileList) {
  const urls = [];
  for (const file of fileList) {
    const url = await uploadFileAndGetUrl(folder, file);
    urls.push(url);
  }
  return urls;
}

    delay_reason: document.getElementById('pDelayReason').value.trim() || null,

  const { data, error } = await supabaseClient.from('projects').insert([record]).select();

/* ---- Rotating Scroll Knob ---- */
(function () {
  const knob = document.getElementById('scrollKnob');
  const knobProgress = document.getElementById('knobProgress');
  const knobPointer = document.getElementById('knobPointer');
  const CIRCUMFERENCE = 2 * Math.PI * 26; // matches r=26 in the SVG

  function getScrollableHeight() {
    return Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
  }

  function updateKnobFromScroll() {
    const progress = Math.min(Math.max(window.scrollY / getScrollableHeight(), 0), 1);
    const angle = progress * 360;
    knobPointer.setAttribute('transform', `rotate(${angle} 30 30)`);
    knobProgress.style.strokeDashoffset = CIRCUMFERENCE - progress * CIRCUMFERENCE;
  }

  function scrollFromPointer(clientX, clientY) {
    const rect = knob.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let angle = Math.atan2(clientX - cx, -(clientY - cy)) * (180 / Math.PI);
    if (angle < 0) angle += 360;
    const progress = angle / 360;
    window.scrollTo({ top: progress * getScrollableHeight(), behavior: 'auto' });
  }

  let dragging = false;

  knob.addEventListener('mousedown', function (e) {
    dragging = true;
    scrollFromPointer(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', function (e) {
    if (dragging) scrollFromPointer(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', function () { dragging = false; });

  knob.addEventListener('touchstart', function (e) {
    dragging = true;
    const t = e.touches[0];
    scrollFromPointer(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (dragging) {
      const t = e.touches[0];
      scrollFromPointer(t.clientX, t.clientY);
    }
  }, { passive: true });
  window.addEventListener('touchend', function () { dragging = false; });

  window.addEventListener('scroll', updateKnobFromScroll);
  window.addEventListener('resize', updateKnobFromScroll);
  updateKnobFromScroll();
})();
