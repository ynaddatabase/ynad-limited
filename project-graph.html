<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Graph — YNAD Construction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col">

    <nav class="bg-slate-900/95 border-b border-white/10 px-8 py-4 flex items-center justify-between">
        <a href="index.html" class="text-2xl font-bold tracking-widest uppercase">
            YNAD <span class="text-amber-500 font-light">Construction</span>
        </a>
        <a href="index.html" class="text-sm tracking-wider hover:text-amber-500 transition">
            <i class="fa-solid fa-arrow-left mr-2"></i>BACK TO HOME
        </a>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center px-6 text-center">
        <div class="w-20 h-20 rounded-full bg-amber-500/10 flex items-center justify-center mb-6">
            <i class="fa-solid fa-chart-line text-3xl text-amber-500"></i>
        </div>
        <h1 class="text-2xl md:text-3xl font-light tracking-widest uppercase mb-3">Project Graph</h1>
        <p class="text-sm text-slate-400 max-w-md leading-relaxed">
            This page is a placeholder. Project analytics and charts (ongoing / completed / upcoming trends, category breakdowns, timelines) will be built here separately.
        </p>
    </main>

    <footer class="py-6 text-center text-xs text-slate-500 border-t border-white/10">
        &copy; <span id="footerYear"></span> YNAD Construction. All rights reserved.
    </footer>

    <script>
        document.getElementById('footerYear').textContent = new Date().getFullYear();
    </script>
</body>
</html>
