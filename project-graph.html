<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Graph — YNAD Construction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }

        #pageLoadingBar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: transparent; z-index: 99999; pointer-events: none; overflow: hidden; }
        #pageLoadingProgress { width: 8%; height: 100%; background: linear-gradient(90deg, #b45309, #d97706, #f59e0b, #d97706, #b45309); box-shadow: 0 0 10px rgba(217, 119, 6, 0.70); transition: width 0.45s ease, opacity 0.35s ease; }

        .reveal-fade-left { opacity: 0; transform: translateX(-40px); transition: opacity 0.7s ease, transform 0.7s ease; }
        .reveal-fade-left.revealed { opacity: 1; transform: translateX(0); }

        /* ---------- NAV (same as All Projects) ---------- */
        #mainNav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(0,0,0,0.48); border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; transform: translateY(0); }
        #mainNav.nav-hidden { transform: translateY(-100%); }
        #mainNav.nav-solid { background-color: #ffffff; border-bottom-color: #e5e7eb; box-shadow: 0 6px 18px rgba(15,23,42,0.08); }
        #mainNav .nav-adaptive { color: #ffffff; transition: color 0.35s ease; }
        #mainNav.nav-solid .nav-adaptive { color: #1b1d1d; }
        #mainNav .nav-adaptive-muted { color: rgba(255,255,255,0.85); transition: color 0.35s ease; }
        #mainNav.nav-solid .nav-adaptive-muted { color: #3a3c3c; }
        #mainNav .nav-icon-btn { background: rgba(255,255,255,0.1); border: 1px solid transparent;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease; }
        #mainNav.nav-solid .nav-icon-btn { background: #f1f5f9; border-color: #e2e8f0; }
        #mainNav .nav-icon-btn:hover { background-color: #d97706; border-color: #d97706; color: #ffffff !important; transform: translateY(-3px) scale(1.08); box-shadow: 0 8px 20px rgba(217,119,6,0.35); }
        #mainNav #searchIconBtn:hover { transform: scale(1.05); }
        #searchBoxWrap.search-open #searchIconBtn:hover { transform: translateX(2px) scale(1.05); }

        body.theme-light { background-color: #ffffff; color: #2a2c2c; }
        body.theme-light #pageHeaderSection { background-color: #ffffff !important; }
        body.theme-light #settingsDropdownMenu, body.theme-light #userDropdownMenu, body.theme-light #searchDropdownMenu, body.theme-light #menuBox,
        body.theme-light .graph-card { background-color: #ffffff !important; border-color: #e2e8f0 !important; }

        body.theme-effective-dark { background-color: #131414 !important; color: #e2e8f0; }
        body.theme-effective-dark #pageHeaderSection { background-color: #131414 !important; }
        body.theme-effective-dark #settingsDropdownMenu, body.theme-effective-dark #userDropdownMenu, body.theme-effective-dark #searchDropdownMenu,
        body.theme-effective-dark #menuBox, body.theme-effective-dark .graph-card { background-color: #232525 !important; border-color: #3a3c3c !important; }
        body.theme-effective-dark .text-slate-900, body.theme-effective-dark .text-slate-800 { color: #ffffff !important; }
        body.theme-effective-dark .text-slate-600, body.theme-effective-dark .text-slate-500, body.theme-effective-dark .text-slate-400 { color: #c7c5c2 !important; }
        body.theme-effective-dark #pageHeaderSection h1, body.theme-effective-dark #pageHeaderSection .filter-tab { color: #ffffff !important; }
        body.theme-effective-dark #searchDropdownMenu input { color: #ffffff !important; }
        body.theme-effective-dark #searchDropdownMenu input::placeholder { color: #a8a6a3; }
        body.theme-effective-dark .border-slate-100, body.theme-effective-dark .border-slate-200, body.theme-effective-dark .border-slate-300 { border-color: #3a3c3c !important; }
        body.theme-effective-dark .bg-slate-50 { background-color: #232525 !important; }
        body.theme-effective-dark .bg-white { background-color: #232525 !important; }
        body.theme-effective-dark .hover\:bg-slate-100:hover { background-color: #2a2c2c !important; }
        body.theme-effective-dark .text-black, body.theme-effective-dark .text-slate-700, body.theme-effective-dark .text-gray-900,
        body.theme-effective-dark .text-gray-800, body.theme-effective-dark .text-gray-700 { color: #ffffff !important; }

        #settingsDropdownMenu a { transition: background-color 0.22s ease, color 0.22s ease; }
        body.theme-effective-dark #settingsDropdownMenu a { color: #e2e8f0 !important; }
        body.theme-effective-dark #settingsDropdownMenu a:hover, body.theme-light #settingsDropdownMenu a:hover { background-color: #d97706 !important; color: #ffffff !important; }

        body.theme-effective-dark #mainNav.nav-solid { background-color: #131414; border-bottom-color: #3a3c3c; }
        body.theme-effective-dark #mainNav.nav-solid .nav-icon-btn, body.theme-effective-dark #mainNav.nav-solid .theme-mode-switch { background-color: #2a2c2c; border-color: #3a3c3c; }
        body.theme-effective-dark #mainNav.nav-solid .nav-adaptive { color: #ffffff; }
        body.theme-effective-dark #mainNav.nav-solid .nav-adaptive-muted { color: #c7c5c2; }
        body.theme-effective-dark .theme-mode-btn.active { color: #ffffff !important; }

        #userProfileBtn { background: #ffffff; color: #64748b; border-color: #d97706; }
        #userProfileBtn .profile-fallback-icon { font-size: 15px; line-height: 1; transition: color 0.35s ease, transform 0.25s ease; }
        #userProfileBtn:hover .profile-fallback-icon { transform: scale(1.05); }
        #userProfileBtn.is-authenticated { background: transparent; }
        #userProfileBtn img { display: block; width: 100%; height: 100%; object-fit: cover; }
        #userProfileBtn .profile-fallback-icon[hidden], #userProfileBtn img[hidden] { display: none !important; }
        #userDropdownMenu .profile-avatar-large { background: #ffffff; color: #64748b; }
        #userDropdownMenu .profile-user-name { color: #1b1d1d; }
        #userDropdownMenu .profile-user-email { color: #64748b; }
        #userDropdownMenu .auth-action { background: #ffffff; color: #55575a; border: 1px solid #e2e8f0; }
        #userDropdownMenu .auth-action:hover { background: #d97706; color: #ffffff; border-color: #d97706; }
        body.theme-effective-dark #userProfileBtn { background: #2a2c2c; border-color: #f59e0b; color: #c7c5c2; }
        body.theme-effective-dark #userDropdownMenu .profile-avatar-large { background: #2a2c2c; color: #c7c5c2; border-color: #55575a !important; }
        body.theme-effective-dark #userDropdownMenu .profile-user-name { color: #ffffff !important; }
        body.theme-effective-dark #userDropdownMenu .profile-user-email { color: #a8a6a3 !important; }
        body.theme-effective-dark #userDropdownMenu .auth-action { background: #2a2c2c; color: #c7c5c2; border-color: #3a3c3c; }
        body.theme-effective-dark #userDropdownMenu .auth-action:hover { background: #d97706; color: #ffffff; border-color: #d97706; }

        body.theme-transition, body.theme-transition * { transition-property: color, background-color, border-color, fill, stroke !important; transition-duration: 0.45s !important; transition-timing-function: ease !important; }

        #pageHeaderSection { padding-top: 112px; transition: background-color 0.45s ease; }

        .hamburger-icon { transition: transform 0.2s cubic-bezier(0.4,0,0.2,1); display: inline-block; }
        .hamburger-icon.clicked { transform: scale(1.25); }

        #pageContentWrapper { transition: filter 0.6s ease-in-out; }
        #pageContentWrapper.blurred { filter: blur(6px); pointer-events: none; }

        #menuOverlay { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: flex-end; background-color: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
            opacity: 0; visibility: hidden; transition: opacity 0.7s ease, visibility 0.7s ease; pointer-events: none; }
        #menuOverlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
        #menuBox { transform: translateX(100%); transition: transform 0.7s cubic-bezier(0.16,1,0.3,1); }
        #menuOverlay.open #menuBox { transform: translateX(0); }

        #settingsDropdownMenu, #userDropdownMenu { opacity: 0; visibility: hidden; transform: translateY(12px) scale(0.96); transition: all 0.25s cubic-bezier(0.16,1,0.3,1); pointer-events: none; }
        #settingsDropdownMenu.open, #userDropdownMenu.open { opacity: 1; visibility: visible; transform: translateY(0) scale(1); pointer-events: auto; }

        #searchBoxWrap { height: 40px; padding-right: 2px; }
        #homeContactLoginGroup { position: relative; z-index: 5; will-change: transform; transition: transform 0.45s cubic-bezier(0.4,0,0.2,1); }
        #homeContactLoginGroup.icons-pushed { transform: translateX(-270px); }
        #searchDropdownMenu { position: absolute; right: 0; top: 50%; transform: translateY(-50%) translateX(12px); width: 40px; height: 40px; border-radius: 999px; opacity: 0; visibility: hidden; overflow: hidden;
            transition: width 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease, visibility 0.4s ease, transform 0.4s cubic-bezier(0.16,1,0.3,1); pointer-events: none; white-space: nowrap; }
        #searchDropdownMenu.open { width: 250px; right: 0; opacity: 1; visibility: visible; transform: translateY(-50%) translateX(0); pointer-events: auto; }
        @media (min-width: 640px) { #searchDropdownMenu.open { width: 270px; } }
        #searchDropdownMenu input { padding-right: 38px; }
        #searchIconBtn { transition: width 0.3s cubic-bezier(0.34,1.56,0.64,1), height 0.3s cubic-bezier(0.34,1.56,0.64,1), background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.3s ease, box-shadow 0.3s ease; }
        #searchBoxWrap.search-open #searchIconBtn { width: 30px; height: 30px; background-color: #d97706 !important; color: #ffffff !important; border-color: #d97706 !important; transform: translateX(-5px); }
        #searchBoxWrap.search-open #searchIconBtn:hover { background-color: #b45309 !important; border-color: #b45309 !important; transform: translateX(-5px) scale(1.05); }

        .theme-mode-switch { --theme-index: 1; position: relative; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid transparent; transition: background-color 0.45s ease, border-color 0.45s ease; }
        .theme-mode-switch::before { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 999px; background: #d97706; transform: translateX(calc(var(--theme-index) * 30px)); transition: transform 0.45s cubic-bezier(0.4,0,0.2,1), background-color 0.35s ease; z-index: 0; pointer-events: none; }
        #mainNav.nav-solid .theme-mode-switch { background: #f1f5f9; border-color: #e2e8f0; }
        .theme-mode-btn { position: relative; z-index: 1; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: none; background: transparent; color: inherit; opacity: 0.7; cursor: pointer; font-size: 0.72rem; transition: color 0.35s ease, opacity 0.25s ease, transform 0.25s ease; }
        .theme-mode-btn:hover { opacity: 1; transform: scale(1.08); }
        .theme-mode-btn.active { color: #ffffff !important; opacity: 1; }

        /* ---------- FILTER TABS + PANEL (same as All Projects) ---------- */
        #filterTabsContainer { position: relative; }
        #filterTabIndicator { position: absolute; top: 0; left: 0; z-index: 10; border-radius: 999px; background-color: #d97706;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), width 0.3s cubic-bezier(0.4,0,0.2,1), height 0.3s cubic-bezier(0.4,0,0.2,1); width: 0; height: 0; }
        .filter-tab { position: relative; z-index: 20; background-color: transparent !important; color: #3a3c3c; transition: all 0.25s ease; }
        body.theme-effective-dark .filter-tab { background-color: transparent !important; color: #c7c5c2 !important; }
        .filter-tab.active-text { color: #ffffff !important; }
        body.theme-effective-dark .filter-tab.active-text { color: #ffffff !important; }

        #advFilterPanel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s cubic-bezier(0.16,1,0.3,1); }
        #advFilterPanel.open { grid-template-rows: 1fr; }
        #advFilterPanel > div { overflow: hidden; }
        .filter-input-caps, .filter-input-caps option { text-transform: uppercase; }
        .filter-input-caps::placeholder { text-transform: uppercase; }
        body.theme-effective-dark #advFilterPanel { background-color: #131414 !important; border-bottom-color: #2a2c2c !important; }
        body.theme-effective-dark #advFilterPanel input, body.theme-effective-dark #advFilterPanel select { background-color: #2a2c2c !important; border-color: #3a3c3c !important; color: #ffffff !important; }
        body.theme-effective-dark #advFilterPanel label { color: #a8a6a3 !important; }
        body.theme-effective-dark #pageHeaderSection { border-bottom-color: #2a2c2c !important; }

        /* ---------- GRAPH SECTION ---------- */
        .graph-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 6px 18px rgba(15,23,42,0.08); transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .graph-card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(15,23,42,0.14); }
        .stat-value { color: #1b1d1d; }
        body.theme-effective-dark .stat-value { color: #ffffff; }

        /* ---------- GRAPH VIEW SWITCHER ---------- */
        .gv-tab { background: transparent; color: #3a3c3c; border: 1px solid #e2e8f0; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
        /* all buttons same size */
        .gv-tab { width: 210px; max-width: 100%; text-align: center; white-space: nowrap; }
        @media (max-width: 639px) { .gv-tab { width: calc(50% - 4px); font-size: 10px; } }
        .gv-tab:hover { border-color: #d97706; color: #d97706; }
        .gv-tab.gv-active { background: #d97706; border-color: #d97706; color: #ffffff; }
        .gv-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; cursor: pointer;
            color: #b45309; background: rgba(217,119,6,0.10); border: 1px solid rgba(217,119,6,0.45); transition: background-color 0.25s ease, color 0.25s ease; }
        .gv-chip:hover { background: #d97706; color: #ffffff; }
        body.theme-effective-dark .gv-tab { color: #c7c5c2; border-color: #3a3c3c; }
        body.theme-effective-dark .gv-tab:hover { color: #f59e0b; border-color: #f59e0b; }
        body.theme-effective-dark .gv-tab.gv-active { background: #d97706; border-color: #d97706; color: #ffffff; }
        body.theme-effective-dark .gv-chip { color: #fbbf24; }
        body.theme-effective-dark .gv-chip:hover { color: #ffffff; }

        /* ---------- MOUNTAIN GRAPH ---------- */
        .mountain-wrap { overflow-x: auto; overflow-y: hidden; padding-bottom: 8px; }
        .mountain-svg { min-width: 760px; width: 100%; height: auto; display: block; }
        #mgMarkers { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.28)); pointer-events: none; }
        .mg-count { font-family: 'Poppins', sans-serif; font-weight: 500; fill: #ffffff; pointer-events: none; }
        .mg-label { font-family: 'Poppins', sans-serif; font-weight: 600; fill: #3a3c3c; letter-spacing: 1px; pointer-events: none; }
        body.theme-effective-dark .mg-label { fill: #e2e8f0; }
        .mg-hit { fill: transparent; }
        .mg-hit.mg-click { cursor: pointer; }
        .mg-hit.mg-click:hover { fill: rgba(217,119,6,0.12); }
        #graphCharts {
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }
        /* ---------- GRAPH WHOLE-PANEL SLIDE ---------- */
        #graphCharts.graph-panel-sliding {
            overflow: hidden;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            will-change: transform;
        }
    </style>
</head>

<body class="bg-white text-slate-800">

    <div id="pageLoadingBar" aria-hidden="true"><div id="pageLoadingProgress"></div></div>

    <div id="pageContentWrapper">

        <!-- Header is sourced directly from index.html so one header stays shared. -->
        <div id="indexHeaderContainer" aria-label="Site header"></div>

        <script>
        window.__indexHeaderReady = (async function loadIndexHeader() {
            const container = document.getElementById('indexHeaderContainer');
            if (!container) return;
            try {
                const response = await fetch('index.html', { cache: 'no-store' });
                if (!response.ok) throw new Error('Unable to load index.html');
                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const nav = doc.querySelector('#mainNav');
                if (!nav) throw new Error('Header #mainNav was not found in index.html');
                container.replaceChildren(nav.cloneNode(true));

                const homeLink = container.querySelector('#homeContactLoginGroup a[title="Home"]');
                const contactLink = container.querySelector('#homeContactLoginGroup a[title="Contact"]');
                if (homeLink) homeLink.href = 'index.html';
                if (contactLink) {
                    contactLink.href = 'index.html#siteFooterContainer';
                    contactLink.addEventListener('click', function (event) {
                        const footer = document.getElementById('siteFooterContainer');
                        if (footer) { event.preventDefault(); footer.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
                    });
                }
                document.dispatchEvent(new CustomEvent('ynad-index-header-ready'));
            } catch (error) {
                console.error('Shared index header failed to load:', error);
                container.innerHTML = '';
            }
        })();
        </script>

        <section id="pageHeaderSection" class="py-12 md:py-16 text-center bg-slate-50 border-b border-slate-200 px-6">
            <h1 id="pageHeadingText" class="text-xl md:text-2xl font-light tracking-widest uppercase mb-3 reveal-fade-left" style="color: rgba(0,0,0,0.7); margin-bottom: calc(0.75rem + 0.3in);">Project Graph</h1>

            <div id="filterTabsContainer" class="flex flex-wrap justify-center gap-3 mb-6"></div>

            <button onclick="toggleAdvFilterPanel()" id="advFilterToggleBtn" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-amber-600 hover:text-amber-700 transition cursor-pointer">
                <i class="fa-solid fa-sliders"></i> <span id="advFilterToggleLabel">Show Filters</span>
            </button>
        </section>

        <div id="advFilterPanel" class="bg-white border-b">
            <div>
                <div class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Category</label>
                        <select id="filterCategory" onchange="requestFilteredGraphUpdate()" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500 bg-white">
                            <option value="">All Categories</option>
                            <option value="Masjid">Masjid</option>
                            <option value="Madrasa">Madrasa</option>
                            <option value="Markaz">Markaz</option>
                            <option value="Orphanage">Orphanage</option>
                            <option value="Ablution">Ablution</option>
                            <option value="Water Well">Water Well</option>
                            <option value="Clinic">Clinic</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Organization</label>
                        <input type="text" id="filterOrganization" onkeyup="requestFilteredGraphUpdate()" placeholder="e.g. WAMY" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Donor Name / ID</label>
                        <input type="text" id="filterDonor" onkeyup="requestFilteredGraphUpdate()" placeholder="Name or ID" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Donated Country</label>
                        <input type="text" id="filterCountry" list="worldCountryList" onkeyup="requestFilteredGraphUpdate()" onchange="requestFilteredGraphUpdate()" placeholder="Enter country name" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                        <datalist id="worldCountryList"></datalist>
                    </div>

                    <div class="sm:col-span-2">
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <label class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Cost</label>
                            <div class="relative inline-flex items-center">
                                <select id="costMode" onchange="onCostModeChange()" class="appearance-none bg-transparent text-[10px] font-normal uppercase tracking-wide text-slate-500 pr-3.5 cursor-pointer focus:outline-none">
                                    <option value="exact" selected>Exact Cost</option>
                                    <option value="range">Cost Range</option>
                                </select>
                                <i class="fa-solid fa-chevron-down text-[6px] text-slate-400 absolute right-0 pointer-events-none"></i>
                            </div>
                        </div>
                        <div id="costExactWrap">
                            <input type="number" id="filterCostExact" onchange="requestFilteredGraphUpdate()" placeholder="750000" class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                        </div>
                        <div id="costRangeWrap" class="hidden items-center gap-2">
                            <input type="number" id="filterCostMin" onchange="requestFilteredGraphUpdate()" placeholder="500000" class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                            <span class="text-slate-400 text-xs">—</span>
                            <input type="number" id="filterCostMax" onchange="requestFilteredGraphUpdate()" placeholder="1800000" class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">BD District</label>
                        <input type="text" id="filterDistrict" list="bdDistrictList" onkeyup="requestFilteredGraphUpdate()" onchange="requestFilteredGraphUpdate()" placeholder="Enter district name" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                        <datalist id="bdDistrictList"></datalist>
                    </div>

                    <div class="sm:col-span-2 lg:col-span-2">
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <label class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Date</label>
                            <div class="relative inline-flex items-center">

                    nav.classList.toggle('nav-solid', currentScrollY > 4);
                    if (currentScrollY <= 4) nav.classList.remove('nav-hidden');
                    else if (currentScrollY > lastScrollY) nav.classList.add('nav-hidden');

            if (!user) return '';

            const identityData = identities[0] && identities[0].identity_data ? identities[0].identity_data : {};

        /* ---------- Theme ---------- */
        function setThemeMode(mode) {
            const validModes = ['light', 'dynamic', 'dark'];
            if (!validModes.includes(mode)) mode = 'dynamic';
            const switcher = document.getElementById('themeModeSwitch');
            const buttons = document.querySelectorAll('.theme-mode-btn');
            const indexMap = { light: 0, dynamic: 1, dark: 2 };
            buttons.forEach(function(btn) { btn.classList.toggle('active', btn.getAttribute('data-mode') === mode); });
            if (switcher) switcher.style.setProperty('--theme-index', indexMap[mode]);

            const body = document.body;
            body.classList.add('theme-transition');
            body.classList.remove('theme-light', 'theme-dynamic', 'theme-dark', 'theme-effective-dark');
            body.classList.add('theme-' + mode);

            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isEffectiveDark = mode === 'dark' || (mode === 'dynamic' && prefersDark);
            if (isEffectiveDark) body.classList.add('theme-effective-dark');
            document.documentElement.classList.toggle('dark', isEffectiveDark);

            try {
                const menuFrame = document.getElementById('menuLinksFrame');
                if (menuFrame && menuFrame.contentWindow) menuFrame.contentWindow.postMessage({ type: 'ynad-theme', dark: isEffectiveDark }, '*');
            } catch (e) {}

            window.clearTimeout(window.__ynadThemeTransitionTimer);
            window.__ynadThemeTransitionTimer = window.setTimeout(function() { body.classList.remove('theme-transition'); }, 500);
            try { localStorage.setItem('ynad-theme-mode', mode); } catch (e) {}
        }

        window.addEventListener('message', function(e) {
            if (!e.data || typeof e.data !== 'object') return;
            if (e.data.type === 'ynad-request-theme') {
                const isEffectiveDark = document.body.classList.contains('theme-effective-dark');
                try {
                    const menuFrame = document.getElementById('menuLinksFrame');
                    if (menuFrame && menuFrame.contentWindow && e.source === menuFrame.contentWindow) {
                        menuFrame.contentWindow.postMessage({ type: 'ynad-theme', dark: isEffectiveDark }, '*');
                    }
                } catch (err) {}
            }
        });

        (function initThemeMode() {

                setThemeMode(saved);

                        if (document.body.classList.contains('theme-dynamic')) setThemeMode('dynamic');

        function getNonStatusFilteredProjects() {
            const category = document.getElementById('filterCategory').value.toLowerCase();
            const organization = document.getElementById('filterOrganization').value.toLowerCase();
            const donor = document.getElementById('filterDonor').value.toLowerCase();
            const country = document.getElementById('filterCountry').value.toLowerCase();
            const district = document.getElementById('filterDistrict').value.toLowerCase();
            const engineer = document.getElementById('filterEngineer').value.toLowerCase();

            const costMode = document.getElementById('costMode').value;
            const costExact = parseFloat(document.getElementById('filterCostExact').value);
            const costMin = parseFloat(document.getElementById('filterCostMin').value);
            const costMax = parseFloat(document.getElementById('filterCostMax').value);

            const dateMode = document.getElementById('dateMode').value;
            const dateExact = document.getElementById('filterDateExact').value;
            const dateMin = document.getElementById('filterDateMin').value;
            const dateMax = document.getElementById('filterDateMax').value;

            return allProjectsData.filter(p => {
                for (const v in graphDrill) {
                    if (!GRAPH_VIEWS[v] || gvNorm(GRAPH_VIEWS[v].get(p)) !== graphDrill[v].key) return false;
                }
                if (searchQuery) {
                    const hay = [p.bd_number, p.ho_number, p.project_name, p.organization, p.donor_name, p.donated_country, p.district].join(' ').toUpperCase();
                    if (!hay.includes(searchQuery)) return false;
                }
                if (category && (p.category || '').toLowerCase() !== category) return false;
                if (organization && !(p.organization || '').toLowerCase().includes(organization)) return false;
                if (donor && !(`${p.donor_name || ''} ${p.donor_id || ''}`).toLowerCase().includes(donor)) return false;
                if (country && !(p.donated_country || '').toLowerCase().includes(country)) return false;
                if (district && !(p.district || '').toLowerCase().includes(district)) return false;
                if (engineer && !(`${p.engineer_name || ''} ${p.engineer_id || ''}`).toLowerCase().includes(engineer)) return false;

                if (costMode === 'exact') {
                    if (!isNaN(costExact) && (p.cost === null || p.cost === undefined || Number(p.cost) !== costExact)) return false;
                } else {
                    if (!isNaN(costMin) && (p.cost === null || p.cost === undefined || p.cost < costMin)) return false;
                    if (!isNaN(costMax) && (p.cost === null || p.cost === undefined || p.cost > costMax)) return false;
                }
                if (dateMode === 'exact') {
                    if (dateExact && p.opening_date !== dateExact) return false;
                } else {
                    if (dateMin && (!p.opening_date || p.opening_date < dateMin)) return false;
                    if (dateMax && (!p.opening_date || p.opening_date > dateMax)) return false;
                }
                return true;
            });
        }

            lastFilteredCount = finalFiltered.length;

        /* ---------- Graph views (Category / District / ...) + drill-down ---------- */
        function gvClean(v) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim(); }
        function gvNorm(v) { return gvClean(v).normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ''); }

        const GRAPH_VIEWS = {
            category:     { label: 'Category',        all: 'all categories',        get: p => p.category },
            district:     { label: 'District',        all: 'all districts',         get: p => p.district },

        function setGraphView(view) {

        /* ---------- Mountain graph ---------- */
        const MG_CATEGORIES = ['Masjid', 'Madrasa', 'Markaz', 'Orphanage', 'Ablution', 'Water Well', 'Clinic'];
        const MG_GAP = 10, MG_DURATION = 900, MG_DENSE_AFTER = 12, MG_MIN_AXIS = 4;
        const mgState = { names: {}, cats: {}, max: 1, ready: false, raf: null, view: null, dense: false, clickable: false, stagger: false, instant: false,
                          W: 1600, CH: 520, H: 650, ymin: 94, ymax: 370 };

        /* graph height = visible screen-er ekta fraction (aro kom chaile RATIO komao) */
        const MG_HEIGHT_RATIO = 0.85;   // 1 = full height, 0.5 = ordheyk

        function mgFitHeight() {
            const bar = document.getElementById('graphViewBar');
            const used = 76 + 48 + (bar ? bar.offsetHeight : 90) + 32 + 8;
            const fit = window.innerHeight - used;
            return Math.max(300, Math.round(fit * MG_HEIGHT_RATIO));
        }

        function smoothPath(pts) {
            let d = `M${pts[0][0]},${pts[0][1]}`;
            for (let i = 0; i < pts.length - 1; i++) {
                const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
                const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
                const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
                d += ` C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;
            }
            return d;
        }
        function mgEase(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
        function mgBack(t) { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
        function mgShort(name) { const s = String(name); return s.length > 26 ? s.slice(0, 25) + '…' : s; }

        function mgWrap(name, slot) {
            const words = mgShort(name).toUpperCase().split(/\s+/).filter(Boolean);
            const longest = Math.max(1, ...words.map(w => w.length));
            const fs = Math.max(12, Math.min(26, (slot - 16) / (longest * 0.78)));
            if (words.length <= 2) return { lines: words, fs };
            const maxChars = Math.max(longest, Math.floor((slot - 16) / (fs * 0.78)));
            const lines = [];
            let cur = '';
            words.forEach(w => {
                if (!cur) cur = w;
                else if ((cur + ' ' + w).length <= maxChars) cur += ' ' + w;
                else { lines.push(cur); cur = w; }
            });
            if (cur) lines.push(cur);
            if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].replace(/.?$/, '…'); }
            return { lines, fs };
        }

        function mgSkeletonHtml() {
            return `
                <div class="col-span-full">
                    <div class="mountain-wrap">
                        <svg id="mgSvg" class="mountain-svg" viewBox="0 0 ${mgState.W} ${mgState.H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project graph">
                            <defs>
                                <linearGradient id="mgDark" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#d97706"/>
                                </linearGradient>
                                <linearGradient id="mgLight" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0" stop-color="#ea9a10"/><stop offset="1" stop-color="#dd880c"/>
                                </linearGradient>
                                <clipPath id="mgClip"><path id="mgClipPath" d=""/></clipPath>
                            </defs>
                            <g clip-path="url(#mgClip)"><g id="mgBars"></g></g>
                            <g id="mgCounts"></g>
                            <g id="mgMarkers"></g>
                            <g id="mgLabels"></g>
                            <g id="mgHits"></g>
                        </svg>
                    </div>
                </div>`;
        }

        function mgDraw() {
            const barsEl = document.getElementById('mgBars');
            if (!barsEl) return;
            const W = mgState.W, CH = mgState.CH, H = mgState.H;
            const YMIN = mgState.ymin, YMAX = mgState.ymax;
            const M = Math.max(mgState.max, MG_MIN_AXIS);   // few projects => peak stays mid-height
            const vis = Object.keys(mgState.cats)
                .filter(k => mgState.cats[k].o > 0.002 && mgState.cats[k].sw > 1)
                .sort((a, b) => mgState.cats[a].x - mgState.cats[b].x);
            if (!vis.length) return;

            const pts = [], bars = [], counts = [], markers = [], labels = [], hits = [];

            vis.forEach(k => {
                const s = mgState.cats[k];
                const name = mgState.names[k] || k;
                const cx = s.x, slot = s.sw, o = s.o.toFixed(3);
                const y = YMAX - Math.min(s.c / M, 1) * (YMAX - YMIN);
                pts.push([cx, y]);

                const g = Math.min(MG_GAP, slot * 0.2);
                const bw = Math.max(slot - g, 0), bx = cx - bw / 2;
                bars.push(`<rect x="${bx.toFixed(2)}" y="0" width="${bw.toFixed(2)}" height="${CH}" fill="url(#mgLight)"/>` +
                          `<rect x="${bx.toFixed(2)}" y="0" width="${bw.toFixed(2)}" height="${CH}" fill="url(#mgDark)" opacity="${s.p.toFixed(3)}"/>`);

                const num = String(Math.round(s.c)).padStart(2, '0');
                const cfs = Math.min(38, slot * 0.8 / (num.length * 0.62));
                counts.push(`<text class="mg-count" font-size="${cfs.toFixed(1)}" x="${cx.toFixed(2)}" y="${CH - 50}" text-anchor="middle" opacity="${o}">${num}</text>`);

                const ro = Math.min(26, slot * 0.42);
                markers.push(`<g opacity="${o}"><circle cx="${cx.toFixed(2)}" cy="${y.toFixed(2)}" r="${ro.toFixed(2)}" fill="#ffffff"/><circle cx="${cx.toFixed(2)}" cy="${y.toFixed(2)}" r="${(ro * 0.5).toFixed(2)}" fill="#b45309"/></g>`);

                const o2 = (s.o * s.o).toFixed(3);
                if (mgState.dense) {
                    const fs = Math.min(20, Math.max(11, slot * 0.55));
                    labels.push(`<text class="mg-label" font-size="${fs.toFixed(1)}" transform="translate(${cx.toFixed(2)} ${CH + 16}) rotate(-90)" text-anchor="end" dy="0.35em" opacity="${o2}">${escapeHtml(mgShort(name).toUpperCase())}</text>`);
                } else {
                    const w = mgWrap(name, slot);
                    labels.push(`<g opacity="${o2}">` + w.lines.map((ln, li) =>
                        `<text class="mg-label" font-size="${w.fs.toFixed(1)}" x="${cx.toFixed(2)}" y="${(CH + 40 + li * w.fs * 1.3).toFixed(1)}" text-anchor="middle">${escapeHtml(ln)}</text>`).join('') + `</g>`);
                }

                const tip = `${name}: ${Math.round(s.c)} project(s)` + (mgState.clickable ? ' (click to see the category breakdown)' : '');
                hits.push(`<rect class="mg-hit${mgState.clickable ? ' mg-click' : ''}" data-key="${escapeHtml(k)}" x="${(cx - slot / 2).toFixed(2)}" y="0" width="${slot.toFixed(2)}" height="${H}"><title>${escapeHtml(tip)}</title></rect>`);
            });

            const curve = smoothPath([[0, pts[0][1] + 40], ...pts, [W, pts[pts.length - 1][1] + 40]]);
            document.getElementById('mgClipPath').setAttribute('d', `${curve} L${W},${CH} L0,${CH} Z`);
            barsEl.innerHTML = bars.join('');
            document.getElementById('mgCounts').innerHTML = counts.join('');
            document.getElementById('mgMarkers').innerHTML = markers.join('');
            document.getElementById('mgLabels').innerHTML = labels.join('');
            document.getElementById('mgHits').innerHTML = hits.join('');
        }

        function mgReset() {
            if (mgState.raf) cancelAnimationFrame(mgState.raf);
            mgState.raf = null; mgState.cats = {}; mgState.names = {}; mgState.max = 1; mgState.ready = false; mgState.view = null;
        }

        function mgAnimate(keys, counts, clickable, names) {
            const charts = document.getElementById('graphCharts');
            let svg = document.getElementById('mgSvg');

            /* On the first render the page only has the "Loading graph..."
               placeholder. Build the SVG skeleton before drawing the graph. */
            if (!svg && charts) {
                charts.innerHTML = mgSkeletonHtml();
                svg = document.getElementById('mgSvg');
            }
            if (!svg) return;

            Object.assign(mgState.names, names || {});
            const n = keys.length;
            const box = document.getElementById('graphCharts');
            const W = Math.max(760, Math.round(box.clientWidth || 1600), n * 28);
            const sw = W / n;
            const fresh = !mgState.ready;
            let tmax = 1;
            keys.forEach(k => { if (counts[k] > tmax) tmax = counts[k]; });

            mgState.dense = n > MG_DENSE_AFTER;
            mgState.clickable = clickable;
            let labelH;
            if (mgState.dense) {
                const fs = Math.min(20, Math.max(11, sw * 0.55));
                const longest = Math.max(...keys.map(k => mgShort(mgState.names[k] || k).length));
                labelH = Math.min(300, 36 + longest * fs * 0.8);
            } else {
                let lines = 1, fsMax = 12;
                keys.forEach(k => { const w = mgWrap(mgState.names[k] || k, sw); lines = Math.max(lines, w.lines.length); fsMax = Math.max(fsMax, w.fs); });
                labelH = 40 + lines * fsMax * 1.3 + 20;
            }
            mgState.W = W;
            mgState.CH = Math.max(140, mgFitHeight() - labelH);
            mgState.H = mgState.CH + labelH;
            mgState.ymin = mgState.CH * 0.08;
            mgState.ymax = mgState.CH * 0.55;
            svg.setAttribute('viewBox', `0 0 ${W} ${mgState.H}`);
            svg.style.minWidth = W + 'px';

            /* targets */
            const target = {};
            keys.forEach((k, i) => {
                const tx = (i + 0.5) * sw, tp = i % 2 === 0 ? 1 : 0;
                let cur = mgState.cats[k];
                if (!cur) cur = mgState.cats[k] = { c: 0, x: tx, sw: fresh ? sw : 0, o: fresh ? 1 : 0, p: tp };
                else if (cur.o < 0.002 || cur.sw < 1) { cur.x = tx; cur.sw = 0; cur.p = tp; }
                target[k] = { c: counts[k], x: tx, sw: sw, o: 1, p: tp };
            });
            Object.keys(mgState.cats).forEach(k => {
                if (!target[k]) { const cur = mgState.cats[k]; target[k] = { c: 0, x: cur.x, sw: 0, o: 0, p: cur.p }; }
            });
            if (fresh) mgState.max = tmax;
            mgState.ready = true;

            const from = {};
            Object.keys(target).forEach(k => { const s = mgState.cats[k]; from[k] = { c: s.c, x: s.x, sw: s.sw, o: s.o, p: s.p }; });
            const fromMax = mgState.max;

            if (mgState.raf) cancelAnimationFrame(mgState.raf);
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const start = performance.now();
            const idx = {};
            keys.forEach((k, i) => { idx[k] = i; });
            const STAG = mgState.stagger ? Math.min(110, 800 / n) : 0;   // delay between bars (ms)
            const total = MG_DURATION + STAG * n;

            const step = (now) => {
                const el = (reduce || mgState.instant) ? 1e9 : now - start;
                const t = Math.min(1, el / total);
                Object.keys(target).forEach(k => {
                    const a = from[k], b = target[k], s = mgState.cats[k];
                    if (!s) return;
                    const tk = Math.min(1, Math.max(0, (el - (idx[k] || 0) * STAG) / MG_DURATION));
                    const e = mgEase(tk);
                    s.c = a.c + (b.c - a.c) * (mgState.stagger ? mgBack(tk) : e);   // bounce on the height
                    s.x = a.x + (b.x - a.x) * e;
                    s.sw = a.sw + (b.sw - a.sw) * e;
                    s.o = a.o + (b.o - a.o) * e;
                    s.p = a.p + (b.p - a.p) * e;
                });
                mgState.max = fromMax + (tmax - fromMax) * mgEase(Math.min(1, el / MG_DURATION));
                if (t >= 1) Object.keys(target).forEach(k => { if (target[k].o === 0) delete mgState.cats[k]; });
                mgDraw();
                mgState.raf = t < 1 ? requestAnimationFrame(step) : null;
            };
            mgState.raf = requestAnimationFrame(step);
        }

        function renderEmptyGraph(message, keepStats) {
            mgReset();
            if (!keepStats) document.getElementById('graphStats').innerHTML = '';
            setGraphTitle('');
            const emptyCharts = document.getElementById('graphCharts');
            if (emptyCharts) {
                emptyCharts.style.height = '';
            }
            document.getElementById('graphCharts').innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center text-center py-24 min-h-[320px] text-slate-400">
                    <i class="fa-solid fa-chart-line text-4xl mb-4 text-slate-300"></i>
                    <span class="text-sm tracking-wide uppercase">${escapeHtml(message)}</span>
                </div>`;
        }

        function animateGraphPanel(direction, update) {
            const charts = document.getElementById('graphCharts');
            const oldSvg = document.getElementById('mgSvg');
            if (!charts || !oldSvg || !direction) { update(); return; }

            const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) { update(); return; }

            const height = Math.max(charts.offsetHeight, charts.scrollHeight);
            if (height > 0) charts.style.height = height + 'px';
            charts.classList.add('graph-panel-sliding');

            const out = charts.animate(
                [
                    { transform: 'translate3d(0, 0, 0)' },
                    { transform: `translate3d(${-direction * 100}%, 0, 0)` }
                ],
                { duration: 380, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
            );

            out.finished.catch(() => {}).finally(() => {
                out.cancel();
                update();

                /* New graph starts fully outside on the opposite side.
                   Nothing is displayed side-by-side, so the graph never looks split. */
                charts.style.transform = `translate3d(${direction * 100}%, 0, 0)`;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        const incoming = charts.animate(
                            [
                                { transform: `translate3d(${direction * 100}%, 0, 0)` },
                                { transform: 'translate3d(0, 0, 0)' }
                            ],
                            { duration: 380, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
                        );
                        incoming.finished.catch(() => {}).finally(() => {
                            incoming.cancel();
                            charts.style.transform = '';
                            charts.style.height = '';
                            charts.classList.remove('graph-panel-sliding');
                        });
                    });
                });
            });
        }

        function renderGraph(projects) {
            const charts = document.getElementById('graphCharts');
            syncGraphControls();

            /* All interactive graph/filter changes use the same whole-graph
               left/right transition. Initial load and resize stay instant. */
            if (graphAnimationPending && document.getElementById('mgSvg') && graphDir) {
                const direction = graphDir;
                graphAnimationPending = false;
                graphDir = 0;
                animateGraphPanel(direction, () => renderGraph(projects));
                return;
            }

            if (!projects || projects.length === 0) {
                renderEmptyGraph('No projects match the selected filters.');
                return;
            }

            const g = GRAPH_VIEWS[graphView];

            const counts = {}, forms = {};
            projects.forEach(p => {
                const raw = gvClean(g.get(p));
                const k = gvNorm(raw);
                if (!k) return;
                counts[k] = (counts[k] || 0) + 1;
                forms[k] = forms[k] || {};
                forms[k][raw] = (forms[k][raw] || 0) + 1;
            });
            let keys = Object.keys(counts);
            if (!keys.length) {
                renderEmptyGraph(`No ${g.label.toLowerCase()} data for the selected filters.`, true);
                return;
            }

            const names = {};
            keys.forEach(k => {
                const canon = graphView === 'category' ? MG_CATEGORIES.find(c => gvNorm(c) === k) : null;
                names[k] = canon || Object.keys(forms[k]).sort((a, b) => forms[k][b] - forms[k][a])[0];
            });

            if (graphView === 'category') {
                const known = MG_CATEGORIES.map(gvNorm).filter(k => counts[k]);
                const extra = keys.filter(k => !known.includes(k)).sort((a, b) => names[a].localeCompare(names[b]));
                keys = known.concat(extra);
            } else {
                keys.sort((a, b) => counts[b] - counts[a] || names[a].localeCompare(names[b]));
            }

            const drillText = Object.keys(graphDrill).map(v => graphDrill[v].label).join(' and ');
            setGraphTitle(`Projects by ${g.label}${drillText ? ' for ' + drillText : ''} (${keys.length})`);

            mgState.stagger = false;
            mgState.instant = false;
            mgState.view = graphView;
            mgAnimate(keys, counts, graphView !== 'category', names);
        }

        async function loadAllProjects() {
            populateReferenceLists();
            const { data, error } = await supabaseClient
                .from('projects')
                .select('*')
                .order('opening_date', { ascending: false, nullsFirst: false });

            if (error) {
                console.error(error);
                document.getElementById('graphCharts').innerHTML =
                    `<div class="col-span-full flex items-center justify-center py-24 min-h-[320px] text-red-500 text-sm">Failed to load projects: ${escapeHtml(error.message)}</div>`;
                return;
            }
            allProjectsData = data || [];
            applyAdvFilters();
        }

        /* re-fit graph to the screen when the window is resized */
        let __gResizeT;
        window.addEventListener('resize', () => { clearTimeout(__gResizeT); __gResizeT = setTimeout(applyAdvFilters, 200); });

        window.addEventListener('DOMContentLoaded', () => {
            currentFilter = 'all';
            buildGraphViewTabs();
            loadAllProjects();
            observeRevealTargets(document);
            initAuthState();

            if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => scheduleIndicatorSync(50));
            window.addEventListener('load', () => scheduleIndicatorSync(350));

            const loadingProgress = document.getElementById('pageLoadingProgress');
            const finishPageLoad = () => {
                if (!loadingProgress) return;
                loadingProgress.style.width = '100%';
                setTimeout(() => { loadingProgress.style.opacity = '0'; }, 250);
                setTimeout(() => { const bar = document.getElementById('pageLoadingBar'); if (bar) bar.style.display = 'none'; }, 650);
            };
            if (loadingProgress) requestAnimationFrame(() => { loadingProgress.style.width = '72%'; });
            if (document.readyState === 'complete') finishPageLoad();
            else window.addEventListener('load', finishPageLoad, { once: true });
        });
    </script>
</body>
