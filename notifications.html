body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);transition:background .3s}
#pageContentWrapper{min-height:100vh;display:flex;flex-direction:column}

button,select,input{font-family:inherit}
.ibtn{height:38px;padding:0 16px;border-radius:999px;border:1.5px solid var(--amber);background:transparent;color:var(--amber);font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:.25s;white-space:nowrap}

main{max-width:1100px;width:100%;flex:1 0 auto;margin:0 auto;padding:124px 24px 80px}

.sub{color:var(--muted);font-size:13px;margin:4px 0 26px}

/* Tabs with sliding indicator */
.tabs-row{display:flex;align-items:stretch;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs{position:relative;display:flex;gap:4px}
#tabIndicator{position:absolute;bottom:-1px;left:0;height:2px;width:0;background:var(--amber);border-radius:2px;pointer-events:none;transition:transform .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1)}
.tab{background:none;border:none;padding:11px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:color .3s ease;white-space:nowrap}
.tab:hover,.tab.on{color:var(--amber)}
.tab-tools{display:flex;gap:8px;align-self:center;margin-bottom:6px}
.panel-in{animation:panelIn .35s ease both}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Notification cards */
.notif{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;transition:border-color .2s,background .2s,box-shadow .2s,opacity .2s}
.notif.blue{--pc:var(--manager)}.notif.amber{--pc:var(--amber)}.notif.red{--pc:var(--bad)}
.notif.unread{border-left-color:var(--amber);background:var(--panel);background:color-mix(in srgb,var(--amber) 8%,var(--panel));cursor:pointer}
.notif.unread:hover{box-shadow:0 8px 22px rgba(0,0,0,.1)}
.notif.read{opacity:.7}
.n-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid var(--line);background:var(--soft);color:var(--pc,var(--amber))}
.n-top{display:flex;align-items:center;gap:8px;min-width:0}
.n-top b{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notif.unread .n-top b{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:transparent}
.notif.unread .dot{background:var(--amber)}
.n-local{font-size:12px;color:var(--muted);margin-top:1px}
.n-msg{font-size:12.5px;margin-top:6px;line-height:1.55}
.n-meta{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.n-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:11px;font-weight:600;border-radius:99px;padding:3px 11px;border:1px solid currentColor;display:inline-block;color:var(--pc,var(--muted));white-space:nowrap}
.b{height:34px;padding:0 14px;border-radius:7px;border:1.5px solid var(--amber);background:var(--amber);color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}
.b:hover{background:var(--amber-d);border-color:var(--amber-d)}
.b.ghost{background:transparent;color:var(--amber)}
.b.ghost:hover{background:var(--amber-d);border-color:var(--amber-d);color:#fff}
.empty{text-align:center;color:var(--muted);padding:50px 20px;background:var(--panel);border:1px dashed var(--line);border-radius:10px;font-size:13px}
.empty i{font-size:26px;color:var(--amber);display:block;margin-bottom:10px}
.search-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}

.toast{position:fixed;right:24px;bottom:24px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);padding:13px 18px;border-radius:9px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.2);transform:translateY(20px);opacity:0;transition:.3s;z-index:120}
.toast.show{transform:none;opacity:1}

<div id="pageContentWrapper">

  <!-- Header is sourced directly from index.html so one header stays shared. -->
  <div id="indexHeaderContainer" aria-label="Site header"></div>

  <script>
  window.__indexHeaderReady = (async function loadIndexHeader() {
      const container = document.getElementById('indexHeaderContainer');
      if (!container) return;
      try {
          const response = await fetch('index.html', { cache: 'no-store' });
          if (!response.ok) throw new Error('Unable to load index.html');
          const html = await response.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const nav = doc.querySelector('#mainNav');
          if (!nav) throw new Error('Header #mainNav was not found in index.html');
          container.replaceChildren(nav.cloneNode(true));

          const homeLink = container.querySelector('#homeContactLoginGroup a[title="Home"]');
          const contactLink = container.querySelector('#homeContactLoginGroup a[title="Contact"]');
          if (homeLink) homeLink.href = 'index.html';
          if (contactLink) {
              contactLink.href = 'index.html#siteFooterContainer';
              contactLink.addEventListener('click', function (event) {
                  const footer = document.getElementById('siteFooterContainer');
                  if (footer) { event.preventDefault(); footer.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
              });
          }
          document.dispatchEvent(new CustomEvent('ynad-index-header-ready'));
      } catch (error) {
          console.error('Shared index header failed to load:', error);
          container.innerHTML = '';
      }
  })();
  </script>

  <!-- Footer — loaded dynamically, identical to the other pages -->
  <div id="siteFooterContainer"></div>

  <script>
  (function(){
      const container = document.getElementById('siteFooterContainer');
      if (!container) return;
      fetch('footer.html', { cache: 'no-store' })
          .then(response => {
              if (!response.ok) throw new Error('Unable to load footer.html');
              return response.text();
          })
          .then(html => {
              const template = document.createElement('template');
              template.innerHTML = html;
              const scripts = Array.from(template.content.querySelectorAll('script'));
              scripts.forEach(script => script.remove());
              container.replaceChildren(template.content.cloneNode(true));
              scripts.forEach(oldScript => {
                  const newScript = document.createElement('script');
                  for (const attr of oldScript.attributes) newScript.setAttribute(attr.name, attr.value);
                  newScript.textContent = oldScript.textContent;
                  document.body.appendChild(newScript);
                  newScript.remove();
              });
          })
          .catch(error => {
              console.error(error);
              container.innerHTML = '<div style="padding:32px;text-align:center;color:#a8a6a3;background:#1b1d1d;">Footer failed to load.</div>';
          });
  })();
  </script>

/* ================= HEADER SCROLL ANIMATION ================= */
(function () {
    function bindIndexHeaderScroll() {
        const nav = document.getElementById('mainNav');
        if (!nav || nav.dataset.scrollBound === 'true') return;
        nav.dataset.scrollBound = 'true';
        let lastScrollY = window.scrollY, ticking = false;

        function handleNavScroll() {
            const y = window.scrollY;
            nav.classList.toggle('nav-solid', y > 4);
            if (nav.dataset.scrollLock === 'true') { nav.classList.add('nav-hidden'); lastScrollY = y; ticking = false; return; }
            if (y <= 4) nav.classList.remove('nav-hidden');
            else if (y > lastScrollY) nav.classList.add('nav-hidden');
            else if (y < lastScrollY) nav.classList.remove('nav-hidden');
            lastScrollY = y; ticking = false;
        }
        window.addEventListener('scroll', function () {
            if (!ticking) { window.requestAnimationFrame(handleNavScroll); ticking = true; }
        }, { passive: true });
        handleNavScroll();
    }
    if (window.__indexHeaderReady && typeof window.__indexHeaderReady.then === 'function') window.__indexHeaderReady.then(bindIndexHeaderScroll);
    else document.addEventListener('ynad-index-header-ready', bindIndexHeaderScroll, { once: true });
})();

function getUserAvatarUrl(user) {
    if (!user) return '';
    const m = user.user_metadata || {};
    const ids = Array.isArray(user.identities) ? user.identities : [];
    const idd = ids[0] && ids[0].identity_data ? ids[0].identity_data : {};
    return m.avatar_url || m.picture || m.profile_image || m.photo_url || idd.avatar_url || idd.picture || '';
}
function getUserDisplayName(user) {
    if (!user) return 'Guest User';
    const m = user.user_metadata || {};
    return m.full_name || m.name || m.user_name || m.username || (user.email ? user.email.split('@')[0] : 'User');
}
function setProfileImage(img, fallback, url) {
    if (!img || !fallback) return;
    if (!url) { img.hidden = true; img.removeAttribute('src'); fallback.hidden = false; return; }
    img.onload = function () { img.hidden = false; fallback.hidden = true; };
    img.onerror = function () { img.hidden = true; img.removeAttribute('src'); fallback.hidden = false; };
    img.src = url;
}
function updateProfileUI(user) {
    const profileBtn = document.getElementById('userProfileBtn');
    const loggedIn = !!user;
    if (profileBtn) { profileBtn.classList.toggle('is-authenticated', loggedIn); profileBtn.title = loggedIn ? 'Profile' : 'Log in'; }
    const avatarUrl = getUserAvatarUrl(user);
    setProfileImage(document.getElementById('userProfileImage'), document.getElementById('userProfileFallback'), avatarUrl);
    setProfileImage(document.getElementById('userDropdownImage'), document.getElementById('userDropdownFallback'), avatarUrl);
    const nameEl = document.getElementById('profileUserName');
    const emailEl = document.getElementById('profileUserEmail');
    if (nameEl) nameEl.textContent = loggedIn ? getUserDisplayName(user) : 'Guest User';
    if (emailEl) emailEl.textContent = loggedIn ? (user.email || 'Signed in') : 'Not logged in';
    const authAction = document.getElementById('profileAuthAction');
    const authIcon = document.getElementById('profileAuthActionIcon');
    const authText = document.getElementById('profileAuthActionText');
    if (authAction && authIcon && authText) {
        if (loggedIn) {
            authAction.href = '#'; authAction.title = 'Log out';
            authIcon.className = 'fa-solid fa-right-from-bracket'; authText.textContent = 'LOG OUT';
            authAction.onclick = handleLogout;
        } else {
            authAction.href = 'login.html'; authAction.title = 'Log in';
            authIcon.className = 'fa-solid fa-right-to-bracket'; authText.textContent = 'LOG IN';
            authAction.onclick = null;
        }
    }
}
async function handleLogout(event) {
    if (event) event.preventDefault();
    try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;
        updateProfileUI(null);
        const dd = document.getElementById('userDropdownMenu');
        if (dd) dd.classList.remove('open');
    } catch (error) { console.error('Logout failed:', error); }
}

});

/* ================= THEME (Light / Dynamic / Dark) ================= */
function setThemeMode(mode) {
    const validModes = ['light', 'dynamic', 'dark'];
    if (!validModes.includes(mode)) mode = 'dynamic';
    const switcher = document.getElementById('themeModeSwitch');
    const indexMap = { light: 0, dynamic: 1, dark: 2 };
    document.querySelectorAll('.theme-mode-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-mode') === mode));
    if (switcher) switcher.style.setProperty('--theme-index', indexMap[mode]);

    const body = document.body;
    body.classList.add('theme-transition');
    body.classList.remove('theme-light', 'theme-dynamic', 'theme-dark', 'theme-effective-dark');
    body.classList.add('theme-' + mode);

    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isEffectiveDark = mode === 'dark' || (mode === 'dynamic' && prefersDark);
    if (isEffectiveDark) body.classList.add('theme-effective-dark');

    document.documentElement.classList.toggle('dark', isEffectiveDark);
    document.documentElement.setAttribute('data-theme', isEffectiveDark ? 'dark' : 'light');

    try {
        const f = document.getElementById('menuLinksFrame');
        if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'ynad-theme', dark: isEffectiveDark }, '*');
    } catch (e) {}

    clearTimeout(window.__ynadThemeTransitionTimer);
    window.__ynadThemeTransitionTimer = setTimeout(() => body.classList.remove('theme-transition'), 500);
    try { localStorage.setItem('ynad-theme-mode', mode); } catch (e) {}
}
window.addEventListener('message', function(e) {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.type === 'ynad-request-theme') {
        const dark = document.body.classList.contains('theme-effective-dark');
        try {
            const f = document.getElementById('menuLinksFrame');
            if (f && f.contentWindow && e.source === f.contentWindow) f.contentWindow.postMessage({ type: 'ynad-theme', dark: dark }, '*');
        } catch (err) {}
    }
});
(function initThemeMode() {
    let saved = 'dynamic';
    try { saved = localStorage.getItem('ynad-theme-mode') || 'dynamic'; } catch (e) {}
    document.addEventListener('DOMContentLoaded', function() {
        Promise.resolve(window.__indexHeaderReady).then(function() { setThemeMode(saved); });
        if (window.matchMedia) {
            const media = window.matchMedia('(prefers-color-scheme: dark)');
            const sync = function() { if (document.body.classList.contains('theme-dynamic')) setThemeMode('dynamic'); };
            if (media.addEventListener) media.addEventListener('change', sync);
            else if (media.addListener) media.addListener(sync);
        }
    });
})();

/* ================= SIDE MENU ================= */
function openMenuWithEffect() {
    const icon = document.getElementById('hamburgerBtnIcon');
    const pageWrapper = document.getElementById('pageContentWrapper');
    const overlay = document.getElementById('menuOverlay');
    const menuFrame = document.getElementById('menuLinksFrame');
    if (icon) icon.classList.add('clicked');
    setTimeout(() => {
        if (icon) icon.classList.remove('clicked');
        pageWrapper.classList.add('blurred');
        setTimeout(() => {
            menuFrame.src = 'menu.html';
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
            menuFrame.onload = function () {
                try { menuFrame.contentWindow.postMessage({ type: 'ynad-menu-open' }, '*'); } catch (e) {}
            };
        }, 200);
    }, 200);
}
function closeMenuWithEffect() {
    const overlay = document.getElementById('menuOverlay');
    const pageWrapper = document.getElementById('pageContentWrapper');
    const menuFrame = document.getElementById('menuLinksFrame');
    try { if (menuFrame && menuFrame.contentWindow) menuFrame.contentWindow.postMessage({ type: 'ynad-menu-closing' }, '*'); } catch (e) {}
    setTimeout(() => {
        overlay.classList.remove('open');
        setTimeout(() => {
            pageWrapper.classList.remove('blurred');
            document.body.style.overflow = 'auto';
            menuFrame.src = 'about:blank';
        }, 400);
    }, 380);
}
function handleOverlayClick(event) {
    if (event.target === document.getElementById('menuOverlay')) closeMenuWithEffect();
}


/* ================= NOTIFICATIONS ================= */
const WINDOW_DAYS = 3;   // reminder starts this many days before the opening date
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtDate = s => new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

/* Read state is kept in this browser, separately for each signed-in user */
const readKey = () => 'ynad-notif-read:' + (me ? me.id : 'guest');
function getRead(){ try{ return new Set(JSON.parse(localStorage.getItem(readKey())||'[]')); }catch(e){ return new Set(); } }
function saveRead(set){ try{ localStorage.setItem(readKey(), JSON.stringify([...set])); return true; }catch(e){ toast('Could not save the read state in this browser.',true); return false; } }

/* A project is notified when it has an opening date that is within WINDOW_DAYS (or already passed)
   and it is not yet marked as opened / completed. The id includes the date, so changing the
   opening date creates a fresh unread notification. */
function buildNotifs(){
  const today = new Date(); today.setHours(0,0,0,0);
  notifs = projects
    .filter(p => p.opening_date && !p.opened_date && p.status !== 'Completed')
    .map(p => ({ id: p.id+'|'+p.opening_date, p, days: Math.round((new Date(p.opening_date+'T00:00:00') - today)/86400000) }))
    .filter(n => Number.isFinite(n.days) && n.days <= WINDOW_DAYS);
}

function info(n){
  const d = n.days, date = fmtDate(n.p.opening_date);
  if (d > 1)  return {cls:'blue',  label:'In '+d+' days', msg:`Opening date is ${date}. This project opens in ${d} days.`};
  if (d === 1) return {cls:'amber', label:'Tomorrow',     msg:`Opening date is ${date}. This project opens tomorrow.`};
  if (d === 0) return {cls:'amber', label:'Today',        msg:`Opening date is ${date}. This project opens today.`};
  const a = -d, u = a === 1 ? 'day' : 'days';
  return {cls:'red', label:a+' '+u+' overdue', msg:`Opening date was ${date} (${a} ${u} ago) and the project is not marked as opened yet.`};
}

function matchN(n){
  if (!searchQuery) return true;
  const p = n.p;
  return [p.project_name,p.local_name,p.bd_number,p.ho_number,p.district,p.category].join(' ').toLowerCase().includes(searchQuery);
}

function render(){
  const read = getRead();
  const unreadTotal = notifs.filter(n => !read.has(n.id)).length;
  $('unreadLine').innerHTML = unreadTotal ? ` <strong>${unreadTotal} unread.</strong>` : '';
  document.title = (unreadTotal ? '('+unreadTotal+') ' : '') + 'Notifications — YNAD Construction';
  $('markAllBtn').classList.toggle('hide', unreadTotal === 0);

  const banner = $('searchBanner');
  if (searchQuery) { banner.classList.remove('hide'); $('searchBannerText').innerHTML = `Showing results for “${esc(searchQuery)}”`; }
  else banner.classList.add('hide');

  const list = notifs.filter(matchN)
    .filter(n => filter === 'all' || (filter === 'unread' ? !read.has(n.id) : read.has(n.id)))
    .sort((a,b) => (read.has(a.id) - read.has(b.id)) || (a.days - b.days));

  if (!list.length) {
    const msg = searchQuery ? 'No matching notifications.'
      : filter === 'unread' ? 'You are all caught up. No unread notifications.'
      : filter === 'read' ? 'No read notifications yet.'
      : 'No notifications. A project shows up here 3 days before its opening date.';
    $('list').innerHTML = `<div class="empty"><i class="fa-solid fa-bell-slash"></i>${msg}</div>`;
  } else {
    $('list').innerHTML = list.map(n => {
      const p = n.p, i = info(n), isRead = read.has(n.id);
      const name = p.project_name || p.local_name || 'Untitled project';
      const local = p.project_name && p.local_name && p.local_name !== p.project_name ? `<div class="n-local">${esc(p.local_name)}</div>` : '';
      const codes = [p.bd_number, p.ho_number ? 'HO-'+String(p.ho_number).replace(/^HO-/i,'') : '', p.district, p.category].filter(Boolean).map(esc).join(' · ');
      return `
      <article class="notif ${isRead?'read':'unread'} ${i.cls}" data-id="${esc(n.id)}">
        <div class="n-ico"><i class="fa-solid fa-calendar-day"></i></div>
        <div style="min-width:0">
          <div class="n-top"><span class="dot"></span><b>${esc(name)}</b></div>
          ${local}
          <p class="n-msg">${esc(i.msg)}</p>
          ${codes ? `<small class="n-meta">${codes}</small>` : ''}
        </div>
        <div class="n-side">
          <span class="pill">${esc(i.label)}</span>
          <div class="acts">
            <button type="button" class="b ghost" onclick="toggleRead(this)">${isRead?'Mark as unread':'Mark as read'}</button>
            <a class="b" href="project_view.html?id=${encodeURIComponent(p.id)}" onclick="markOpened(this)">View project</a>
          </div>
        </div>
      </article>`;
    }).join('');
  }
  requestAnimationFrame(moveTabIndicator);
}

function toggleRead(btn){
  const id = btn.closest('.notif').dataset.id, s = getRead();
  if (s.has(id)) s.delete(id); else s.add(id);
  if (saveRead(s)) render();
}
function markOpened(a){ const s = getRead(); s.add(a.closest('.notif').dataset.id); saveRead(s); }
function markAllRead(){
  const s = getRead(); notifs.forEach(n => s.add(n.id));
  if (saveRead(s)) { render(); toast('All notifications marked as read.'); }
}
/* clicking an unread card (not its buttons) also marks it as read */
$('list').addEventListener('click', e => {
  if (e.target.closest('a,button')) return;
  const c = e.target.closest('.notif.unread'); if (!c) return;
  const s = getRead(); s.add(c.dataset.id);
  if (saveRead(s)) render();
});
window.addEventListener('storage', e => { if (e.key === readKey()) render(); });

/* ================= SLIDING TAB INDICATOR ================= */
let tabIndReady = false;
function moveTabIndicator(){
  const nav = $('tabs'), ind = $('tabIndicator');
  if (!nav || !ind) return;
  const btn = nav.querySelector('.tab.on');
  if (!btn || !btn.offsetWidth) return;
  const first = !tabIndReady;
  if (first) ind.style.transition = 'none';
  ind.style.width = btn.offsetWidth + 'px';
  ind.style.transform = `translateX(${btn.offsetLeft}px)`;
  if (first) { void ind.offsetWidth; ind.style.transition = ''; tabIndReady = true; }
}
function switchTab(k){
  filter = k;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.t === k));
  moveTabIndicator();
  render();
  const el = $('list'); el.classList.remove('panel-in'); void el.offsetWidth; el.classList.add('panel-in');
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.t));
window.addEventListener('resize', moveTabIndicator);
window.addEventListener('load', moveTabIndicator);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveTabIndicator);

/* ================= HEADER SEARCH (filters notifications) ================= */
function executeSearch() {
  const inp = document.getElementById('projectSearchInput');
  const feedback = document.getElementById('searchResultFeedback');
  const raw = inp ? inp.value.trim() : '';
  if (!raw) {
    if (feedback) {
      feedback.textContent = 'Please enter project details.';
      feedback.className = 'absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-red-500 z-50';
    }
    return;
  }
  searchQuery = raw.toLowerCase();
  render();
  const n = notifs.filter(matchN).length;
  if (feedback) {
    feedback.classList.remove('hidden');
    feedback.className = 'absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border font-semibold z-50 ' + (n ? 'text-emerald-600' : 'text-red-500');
    feedback.textContent = n ? `Found ${n} matching notification(s)!` : `No match found for "${raw}".`;
  }
  if (n) {
    setTimeout(() => {
      const sd = document.getElementById('searchDropdownMenu'); if (sd) sd.classList.remove('open');
      const sw = document.getElementById('searchBoxWrap'); if (sw) sw.classList.remove('search-open');
      const ig = document.getElementById('homeContactLoginGroup'); if (ig) ig.classList.remove('icons-pushed');
      if (feedback) feedback.classList.add('hidden');
    }, 1500);
  }
}
function handleProjectSearch(event) { if (event.key === 'Enter') executeSearch(); }
function clearSearch(){
  searchQuery = '';
  const inp = document.getElementById('projectSearchInput'); if (inp) inp.value = '';
  render();
}


/* ================= DATA ================= */
async function init(){
  const {data:{session}} = await supabaseClient.auth.getSession();
  if (session) me = {id:session.user.id};
  load();
  Promise.resolve(window.__indexHeaderReady).then(() => updateProfileUI(session ? session.user : null));
  supabaseClient.auth.onAuthStateChange((_e, s) => {
    me = s ? {id:s.user.id} : null;
    updateProfileUI(s ? s.user : null);
    render();
  });
}

async function load(manual){
  const btn = $('refreshBtn');
  if (btn) btn.classList.add('spin');
  const limit = new Date(); limit.setDate(limit.getDate() + WINDOW_DAYS);
  const {data,error} = await supabaseClient.from('projects')
    .select('id,project_name,local_name,bd_number,ho_number,district,category,status,opening_date,opened_date')
    .not('opening_date','is',null)
    .is('opened_date',null)
    .lte('opening_date', ymd(limit));
  if (btn) btn.classList.remove('spin');
  if (error) {
    toast('Could not load data: '+error.message, true);
    $('list').innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>Could not load notifications. Please check the projects table and its policies in Supabase.</div>';
    return;
  }
  projects = data || [];
  buildNotifs();
  render();
  if (manual === true) toast('Notifications refreshed.');
}

init();
</script>
