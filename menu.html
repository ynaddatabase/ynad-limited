<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background: transparent;
    }
    .menu-list {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        padding: 4px 4px 0 4px;
    }
    .menu-link {
        opacity: 0;
        transform: translateY(35px);
        animation: menuItemIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #0f172a;
        text-decoration: none;
        text-transform: uppercase;
        cursor: pointer;
    }
    @media (min-width: 768px) {
        .menu-link { font-size: 1.125rem; }
    }
    .menu-link:hover { color: #d97706; }
    .menu-link:nth-child(1) { animation-delay: 0.15s; }
    .menu-link:nth-child(2) { animation-delay: 0.25s; }
    .menu-link:nth-child(3) { animation-delay: 0.35s; }
    .menu-link:nth-child(4) { animation-delay: 0.45s; }
    .menu-link:nth-child(5) { animation-delay: 0.55s; }
    @keyframes menuItemIn {
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>
<div class="menu-list">
    <a class="menu-link" onclick="goTo('financial-overview')">Financial Overview</a>
    <a class="menu-link" onclick="goTo('about')">About</a>
    <a class="menu-link" onclick="goTo('blog')">Blog</a>
    <a class="menu-link" onclick="goTo('ynad-moments')">YNAD Moments</a>
    <a class="menu-link" onclick="goTo('ynad-team')">YNAD Team</a>
</div>

<script>
    // Closes the overlay using the parent page's existing closeMenuWithEffect()
    // (same animation it opened with), then — once that close animation has
    // fully finished — smoothly scrolls the parent page to the target section.
    // targetId should match a real section id on the parent page (e.g. "about").
    function goTo(targetId) {
        if (parent && typeof parent.closeMenuWithEffect === 'function') {
            parent.closeMenuWithEffect();
        }

        // parent.closeMenuWithEffect() removes the 'open' class immediately,
        // then un-blurs the page + resets the iframe after 400ms. We wait for
        // that same 400ms before starting the scroll, so the scroll only
        // begins once the menu has fully closed — matching the open animation's
        // own timing rather than fighting it.
        setTimeout(function () {
            if (parent && parent.document) {
                const targetEl = parent.document.getElementById(targetId);
                if (targetEl) {
                    // Use the parent's own smooth-scroll if available (matches
                    // the site's existing easing used for goToRecentProjects());
                    // otherwise fall back to native smooth scrolling.
                    if (typeof parent.smoothScrollToElement === 'function') {
                        parent.smoothScrollToElement(targetEl);
                    } else {
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            }
        }, 400);
    }
</script>
</body>
</html>
