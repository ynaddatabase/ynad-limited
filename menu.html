<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,sans-serif;background:transparent}
.menu-list{display:flex;flex-direction:column;gap:1.5rem;padding:4px}
.menu-item{display:flex;align-items:center;gap:9px}
.menu-link{
 opacity:0;transform:translateY(35px);
 animation:in .7s cubic-bezier(.16,1,.3,1) forwards;
 font-size:1rem;font-weight:500;letter-spacing:.02em;
 color:#0f172a;text-decoration:none;text-transform:uppercase;cursor:pointer
}
.menu-link:hover{color:#d97706}
.edit-icon{display:none;text-decoration:none;color:#64748b;font-size:17px;cursor:pointer}
.edit-icon:hover{color:#d97706}
body.edit-mode .edit-icon{display:inline-block}
@media(min-width:768px){.menu-link{font-size:1.125rem}}
.menu-link:nth-child(1){animation-delay:.15s}
.menu-link:nth-child(2){animation-delay:.25s}
.menu-link:nth-child(3){animation-delay:.35s}
.menu-link:nth-child(4){animation-delay:.45s}
.menu-link:nth-child(5){animation-delay:.55s}
@keyframes in{to{opacity:1;transform:translateY(0)}}
</style>
</head>

<body>

<div class="menu-list">

<div class="menu-item">
<a class="menu-link" onclick="goTo('financial-overview')">Financial Overview</a>
</div>

<div class="menu-item">
<a class="menu-link" onclick="goTo('about')">About</a>
<a class="edit-icon" href="#" onclick="openEditor(event)">✎</a>
</div>

<div class="menu-item">
<a class="menu-link" onclick="goTo('blog')">Blog</a>
</div>

<div class="menu-item">
<a class="menu-link" onclick="goTo('ynad-moments')">YNAD Moments</a>
</div>

<div class="menu-item">
<a class="menu-link" onclick="goTo('ynad-team')">YNAD Team</a>
</div>

</div>

<script>

/* ================================================================
   ALT + SHIFT + D — edit mode toggle
   ================================================================
   This listener lives ONLY here, on this iframe's own document.
   It does NOT try to attach a listener onto `parent` (that reliably
   fails/gets blocked in real browsers even for same-origin iframes
   in many setups — the previous version's try/catch was silently
   swallowing that failure, which is why nothing ever showed up).

   Because the hamburger menu overlay keeps keyboard focus INSIDE
   this iframe while it's open, THIS iframe needs its own listener
   to catch the key combo while the menu is open. Toggling here
   shows the pencil icon locally, AND notifies the parent page via
   postMessage so index.html's own admin/manager check
   (isAdminOrManager) can also gate it — see the matching message
   listener added in index.html below.
   ================================================================ */
function toggleEdit(){
    document.body.classList.toggle('edit-mode');

    // Tell the parent page edit-mode was toggled here, so index.html
    // can apply its OWN admin/manager permission check before fully
    // trusting this — this iframe alone should not be the sole gate.
    try{
        parent.postMessage({ type: 'ynad-toggle-edit-mode' }, '*');
    }catch(e){}
}

document.addEventListener('keydown', function(e){
    if(e.altKey && e.shiftKey && e.code === 'KeyD'){
        e.preventDefault();
        toggleEdit();
    }
});

/* If the parent page (index.html) decides the current user is NOT
   an admin/manager, it messages back here to force edit-mode off,
   so the pencil icon never actually stays visible for non-admins. */
window.addEventListener('message', function(e){
    if(!e.data || typeof e.data !== 'object') return;
    if(e.data.type === 'ynad-deny-edit-mode'){
        document.body.classList.remove('edit-mode');
    }
});

/* About Editor */
function openEditor(e){
    e.preventDefault();

    const d=parent.document,s=d.createElement('div');
    const about=d.getElementById('about');
    if(!about)return;

    const h=about.querySelector('h1,h2,h3,h4');
    const p=about.querySelector('p');

    s.id='about-editor';
    s.innerHTML=`
    <div class="ae-bg">
      <div class="ae-box">
        <button id="ae-x">×</button>
        <h3>Edit About</h3>

        <label>Heading</label>
        <input id="ae-head" value="${h?h.textContent.trim():''}">

        <label>Full Text</label>
        <textarea id="ae-text">${p?p.textContent.trim():''}</textarea>

        <label>Text Alignment</label>
        <div class="ae-align">
          <button data-a="left">Left</button>
          <button data-a="center">Center</button>
          <button data-a="right">Right</button>
          <button data-a="justify">Justify</button>
        </div>

        <div class="ae-actions">
          <button id="ae-cancel">Cancel</button>
          <button id="ae-save">Save Changes</button>
        </div>
      </div>
    </div>`;

    const st=d.createElement('style');
    st.id='about-editor-style';
    st.textContent=`
    #about-editor .ae-bg{
      position:fixed;inset:0;z-index:999999;
      display:flex;align-items:center;justify-content:center;
      padding:20px;background:rgba(15,23,42,.55);
      backdrop-filter:blur(6px)
    }
    #about-editor .ae-box{
      position:relative;width:min(650px,100%);
      background:#fff;border-radius:14px;padding:24px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      font-family:Montserrat,sans-serif
    }
    #about-editor h3{margin:0 0 20px;color:#0f172a}
    #about-editor label{display:block;margin:14px 0 7px;font-size:12px;font-weight:600;color:#334155}
    #about-editor input,#about-editor textarea{
      width:100%;padding:11px;border:1px solid #cbd5e1;
      border-radius:8px;outline:0;font:14px Montserrat
    }
    #about-editor textarea{height:170px;resize:vertical;line-height:1.6}
    .ae-align{display:flex;gap:7px;flex-wrap:wrap}
    .ae-align button,#ae-cancel,#ae-save{
      padding:9px 13px;border:1px solid #cbd5e1;border-radius:7px;
      background:#fff;cursor:pointer
    }
    .ae-align button.active{background:#0f172a;color:#fff}
    .ae-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    #ae-save{background:#0f172a;color:#fff}
    #ae-x{
      position:absolute;right:15px;top:12px;border:0;background:none;
      font-size:27px;color:#64748b;cursor:pointer
    }`;

    d.head.appendChild(st);
    d.body.appendChild(s);

    let align=(p?d.defaultView.getComputedStyle(p).textAlign:'left');
    if(align==='start')align='left';

    const setAlign=a=>{
        align=a;
        s.querySelectorAll('[data-a]').forEach(b=>
            b.classList.toggle('active',b.dataset.a===a)
        );
    };

    s.querySelectorAll('[data-a]').forEach(b=>
        b.onclick=()=>setAlign(b.dataset.a)
    );

    setAlign(align);

    const close=()=>{
        s.remove();
        st.remove();
    };

    d.getElementById('ae-x').onclick=close;
    d.getElementById('ae-cancel').onclick=close;

    d.getElementById('ae-save').onclick=()=>{
        if(h)h.textContent=d.getElementById('ae-head').value.trim();
        if(p){
            p.textContent=d.getElementById('ae-text').value.trim();
            p.style.textAlign=align;
        }
        close();
    };
}

/* Navigation */
function goTo(id){
    if(parent&&typeof parent.closeMenuWithEffect==='function')
        parent.closeMenuWithEffect();

    setTimeout(()=>{
        const el=parent.document.getElementById(id);
        if(el){
            if(typeof parent.smoothScrollToElement==='function')
                parent.smoothScrollToElement(el);
            else el.scrollIntoView({behavior:'smooth',block:'start'});
        }
    },400);
}

</script>
</body>
</html>
