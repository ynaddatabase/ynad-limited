<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background: transparent;
    }
    .menu-list {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        padding: 4px 4px 0 4px;
    }
    .menu-link {
        opacity: 0;
        transform: translateY(35px);
        animation: menuItemIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #0f172a;
        text-decoration: none;
        text-transform: uppercase;
    }
    @media (min-width: 768px) {
        .menu-link { font-size: 1.125rem; }
    }
    .menu-link:hover { color: #d97706; }
    .menu-link:nth-child(1) { animation-delay: 0.15s; }
    .menu-link:nth-child(2) { animation-delay: 0.25s; }
    .menu-link:nth-child(3) { animation-delay: 0.35s; }
    .menu-link:nth-child(4) { animation-delay: 0.45s; }
    @keyframes menuItemIn {
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<div class="menu-list">
    <a href="#projects" target="_top" class="menu-link" onclick="parent.closeMenuWithEffect()">Filter By Project</a>
    <a href="#" target="_top" class="menu-link" onclick="parent.closeMenuWithEffect()">Financial Overview</a>
    <a href="#" target="_top" class="menu-link" onclick="parent.closeMenuWithEffect()">YNAD Moments</a>
    <a href="#" target="_top" class="menu-link" onclick="parent.closeMenuWithEffect()">Blog</a>
</div>

</body>
</html>
