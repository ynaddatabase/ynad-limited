<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project View | YNAD Construction</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent:#d97706;
      --accent-dark:#b45309;
      --ink:#111827;
      --muted:#64748b;
      --line:#e5e7eb;
      --surface:#ffffff;
      --gallery:#2d2d2d;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:#fff;
      color:var(--ink);
      overflow-x:hidden;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ================================================================
       TOP LOADING BAR (same as other pages)
       ================================================================ */
    #pageLoadingBar{
      position:fixed;top:0;left:0;right:0;height:3px;
      background:transparent;z-index:99999;pointer-events:none;overflow:hidden;
    }
    #pageLoadingProgress{
      width:8%;height:100%;
      background:linear-gradient(90deg,#b45309,#d97706,#f59e0b,#d97706,#b45309);
      box-shadow:0 0 10px rgba(217,119,6,.70);
      transition:width .45s ease,opacity .35s ease;
    }

    /* ================================================================
       SHARED HEADER (sourced from index.html) — same spec as other pages
       ================================================================ */
    #mainNav{
      position:fixed;top:0;left:0;right:0;z-index:50;
      background:rgba(0,0,0,.48);
      border-bottom:1px solid rgba(255,255,255,.1);
      transition:transform .35s cubic-bezier(.4,0,.2,1),background-color .35s ease,border-color .35s ease,box-shadow .35s ease;
      transform:translateY(0);
    }
    #mainNav.nav-hidden{transform:translateY(-100%)}
    #mainNav.nav-solid{
      background-color:#ffffff;
      border-bottom-color:#e5e7eb;
      box-shadow:0 6px 18px rgba(15,23,42,.08);
    }
    #mainNav .nav-adaptive{color:#fff;transition:color .35s ease}
    #mainNav.nav-solid .nav-adaptive{color:#1b1d1d}
    #mainNav .nav-adaptive-muted{color:rgba(255,255,255,.85);transition:color .35s ease}
    #mainNav.nav-solid .nav-adaptive-muted{color:#3a3c3c}
    #mainNav .nav-icon-btn{
      background:rgba(255,255,255,.1);
      border:1px solid transparent;
      transition:background-color .25s ease,color .25s ease,border-color .25s ease,transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease;
    }
    #mainNav.nav-solid .nav-icon-btn{background:#f1f5f9;border-color:#e2e8f0}
    #mainNav .nav-icon-btn:hover{
      background-color:#d97706;border-color:#d97706;color:#fff !important;
      transform:translateY(-3px) scale(1.08);
      box-shadow:0 8px 20px rgba(217,119,6,.35);
    }
    #mainNav #searchIconBtn:hover{transform:scale(1.05)}
    #searchBoxWrap.search-open #searchIconBtn:hover{transform:translateX(2px) scale(1.05)}

    #userProfileBtn{background:#fff;color:#64748b;border-color:#d97706}
    #userProfileBtn .profile-fallback-icon{font-size:15px;line-height:1;transition:color .35s ease,transform .25s ease}
    #userProfileBtn:hover .profile-fallback-icon{transform:scale(1.05)}
    #userProfileBtn.is-authenticated{background:transparent}
    #userProfileBtn img{display:block;width:100%;height:100%;object-fit:cover}
    #userProfileBtn .profile-fallback-icon[hidden],#userProfileBtn img[hidden]{display:none !important}
    #userDropdownMenu .profile-avatar-large{background:#fff;color:#64748b}
    #userDropdownMenu .profile-user-name{color:#1b1d1d}
    #userDropdownMenu .profile-user-email{color:#64748b}
    #userDropdownMenu .auth-action{background:#fff;color:#55575a;border:1px solid #e2e8f0}
    #userDropdownMenu .auth-action:hover{background:#d97706;color:#fff;border-color:#d97706}

    .hamburger-icon{transition:transform .2s cubic-bezier(.4,0,.2,1);display:inline-block}
    .hamburger-icon.clicked{transform:scale(1.25)}

    #pageContentWrapper{transition:filter .6s ease-in-out}
    #pageContentWrapper.blurred{filter:blur(6px);pointer-events:none}

    #menuOverlay{
      position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-end;
      background-color:rgba(0,0,0,.4);backdrop-filter:blur(2px);
      opacity:0;visibility:hidden;
      transition:opacity .7s ease,visibility .7s ease;pointer-events:none;
    }
    #menuOverlay.open{opacity:1;visibility:visible;pointer-events:auto}
    #menuBox{transform:translateX(100%);transition:transform .7s cubic-bezier(.16,1,.3,1)}
    #menuOverlay.open #menuBox{transform:translateX(0)}

    #settingsDropdownMenu,#userDropdownMenu{
      opacity:0;visibility:hidden;transform:translateY(12px) scale(.96);
      transition:all .25s cubic-bezier(.16,1,.3,1);pointer-events:none;
    }
    #settingsDropdownMenu.open,#userDropdownMenu.open{
      opacity:1;visibility:visible;transform:translateY(0) scale(1);pointer-events:auto;
    }
    #settingsDropdownMenu a{transition:background-color .22s ease,color .22s ease}

    #searchBoxWrap{height:40px;padding-right:2px}
    #searchDropdownMenu.open{right:0}
    #homeContactLoginGroup{
      position:relative;z-index:5;will-change:transform;
      transition:transform .45s cubic-bezier(.4,0,.2,1);
    }
    #homeContactLoginGroup.icons-pushed{transform:translateX(-270px)}
    #searchDropdownMenu{
      position:absolute;right:0;top:50%;
      transform:translateY(-50%) translateX(12px);
      width:40px;height:40px;border-radius:999px;
      opacity:0;visibility:hidden;overflow:hidden;
      transition:width .4s cubic-bezier(.16,1,.3,1),opacity .3s ease,visibility .4s ease,transform .4s cubic-bezier(.16,1,.3,1);
      pointer-events:none;white-space:nowrap;
    }
    #searchDropdownMenu.open{
      width:250px;opacity:1;visibility:visible;
      transform:translateY(-50%) translateX(0);pointer-events:auto;
    }
    @media (min-width:640px){#searchDropdownMenu.open{width:270px}}
    #searchDropdownMenu input{padding-right:38px}
    #searchIconBtn{
      transition:width .3s cubic-bezier(.34,1.56,.64,1),height .3s cubic-bezier(.34,1.56,.64,1),background-color .25s ease,color .25s ease,border-color .25s ease,transform .3s ease,box-shadow .3s ease;
    }
    #searchBoxWrap.search-open #searchIconBtn{
      width:30px;height:30px;
      background-color:#d97706 !important;color:#fff !important;border-color:#d97706 !important;
      transform:translateX(-5px);
    }
    #searchBoxWrap.search-open #searchIconBtn:hover{
      background-color:#b45309 !important;border-color:#b45309 !important;
      transform:translateX(-5px) scale(1.05);
    }

    .theme-mode-switch{
      --theme-index:1;position:relative;display:flex;align-items:center;gap:2px;padding:3px;
      border-radius:999px;background:rgba(255,255,255,.1);border:1px solid transparent;
      transition:background-color .45s ease,border-color .45s ease;
    }
    .theme-mode-switch::before{
      content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:999px;
      background:#d97706;transform:translateX(calc(var(--theme-index) * 30px));
      transition:transform .45s cubic-bezier(.4,0,.2,1),background-color .35s ease;
      z-index:0;pointer-events:none;
    }
    #mainNav.nav-solid .theme-mode-switch{background:#f1f5f9;border-color:#e2e8f0}
    .theme-mode-btn{
      position:relative;z-index:1;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
      border-radius:999px;border:none;background:transparent;color:inherit;opacity:.7;cursor:pointer;
      font-size:.72rem;transition:color .35s ease,opacity .25s ease,transform .25s ease;
    }
    .theme-mode-btn:hover{opacity:1;transform:scale(1.08)}
    .theme-mode-btn.active{color:#fff !important;opacity:1}

    body.theme-transition,body.theme-transition *{
      transition-property:color,background-color,border-color,fill,stroke !important;
      transition-duration:.45s !important;
      transition-timing-function:ease !important;
    }

    /* ================================================================
       PROJECT PAGE
       ================================================================ */
    .project-page{opacity:0;animation:pageIn .75s ease forwards}
    @keyframes pageIn{to{opacity:1}}

    /* Hero — fills the full browser viewport, so no white strip below it */
    .hero{
      position:relative;
      width:100%;
      height:100vh;
      height:100dvh;
      min-height:520px;
      background:#111827;
    }
    .hero-bg{position:absolute;inset:0;overflow:hidden}
    .hero-image{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;object-position:center;
      transform:scale(1.035);opacity:0;
      animation:heroImageIn 1.15s ease .05s forwards;
    }
    @keyframes heroImageIn{
      from{opacity:0;transform:scale(1.07)}
      to{opacity:1;transform:scale(1)}
    }
    .hero-bg::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to bottom,rgba(0,0,0,.30) 0%,rgba(0,0,0,.04) 40%,rgba(0,0,0,.60) 100%);
      pointer-events:none;
    }

    .hero-content{
      position:absolute;
      right:5.5vw;
      bottom:96px;
      z-index:2;
      max-width:min(780px,80vw);
      text-align:right;
      color:#fff;
    }
    .hero-kicker{
      display:inline-flex;align-items:center;gap:10px;
      font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
      color:#fbbf24;margin-bottom:10px;
      text-shadow:0 2px 10px rgba(0,0,0,.35);
    }
    .hero-kicker::before{
      content:"";display:inline-block;width:26px;height:2px;background:#d97706;border-radius:2px;
    }
    .hero-title{
      margin:0;
      font-size:clamp(26px,2.7vw,40px);
      line-height:1.15;
      font-weight:400;
      letter-spacing:.04em;
      text-transform:uppercase;
      text-shadow:0 3px 18px rgba(0,0,0,.30);
    }
    .hero-location{
      display:inline-flex;align-items:center;gap:8px;
      margin-top:14px;
      font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
      color:#fff;text-decoration:none;
      text-shadow:0 2px 10px rgba(0,0,0,.35);
    }
    .hero-location i{color:#f59e0b;font-size:13px}
    a.hero-location{cursor:pointer;transition:color .2s ease}
    a.hero-location:hover{color:#fbbf24}
    a.hero-location span{
      background-image:linear-gradient(#f59e0b,#f59e0b);
      background-repeat:no-repeat;background-position:0 100%;background-size:0 1.5px;
      padding-bottom:2px;transition:background-size .3s ease;
    }
    a.hero-location:hover span{background-size:100% 1.5px}

    .hero-scroll{
      position:absolute;left:50%;bottom:76px;transform:translateX(-50%);
      z-index:3;width:28px;height:28px;border-radius:50%;
      border:1px solid rgba(255,255,255,.7);color:#fff;
      display:flex;align-items:center;justify-content:center;
      animation:floatY 1.8s ease-in-out infinite;cursor:pointer;
    }
    @keyframes floatY{
      0%,100%{transform:translate(-50%,0)}
      50%{transform:translate(-50%,5px)}
    }

    /* Hero info bar: M / HO codes + FILES + MEDIA over a low-opacity black gradient */
    .hero-bar{
      position:absolute;left:0;right:0;bottom:0;z-index:5;
      min-height:60px;padding:0 5.5vw;
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      background:linear-gradient(to top,rgba(0,0,0,.66),rgba(0,0,0,.34));
      border-top:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(3px);
      color:#fff;
    }
    .hero-codes{
      display:flex;align-items:center;gap:10px;
      font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.82);white-space:nowrap;
    }
    .hero-codes .code-divider{width:1px;height:14px;background:rgba(255,255,255,.35)}
    .hero-actions{display:flex;align-items:center;gap:6px}
    .hero-btn{
      display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;
      border:none;border-radius:4px;background:transparent;cursor:pointer;
      font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
      transition:background .2s ease,color .2s ease;
    }
    .hero-btn.files{color:#93c5fd}
    .hero-btn.files:hover,.hero-btn.files[aria-expanded="true"]{background:#2563eb;color:#fff}
    .hero-btn.media{color:#fbbf24}
    .hero-btn.media:hover,.hero-btn.media[aria-expanded="true"]{background:#d97706;color:#fff}

    /* FILES / MEDIA dropdowns (open upward from the bar, hover-only nested menus) */
    .hm-wrap{position:relative}
    .hm-wrap.files-wrap{--hm-accent:#60a5fa}
    .hm-wrap.media-wrap{--hm-accent:#f59e0b}
    .hm-menu{
      position:absolute;bottom:calc(100% + 10px);left:50%;
      transform:translateX(-50%) translateY(4px);
      min-width:150px;padding:7px 6px;
      background:#1e293b;border:1px solid #334155;border-radius:8px;
      box-shadow:0 14px 34px rgba(0,0,0,.45);
      opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
      z-index:70;text-align:left;
    }
    .hm-menu.open{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0)}
    .hm-item,.hm-link{
      position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;
      width:100%;min-height:30px;padding:6px 8px;
      background:transparent;color:#fff;
      font-size:10px;line-height:1.2;font-weight:700;letter-spacing:.04em;
      text-decoration:none;text-align:left;cursor:pointer;
      transition:color .16s ease,transform .16s ease;
    }
    .hm-item:hover,.hm-item.hover-open,.hm-link:hover{color:var(--hm-accent);transform:translateX(2px)}
    .hm-item > i,.hm-link > i{font-size:8px;color:#64748b;flex:0 0 auto;transition:color .16s ease}
    .hm-item:hover > i,.hm-item.hover-open > i,.hm-link:hover > i{color:var(--hm-accent)}
    .hm-sub{
      position:absolute;left:calc(100% + 7px);top:-7px;min-width:150px;padding:7px 6px;
      display:none;flex-direction:column;gap:1px;
      background:#1e293b;border:1px solid #334155;border-radius:8px;
      box-shadow:0 14px 34px rgba(0,0,0,.45);z-index:71;
    }
    .hm-item:hover > .hm-sub,.hm-item.hover-open > .hm-sub{display:flex}
    .hm-sub.flip-left{left:auto;right:calc(100% + 7px)}
    .hm-sub a{
      display:block;width:100%;padding:6px 8px;
      font-size:9.5px;font-weight:600;letter-spacing:.03em;color:#fff;
      text-decoration:none;white-space:nowrap;background:transparent;
      transition:color .16s ease,transform .16s ease;
    }
    .hm-sub a:hover{color:var(--hm-accent);transform:translateX(2px)}

    /* Sections */
    .section{width:100%;padding:88px 6vw}
    .summary-section{background:#fff;text-align:center}
    .summary-copy{max-width:1060px;margin:0 auto;color:#475569;font-size:14px;line-height:2}
    .section-heading{
      margin:0 0 42px;font-size:clamp(28px,3.2vw,44px);font-weight:300;
      letter-spacing:.04em;text-align:center;text-transform:uppercase;color:#374151;
    }
    .features-section{padding-top:30px;padding-bottom:96px}
    .feature-grid{
      max-width:1120px;margin:0 auto;display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 58px;
    }
    .feature-item{position:relative;padding-left:28px;color:#334155;font-size:13px;line-height:1.75}
    .feature-item::before{
      content:"";position:absolute;left:0;top:.68em;width:15px;height:1px;background:#64748b;
      transition:width .3s ease,background .3s ease;
    }
    .feature-item:hover::before{width:21px;background:var(--accent)}
    .feature-item.reveal{opacity:0;transform:translateY(18px);transition:opacity .65s ease,transform .65s ease}
    .feature-item.reveal.visible{opacity:1;transform:translateY(0)}

    .overview-section{
      padding:0;display:grid;grid-template-columns:1fr 1fr;min-height:620px;background:#fff;
    }
    .overview-copy{padding:82px 6vw 74px;display:flex;flex-direction:column;justify-content:center}
    .overview-heading{
      margin:0 0 42px;font-size:clamp(28px,3.1vw,44px);font-weight:300;
      letter-spacing:.05em;text-transform:uppercase;color:#475569;
    }
    .overview-list{max-width:650px;display:grid;gap:24px}
    .overview-row{
      display:grid;grid-template-columns:180px 1fr;gap:24px;
      padding-bottom:18px;border-bottom:1px solid #eef2f7;
    }
    .overview-label{color:#334155;font-size:13px}
    .overview-value{color:#64748b;font-size:13px;line-height:1.7}
    .overview-image-wrap{position:relative;min-height:620px;overflow:hidden;background:#dbe3ea;cursor:pointer}
    .overview-image{
      width:100%;height:100%;object-fit:cover;display:block;
      transition:transform .75s cubic-bezier(.16,1,.3,1);
    }
    .overview-image-wrap:hover .overview-image{transform:scale(1.035)}

    /* Gallery: 12 images (4 x 3) */
    .gallery-section{background:var(--gallery);color:#fff;padding:86px 0 0}
    .gallery-title{
      margin:0;padding:0 6vw 46px;text-align:center;font-size:32px;line-height:1;
      font-weight:300;letter-spacing:.06em;text-transform:uppercase;
    }
    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:6px;
      padding:6px;
      background:#202020;
    }
    .gallery-item{
      position:relative;min-height:300px;overflow:hidden;background:#222;cursor:pointer;
      opacity:0;transform:translateY(18px);transition:opacity .65s ease,transform .65s ease;
    }
    .gallery-item.visible{opacity:1;transform:translateY(0)}
    .gallery-item img{
      width:100%;height:100%;min-height:300px;object-fit:cover;display:block;
      transition:transform .6s cubic-bezier(.16,1,.3,1),filter .35s ease;
    }
    .gallery-item::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.42),transparent 48%);
      opacity:0;transition:opacity .35s ease;
    }
    .gallery-item:hover img{transform:scale(1.055);filter:brightness(.92)}
    .gallery-item:hover::after{opacity:1}

    /* Lightbox: two image layers create a real left/right slide transition */
    .lightbox{
      position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);
      display:flex;align-items:center;justify-content:center;
      opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;padding:36px;
    }
    .lightbox.open{opacity:1;visibility:visible}
    .lightbox-stage{
      position:relative;
      width:min(88vw,1500px);
      height:86vh;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;isolation:isolate;
      opacity:0;transform:scale(.975);
      transition:opacity .3s ease,transform .3s ease;
    }
    .lightbox.open .lightbox-stage{opacity:1;transform:scale(1)}
    .lightbox-stage .lightbox-photo{
      position:absolute;inset:0;
      display:block;width:100%;height:100%;max-width:none;max-height:none;
      object-fit:contain;
      box-shadow:0 25px 70px rgba(0,0,0,.45);
      transform:translateX(0);opacity:1;
      transition:transform .46s cubic-bezier(.22,.68,0,1),opacity .38s ease;
      user-select:none;-webkit-user-drag:none;
      pointer-events:none;
    }
    .lightbox-stage .lightbox-photo.is-hidden{
      visibility:hidden;opacity:0;transform:translateX(0);
    }
    .lightbox-stage .lightbox-photo.is-entering-right{opacity:0;transform:translateX(110%)}
    .lightbox-stage .lightbox-photo.is-entering-left{opacity:0;transform:translateX(-110%)}
    .lightbox-stage .lightbox-photo.is-leaving-left{opacity:0;transform:translateX(-110%)}
    .lightbox-stage .lightbox-photo.is-leaving-right{opacity:0;transform:translateX(110%)}
    .lightbox-stage .lightbox-photo.is-active{visibility:visible;opacity:1;transform:translateX(0)}
    .lightbox-btn{
      position:absolute;width:46px;height:46px;border-radius:50%;
      background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);color:#fff;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:background .25s ease,border-color .25s ease,transform .25s ease;
    }
    .lightbox-btn:hover{background:var(--accent);border-color:var(--accent)}
    .lightbox-close{right:24px;top:18px}
    .lightbox-prev{left:24px;top:50%;transform:translateY(-50%)}
    .lightbox-next{right:24px;top:50%;transform:translateY(-50%)}
    .lightbox-prev:hover{transform:translateY(-50%) scale(1.07)}
    .lightbox-next:hover{transform:translateY(-50%) scale(1.07)}
    .lightbox-counter{
      position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
      font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.8);
    }

    .loading,.error-state{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:40px;text-align:center;font-size:13px;letter-spacing:.08em;
      text-transform:uppercase;color:#64748b;
    }

    /* Dark theme (follows the header theme switch) */
    body.theme-effective-dark{background-color:#131414 !important;color:#e2e8f0}
    body.theme-effective-dark .summary-section,
    body.theme-effective-dark .features-section,
    body.theme-effective-dark .overview-section{background:#131414}
    body.theme-effective-dark .summary-copy{color:#c7c5c2}
    body.theme-effective-dark .section-heading,
    body.theme-effective-dark .overview-heading{color:#fff}
    body.theme-effective-dark .feature-item{color:#d1d5db}
    body.theme-effective-dark .feature-item::before{background:#a8a6a3}
    body.theme-effective-dark .overview-label{color:#e5e7eb}
    body.theme-effective-dark .overview-value{color:#a8a6a3}
    body.theme-effective-dark .overview-row{border-bottom-color:#2a2c2c}

<body class="bg-white text-slate-800">

  <div id="pageLoadingBar" aria-hidden="true">
    <div id="pageLoadingProgress"></div>
  </div>

  <div id="pageContentWrapper">

    <!-- Header is sourced directly from index.html so one header stays shared. -->
    <div id="indexHeaderContainer" aria-label="Site header"></div>

    <script>
      window.__indexHeaderReady = (async function loadIndexHeader() {
        const container = document.getElementById('indexHeaderContainer');
        if (!container) return;

        try {
          const response = await fetch('index.html', { cache: 'no-store' });
          if (!response.ok) throw new Error('Unable to load index.html');

          const html = await response.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const nav = doc.querySelector('#mainNav');
          if (!nav) throw new Error('Header #mainNav was not found in index.html');

          container.replaceChildren(nav.cloneNode(true));

          const homeLink = container.querySelector('#homeContactLoginGroup a[title="Home"]');
          const contactLink = container.querySelector('#homeContactLoginGroup a[title="Contact"]');
          if (homeLink) homeLink.href = 'index.html';

          if (contactLink) {
            contactLink.href = 'index.html#siteFooterContainer';
            contactLink.addEventListener('click', function (event) {
              const footer = document.getElementById('siteFooterContainer');
              if (footer) {
                event.preventDefault();
                footer.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }
            });
          }

          document.dispatchEvent(new CustomEvent('ynad-index-header-ready'));
        } catch (error) {
          console.error('Shared index header failed to load:', error);
          container.innerHTML = '';
        }
      })();
    </script>

    <!-- Project content is rendered here -->
    <div id="app">
      <div class="loading">Loading project...</div>
    </div>

    <!-- Footer Section — loaded dynamically from footer.html (same as index.html) -->
    <div id="siteFooterContainer"></div>

    <script>
    (function(){
      const container = document.getElementById('siteFooterContainer');
      if (!container) return;

      fetch('footer.html', { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('Unable to load footer.html');
          return response.text();
        })
        .then(html => {
          const template = document.createElement('template');
          template.innerHTML = html;

          const scripts = Array.from(template.content.querySelectorAll('script'));
          scripts.forEach(script => script.remove());

          container.replaceChildren(template.content.cloneNode(true));

          scripts.forEach(oldScript => {
            const newScript = document.createElement('script');
            for (const attr of oldScript.attributes) {
              newScript.setAttribute(attr.name, attr.value);
            }
            newScript.textContent = oldScript.textContent;
            document.body.appendChild(newScript);
            newScript.remove();
          });
        })
        .catch(error => {
          console.error(error);
          container.innerHTML = '<div style="padding:32px;text-align:center;color:#94a3b8;background:#0f172a;">Footer failed to load.</div>';
        });
    })();
    </script>

  <script>
    if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
    window.scrollTo(0, 0);

    const SUPABASE_URL = 'https://zjbvnwawdgdncthktqtx.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_KLOwVeJVKzC8Lo2slNnH0A_PdhW5BlT';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const FALLBACK_HERO = 'https://images.unsplash.com/photo-1590381105924-c72589b9ef3f?auto=format&fit=crop&w=1800&q=80';

    const SAMPLE_FEATURES = [
      'Premium architectural planning with efficient functional spaces',
      'Contemporary facade with carefully detailed entrance and drop-off',
      '24/7 security surveillance and controlled access',
      'High-quality utility, fire safety and emergency systems',
      'Thoughtfully planned parking and service circulation',
      'Modern building management and optional automation',
      'Landscaped outdoor areas and comfortable common spaces',
      'High-speed vertical circulation with premium passenger lifts',
      'Energy-conscious glazing and durable exterior materials',
      'Dedicated management and support facilities',
      'Reliable backup power for essential building services',
      'Well-planned natural light and ventilation'
    ];

    /* Photos in the order they were uploaded in project_add (13 max):
       #1  -> beside the Overview section
       #2..#13 -> Gallery (12 images, in the same order) */
    const OVERVIEW_PHOTO_COUNT = 1;
    const GALLERY_PHOTO_COUNT = 12;
    let lightboxImages = [];
    let lightboxIndex = 0;
    let lightboxCurrentImage = document.getElementById('lightboxImage');
    let lightboxIncomingImage = document.getElementById('lightboxIncomingImage');
    let lightboxAnimating = false;
    let lightboxPendingDirection = 0;
    let lightboxTransitionToken = 0;
    let lightboxTransitionTimer = null;

    /* ================================================================
       HELPERS
       ================================================================ */
    function normalizePhotoUrls(raw) {
      if (!raw) return [];
      if (Array.isArray(raw)) return raw.filter(Boolean);
      if (typeof raw === 'string') {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed.filter(Boolean);
        } catch (_) {}
        return raw.includes(',')
          ? raw.split(',').map(v => v.trim()).filter(Boolean)
          : [raw];
      }
      return [];
    }

    function safe(value) {
      if (value === null || value === undefined) return '';
      return String(value);
    }

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name) || '';
    }

    function firstValue(obj, keys, fallback='') {
      for (const key of keys) {
        if (obj && obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== '') {
          return obj[key];
        }
      }
      return fallback;
    }

    function escapeHtml(value) {
      return safe(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function projectLocation(project) {
      const direct = firstValue(project, ['location','address','project_address','district']);
      const district = firstValue(project, ['district']);
      const country = firstValue(project, ['donated_country','country'], 'Bangladesh');
      if (direct && district && !String(direct).toLowerCase().includes(String(district).toLowerCase())) {
        return `${direct}, ${district}, ${country}`;
      }
      return direct || district || country;
    }

    function ordinalSuffix(n) {
      const rem100 = n % 100;
      if (rem100 >= 11 && rem100 <= 13) return n + 'th';
      switch (n % 10) {
        case 1: return n + 'st';
        case 2: return n + 'nd';
        case 3: return n + 'rd';
        default: return n + 'th';
      }
    }

    function parseMediaItems(raw) {
      if (!raw) return [];
      let arr = raw;
      if (typeof raw === 'string') {
        try { arr = JSON.parse(raw); } catch (e) { arr = [raw]; }
      }
      if (!Array.isArray(arr)) return [];
      return arr.map(x => typeof x === 'string' ? { url: x } : x).filter(x => x && x.url);
    }

    function getMediaItems(project, field, type) {
      let items = parseMediaItems(project[field]);
      if (!items.length) {
        const legacy = field === 'report_urls' ? project.report_url : (field === 'video_urls' ? project.video_link : null);
        if (legacy) items = [{ url: legacy }];
      }
      const st = String(project.status || '').toLowerCase();
      const defType = st === 'completed' ? 'opening' : (st === 'upcoming' ? 'proposal' : 'ongoing');
      return items.filter(x => (x.type || defType) === type);
    }

    function buildNumberedLinksHtml(items, label) {
      let html = '';
      for (let n = items.length; n >= 1; n--) {
        html += `<a href="${escapeAttr(items[n - 1].url)}" target="_blank" rel="noopener">${ordinalSuffix(n)} ${label}</a>\n`;
      }
      return html;
    }

    function buildLatestVideoLinkHtml(items) {
      if (!items.length) return '<a href="#" onclick="return false;">VIDEO</a>';
      return `<a href="${escapeAttr(items[items.length - 1].url)}" target="_blank" rel="noopener">VIDEO</a>`;
    }

    function buildOverviewRows(project) {
      const rows = [
        ['Address', projectLocation(project)],
        ['Size', firstValue(project, ['size','project_size','apartment_size','unit_size'], 'Project size not added')],
        ['Land Size', firstValue(project, ['land_size','landsize'], '—')],
        ['Property Orientation', firstValue(project, ['property_orientation','orientation'], '—')],
        ['Number of Apartments', firstValue(project, ['number_of_apartments','apartments','total_units'], '—')],
        ['Number of Basements', firstValue(project, ['number_of_basements','basements'], '—')],
        ['Road Width', firstValue(project, ['road_width'], '—')],
        ['Architectural Consultant', firstValue(project, ['architectural_consultant','architect'], '—')],
        ['Structural Consultant', firstValue(project, ['structural_consultant'], '—')],
        ['RAJUK Approval No', firstValue(project, ['rajuk_approval_no','approval_no'], '—')]
      ];
      return rows.filter(row => row[1] !== '—' || row[0] === 'Address');
    }

    function buildFeatures(project) {
      const raw = firstValue(project, ['features','feature_list','amenities','project_features'], '');
      let list = [];

      if (Array.isArray(raw)) list = raw;
      else if (typeof raw === 'string' && raw.trim()) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) list = parsed;
        } catch (_) {
          list = raw.split(/\r?\n|•|\|/).map(v => v.trim()).filter(Boolean);
        }
      }

      list = list.map(v => safe(v).trim()).filter(Boolean);
      return list.length ? list : SAMPLE_FEATURES;
    }

    function buildSummary(project) {
      return firstValue(
        project,
        ['summary','project_summary','description','details','project_description'],
        `A carefully planned ${firstValue(project,['project_type','category'],'project')} by YNAD Construction, designed around functionality, quality and a refined user experience. This section is ready for your final project summary and can be replaced directly from the project database.`
      );
    }

    /* Hero + FILES / MEDIA bar */
    function buildHeroBarHtml(project) {
      const openingReport = getMediaItems(project, 'report_urls', 'opening').slice(-1)[0];
      const ongoingReports = getMediaItems(project, 'report_urls', 'ongoing');
      const openingVideos = getMediaItems(project, 'video_urls', 'opening');
      const ongoingVideos = getMediaItems(project, 'video_urls', 'ongoing');
      const proposalVideos = getMediaItems(project, 'video_urls', 'proposal');

      const bd = safe(project.bd_number);
      const ho = safe(project.ho_number);
      const codesHtml = (bd || ho) ? `
        <div class="hero-codes">
          ${bd ? `<span>${escapeHtml(bd)}</span>` : ''}
          ${(bd && ho) ? `<span class="code-divider"></span>` : ''}
          ${ho ? `<span>HO-${escapeHtml(String(ho).replace(/^HO-/i,''))}</span>` : ''}
        </div>` : '<div></div>';

      return `
        <div class="hero-bar">
          ${codesHtml}

          <div class="hero-actions">
            <div class="hm-wrap files-wrap">
              <button type="button" class="hero-btn files" aria-expanded="false" onclick="toggleHeroMenu(event, 'filesMenu-hero')">
                <i class="fa-solid fa-folder-open"></i><span>FILES</span>
              </button>
              <div id="filesMenu-hero" class="hm-menu" role="menu">
                <div class="hm-item">
                  <span>REPORT</span><i class="fa-solid fa-chevron-right"></i>
                  <div class="hm-sub">
                    <a href="${openingReport ? escapeAttr(openingReport.url) : '#'}"
                       target="${openingReport ? '_blank' : '_self'}"
                       ${openingReport ? 'rel="noopener"' : 'onclick="return false;"'}>OPENING REPORT</a>
                    <div class="hm-item">
                      <span>ONGOING</span>
                      ${ongoingReports.length > 0 ? `
                      <i class="fa-solid fa-chevron-right"></i>
                      <div class="hm-sub">
                        ${buildNumberedLinksHtml(ongoingReports, 'report')}
                      </div>` : ''}
                    </div>
                  </div>
                </div>
                <a class="hm-link" href="${project.documents_url ? escapeAttr(project.documents_url) : '#'}"
                   target="${project.documents_url ? '_blank' : '_self'}"
                   ${project.documents_url ? 'rel="noopener"' : 'onclick="return false;"'}>DOCUMENTS</a>
              </div>
            </div>

            <div class="hm-wrap media-wrap">
              <button type="button" class="hero-btn media" aria-expanded="false" onclick="toggleHeroMenu(event, 'mediaMenu-hero')">
                <i class="fa-solid fa-photo-film"></i><span>MEDIA</span>
              </button>
              <div id="mediaMenu-hero" class="hm-menu" role="menu">
                <div class="hm-item">
                  <span>OPENING</span><i class="fa-solid fa-chevron-right"></i>
                  <div class="hm-sub">
                    ${buildLatestVideoLinkHtml(openingVideos)}
                    <a href="#" onclick="return false;">RAW PHOTO</a>
                    <a href="#" onclick="return false;">RAW VIDEO</a>
                  </div>
                </div>
                <div class="hm-item">
                  <span>ONGOING</span><i class="fa-solid fa-chevron-right"></i>
                  <div class="hm-sub">
                    ${buildNumberedLinksHtml(ongoingVideos, 'video')}
                    <a href="#" onclick="return false;">RAW PHOTO</a>
                    <a href="#" onclick="return false;">RAW VIDEO</a>
                  </div>
                </div>
                <div class="hm-item">
                  <span>PROPOSAL</span><i class="fa-solid fa-chevron-right"></i>
                  <div class="hm-sub">
                    ${buildLatestVideoLinkHtml(proposalVideos)}
                    <a href="#" onclick="return false;">RAW PHOTO</a>
                    <a href="#" onclick="return false;">RAW VIDEO</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    /* ================================================================
       RENDER
       ================================================================ */
    function renderProject(project) {
      const photos = normalizePhotoUrls(project.photo_urls).slice(0, OVERVIEW_PHOTO_COUNT + GALLERY_PHOTO_COUNT);

      /* Hero = C-Photo (same as the homepage slideshow). Falls back to the first photo. */
      const heroImage = firstValue(project, ['c_photo_url'], photos[0] || FALLBACK_HERO);

      const overviewImage = photos[0] || heroImage;
      const galleryPhotos = photos.slice(OVERVIEW_PHOTO_COUNT, OVERVIEW_PHOTO_COUNT + GALLERY_PHOTO_COUNT);

      /* Lightbox follows the exact upload order: #1 (overview) -> #2 ... #13 */
      lightboxImages = photos.slice();

      const features = buildFeatures(project);
      const overviewRows = buildOverviewRows(project);
      const summary = buildSummary(project);
      const name = firstValue(project, ['project_name','name'], 'Project Details');
      const location = projectLocation(project);
      const category = firstValue(project, ['category','project_type'], 'Project');
      const locationLink = safe(project.location_link).trim();

      document.title = `${name} | YNAD Construction`;

      const featureHtml = features.map((feature, idx) => `
        <div class="feature-item reveal" style="transition-delay:${Math.min(idx,11)*.055}s">
          ${escapeHtml(feature)}
        </div>
      `).join('');

      const overviewHtml = overviewRows.map(row => `
        <div class="overview-row">
          <div class="overview-label">${escapeHtml(row[0])}</div>
          <div class="overview-value">${escapeHtml(row[1])}</div>
        </div>
      `).join('');

      const galleryHtml = galleryPhotos.map((img, i) => {
        const lightboxPos = OVERVIEW_PHOTO_COUNT + i;
        return `
        <div class="gallery-item reveal" style="transition-delay:${Math.min(i,11)*.035}s"
             onclick="openLightbox(${lightboxPos})">
          <img src="${escapeAttr(img)}" alt="${escapeAttr(name)} gallery ${i+1}" loading="${i<4?'eager':'lazy'}">
        </div>`;
      }).join('');

      const locationHtml = locationLink
        ? `<a class="hero-location" href="${escapeAttr(locationLink)}" target="_blank" rel="noopener" title="Open project location">
             <i class="fa-solid fa-location-dot"></i><span>${escapeHtml(location)}</span>
           </a>`
        : `<div class="hero-location"><i class="fa-solid fa-location-dot"></i><span>${escapeHtml(location)}</span></div>`;

      const galleryBlock = galleryPhotos.length ? `
          <section class="gallery-section">
            <h2 class="gallery-title">Gallery</h2>
            <div class="gallery-grid">${galleryHtml}</div>
          </section>` : '';

      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="project-page">

          <section class="hero" id="heroSection">
            <div class="hero-bg">
              <img class="hero-image" src="${escapeAttr(heroImage)}" alt="${escapeAttr(name)}">
            </div>

            <div class="hero-content">
              <div class="hero-kicker">${escapeHtml(category)}</div>
              <h1 class="hero-title">${escapeHtml(name)}</h1>
              ${locationHtml}
            </div>

            <a href="#summary" class="hero-scroll" aria-label="Scroll to project summary">
              <i class="fa-solid fa-chevron-down text-[10px]"></i>
            </a>

            ${buildHeroBarHtml(project)}
          </section>

          <section id="summary" class="section summary-section">
            <p class="summary-copy">${escapeHtml(summary)}</p>
          </section>

          <section class="section features-section">
            <h2 class="section-heading">Features</h2>
            <div class="feature-grid">${featureHtml}</div>
          </section>

          <section class="overview-section">
            <div class="overview-copy">
              <h2 class="overview-heading">Overview</h2>
              <div class="overview-list">${overviewHtml}</div>
            </div>
            <div class="overview-image-wrap" ${photos.length ? 'onclick="openLightbox(0)"' : ''}>
              <img class="overview-image" src="${escapeAttr(overviewImage)}" alt="${escapeAttr(name)} overview image" loading="lazy">
            </div>
          </section>

          ${galleryBlock}
        </div>
      `;

      setupScrollEffects();
      bindHeaderScroll();
    }

    async function loadProject() {
      const projectId = getQueryParam('id');
      const projectName = getQueryParam('name');

      let data = null;
      let error = null;

      if (projectId) {
        ({ data, error } = await supabaseClient
          .from('projects')
          .select('*')
          .eq('id', projectId)
          .maybeSingle());
      }

      if (!data && projectName) {
        ({ data, error } = await supabaseClient
          .from('projects')
          .select('*')
          .eq('project_name', projectName)
          .maybeSingle());
      }

      if (!data && !projectId && !projectName) {
        ({ data, error } = await supabaseClient
          .from('projects')
          .select('*')
          .order('opening_date', { ascending:false, nullsFirst:false })
          .limit(1)
          .maybeSingle());
      }

      if (error || !data) {
        console.error('Project View load error:', error);
        document.getElementById('app').innerHTML = `
          <div class="error-state">
            <div>
              <div class="mb-3 text-red-500">Project could not be loaded.</div>
              <button onclick="goBack()" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-900 text-white text-xs">
                <i class="fa-solid fa-arrow-left"></i> Back to Projects
              </button>
            </div>
          </div>`;
        return;
      }

      renderProject(data);
    }

    /* ================================================================
       HEADER SCROLL (same behaviour as the other pages):
       transparent over the hero, solid white after it,
       hides on scroll-down and returns on scroll-up.
       ================================================================ */
    function bindHeaderScroll() {
      const run = function () {
        const nav = document.getElementById('mainNav');
        if (!nav || nav.dataset.scrollBound === 'true') return;
        nav.dataset.scrollBound = 'true';

        let lastScrollY = window.scrollY;
        let ticking = false;

        function handleNavScroll() {
          const currentScrollY = window.scrollY;
          const hero = document.getElementById('heroSection');
          const pastHero = hero
            ? currentScrollY >= hero.offsetTop + hero.offsetHeight - nav.offsetHeight
            : currentScrollY > 4;

          nav.classList.toggle('nav-solid', pastHero);

          if (currentScrollY <= 4) {
            nav.classList.remove('nav-hidden');
          } else if (currentScrollY > lastScrollY) {
            nav.classList.add('nav-hidden');
          } else if (currentScrollY < lastScrollY) {
            nav.classList.remove('nav-hidden');
          }

          lastScrollY = currentScrollY;
          ticking = false;
        }

        window.addEventListener('scroll', function () {
          if (!ticking) {
            window.requestAnimationFrame(handleNavScroll);
            ticking = true;
          }
        }, { passive: true });

        handleNavScroll();
      };

      Promise.resolve(window.__indexHeaderReady).then(run);
    }

    function setupScrollEffects() {
      const items = document.querySelectorAll('.reveal');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, {threshold:.12, rootMargin:'0px 0px -35px 0px'});

      items.forEach(item => observer.observe(item));
    }

    /* ================================================================
       LIGHTBOX (arrow buttons, keyboard arrows, swipe)
       ================================================================ */
    function updateLightboxCounter() {
      const counter = document.getElementById('lightboxCounter');
      if (counter) counter.textContent = (lightboxIndex + 1) + ' / ' + lightboxImages.length;
    }

    function resetLightboxLayers() {
      if (lightboxCurrentImage) {
        lightboxCurrentImage.className = 'lightbox-photo is-active';
        lightboxCurrentImage.onload = null;
        lightboxCurrentImage.onerror = null;
      }
      if (lightboxIncomingImage) {
        lightboxIncomingImage.className = 'lightbox-photo is-hidden';
        lightboxIncomingImage.onload = null;
        lightboxIncomingImage.onerror = null;
        lightboxIncomingImage.removeAttribute('src');
      }
    }

    function showLightbox(index) {
      if (!lightboxImages.length) return;
      const total = lightboxImages.length;
      lightboxIndex = ((index % total) + total) % total;

      resetLightboxLayers();
      lightboxCurrentImage.src = lightboxImages[lightboxIndex];
      updateLightboxCounter();

      const hideArrows = total < 2;
      document.querySelector('.lightbox-prev').style.display = hideArrows ? 'none' : 'flex';
      document.querySelector('.lightbox-next').style.display = hideArrows ? 'none' : 'flex';
    }

    function openLightbox(index) {
      if (!lightboxImages.length) return;
      lightboxTransitionToken++;
      if (lightboxTransitionTimer) clearTimeout(lightboxTransitionTimer);
      lightboxAnimating = false;
      lightboxPendingDirection = 0;

      const box = document.getElementById('lightbox');
      showLightbox(index);
      box.classList.add('open');
      box.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
    }

    function finishLightboxStep(nextIndex, token, current, incoming, finishHandler) {
      if (token !== lightboxTransitionToken) return;
      if (lightboxTransitionTimer) clearTimeout(lightboxTransitionTimer);
      if (finishHandler) incoming.removeEventListener('transitionend', finishHandler);
      lightboxTransitionTimer = null;

      // Swap the two image layers instead of reloading the visible image.
      current.id = 'lightboxIncomingImage';
      incoming.id = 'lightboxImage';
      lightboxCurrentImage = incoming;
      lightboxIncomingImage = current;

      lightboxCurrentImage.className = 'lightbox-photo is-active';
      lightboxIncomingImage.className = 'lightbox-photo is-hidden';
      lightboxIncomingImage.onload = null;
      lightboxIncomingImage.onerror = null;
      lightboxIncomingImage.removeAttribute('src');

      lightboxIndex = nextIndex;
      updateLightboxCounter();
      lightboxAnimating = false;

      if (lightboxPendingDirection !== 0) {
        const queuedDirection = Math.sign(lightboxPendingDirection);
        lightboxPendingDirection -= queuedDirection;
        window.setTimeout(() => animateLightboxStep(queuedDirection), 35);
      }
    }

    function animateLightboxStep(direction) {
      if (!lightboxImages.length || lightboxImages.length < 2) return;
      const total = lightboxImages.length;
      const nextIndex = ((lightboxIndex + direction) % total + total) % total;
      const current = lightboxCurrentImage;
      const incoming = lightboxIncomingImage;
      const token = ++lightboxTransitionToken;
      let started = false;
      let finished = false;

      lightboxAnimating = true;
      incoming.className = 'lightbox-photo ' + (direction > 0 ? 'is-entering-right' : 'is-entering-left');
      incoming.onload = null;
      incoming.onerror = null;

      let onSlideEnd = null;
      const finish = () => {
        if (finished) return;
        finished = true;
        finishLightboxStep(nextIndex, token, current, incoming, onSlideEnd);
      };

      const startTransition = () => {
        if (started || token !== lightboxTransitionToken) return;
        started = true;
        incoming.onload = null;
        incoming.onerror = null;

        // Force the starting position to be painted before moving the new image.
        void incoming.offsetWidth;
        requestAnimationFrame(() => {
          if (token !== lightboxTransitionToken) return;
          current.classList.remove('is-active');
          current.classList.add(direction > 0 ? 'is-leaving-left' : 'is-leaving-right');
          incoming.classList.remove('is-entering-right', 'is-entering-left');
          incoming.classList.add('is-active');
        });

        onSlideEnd = function (event) {
          if (event.target === incoming && event.propertyName === 'transform') finish();
        };
        incoming.addEventListener('transitionend', onSlideEnd);
        // Fallback for reduced-motion settings or browsers without transition events.
        lightboxTransitionTimer = window.setTimeout(finish, 520);
      };

      incoming.onerror = () => {
        if (token !== lightboxTransitionToken) return;
        incoming.onload = null;
        incoming.onerror = null;
        lightboxAnimating = false;
        showLightbox(nextIndex);
        if (lightboxPendingDirection !== 0) {
          const queuedDirection = Math.sign(lightboxPendingDirection);
          lightboxPendingDirection -= queuedDirection;
          window.setTimeout(() => animateLightboxStep(queuedDirection), 35);
        }
      };
      incoming.onload = startTransition;
      incoming.src = lightboxImages[nextIndex];

      if (incoming.complete && incoming.naturalWidth > 0) startTransition();
    }

    function lightboxStep(direction) {
      if (!lightboxImages.length || !direction) return;
      const step = direction > 0 ? 1 : -1;
      if (lightboxAnimating) {
        lightboxPendingDirection += step;
        return;
      }
      animateLightboxStep(step);
    }

    function closeLightbox() {
      const box = document.getElementById('lightbox');
      lightboxTransitionToken++;
      if (lightboxTransitionTimer) clearTimeout(lightboxTransitionTimer);
      lightboxTransitionTimer = null;
      lightboxAnimating = false;
      lightboxPendingDirection = 0;
      resetLightboxLayers();
      box.classList.remove('open');
      box.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
    }

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    (function () {
      let startX = 0;
      const box = document.getElementById('lightbox');
      box.addEventListener('touchstart', e => { startX = e.changedTouches[0].clientX; }, { passive: true });
      box.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 50) lightboxStep(dx < 0 ? 1 : -1);
      }, { passive: true });
    })();

    document.addEventListener('keydown', (e) => {
      const box = document.getElementById('lightbox');
      const isOpen = box.classList.contains('open');

      if (e.key === 'Escape') {
        if (isOpen) closeLightbox();
        closeAllHeroMenus();
        return;
      }
      if (!isOpen) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); lightboxStep(1); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); lightboxStep(-1); }
    });

    /* ================================================================
       FILES / MEDIA DROPDOWNS (hero bar)
       Top-level opens on click, nested menus are hover-only.
       ================================================================ */
    const HM_ITEM_SEL = '.hm-item';
    const hmHoverTimers = new WeakMap();
    const hmWrapTimers = new WeakMap();

    function clearHeroMenuHover(menu) {
      if (!menu) return;
      menu.querySelectorAll(HM_ITEM_SEL).forEach(function (item) {
        item.classList.remove('hover-open');
        const t = hmHoverTimers.get(item);
        if (t) clearTimeout(t);
      });
      menu.querySelectorAll('.hm-sub').forEach(function (s) { s.classList.remove('flip-left'); });
    }

    function closeHeroMenu(menu) {
      if (!menu) return;
      menu.classList.remove('open');
      clearHeroMenuHover(menu);
      const btn = menu.closest('.hm-wrap') && menu.closest('.hm-wrap').querySelector('button');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }

    function closeAllHeroMenus() {
      document.querySelectorAll('.hm-menu.open').forEach(closeHeroMenu);
    }

    function positionHeroSubmenus(menu) {
      if (!menu) return;
      menu.querySelectorAll('.hm-sub').forEach(function (sub) {
        sub.classList.remove('flip-left');
        const rect = sub.getBoundingClientRect();
        if (rect.right > window.innerWidth - 8) sub.classList.add('flip-left');
      });
    }

    function toggleHeroMenu(event, menuId) {
      event.preventDefault();
      event.stopPropagation();

      const menu = document.getElementById(menuId);
      if (!menu) return;

      document.querySelectorAll('.hm-menu.open').forEach(function (other) {
        if (other !== menu) closeHeroMenu(other);
      });

      const willOpen = !menu.classList.contains('open');
      clearHeroMenuHover(menu);
      menu.classList.toggle('open', willOpen);
      const btn = menu.closest('.hm-wrap').querySelector('button');
      if (btn) btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');

      if (willOpen) requestAnimationFrame(function () { positionHeroSubmenus(menu); });
    }

    /* Nested rows never lock open on click */
    document.addEventListener('click', function (e) {
      const nested = e.target.closest(HM_ITEM_SEL);
      if (!nested) return;
      if (nested.closest('.hm-sub')) return;
      e.stopPropagation();
    });

    document.addEventListener('mouseover', function (e) {
      const wrap = e.target.closest('.hm-wrap');
      if (wrap) {
        const wt = hmWrapTimers.get(wrap);
        if (wt) clearTimeout(wt);
      }

      const item = e.target.closest(HM_ITEM_SEL);
      if (!item || !item.parentElement) return;

      const old = hmHoverTimers.get(item);
      if (old) clearTimeout(old);

      Array.from(item.parentElement.children).forEach(function (sibling) {
        if (sibling !== item && sibling.classList && sibling.classList.contains('hover-open')) {
          sibling.classList.remove('hover-open');
        }
      });

      const sub = item.querySelector(':scope > .hm-sub');
      if (!sub) return;

      item.classList.add('hover-open');
      requestAnimationFrame(function () {
        sub.classList.remove('flip-left');
        if (sub.getBoundingClientRect().right > window.innerWidth - 8) sub.classList.add('flip-left');
      });
    });

    document.addEventListener('mouseout', function (e) {
      let el = e.target.closest(HM_ITEM_SEL);
      while (el) {
        const item = el;
        const stillInside = e.relatedTarget && item.contains(e.relatedTarget);
        if (!stillInside) {
          const old = hmHoverTimers.get(item);
          if (old) clearTimeout(old);
          hmHoverTimers.set(item, setTimeout(function () {
            if (!item.matches(':hover')) item.classList.remove('hover-open');
          }, 180));
        }
        el = item.parentElement ? item.parentElement.closest(HM_ITEM_SEL) : null;
      }

      const wrap = e.target.closest('.hm-wrap');
      if (wrap && !(e.relatedTarget && wrap.contains(e.relatedTarget))) {
        const old = hmWrapTimers.get(wrap);
        if (old) clearTimeout(old);
        hmWrapTimers.set(wrap, setTimeout(function () {
          if (!wrap.matches(':hover')) closeHeroMenu(wrap.querySelector('.hm-menu'));
        }, 250));
      }
    });

    /* ================================================================
       HEADER FUNCTIONS (profile, settings, search, theme, menu)
       ================================================================ */
    function getUserAvatarUrl(user) {
      if (!user) return '';
      const metadata = user.user_metadata || {};
      const identities = Array.isArray(user.identities) ? user.identities : [];
      const identityData = identities[0] && identities[0].identity_data ? identities[0].identity_data : {};
      return metadata.avatar_url ||
             metadata.picture ||
             metadata.profile_image ||
             metadata.photo_url ||
             identityData.avatar_url ||
             identityData.picture ||
             '';
    }

    function getUserDisplayName(user) {
      if (!user) return 'Guest User';
      const metadata = user.user_metadata || {};
      return metadata.full_name ||
             metadata.name ||
             metadata.user_name ||
             metadata.username ||
             (user.email ? user.email.split('@')[0] : 'User');
    }

    function setProfileImage(img, fallback, url) {
      if (!img || !fallback) return;
      if (!url) {
        img.hidden = true;
        img.removeAttribute('src');
        fallback.hidden = false;
        return;
      }
      img.onload = function () { img.hidden = false; fallback.hidden = true; };
      img.onerror = function () { img.hidden = true; img.removeAttribute('src'); fallback.hidden = false; };
      img.src = url;
    }

    function updateProfileUI(user) {
      const profileBtn = document.getElementById('userProfileBtn');
      const profileImg = document.getElementById('userProfileImage');
      const profileFallback = document.getElementById('userProfileFallback');
      const dropdownImg = document.getElementById('userDropdownImage');
      const dropdownFallback = document.getElementById('userDropdownFallback');
      const nameEl = document.getElementById('profileUserName');
      const emailEl = document.getElementById('profileUserEmail');
      const authAction = document.getElementById('profileAuthAction');
      const authIcon = document.getElementById('profileAuthActionIcon');
      const authText = document.getElementById('profileAuthActionText');

      const loggedIn = !!user;

      if (profileBtn) {
        profileBtn.classList.toggle('is-authenticated', loggedIn);
        profileBtn.title = loggedIn ? 'Profile' : 'Log in';
      }

      const avatarUrl = getUserAvatarUrl(user);
      setProfileImage(profileImg, profileFallback, avatarUrl);
      setProfileImage(dropdownImg, dropdownFallback, avatarUrl);

      if (nameEl) nameEl.textContent = loggedIn ? getUserDisplayName(user) : 'Guest User';
      if (emailEl) emailEl.textContent = loggedIn ? (user.email || 'Signed in') : 'Not logged in';

      if (authAction && authIcon && authText) {
        if (loggedIn) {
          authAction.href = '#';
          authAction.title = 'Log out';
          authIcon.className = 'fa-solid fa-right-from-bracket';
          authText.textContent = 'LOG OUT';
          authAction.onclick = handleLogout;
        } else {
          authAction.href = 'login.html';
          authAction.title = 'Log in';
          authIcon.className = 'fa-solid fa-right-to-bracket';
          authText.textContent = 'LOG IN';
          authAction.onclick = null;
        }
      }
    }

    async function handleLogout(event) {
      if (event) event.preventDefault();
      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;
        updateProfileUI(null);
        const dropdown = document.getElementById('userDropdownMenu');
        if (dropdown) dropdown.classList.remove('open');
      } catch (error) {
        console.error('Logout failed:', error);
      }
    }

    async function initAuthState() {
      try {
        if (window.__indexHeaderReady) await window.__indexHeaderReady;
        const { data: { session } } = await supabaseClient.auth.getSession();
        updateProfileUI(session ? session.user : null);
        supabaseClient.auth.onAuthStateChange(function (_event, newSession) {
          updateProfileUI(newSession ? newSession.user : null);
        });
      } catch (error) {
        console.error('Auth state initialization failed:', error);
        updateProfileUI(null);
      }
    }

    /* Search: finds a project by code, name, organization, donor, country or
       district, then opens its project view page. */
    async function executeSearch() {
      const input = document.getElementById('projectSearchInput');
      const feedback = document.getElementById('searchResultFeedback');
      const query = input.value.trim().toUpperCase();

      if (!query) {
        feedback.textContent = 'Please enter project details.';
        feedback.className = 'absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-red-500 z-50';
        return;
      }

      const { data, error } = await supabaseClient
        .from('projects')
        .select('id, bd_number, ho_number, project_name, local_name, organization, donor_name, donated_country, district');

      if (error) {
        feedback.textContent = 'Search failed. Please try again.';
        feedback.className = 'absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-red-500 z-50';
        return;
      }

      const matches = (data || []).filter(p =>
        [p.bd_number, p.ho_number, p.project_name, p.local_name, p.organization, p.donor_name, p.donated_country, p.district]
          .some(v => String(v || '').toUpperCase().includes(query))
      );

      if (matches.length > 0) {
        feedback.className = 'absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-emerald-600 font-semibold z-50';
        feedback.textContent = matches.length === 1
          ? 'Found 1 matching project! Opening...'
          : `Found ${matches.length} matching projects! Opening the first one...`;
        setTimeout(() => {
          window.location.href = 'project_view.html?id=' + encodeURIComponent(matches[0].id);
        }, 700);
      } else {
        feedback.className = 'absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-red-500 font-semibold z-50';
        feedback.textContent = `No match found for "${input.value.trim()}".`;
      }
    }

    function handleProjectSearch(event) {
      if (event.key === 'Enter') executeSearch();
    }

    function setThemeMode(mode) {
      const validModes = ['light', 'dynamic', 'dark'];
      if (!validModes.includes(mode)) mode = 'dynamic';

      const switcher = document.getElementById('themeModeSwitch');
      const buttons = document.querySelectorAll('.theme-mode-btn');
      const indexMap = { light: 0, dynamic: 1, dark: 2 };

      buttons.forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
      });

      if (switcher) switcher.style.setProperty('--theme-index', indexMap[mode]);

      const body = document.body;
      body.classList.add('theme-transition');
      body.classList.remove('theme-light', 'theme-dynamic', 'theme-dark', 'theme-effective-dark');
      body.classList.add('theme-' + mode);

      const prefersDark = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;

      const isEffectiveDark = mode === 'dark' || (mode === 'dynamic' && prefersDark);
      if (isEffectiveDark) body.classList.add('theme-effective-dark');

      document.documentElement.classList.toggle('dark', isEffectiveDark);

      try {
        const menuFrame = document.getElementById('menuLinksFrame');
        if (menuFrame && menuFrame.contentWindow) {
          menuFrame.contentWindow.postMessage({ type: 'ynad-theme', dark: isEffectiveDark }, '*');
        }
      } catch (e) {}

      window.clearTimeout(window.__ynadThemeTransitionTimer);
      window.__ynadThemeTransitionTimer = window.setTimeout(function() {
        body.classList.remove('theme-transition');
      }, 500);

      try { localStorage.setItem('ynad-theme-mode', mode); } catch (e) {}
    }

    window.addEventListener('message', function(e) {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === 'ynad-request-theme') {
        const isEffectiveDark = document.body.classList.contains('theme-effective-dark');
        try {
          const menuFrame = document.getElementById('menuLinksFrame');
          if (menuFrame && menuFrame.contentWindow && e.source === menuFrame.contentWindow) {
            menuFrame.contentWindow.postMessage({ type: 'ynad-theme', dark: isEffectiveDark }, '*');
          }
        } catch (err) {}
      }
    });

    (function initThemeMode() {
      let saved = 'dynamic';
      try { saved = localStorage.getItem('ynad-theme-mode') || 'dynamic'; } catch (e) {}

      document.addEventListener('DOMContentLoaded', async function() {
        try { if (window.__indexHeaderReady) await window.__indexHeaderReady; } catch (e) {}

        setThemeMode(saved);

        if (window.matchMedia) {
          const media = window.matchMedia('(prefers-color-scheme: dark)');
          const syncDynamicTheme = function() {
            if (document.body.classList.contains('theme-dynamic')) setThemeMode('dynamic');
          };
          if (media.addEventListener) media.addEventListener('change', syncDynamicTheme);
          else if (media.addListener) media.addListener(syncDynamicTheme);
        }
      });
    })();

    window.addEventListener('storage', function (e) {
      if (e.key === 'ynad-theme-mode') {
        try { setThemeMode(localStorage.getItem('ynad-theme-mode') || 'dynamic'); } catch (err) {}
      }
    });

    function openMenuWithEffect() {
      const icon = document.getElementById('hamburgerBtnIcon');
      const pageWrapper = document.getElementById('pageContentWrapper');
      const overlay = document.getElementById('menuOverlay');
      const menuFrame = document.getElementById('menuLinksFrame');

      icon.classList.add('clicked');

      setTimeout(() => {
        icon.classList.remove('clicked');
        pageWrapper.classList.add('blurred');

        setTimeout(() => {
          menuFrame.src = 'menu.html';
          overlay.classList.add('open');
          document.body.style.overflow = 'hidden';

          menuFrame.onload = function () {
            try { menuFrame.contentWindow.postMessage({ type: 'ynad-menu-open' }, '*'); } catch (e) {}
          };
        }, 200);

      }, 200);
    }

    function closeMenuWithEffect() {
      const overlay = document.getElementById('menuOverlay');
      const pageWrapper = document.getElementById('pageContentWrapper');
      const menuFrame = document.getElementById('menuLinksFrame');

      try {
        if (menuFrame && menuFrame.contentWindow) {
          menuFrame.contentWindow.postMessage({ type: 'ynad-menu-closing' }, '*');
        }
      } catch (e) {}

      setTimeout(() => {
        overlay.classList.remove('open');

        setTimeout(() => {
          pageWrapper.classList.remove('blurred');
          document.body.style.overflow = 'auto';
          menuFrame.src = 'about:blank';
        }, 400);

      }, 380);
    }

    function handleOverlayClick(event) {
      if (event.target === document.getElementById('menuOverlay')) closeMenuWithEffect();
    }

    /* bfcache / back button: clear leftover states */
    window.addEventListener('pageshow', function () {
      const pageWrapper = document.getElementById('pageContentWrapper');
      if (pageWrapper) pageWrapper.classList.remove('blurred');
      closeAllHeroMenus();
    });

    /* ================================================================
       START
       ================================================================ */
    window.addEventListener('DOMContentLoaded', () => {
      loadProject();
      initAuthState();

      const loadingProgress = document.getElementById('pageLoadingProgress');
      const finishPageLoad = () => {
        if (!loadingProgress) return;
        loadingProgress.style.width = '100%';
        setTimeout(() => { loadingProgress.style.opacity = '0'; }, 250);
        setTimeout(() => {
          const bar = document.getElementById('pageLoadingBar');
          if (bar) bar.style.display = 'none';
        }, 650);
      };

      if (loadingProgress) {
        requestAnimationFrame(() => { loadingProgress.style.width = '72%'; });
      }

      if (document.readyState === 'complete') {
        finishPageLoad();
      } else {
        window.addEventListener('load', finishPageLoad, { once: true });
      }
    });
  </script>
</body>
</html>
