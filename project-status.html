<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Status Overview — YNAD Construction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }

        #pageLoadingBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 99999;
            pointer-events: none;
            overflow: hidden;
        }

        #pageLoadingProgress {
            width: 8%;
            height: 100%;
            background: linear-gradient(90deg, #b45309, #d97706, #f59e0b, #d97706, #b45309);
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.70);
            transition: width 0.45s ease, opacity 0.35s ease;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .zoom-container {
            position: relative;
        }
        .zoom-wrapper {
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .zoom-wrapper::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.48);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 10;
        }
        .zoom-wrapper:hover::after,
        .recent-project-card:hover .zoom-wrapper::after {
            opacity: 1;
        }
        .zoom-wrapper img {
            transition: transform 0.3s ease-in-out;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .zoom-wrapper:hover img {
            transform: scale(1.05);
        }

        .zoom-container::before,
        .zoom-container::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border: 2px solid transparent;
            transition: width 0.3s ease, height 0.3s ease;
            pointer-events: none;
            z-index: 30;
        }
        .zoom-container::before {
            top: 8px;
            left: 8px;
        }
        .zoom-container::after {
            bottom: 8px;
            right: 8px;
        }
        .zoom-container:hover::before {
            width: 40px;
            height: 40px;
            border-top-color: #d97706;
            border-left-color: #d97706;
            border-bottom-color: transparent;
            border-right-color: transparent;
        }
        .zoom-container:hover::after {
            width: 40px;
            height: 40px;
            border-bottom-color: #d97706;
            border-right-color: #d97706;
            border-top-color: transparent;
            border-left-color: transparent;
        }

        /* ================================================================
           PROJECT CARD — identical spec to all-projects.html / index.html
           ================================================================ */
        .recent-project-card {
            width: 100%;
            height: 417.8708px;
            min-height: 417.8708px;
            position: relative;
            overflow: visible;
            background: #ffffff;
            border: 1px solid transparent;
            box-sizing: border-box;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.10),
                        0 10px 12px -12px rgba(15, 23, 42, 0.42);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: left;
        }

        .recent-project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.14);
        }

        .recent-project-card::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: -10px;
            height: 10px;
            background: transparent;
            pointer-events: none;
            z-index: 40;
            box-shadow: 0 7px 12px -10px rgba(15, 23, 42, 0.55);
        }

        .recent-project-image {
            position: relative;
            width: 100%;
            height: 299.141px;
            overflow: hidden;
            background: #e5e7eb;
            flex: 0 0 299.141px;
        }

        .recent-project-image-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .recent-project-image-track > .zoom-wrapper {
            width: 100%;
            min-width: 100%;
            height: 299.141px;
            min-height: 299.141px;
        }

        .recent-project-image-track img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .recent-project-bottom {
            width: 100%;
            height: 118.7298px;
            min-height: 118.7298px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            background: #fff;
        }

        .recent-project-info {
            height: 72px;
            min-height: 72px;
            padding: 10px 19px 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
        }

        .recent-project-info-left {
            min-width: 0;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .recent-project-title {
            margin: 0 0 2px;
            font-size: 15px;
            line-height: 20px;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: #232525;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-project-location {
            margin-top: 0;
            font-size: 11px;
            line-height: 16px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: rgba(0, 0, 0, 0.7);
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-project-code {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            line-height: 16px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }

        .recent-project-code .code-divider {
            width: 1px;
            height: 14px;
            background: rgba(0, 0, 0, 0.2);
            flex: 0 0 auto;
        }

        .recent-project-actions {
            height: 46.7298px;
            min-height: 46.7298px;
            border-top: none;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
            box-sizing: border-box;
            gap: 0;
        }

        .recent-project-action {
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 3px;
            border-radius: 4px;
            font-size: 10px;
            line-height: 1;
            font-weight: 600;
            letter-spacing: 0.015em;
            white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .recent-project-action.docs {
            color: rgba(37, 99, 235, 0.70);
        }

        .recent-project-action.docs:hover {
            color: #fff;
            background: #2563eb;
        }

        .recent-project-action.media {
            color: rgba(217, 119, 6, 0.72);
            border: none;
            background: transparent;
        }

        .recent-project-action.media:hover {
            color: #fff;
            background: #d97706;
        }

        .recent-project-action.location {
            color: rgba(71, 85, 105, 0.78);
        }

        .recent-project-action.location:hover {
            color: #fff;
            background: #3a3c3c;
        }

        .reveal-fade-left {
            opacity: 0;
            transform: translateX(-40px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .reveal-fade-left.revealed {
            opacity: 1;
            transform: translateX(0);
        }

        .media-menu-wrap { position: relative; }

        .media-menu {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, .18);
            min-width: 140px;
            padding: 6px;
            z-index: 60;
            text-align: left;
        }
        .media-menu.hidden { display: none; }

        .media-menu-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 9px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .04em;
            color: #3a3c3c;
            border-radius: 5px;
            cursor: default;
            transition: background .15s ease, color .15s ease;
        }
        .media-menu-item:hover,
        .media-menu-item.open {
            background: #fffbeb;
            color: #b45309;
        }
        .media-menu-item i {
            font-size: 8px;
            color: #a8a6a3;
        }
        .media-menu-item:hover i,
        .media-menu-item.open i {
            color: #d97706;
        }

        .media-submenu {
            position: absolute;
            left: calc(100% + 6px);
            top: -6px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, .18);
            min-width: 120px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 1px;
            z-index: 61;
        }
        .media-menu-item:hover .media-submenu,
        .media-menu-item.open .media-submenu {
            display: flex;
        }
        .media-submenu.flip-left {
            left: auto;
            right: calc(100% + 6px);
        }
        .media-submenu a {
            display: block;
            padding: 6px 9px;
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: .03em;
            color: #55575a;
            border-radius: 5px;
            text-decoration: none;
            white-space: nowrap;
            transition: background .15s ease, color .15s ease;
        }
        .media-submenu a:hover {
            background: #d97706;
            color: #fff;
        }

        /* ================================================================
           HEADER — identical spec to all-projects.html / index.html
           ================================================================ */
        #mainNav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.48);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        background-color 0.35s ease,
                        border-color 0.35s ease,
                        box-shadow 0.35s ease;
            transform: translateY(0);
        }
        #mainNav.nav-hidden {
            transform: translateY(-100%);
        }
        #mainNav.nav-solid {
            background-color: #ffffff;
            border-bottom-color: #e5e7eb;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        }
        #mainNav .nav-adaptive {
            color: #ffffff;
            transition: color 0.35s ease;
        }
        #mainNav.nav-solid .nav-adaptive {
            color: #1b1d1d;
        }
        #mainNav .nav-adaptive-muted {
            color: rgba(255, 255, 255, 0.85);
            transition: color 0.35s ease;
        }
        #mainNav.nav-solid .nav-adaptive-muted {
            color: #3a3c3c;
        }
        #mainNav .nav-icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid transparent;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease,
                        transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        #mainNav.nav-solid .nav-icon-btn {
            background: #f1f5f9;
            border-color: #e2e8f0;
        }
        #mainNav .nav-icon-btn:hover {
            background-color: #d97706;
            border-color: #d97706;
            color: #ffffff !important;
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
        }
        #mainNav #searchIconBtn:hover {
            transform: scale(1.05);
        }
        #searchBoxWrap.search-open #searchIconBtn:hover {
            transform: translateX(2px) scale(1.05);
        }

        /* ================================================================
           DARK / LIGHT THEME — identical palette to all-projects.html / index.html
           ================================================================ */
        body.theme-light {
            background-color: #ffffff;
            color: #2a2c2c;
        }

        body.theme-light .recent-project-bottom,
        body.theme-light #pageHeaderSection {
            background-color: #ffffff !important;
        }

        body.theme-light .recent-project-card,
        body.theme-light #settingsDropdownMenu,
        body.theme-light #userDropdownMenu,
        body.theme-light #searchDropdownMenu,
        body.theme-light #menuBox {
            background-color: #ffffff !important;
            border-color: #e2e8f0 !important;
        }

        body.theme-effective-dark {
            background-color: #131414 !important;
            color: #e2e8f0;
        }

        body.theme-effective-dark .recent-project-bottom,
        body.theme-effective-dark #pageHeaderSection {
            background-color: #131414 !important;
        }

        body.theme-effective-dark .recent-project-card,
        body.theme-effective-dark #settingsDropdownMenu,
        body.theme-effective-dark #userDropdownMenu,
        body.theme-effective-dark #searchDropdownMenu,
        body.theme-effective-dark #menuBox {
            background-color: #232525 !important;
            border-color: #3a3c3c !important;
        }

        body.theme-effective-dark .recent-project-title,
        body.theme-effective-dark .text-slate-900,
        body.theme-effective-dark .text-slate-800 {
            color: #ffffff !important;
        }

        body.theme-effective-dark .recent-project-location,
        body.theme-effective-dark .text-slate-600,
        body.theme-effective-dark .text-slate-500,
        body.theme-effective-dark .text-slate-400 {
            color: #c7c5c2 !important;
        }

        body.theme-effective-dark #pageHeaderSection h1,
        body.theme-effective-dark #pageHeaderSection .filter-tab {
            color: #ffffff !important;
        }
        body.theme-effective-dark .recent-project-code {
            color: #a8a6a3 !important;
        }
        body.theme-effective-dark .recent-project-code .code-divider {
            background: #55575a !important;
        }
        body.theme-effective-dark .recent-project-action.docs {
            color: #60a5fa !important;
        }
        body.theme-effective-dark .recent-project-action.media {
            color: #f59e0b !important;
        }
        body.theme-effective-dark .recent-project-action.location {
            color: #a8a6a3 !important;
        }

        body.theme-effective-dark .recent-project-action.docs:hover,
        body.theme-effective-dark .recent-project-action.docs:hover span,
        body.theme-effective-dark .recent-project-action.docs:hover i,
        body.theme-effective-dark .recent-project-action.media:hover,
        body.theme-effective-dark .recent-project-action.media:hover span,
        body.theme-effective-dark .recent-project-action.media:hover i,
        body.theme-effective-dark .recent-project-action.location:hover,
        body.theme-effective-dark .recent-project-action.location:hover span,
        body.theme-effective-dark .recent-project-action.location:hover i {
            color: #ffffff !important;
        }

        body.theme-effective-dark .recent-project-action.docs:hover {
            background: #2563eb !important;
        }
        body.theme-effective-dark .recent-project-action.media:hover {
            background: #d97706 !important;
        }
        body.theme-effective-dark .recent-project-action.location:hover {
            background: #3a3c3c !important;
        }

        body.theme-light .recent-project-card {
            border-color: transparent !important;
        }
        body.theme-light .recent-project-card::after {
            background: transparent !important;
            box-shadow: 0 7px 12px -10px rgba(15, 23, 42, 0.55);
        }

        body.theme-effective-dark .recent-project-card {
            border-color: #3a3c3c !important;
            border-bottom-color: #3a3c3c !important;
            box-shadow:
                inset 0 -1px 0 #3a3c3c,
                0 6px 18px rgba(15, 23, 42, 0.10),
                0 10px 12px -12px rgba(15, 23, 42, 0.78);
        }
        body.theme-effective-dark .recent-project-card::after {
            background: #3a3c3c !important;
            left: 0;
            right: 0;
            bottom: 0;
            height: 1px;
            box-shadow: none !important;
        }

        body.theme-effective-dark #searchDropdownMenu input {
            color: #ffffff !important;
        }
        body.theme-effective-dark #searchDropdownMenu input::placeholder {
            color: #a8a6a3;
        }

        body.theme-effective-dark .border-slate-100,
        body.theme-effective-dark .border-slate-200,
        body.theme-effective-dark .border-slate-300 {
            border-color: #3a3c3c !important;
        }
        body.theme-effective-dark .bg-slate-50 {
            background-color: #232525 !important;
        }
        body.theme-effective-dark .bg-white {
            background-color: #232525 !important;
        }
        body.theme-effective-dark .hover\:bg-slate-100:hover {
            background-color: #2a2c2c !important;
        }

        #settingsDropdownMenu a {
            transition: background-color 0.22s ease, color 0.22s ease;
        }
        body.theme-effective-dark #settingsDropdownMenu a {
            color: #e2e8f0 !important;
        }
        body.theme-effective-dark #settingsDropdownMenu a:hover,
        body.theme-light #settingsDropdownMenu a:hover {
            background-color: #d97706 !important;
            color: #ffffff !important;
        }

        body.theme-effective-dark #mainNav.nav-solid {
            background-color: #131414;
            border-bottom-color: #3a3c3c;
        }
        body.theme-effective-dark #mainNav.nav-solid .nav-icon-btn,
        body.theme-effective-dark #mainNav.nav-solid .theme-mode-switch {
            background-color: #2a2c2c;
            border-color: #3a3c3c;
        }
        body.theme-effective-dark #mainNav.nav-solid .nav-adaptive {
            color: #ffffff;
        }
        body.theme-effective-dark #mainNav.nav-solid .nav-adaptive-muted {
            color: #c7c5c2;
        }
        body.theme-effective-dark .theme-mode-btn.active {
            color: #ffffff !important;
        }

        body.theme-effective-dark .text-black,
        body.theme-effective-dark .text-slate-700,
        body.theme-effective-dark .text-slate-800,
        body.theme-effective-dark .text-slate-900,
        body.theme-effective-dark .text-gray-900,
        body.theme-effective-dark .text-gray-800,
        body.theme-effective-dark .text-gray-700 {
            color: #ffffff !important;
        }

        #userProfileBtn {
            background: #ffffff;
            color: #64748b;
            border-color: #d97706;
        }
        #userProfileBtn .profile-fallback-icon {
            font-size: 15px;
            line-height: 1;
            transition: color 0.35s ease, transform 0.25s ease;
        }
        #userProfileBtn:hover .profile-fallback-icon {
            transform: scale(1.05);
        }
        #userProfileBtn.is-authenticated {
            background: transparent;
        }
        #userProfileBtn img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #userProfileBtn .profile-fallback-icon[hidden],
        #userProfileBtn img[hidden] {
            display: none !important;
        }
        #userDropdownMenu .profile-avatar-large {
            background: #ffffff;
            color: #64748b;
        }
        #userDropdownMenu .profile-user-name {
            color: #1b1d1d;
        }
        #userDropdownMenu .profile-user-email {
            color: #64748b;
        }
        #userDropdownMenu .auth-action {
            background: #ffffff;
            color: #55575a;
            border: 1px solid #e2e8f0;
        }
        #userDropdownMenu .auth-action:hover {
            background: #d97706;
            color: #ffffff;
            border-color: #d97706;
        }
        body.theme-effective-dark #userProfileBtn {
            background: #2a2c2c;
            border-color: #f59e0b;
            color: #c7c5c2;
        }
        body.theme-effective-dark #userDropdownMenu .profile-avatar-large {
            background: #2a2c2c;
            color: #c7c5c2;
            border-color: #55575a !important;
        }
        body.theme-effective-dark #userDropdownMenu .profile-user-name {
            color: #ffffff !important;
        }
        body.theme-effective-dark #userDropdownMenu .profile-user-email {
            color: #a8a6a3 !important;
        }
        body.theme-effective-dark #userDropdownMenu .auth-action {
            background: #2a2c2c;
            color: #c7c5c2;
            border-color: #3a3c3c;
        }
        body.theme-effective-dark #userDropdownMenu .auth-action:hover {
            background: #d97706;
            color: #ffffff;
            border-color: #d97706;
        }

        body.theme-transition,
        body.theme-transition * {
            transition-property: color, background-color, border-color, fill, stroke !important;
            transition-duration: 0.45s !important;
            transition-timing-function: ease !important;
        }

        #pageHeaderSection {
            padding-top: 112px;
            transition: background-color 0.45s ease;
        }

        .hamburger-icon {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
        }
        .hamburger-icon.clicked {
            transform: scale(1.25);
        }

        #pageContentWrapper {
            transition: filter 0.6s ease-in-out;
        }
        #pageContentWrapper.blurred {
            filter: blur(6px);
            pointer-events: none;
        }

        #menuOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: flex-end;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.7s ease, visibility 0.7s ease;
            pointer-events: none;
        }
        #menuOverlay.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        #menuBox {
            transform: translateX(100%);
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #menuOverlay.open #menuBox {
            transform: translateX(0);
        }

        #settingsDropdownMenu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(0.96);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        #settingsDropdownMenu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        #userDropdownMenu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(0.96);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        #userDropdownMenu.open {

                .then(response => {
                    if (!response.ok) throw new Error('Unable to load footer.html');
                    return response.text();
                })
                .then(html => {
                    const template = document.createElement('template');
                    template.innerHTML = html;

                    const scripts = Array.from(template.content.querySelectorAll('script'));
                    scripts.forEach(script => script.remove());

                    container.replaceChildren(template.content.cloneNode(true));

                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        for (const attr of oldScript.attributes) {
                            newScript.setAttribute(attr.name, attr.value);
                        }
                        newScript.textContent = oldScript.textContent;
                        document.body.appendChild(newScript);
                        newScript.remove();
                    });
                })
                .catch(error => {
                    console.error(error);
                    container.innerHTML = '<div style="padding:32px;text-align:center;color:#a8a6a3;background:#1b1d1d;">Footer failed to load.</div>';

        /* ================================================================
           HEADER SCROLL ANIMATION — follows index.html exactly
           The header is loaded asynchronously from index.html, so the
           scroll binding must start only after that shared header exists.
        ================================================================ */
        (function () {
            function bindIndexHeaderScroll() {
                const nav = document.getElementById('mainNav');
                if (!nav) return;
                if (nav.dataset.scrollBound === 'true') return;
                nav.dataset.scrollBound = 'true';

                let lastScrollY = window.scrollY;
                let ticking = false;

                function handleNavScroll() {
                    const currentScrollY = window.scrollY;
                    const pastTop = currentScrollY > 4;

                    nav.classList.toggle('nav-solid', pastTop);

                    /* Match index.html: header stays visible at the top,
                       slides up on scroll-down, and returns immediately
                       when the user scrolls back up. */
                    if (nav.dataset.scrollLock === 'true') {
                        nav.classList.add('nav-hidden');
                        lastScrollY = currentScrollY;
                        ticking = false;
                        return;
                    }

                    if (currentScrollY <= 4) {
                        nav.classList.remove('nav-hidden');
                    } else if (currentScrollY > lastScrollY) {
                        nav.classList.add('nav-hidden');
                    } else if (currentScrollY < lastScrollY) {
                        nav.classList.remove('nav-hidden');
                    }

                    lastScrollY = currentScrollY;
                    ticking = false;
                }

                window.addEventListener('scroll', function () {
                    if (!ticking) {
                        window.requestAnimationFrame(handleNavScroll);
                        ticking = true;
                    }
                }, { passive: true });

                handleNavScroll();
            }

            /* The shared header is fetched asynchronously from index.html. */
            if (window.__indexHeaderReady && typeof window.__indexHeaderReady.then === 'function') {
                window.__indexHeaderReady.then(bindIndexHeaderScroll);
            } else {
                document.addEventListener('ynad-index-header-ready', bindIndexHeaderScroll, { once: true });
            }
        })();

        function getUserAvatarUrl(user) {
            if (!user) return '';
            const metadata = user.user_metadata || {};
            const identities = Array.isArray(user.identities) ? user.identities : [];
            const identityData = identities[0] && identities[0].identity_data ? identities[0].identity_data : {};
            return metadata.avatar_url ||
                   metadata.picture ||
                   metadata.profile_image ||
                   metadata.photo_url ||
                   identityData.avatar_url ||
                   identityData.picture ||
                   '';
        }

        function getUserDisplayName(user) {
            if (!user) return 'Guest User';
            const metadata = user.user_metadata || {};
            return metadata.full_name ||
                   metadata.name ||
                   metadata.user_name ||
                   metadata.username ||
                   (user.email ? user.email.split('@')[0] : 'User');
        }

        function setProfileImage(img, fallback, url) {
            if (!img || !fallback) return;
            if (!url) {
                img.hidden = true;
                img.removeAttribute('src');
                fallback.hidden = false;
                return;
            }
            img.onload = function () {
                img.hidden = false;
                fallback.hidden = true;
            };
            img.onerror = function () {
                img.hidden = true;
                img.removeAttribute('src');
                fallback.hidden = false;
            };
            img.src = url;
        }

        function updateProfileUI(user) {
            const profileBtn = document.getElementById('userProfileBtn');
            const profileImg = document.getElementById('userProfileImage');
            const profileFallback = document.getElementById('userProfileFallback');
            const dropdownImg = document.getElementById('userDropdownImage');
            const dropdownFallback = document.getElementById('userDropdownFallback');
            const nameEl = document.getElementById('profileUserName');
            const emailEl = document.getElementById('profileUserEmail');
            const authAction = document.getElementById('profileAuthAction');
            const authIcon = document.getElementById('profileAuthActionIcon');
            const authText = document.getElementById('profileAuthActionText');

            const loggedIn = !!user;

            if (profileBtn) {
                profileBtn.classList.toggle('is-authenticated', loggedIn);
                profileBtn.title = loggedIn ? 'Profile' : 'Log in';
            }

            const avatarUrl = getUserAvatarUrl(user);
            setProfileImage(profileImg, profileFallback, avatarUrl);
            setProfileImage(dropdownImg, dropdownFallback, avatarUrl);

            if (nameEl) nameEl.textContent = loggedIn ? getUserDisplayName(user) : 'Guest User';
            if (emailEl) emailEl.textContent = loggedIn ? (user.email || 'Signed in') : 'Not logged in';

            if (authAction && authIcon && authText) {
                if (loggedIn) {
                    authAction.href = '#';
                    authAction.title = 'Log out';
                    authIcon.className = 'fa-solid fa-right-from-bracket';
                    authText.textContent = 'LOG OUT';
                    authAction.onclick = handleLogout;

                    authAction.href = 'login.html';
                    authAction.title = 'Log in';
                    authIcon.className = 'fa-solid fa-right-to-bracket';
                    authText.textContent = 'LOG IN';
                    authAction.onclick = null;
                }
            }
        }

        async function handleLogout(event) {
            if (event) event.preventDefault();
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                updateProfileUI(null);
                const dropdown = document.getElementById('userDropdownMenu');
                if (dropdown) dropdown.classList.remove('open');

                console.error('Logout failed:', error);

                    updateProfileUI(newSession ? newSession.user : null);

            } catch (error) {
                console.error('Auth state initialization failed:', error);
                updateProfileUI(null);

        function executeSearch() {
            const query = document.getElementById('projectSearchInput').value.trim().toUpperCase();
            const feedback = document.getElementById('searchResultFeedback');

            if(!query) {
                feedback.textContent = "Please enter project details.";
                feedback.classList.remove('hidden');
                feedback.className = "absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-red-500 z-50";
                return;
            }

            const cards = document.querySelectorAll('#allProjectsGrid > div[data-project-code]');
            let matchCount = 0;

            cards.forEach(card => {
                const code = card.getAttribute('data-project-code') || '';
                const hoNum = card.getAttribute('data-ho-number') || '';
                const pName = card.getAttribute('data-project-name') || '';
                const org = card.getAttribute('data-org') || '';
                const donor = card.getAttribute('data-donor') || '';
                const country = card.getAttribute('data-country') || '';
                const location = card.getAttribute('data-location') || '';

                if(
                    code.toUpperCase().includes(query) ||
                    hoNum.toUpperCase().includes(query) ||
                    pName.toUpperCase().includes(query) ||
                    org.toUpperCase().includes(query) ||
                    donor.toUpperCase().includes(query) ||
                    country.toUpperCase().includes(query) ||
                    location.toUpperCase().includes(query)
                ) {
                    matchCount++;
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    card.classList.add('ring-4', 'ring-amber-500', 'scale-[1.02]');
                    setTimeout(() => {
                        card.classList.remove('ring-4', 'ring-amber-500', 'scale-[1.02]');
                    }, 3000);
                }
            });

            feedback.classList.remove('hidden');
            if(matchCount > 0) {
                feedback.className = "absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-emerald-600 font-semibold z-50";
                feedback.textContent = `Found ${matchCount} matching project(s)!`;

                setTimeout(() => {
                    document.getElementById('searchDropdownMenu').classList.remove('open');
                    document.getElementById('searchBoxWrap').classList.remove('search-open');
                    const iconGroup = document.getElementById('homeContactLoginGroup');
                    if(iconGroup) iconGroup.classList.remove('icons-pushed');
                    feedback.classList.add('hidden');

            } else {
                feedback.className = "absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-red-500 font-semibold z-50";
                feedback.textContent = `No match found for "${query}".`;
            }
        }

        function setThemeMode(mode) {
            const validModes = ['light', 'dynamic', 'dark'];
            if (!validModes.includes(mode)) mode = 'dynamic';

            const switcher = document.getElementById('themeModeSwitch');
            const buttons = document.querySelectorAll('.theme-mode-btn');
            const indexMap = { light: 0, dynamic: 1, dark: 2 };

            buttons.forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
            });

            if (switcher) {
                switcher.style.setProperty('--theme-index', indexMap[mode]);
            }

            const body = document.body;
            body.classList.add('theme-transition');
            body.classList.remove('theme-light', 'theme-dynamic', 'theme-dark', 'theme-effective-dark');
            body.classList.add('theme-' + mode);

            const prefersDark = window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches;

            const isEffectiveDark = mode === 'dark' || (mode === 'dynamic' && prefersDark);

            if (isEffectiveDark) {
                body.classList.add('theme-effective-dark');
            }

            document.documentElement.classList.toggle('dark', isEffectiveDark);

            try {
                const menuFrame = document.getElementById('menuLinksFrame');
                if (menuFrame && menuFrame.contentWindow) {
                    menuFrame.contentWindow.postMessage({ type: 'ynad-theme', dark: isEffectiveDark }, '*');
                }
            } catch (e) {}

            window.clearTimeout(window.__ynadThemeTransitionTimer);
            window.__ynadThemeTransitionTimer = window.setTimeout(function() {
                body.classList.remove('theme-transition');
            }, 500);

            try { localStorage.setItem('ynad-theme-mode', mode); } catch (e) {}
        }

        window.addEventListener('message', function(e) {
            if (!e.data || typeof e.data !== 'object') return;
            if (e.data.type === 'ynad-request-theme') {
                const isEffectiveDark = document.body.classList.contains('theme-effective-dark');
                try {
                    const menuFrame = document.getElementById('menuLinksFrame');
                    if (menuFrame && menuFrame.contentWindow && e.source === menuFrame.contentWindow) {
                        menuFrame.contentWindow.postMessage({ type: 'ynad-theme', dark: isEffectiveDark }, '*');
                    }
                } catch (err) {}
            }
        });

        (function initThemeMode() {
            let saved = 'dynamic';
            try { saved = localStorage.getItem('ynad-theme-mode') || 'dynamic'; } catch (e) {}

            document.addEventListener('DOMContentLoaded', function() {
                Promise.resolve(window.__indexHeaderReady).then(function() {
                    setThemeMode(saved);
                });

                if (window.matchMedia) {
                    const media = window.matchMedia('(prefers-color-scheme: dark)');
                    const syncDynamicTheme = function() {
                        if (document.body.classList.contains('theme-dynamic')) {
                            setThemeMode('dynamic');
                        }
                    };

                    if (media.addEventListener) {
                        media.addEventListener('change', syncDynamicTheme);
                    } else if (media.addListener) {
                        media.addListener(syncDynamicTheme);
                    }
                }
            });
        })();

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function ordinalSuffix(n) {
            const rem100 = n % 100;
            if (rem100 >= 11 && rem100 <= 13) return n + 'th';
            switch (n % 10) {
                case 1: return n + 'st';
                case 2: return n + 'nd';
                case 3: return n + 'rd';
                default: return n + 'th';
            }
        }

        function buildOngoingVideoLinksHtml(totalOngoingVideos) {
            const count = Number(totalOngoingVideos) || 0;
            if (count <= 0) return '';
            let html = '';
            for (let n = count; n >= 1; n--) {
                html += `<a href="#" onclick="return false;">${ordinalSuffix(n)} video</a>\n`;
            }
            return html;
        }

        function normalizePhotoUrls(raw) {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw.filter(Boolean);
            if (typeof raw === 'string') {
                try {
                    const parsed = JSON.parse(raw);
                    return Array.isArray(parsed) ? parsed.filter(Boolean) : [raw];
                } catch (e) {
                    return raw.includes(',') ? raw.split(',').map(s => s.trim()).filter(Boolean) : [raw];
                }
            }
            return [];
        }

        /* ================================================================
           STATUS COMPUTATION — same logic as the original project-status.html:
           derives On Time / Opening Delay / Elapsed Delay / Opening In /
           Not Started / Location Not Finalized from each project's fields.
           ================================================================ */
        const STATUS_TAB_DEFS = [
            { key: 'all',                      label: 'All' },
            { key: 'On Time',                  label: 'On Time' },
            { key: 'Opening Delay',            label: 'Opening Delay' },
            { key: 'Elapsed Delay',            label: 'Elapsed Delay' },
            { key: 'Opening In',               label: 'Opening In' },
            { key: 'Not Started',              label: 'Not Started' },
            { key: 'Location Not Finalized',   label: 'Location Not Finalized' },
        ];

        const STATUS_HEADING_TEXT = {
            all:                      'Project Status Overview',
            'On Time':                'On Time Projects',
            'Opening Delay':          'Opening Delay Projects',
            'Elapsed Delay':          'Elapsed Delay Projects',
            'Opening In':             'Upcoming Opening Projects',
            'Not Started':            'Not Started Projects',
            'Location Not Finalized': 'Location Not Finalized Projects'
        };

        function computeProjectStatus(project) {
            if (!project.location_link) return 'Location Not Finalized';
            if (!project.status) return 'Not Started';
            if (project.status === 'Completed') return 'On Time';
            if (project.status === 'Upcoming') {
                // A project whose planned opening date has already passed is delayed.
                if (project.opening_date) {
                    const openingDate = new Date(project.opening_date + 'T00:00:00');
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    if (!Number.isNaN(openingDate.getTime()) && openingDate < today) {
                        return 'Opening Delay';
                    }
                }
                return 'Opening In';
            }
            if (project.status === 'Ongoing') return 'Elapsed Delay';
            return 'Not Started';
        }

        const FILTER_TAB_TRANSITION_MS = 300;
        let pendingFilterActiveTextTimeout = null;
        let indicatorSyncTimer = null;

        function scheduleIndicatorSync(delay = 0) {
            clearTimeout(indicatorSyncTimer);
            indicatorSyncTimer = setTimeout(() => {
                requestAnimationFrame(moveFilterTabIndicator);
            }, delay);
        }

        function moveFilterTabIndicator() {
            const container = document.getElementById('filterTabsContainer');
            const indicator = document.getElementById('filterTabIndicator');
            if (!container || !indicator) return;

            const buttons = Array.from(container.querySelectorAll('.filter-tab'));
            const activeBtn = buttons.find(b => b.getAttribute('data-filter') === currentFilter);
            if (!activeBtn) return;

            buttons.forEach(b => { if (b !== activeBtn) b.classList.remove('active-text'); });

            indicator.style.width = activeBtn.offsetWidth + 'px';
            indicator.style.height = activeBtn.offsetHeight + 'px';
            indicator.style.transform = `translate(${activeBtn.offsetLeft}px, ${activeBtn.offsetTop}px)`;

            clearTimeout(pendingFilterActiveTextTimeout);
            pendingFilterActiveTextTimeout = setTimeout(() => {
                activeBtn.classList.add('active-text');
            }, FILTER_TAB_TRANSITION_MS);
        }

        function updateFilterTabCounts(nonStatusFiltered) {
            const counts = { all: nonStatusFiltered.length };
            STATUS_TAB_DEFS.forEach(t => { if (t.key !== 'all') counts[t.key] = 0; });
            nonStatusFiltered.forEach(p => {
                const s = computeProjectStatus(p);
                if (counts[s] !== undefined) counts[s]++;
            });

            const container = document.getElementById('filterTabsContainer');
            container.querySelectorAll('.filter-tab').forEach(btn => {
                const key = btn.getAttribute('data-filter');
                const count = counts[key] !== undefined ? counts[key] : 0;
                btn.querySelector('.tab-count').textContent = `(${count})`;
            });
        }

        function populateReferenceLists() {
            const countryList = document.getElementById('worldCountryList');
            if (countryList) countryList.innerHTML = WORLD_COUNTRIES.map(c => `<option value="${escapeHtml(c)}">`).join('');

            const districtList = document.getElementById('bdDistrictList');
            if (districtList) districtList.innerHTML = BD_DISTRICTS.map(d => `<option value="${escapeHtml(d)}">`).join('');
        }

        function toggleAdvFilterPanel() {
            const panel = document.getElementById('advFilterPanel');
            const label = document.getElementById('advFilterToggleLabel');
            panel.classList.toggle('open');
            label.textContent = panel.classList.contains('open') ? 'Hide Filters' : 'Show Filters';
        }

        function onCostModeChange() {
            const mode = document.getElementById('costMode').value;
            const exactWrap = document.getElementById('costExactWrap');
            const rangeWrap = document.getElementById('costRangeWrap');
            if (mode === 'exact') {
                exactWrap.classList.remove('hidden');
                rangeWrap.classList.add('hidden');
                rangeWrap.classList.remove('flex');
                document.getElementById('filterCostMin').value = '';
                document.getElementById('filterCostMax').value = '';
            } else {
                exactWrap.classList.add('hidden');
                rangeWrap.classList.remove('hidden');
                rangeWrap.classList.add('flex');
                document.getElementById('filterCostExact').value = '';
            }
            applyAdvFilters();
        }

        function onDateModeChange() {
            const mode = document.getElementById('dateMode').value;
            const exactWrap = document.getElementById('dateExactWrap');
            const rangeWrap = document.getElementById('dateRangeWrap');
            if (mode === 'exact') {
                exactWrap.classList.remove('hidden');
                rangeWrap.classList.add('hidden');
                rangeWrap.classList.remove('flex');
                document.getElementById('filterDateMin').value = '';
                document.getElementById('filterDateMax').value = '';
            } else {
                exactWrap.classList.add('hidden');
                rangeWrap.classList.remove('hidden');
                rangeWrap.classList.add('flex');
                document.getElementById('filterDateExact').value = '';
            }
            applyAdvFilters();
        }

        function resetAdvFilters() {
            ['filterCategory','filterOrganization','filterDonor','filterCountry','filterCostExact','filterCostMin',
             'filterCostMax','filterDistrict','filterDateExact','filterDateMin','filterDateMax','filterEngineer'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            document.getElementById('costMode').value = 'exact';
            document.getElementById('dateMode').value = 'exact';
            document.getElementById('costExactWrap').classList.remove('hidden');
            document.getElementById('costRangeWrap').classList.add('hidden');
            document.getElementById('costRangeWrap').classList.remove('flex');
            document.getElementById('dateExactWrap').classList.remove('hidden');
            document.getElementById('dateRangeWrap').classList.add('hidden');
            document.getElementById('dateRangeWrap').classList.remove('flex');
            applyAdvFilters();
        }

        function getNonStatusFilteredProjects() {
            const category = document.getElementById('filterCategory').value.toLowerCase();
            const organization = document.getElementById('filterOrganization').value.toLowerCase();
            const donor = document.getElementById('filterDonor').value.toLowerCase();
            const country = document.getElementById('filterCountry').value.toLowerCase();
            const district = document.getElementById('filterDistrict').value.toLowerCase();
            const engineer = document.getElementById('filterEngineer').value.toLowerCase();

            const costMode = document.getElementById('costMode').value;
            const costExact = parseFloat(document.getElementById('filterCostExact').value);
            const costMin = parseFloat(document.getElementById('filterCostMin').value);
            const costMax = parseFloat(document.getElementById('filterCostMax').value);

            const dateMode = document.getElementById('dateMode').value;
            const dateExact = document.getElementById('filterDateExact').value;
            const dateMin = document.getElementById('filterDateMin').value;
            const dateMax = document.getElementById('filterDateMax').value;

            return allProjectsData.filter(p => {
                if (category && (p.category || '').toLowerCase() !== category) return false;
                if (organization && !(p.organization || '').toLowerCase().includes(organization)) return false;
                if (donor && !(`${p.donor_name || ''} ${p.donor_id || ''}`).toLowerCase().includes(donor)) return false;
                if (country && !(p.donated_country || '').toLowerCase().includes(country)) return false;
                if (district && !(p.district || '').toLowerCase().includes(district)) return false;
                if (engineer && !(`${p.engineer_name || ''} ${p.engineer_id || ''}`).toLowerCase().includes(engineer)) return false;

                if (costMode === 'exact') {
                    if (!isNaN(costExact) && (p.cost === null || p.cost === undefined || Number(p.cost) !== costExact)) return false;
                } else {
                    if (!isNaN(costMin) && (p.cost === null || p.cost === undefined || p.cost < costMin)) return false;
                    if (!isNaN(costMax) && (p.cost === null || p.cost === undefined || p.cost > costMax)) return false;
                }

                if (dateMode === 'exact') {
                    if (dateExact && p.opening_date !== dateExact) return false;
                } else {
                    if (dateMin && (!p.opening_date || p.opening_date < dateMin)) return false;
                    if (dateMax && (!p.opening_date || p.opening_date > dateMax)) return false;
                }

                return true;
            });
        }

        function applyAdvFilters() {
            ensureFilterTabsBuilt();

            const nonStatusFiltered = getNonStatusFilteredProjects();
            updateFilterTabCounts(nonStatusFiltered);

            const finalFiltered = currentFilter === 'all'
                ? nonStatusFiltered
                : nonStatusFiltered.filter(p => computeProjectStatus(p) === currentFilter);

            renderProjectGrid(finalFiltered);
            scheduleIndicatorSync(0);
        }

        function renderProjectGrid(projects) {
            const grid = document.getElementById('allProjectsGrid');

            if (!projects || projects.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center text-center py-24 min-h-[420px] text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-4 text-slate-300"></i>
                        <span class="text-sm tracking-wide uppercase">No projects match the selected filters.</span>
                    </div>`;
                return;
            }

            grid.innerHTML = '';
            projects.forEach((project, index) => {
                grid.insertAdjacentHTML('beforeend', buildProjectCardHTML(project, index));
                cardImageIndices[index] = 0;
            });

            observeRevealTargets(grid);
        }

        async function loadAllProjects() {
            const grid = document.getElementById('allProjectsGrid');
            grid.innerHTML = '<div class="col-span-full flex items-center justify-center py-24 min-h-[420px] text-slate-400 text-sm tracking-wide uppercase">Loading projects...</div>';

            populateReferenceLists();

            const { data, error } = await supabaseClient
                .from('projects')
                .select('*')
                .order('opening_date', { ascending: false, nullsFirst: false });

            if (error) {
                console.error(error);
                grid.innerHTML = `<div class="col-span-full flex items-center justify-center py-24 min-h-[420px] text-red-500 text-sm">Failed to load projects: ${escapeHtml(error.message)}</div>`;
                return;
            }

            allProjectsData = data || [];
            applyAdvFilters();
        }

        window.addEventListener('DOMContentLoaded', () => {
            currentFilter = 'all';
            loadAllProjects();
            observeRevealTargets(document);
            Promise.resolve(window.__indexHeaderReady).then(() => initAuthState());

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => {
                    scheduleIndicatorSync(50);
                });
            }
            window.addEventListener('load', () => {
                scheduleIndicatorSync(350);
            });

            const loadingProgress = document.getElementById('pageLoadingProgress');
            const finishPageLoad = () => {
                if (!loadingProgress) return;
                loadingProgress.style.width = '100%';
                setTimeout(() => {
                    loadingProgress.style.opacity = '0';
                }, 250);
                setTimeout(() => {
                    const bar = document.getElementById('pageLoadingBar');
                    if (bar) bar.style.display = 'none';
                }, 650);
            };

            if (loadingProgress) {
                requestAnimationFrame(() => {
                    loadingProgress.style.width = '72%';
                });
            }

            if (document.readyState === 'complete') {
                finishPageLoad();
            } else {
                window.addEventListener('load', finishPageLoad, { once: true });
            }
        });
    </script>
