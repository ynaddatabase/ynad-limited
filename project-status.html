<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Status Overview — YNAD Construction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #filterPanel {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #filterPanel.open {
            grid-template-rows: 1fr;
        }
        #filterPanel > div {
            overflow: hidden;
        }

        /* FIX: explicit stacking order so tab label text always renders
           above the sliding indicator, even if the indicator is ever
           mis-measured or mid-transition. */
        #statusTabIndicator {
            z-index: 10;
        }
        .status-tab {
            z-index: 20;
        }

        .status-project-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .status-project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
        }

        .zoom-container {
            position: relative;
        }
        .zoom-wrapper {
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .zoom-wrapper::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.15);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 10;
        }
        .zoom-wrapper:hover::after {
            opacity: 1;
        }
        .zoom-wrapper img {
            transition: transform 0.3s ease-in-out;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .zoom-wrapper:hover img {
            transform: scale(1.05);
        }

        .zoom-container::before,
        .zoom-container::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border: 2px solid transparent;
            transition: width 0.3s ease, height 0.3s ease;
            pointer-events: none;
            z-index: 30;
        }
        .zoom-container::before {
            top: 8px;
            left: 8px;
        }
        .zoom-container::after {
            bottom: 8px;
            right: 8px;
        }
        .zoom-container:hover::before {
            width: 40px;
            height: 40px;
            border-top-color: #d97706;
            border-left-color: #d97706;
            border-bottom-color: transparent;
            border-right-color: transparent;
        }
        .zoom-container:hover::after {
            width: 40px;
            height: 40px;
            border-bottom-color: #d97706;
            border-right-color: #d97706;
            border-top-color: transparent;
            border-left-color: transparent;
        }

        .filter-input-caps {
            text-transform: uppercase;
        }
        .filter-input-caps::placeholder {
            text-transform: uppercase;
        }

        body {
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }
        body.page-ready {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-white text-slate-800">

    <nav class="bg-white sticky top-0 z-50 px-8 py-4 flex justify-between items-center border-b">
        <a href="index.html" class="text-2xl font-bold tracking-widest text-slate-900 uppercase">
            YNAD <span class="text-amber-600 font-light">Construction</span>
        </a>
        <a href="index.html" class="text-xs font-semibold tracking-widest uppercase text-slate-600 hover:text-amber-600 transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </nav>

    <div class="bg-slate-50 border-b px-6 py-10 text-center">
        <h1 class="text-2xl md:text-4xl font-light tracking-widest uppercase text-slate-900 mb-8">Project Status Overview</h1>

        <div id="statusTabsContainer" class="flex flex-wrap justify-center gap-3 mb-6"></div>

        <button onclick="toggleFilterPanel()" id="filterToggleBtn" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-amber-600 hover:text-amber-700 transition cursor-pointer">
            <i class="fa-solid fa-sliders"></i> <span id="filterToggleLabel">Show Filters</span>
        </button>
    </div>

    <div id="filterPanel" class="bg-white border-b">
        <div>
            <div class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Category</label>
                    <select id="filterCategory" onchange="applyFilters()" class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500 bg-white">
                        <option value="">All Categories</option>
                        <option value="Masjid">Masjid</option>
                        <option value="Madrasa">Madrasa</option>
                        <option value="Markaz">Markaz</option>
                        <option value="Orphanage">Orphanage</option>
                        <option value="Ablution">Ablution</option>
                        <option value="Water Well">Water Well</option>
                        <option value="Clinic">Clinic</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Organization</label>
                    <input type="text" id="filterOrganization" onkeyup="applyFilters()" placeholder="ORGANIZATION NAME" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Donor Name / ID</label>
                    <input type="text" id="filterDonor" onkeyup="applyFilters()" placeholder="Name or ID" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Donated Country</label>
                    <input type="text" id="filterCountry" list="worldCountryList" onkeyup="applyFilters()" onchange="applyFilters()" placeholder="Enter country name" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                    <datalist id="worldCountryList"></datalist>
                </div>

                <div class="sm:col-span-2">
                    <div class="flex items-center gap-1.5 mb-1.5">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Cost</label>
                        <div class="relative inline-flex items-center">
                            <select id="costMode" onchange="onCostModeChange()" class="appearance-none bg-transparent text-[10px] font-normal uppercase tracking-wide text-slate-500 pr-3.5 cursor-pointer focus:outline-none">
                                <option value="exact" selected>Exact Cost</option>
                                <option value="range">Cost Range</option>
                            </select>
                            <i class="fa-solid fa-chevron-down text-[6px] text-slate-400 absolute right-0 pointer-events-none"></i>
                        </div>
                    </div>
                    <div id="costExactWrap">
                        <input type="number" id="filterCostExact" onchange="applyFilters()" placeholder="750000" class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                    </div>
                    <div id="costRangeWrap" class="hidden items-center gap-2">
                        <input type="number" id="filterCostMin" onchange="applyFilters()" placeholder="500000" class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                        <span class="text-slate-400 text-xs">—</span>
                        <input type="number" id="filterCostMax" onchange="applyFilters()" placeholder="1800000" class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">BD District</label>
                    <input type="text" id="filterDistrict" list="bdDistrictList" onkeyup="applyFilters()" onchange="applyFilters()" placeholder="Enter district name" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                    <datalist id="bdDistrictList"></datalist>
                </div>

                <div class="sm:col-span-2 lg:col-span-2">
                    <div class="flex items-center gap-1.5 mb-1.5">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Date</label>
                        <div class="relative inline-flex items-center">
                            <select id="dateMode" onchange="onDateModeChange()" class="appearance-none bg-transparent text-[10px] font-normal uppercase tracking-wide text-slate-500 pr-3.5 cursor-pointer focus:outline-none">
                                <option value="exact" selected>Exact Date</option>
                                <option value="range">Date Range</option>
                            </select>
                            <i class="fa-solid fa-chevron-down text-[6px] text-slate-400 absolute right-0 pointer-events-none"></i>
                        </div>
                    </div>
                    <div id="dateExactWrap">
                        <input type="date" id="filterDateExact" onchange="applyFilters()" class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                    </div>
                    <div id="dateRangeWrap" class="hidden items-center gap-2">
                        <input type="date" id="filterDateMin" onchange="applyFilters()" class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                        <span class="text-slate-400 text-xs">—</span>
                        <input type="date" id="filterDateMax" onchange="applyFilters()" class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Engineer Name / ID</label>
                    <input type="text" id="filterEngineer" onkeyup="applyFilters()" placeholder="Name or ID" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                </div>

                <div class="flex items-end">
                    <button onclick="resetFilters()" class="text-xs font-semibold uppercase tracking-wider text-slate-500 hover:text-amber-600 transition cursor-pointer flex items-center gap-1.5">
                        <i class="fa-solid fa-rotate-left"></i> Reset Filters
                    </button>
                </div>

            </div>
        </div>
    </div>

    <section class="max-w-7xl mx-auto px-6 py-12">
        <div id="statusResultsWrapper" class="transition-all duration-300 ease-out">
            <div id="statusProjectGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="col-span-full text-center py-16 text-slate-400 text-sm tracking-wide uppercase">Loading projects...</div>
            </div>
            <div id="statusEmptyState" class="hidden col-span-full text-center py-16 text-slate-400 text-sm tracking-wide uppercase">
                No projects match the selected filters.
            </div>
        </div>
    </section>

    <footer class="bg-slate-900 text-slate-400 py-6 px-6 border-t border-slate-800">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2 text-[11px] tracking-wide">
            <span id="footerDevCredit">Developed by <a href="#" class="text-amber-500 hover:text-amber-400 transition">Your Company Name</a></span>
            <span id="footerCopyright">&copy; <span id="footerYear"></span> YNAD Construction. All rights reserved.</span>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://zjbvnwawdgdncthktqtx.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_KLOwVeJVKzC8Lo2slNnH0A_PdhW5BlT';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        document.getElementById('footerYear').textContent = new Date().getFullYear();

        const STATUS_STYLES = {
            'On Time':                 { bg: '#dcfce7', text: '#15803d' },
            'Opening Delay':           { bg: '#fef3c7', text: '#b45309' },
            'Elapsed Delay':           { bg: '#fee2e2', text: '#b91c1c' },
            'Opening In':              { bg: '#ede9fe', text: '#6d28d9' },
            'Not Started':             { bg: '#f1f5f9', text: '#475569' },
            'Location Not Finalized':  { bg: '#cffafe', text: '#0e7490' },
        };

        const STATUS_SHORT = {
            'On Time':                'OT',
            'Opening Delay':          'OD',
            'Elapsed Delay':          'ED',
            'Opening In':             'OI',
            'Not Started':            'NS',
            'Location Not Finalized': 'LNF',
        };

        const STATUS_TAB_DEFS = [
            { key: 'all',                      label: 'All' },
            { key: 'On Time',                  label: 'On Time' },
            { key: 'Opening Delay',            label: 'Opening Delay' },
            { key: 'Elapsed Delay',            label: 'Elapsed Delay' },
            { key: 'Opening In',               label: 'Opening In' },
            { key: 'Not Started',              label: 'Not Started' },
            { key: 'Location Not Finalized',   label: 'Location Not Finalized' },
        ];

        function computeProjectStatus(project) {
            if (!project.location_link) return 'Location Not Finalized';
            if (!project.status) return 'Not Started';
            if (project.status === 'Completed') return 'On Time';
            if (project.status === 'Upcoming') return 'Opening In';
            if (project.status === 'Ongoing') return 'Elapsed Delay';
            return 'Not Started';
        }

        const WORLD_COUNTRIES = [
            "Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia",
            "Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium",
            "Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria",
            "Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon","Canada","Central African Republic","Chad",
            "Chile","China","Colombia","Comoros","Congo (Brazzaville)","Congo (DRC)","Costa Rica","Croatia","Cuba",
            "Cyprus","Czechia","Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt","El Salvador",
            "Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia",
            "Georgia","Germany","Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti",
            "Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy",
            "Ivory Coast","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kosovo","Kuwait","Kyrgyzstan",
            "Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg",
            "Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius",
            "Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar",
            "Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea",
            "North Macedonia","Norway","Oman","Pakistan","Palau","Palestine","Panama","Papua New Guinea","Paraguay",
            "Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Rwanda","Saint Kitts and Nevis",
            "Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino","Sao Tome and Principe",
            "Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia",
            "Solomon Islands","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan",
            "Suriname","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Timor-Leste",
            "Togo","Tonga","Trinidad and Tobago","Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine",
            "United Arab Emirates","United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu",
            "Vatican City","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"
        ];

        const BD_DISTRICTS = [
            "Bagerhat","Bandarban","Barguna","Barishal","Bhola","Bogura","Brahmanbaria","Chandpur","Chattogram",
            "Chuadanga","Cox's Bazar","Cumilla","Dhaka","Dinajpur","Faridpur","Feni","Gaibandha","Gazipur",
            "Gopalganj","Habiganj","Jamalpur","Jashore","Jhalokati","Jhenaidah","Joypurhat","Khagrachhari","Khulna",
            "Kishoreganj","Kurigram","Kushtia","Lakshmipur","Lalmonirhat","Madaripur","Magura","Manikganj",
            "Meherpur","Moulvibazar","Munshiganj","Mymensingh","Naogaon","Narail","Narayanganj","Narsingdi",
            "Natore","Netrokona","Nilphamari","Noakhali","Pabna","Panchagarh","Patuakhali","Pirojpur","Rajbari",
            "Rajshahi","Rangamati","Rangpur","Satkhira","Shariatpur","Sherpur","Sirajganj","Sunamganj","Sylhet",
            "Tangail","Thakurgaon"
        ];

        function populateReferenceLists() {
            const countryList = document.getElementById('worldCountryList');
            countryList.innerHTML = WORLD_COUNTRIES.map(c => `<option value="${escapeHtml(c)}">`).join('');

            const districtList = document.getElementById('bdDistrictList');
            districtList.innerHTML = BD_DISTRICTS.map(d => `<option value="${escapeHtml(d)}">`).join('');
        }

        let allProjects = [];
        let activeTab = 'all';

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizePhotoUrls(raw) {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw.filter(Boolean);
            if (typeof raw === 'string') {
                try {
                    const parsed = JSON.parse(raw);
                    return Array.isArray(parsed) ? parsed.filter(Boolean) : [raw];
                } catch (e) {
                    return raw.includes(',') ? raw.split(',').map(s => s.trim()).filter(Boolean) : [raw];
                }
            }
            return [];
        }

        const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1590381105924-c72589b9ef3f?auto=format&fit=crop&w=600&q=80';

        const statusCardImageIndices = {};
        function changeStatusCardImage(cardId, direction) {
            const slider = document.getElementById('statusCardImages-' + cardId);
            if (!slider) return;
            const totalImages = slider.children.length;
            statusCardImageIndices[cardId] = ((statusCardImageIndices[cardId] || 0) + direction + totalImages) % totalImages;
            slider.style.transform = `translateX(-${statusCardImageIndices[cardId] * 100}%)`;
        }

        function buildStatusCardHTML(project, index) {
            const parsedPhotos = normalizePhotoUrls(project.photo_urls);
            const photos = parsedPhotos.length > 0 ? parsedPhotos : [FALLBACK_IMAGE];
            const status = computeProjectStatus(project);
            const style = STATUS_STYLES[status] || STATUS_STYLES['Not Started'];
            const shortCode = STATUS_SHORT[status] || status;

            const imagesHtml = photos.map(url => `
                <div class="zoom-wrapper flex-shrink-0 w-full h-full cursor-pointer">
                    <img src="${escapeHtml(url)}">
                </div>
            `).join('');

            const arrowsHtml = photos.length > 1 ? `
                <div class="flex gap-1">
                    <button onclick="changeStatusCardImage(${index}, -1)" class="w-5 h-5 rounded bg-amber-50 hover:bg-amber-600 hover:text-white text-amber-600 flex items-center justify-center transition text-[9px] cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                    <button onclick="changeStatusCardImage(${index}, 1)" class="w-5 h-5 rounded bg-amber-50 hover:bg-amber-600 hover:text-white text-amber-600 flex items-center justify-center transition text-[9px] cursor-pointer"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
            ` : '';

            return `
            <div class="status-project-card border bg-white shadow-sm overflow-hidden flex flex-col text-left">
                <div class="zoom-container relative h-44 overflow-hidden">
                    <div id="statusCardImages-${index}" class="flex h-full transition-transform duration-300">
                        ${imagesHtml}
                    </div>
                </div>
                <div class="p-4 flex-1 flex flex-col">
                    <div class="flex justify-between items-center mb-1">
                        <div class="flex items-baseline gap-2">
                            <span class="text-sm text-amber-600 font-extrabold">${escapeHtml(project.bd_number)}</span>
                            <span class="text-xs text-slate-400 font-medium">${escapeHtml(project.ho_number)}</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            ${arrowsHtml}
                            <span title="${escapeHtml(status)}" class="text-[9px] font-bold uppercase tracking-wide px-2 py-1 rounded-full" style="background:${style.bg}; color:${style.text};">${shortCode}</span>
                        </div>
                    </div>
                    <h4 class="font-bold text-sm text-slate-900 uppercase leading-snug">${escapeHtml(project.project_name)}</h4>
                    <div class="flex flex-col mt-1 space-y-0.5 flex-1">
                        ${project.organization ? `<span class="text-[11px] text-slate-700 font-bold tracking-wider uppercase">${escapeHtml(project.organization)}</span>` : ''}
                        ${project.donor_name ? `<span class="text-[11px] text-slate-500 tracking-wider uppercase">DONOR: ${escapeHtml(project.donor_name)}</span>` : ''}
                    </div>
                    <span class="text-[11px] text-slate-600 font-semibold tracking-wider uppercase text-right mt-2">${escapeHtml(project.district)}</span>
                </div>
                <div class="px-2 pb-2.5 grid grid-cols-3 gap-1 text-center text-[10px] font-semibold pt-1.5 border-t border-gray-100">
                    <a href="${project.documents_url ? escapeHtml(project.documents_url) : '#'}" target="${project.documents_url ? '_blank' : '_self'}" class="text-blue-600/70 hover:text-white hover:bg-blue-600 py-1 px-2 rounded transition flex items-center justify-center gap-1"><i class="fa-solid fa-file-lines"></i> DOCS</a>
                    <a href="${project.video_link ? escapeHtml(project.video_link) : '#'}" target="${project.video_link ? '_blank' : '_self'}" class="text-amber-600/70 hover:text-white hover:bg-amber-600 py-1 px-1 rounded transition flex items-center justify-center gap-1"><i class="fa-solid fa-video"></i> VIDEO</a>
                    <a href="${project.location_link ? escapeHtml(project.location_link) : '#'}" target="${project.location_link ? '_blank' : '_self'}" class="text-slate-700/70 hover:text-white hover:bg-slate-800 py-1 px-1 rounded transition flex items-center justify-center gap-1"><i class="fa-solid fa-location-dot"></i> MAP</a>
                </div>
            </div>`;
        }

        function setStatusTab(tab) {
            activeTab = tab;
            applyFilters();
        }

        function toggleFilterPanel() {
            const panel = document.getElementById('filterPanel');
            const label = document.getElementById('filterToggleLabel');
            panel.classList.toggle('open');
            label.textContent = panel.classList.contains('open') ? 'Hide Filters' : 'Show Filters';
        }

        function onCostModeChange() {
            const mode = document.getElementById('costMode').value;
            const exactWrap = document.getElementById('costExactWrap');
            const rangeWrap = document.getElementById('costRangeWrap');
            if (mode === 'exact') {
                exactWrap.classList.remove('hidden');
                rangeWrap.classList.add('hidden');
                rangeWrap.classList.remove('flex');
                document.getElementById('filterCostMin').value = '';
                document.getElementById('filterCostMax').value = '';
            } else {
                exactWrap.classList.add('hidden');
                rangeWrap.classList.remove('hidden');
                rangeWrap.classList.add('flex');
                document.getElementById('filterCostExact').value = '';
            }
            applyFilters();
        }

        function onDateModeChange() {
            const mode = document.getElementById('dateMode').value;
            const exactWrap = document.getElementById('dateExactWrap');
            const rangeWrap = document.getElementById('dateRangeWrap');
            if (mode === 'exact') {
                exactWrap.classList.remove('hidden');
                rangeWrap.classList.add('hidden');
                rangeWrap.classList.remove('flex');
                document.getElementById('filterDateMin').value = '';
                document.getElementById('filterDateMax').value = '';
            } else {
                exactWrap.classList.add('hidden');
                rangeWrap.classList.remove('hidden');
                rangeWrap.classList.add('flex');
                document.getElementById('filterDateExact').value = '';
            }
            applyFilters();
        }

        function resetFilters() {
            ['filterCategory','filterOrganization','filterDonor','filterCountry','filterCostExact','filterCostMin',
             'filterCostMax','filterDistrict','filterDateExact','filterDateMin','filterDateMax','filterEngineer'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('costMode').value = 'exact';
            document.getElementById('dateMode').value = 'exact';
            document.getElementById('costExactWrap').classList.remove('hidden');
            document.getElementById('costRangeWrap').classList.add('hidden');
            document.getElementById('costRangeWrap').classList.remove('flex');
            document.getElementById('dateExactWrap').classList.remove('hidden');
            document.getElementById('dateRangeWrap').classList.add('hidden');
            document.getElementById('dateRangeWrap').classList.remove('flex');
            applyFilters();
        }

        function getNonStatusFilteredProjects() {
            const category = document.getElementById('filterCategory').value.toLowerCase();
            const organization = document.getElementById('filterOrganization').value.toLowerCase();
            const donor = document.getElementById('filterDonor').value.toLowerCase();
            const country = document.getElementById('filterCountry').value.toLowerCase();
            const district = document.getElementById('filterDistrict').value.toLowerCase();
            const engineer = document.getElementById('filterEngineer').value.toLowerCase();

            const costMode = document.getElementById('costMode').value;
            const costExact = parseFloat(document.getElementById('filterCostExact').value);
            const costMin = parseFloat(document.getElementById('filterCostMin').value);
            const costMax = parseFloat(document.getElementById('filterCostMax').value);

            const dateMode = document.getElementById('dateMode').value;
            const dateExact = document.getElementById('filterDateExact').value;
            const dateMin = document.getElementById('filterDateMin').value;
            const dateMax = document.getElementById('filterDateMax').value;

            return allProjects.filter(p => {
                if (category && (p.category || '').toLowerCase() !== category) return false;
                if (organization && !(p.organization || '').toLowerCase().includes(organization)) return false;
                if (donor && !(`${p.donor_name || ''} ${p.donor_id || ''}`).toLowerCase().includes(donor)) return false;
                if (country && !(p.donated_country || '').toLowerCase().includes(country)) return false;
                if (district && !(p.district || '').toLowerCase().includes(district)) return false;
                if (engineer && !(`${p.engineer_name || ''} ${p.engineer_id || ''}`).toLowerCase().includes(engineer)) return false;

                if (costMode === 'exact') {
                    if (!isNaN(costExact) && (p.cost === null || p.cost === undefined || Number(p.cost) !== costExact)) return false;
                } else {
                    if (!isNaN(costMin) && (p.cost === null || p.cost === undefined || p.cost < costMin)) return false;
                    if (!isNaN(costMax) && (p.cost === null || p.cost === undefined || p.cost > costMax)) return false;
                }

                if (dateMode === 'exact') {
                    if (dateExact && p.opening_date !== dateExact) return false;
                } else {
                    if (dateMin && (!p.opening_date || p.opening_date < dateMin)) return false;
                    if (dateMax && (!p.opening_date || p.opening_date > dateMax)) return false;
                }

                return true;
            });
        }

        let tabButtonsBuilt = false;

        // FIX (bug 1): each tab button now carries "relative z-20" so its
        // label text always renders ABOVE #statusTabIndicator (z-index 10,
        // set in the <style> block). Previously neither element had an
        // explicit stacking order, so a stale/mis-measured indicator
        // position could visually sit on top of a tab's own text and make
        // it look invisible — this is what happened to "All" in the
        // reported bug.
        function ensureTabButtonsBuilt() {
            if (tabButtonsBuilt) return;
            const container = document.getElementById('statusTabsContainer');
            container.classList.add('relative');

            const indicatorHtml = `<div id="statusTabIndicator" class="absolute top-0 left-0 rounded-full bg-amber-600 transition-all duration-300 ease-out" style="width:0;height:0;"></div>`;
            const buttonsHtml = STATUS_TAB_DEFS.map(t => `
                <button data-status-tab="${escapeHtml(t.key)}" class="status-tab relative z-20 px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest text-slate-700 transition-colors duration-300 cursor-pointer">
                    <span class="tab-label">${escapeHtml(t.label)}</span> <span class="tab-count">(0)</span>
                </button>`).join('');

            container.innerHTML = indicatorHtml + buttonsHtml;

            container.querySelectorAll('.status-tab').forEach(btn => {
                btn.addEventListener('click', () => setStatusTab(btn.getAttribute('data-status-tab')));
            });

            window.addEventListener('resize', moveTabIndicator);
            tabButtonsBuilt = true;
        }

        const TAB_INDICATOR_TRANSITION_MS = 300;
        let pendingActiveTextTimeout = null;

        function moveTabIndicator() {
            const container = document.getElementById('statusTabsContainer');
            const indicator = document.getElementById('statusTabIndicator');
            if (!container || !indicator) return;

            const buttons = Array.from(container.querySelectorAll('.status-tab'));
            const activeBtn = buttons.find(b => b.getAttribute('data-status-tab') === activeTab);
            if (!activeBtn) return;

            buttons.forEach(b => { if (b !== activeBtn) b.classList.remove('text-white'); });

            indicator.style.width = activeBtn.offsetWidth + 'px';
            indicator.style.height = activeBtn.offsetHeight + 'px';
            indicator.style.transform = `translate(${activeBtn.offsetLeft}px, ${activeBtn.offsetTop}px)`;

            clearTimeout(pendingActiveTextTimeout);
            pendingActiveTextTimeout = setTimeout(() => {
                activeBtn.classList.add('text-white');
            }, TAB_INDICATOR_TRANSITION_MS);
        }

        function renderTabs(nonStatusFiltered) {
            ensureTabButtonsBuilt();

            const counts = { all: nonStatusFiltered.length };
            STATUS_TAB_DEFS.forEach(t => { if (t.key !== 'all') counts[t.key] = 0; });
            nonStatusFiltered.forEach(p => {
                const s = computeProjectStatus(p);
                if (counts[s] !== undefined) counts[s]++;
            });

            const container = document.getElementById('statusTabsContainer');
            container.querySelectorAll('.status-tab').forEach(btn => {
                const key = btn.getAttribute('data-status-tab');
                const count = counts[key] !== undefined ? counts[key] : 0;
                btn.querySelector('.tab-count').textContent = `(${count})`;
            });

            moveTabIndicator();
        }

        function applyFilters() {
            const nonStatusFiltered = getNonStatusFilteredProjects();
            renderTabs(nonStatusFiltered);

            const finalFiltered = activeTab === 'all'
                ? nonStatusFiltered
                : nonStatusFiltered.filter(p => computeProjectStatus(p) === activeTab);

            renderGrid(finalFiltered);
        }

        function renderGrid(projects) {
            const wrapper = document.getElementById('statusResultsWrapper');
            const grid = document.getElementById('statusProjectGrid');
            const empty = document.getElementById('statusEmptyState');

            wrapper.classList.add('opacity-0', 'translate-y-2');

            setTimeout(() => {
                Object.keys(statusCardImageIndices).forEach(k => delete statusCardImageIndices[k]);

                if (projects.length === 0) {
                    grid.innerHTML = '';
                    empty.classList.remove('hidden');
                } else {
                    empty.classList.add('hidden');
                    grid.innerHTML = projects.map((p, i) => buildStatusCardHTML(p, i)).join('');
                }

                requestAnimationFrame(() => {
                    wrapper.classList.remove('opacity-0', 'translate-y-2');
                });
            }, 180);
        }

        async function loadStatusOverview() {
            const grid = document.getElementById('statusProjectGrid');

            populateReferenceLists();

            const { data, error } = await supabaseClient
                .from('projects')
                .select('*')
                .order('opening_date', { ascending: false, nullsFirst: false });

            if (error) {
                console.error(error);
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-red-500 text-sm">Failed to load projects: ${escapeHtml(error.message)}</div>`;
                return;
            }

            allProjects = data || [];
            applyFilters();
        }

        function initPageTransitions() {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => document.body.classList.add('page-ready'));
            });

            document.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('http') || link.target === '_blank') return;
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.body.classList.remove('page-ready');
                    setTimeout(() => { window.location.href = href; }, 400);
                });
            });
        }

        window.addEventListener('DOMContentLoaded', loadStatusOverview);
        window.addEventListener('load', initPageTransitions);

        // FIX (bug 2): re-sync the sliding indicator once web fonts have
        // actually swapped in. Montserrat loads via a separate Google Fonts
        // <link>, and Tailwind loads via CDN <script> — both can finish
        // applying AFTER moveTabIndicator() first measures button
        // widths/positions (which happens as soon as Supabase data arrives).
        // If that first measurement runs before fonts swap in, the tab
        // row's layout shifts afterward and the indicator is left
        // sized/positioned for the OLD layout — which is what caused the
        // pill to appear under the wrong tab on first load / hard reload.
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                requestAnimationFrame(moveTabIndicator);
            });
        }
        window.addEventListener('load', () => {
            setTimeout(moveTabIndicator, 350);
        });
    </script>
</body>
</html>
