<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Status Overview — YNAD Construction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #filterPanel {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #filterPanel.open {
            grid-template-rows: 1fr;
        }
        #filterPanel > div {
            overflow: hidden;
        }

        /* FIX: explicit stacking order so tab label text always renders
           above the sliding indicator, even if the indicator is ever
           mis-measured or mid-transition. */
        #statusTabIndicator {
            z-index: 10;
        }
        .status-tab {
            z-index: 20;
        }

        .status-project-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .status-project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
        }

        .zoom-container {
            position: relative;
        }
        .zoom-wrapper {
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .zoom-wrapper::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.15);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 10;
        }
        .zoom-wrapper:hover::after {
            opacity: 1;
        }
        .zoom-wrapper img {
            transition: transform 0.3s ease-in-out;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .zoom-wrapper:hover img {
            transform: scale(1.05);
        }

        .zoom-container::before,
        .zoom-container::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border: 2px solid transparent;
            transition: width 0.3s ease, height 0.3s ease;
            pointer-events: none;
            z-index: 30;
        }
        .zoom-container::before {
            top: 8px;
            left: 8px;
        }
        .zoom-container::after {
            bottom: 8px;
            right: 8px;
        }
        .zoom-container:hover::before {
            width: 40px;
            height: 40px;
            border-top-color: #d97706;
            border-left-color: #d97706;
            border-bottom-color: transparent;
            border-right-color: transparent;
        }
        .zoom-container:hover::after {
            width: 40px;
            height: 40px;
            border-bottom-color: #d97706;
            border-right-color: #d97706;
            border-top-color: transparent;
            border-left-color: transparent;
        }

        .filter-input-caps,
        .filter-input-caps option {
            text-transform: uppercase;
        }
        .filter-input-caps::placeholder {
            text-transform: uppercase;
        }

        body {
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }
        body.page-ready {
            opacity: 1;
            transform: translateY(0);
        }
            /* ================================================================
           RECENT PROJECTS — matched to the supplied 4-card reference
           Desktop: 4 cards visible together
           Image/action proportions preserved from the supplied card spec
           ================================================================ */
        .recent-projects-carousel {
            position: relative;
            width: min(100%, 1700px);
            margin: 0 auto;
        }

        /* The main projects rail is controlled by JS in fixed two-card steps.
           Disable native snap so there is no snap-back / spring-like correction. */
        #mainProjectSlider {
            scroll-snap-type: none !important;
            scroll-behavior: auto !important;
            overscroll-behavior-x: contain;
        }

        .recent-project-card {
            width: calc(25% - 18px);
            min-width: calc(25% - 18px);
            height: 417.8708px;
            min-height: 417.8708px;
            flex: 0 0 calc(25% - 18px);
            scroll-snap-align: start;
            position: relative;
            overflow: visible;
            background: #ffffff;
            border: 1px solid transparent;
            box-sizing: border-box;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.10),
                        0 10px 12px -12px rgba(15, 23, 42, 0.42);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: left;
        }

        .recent-project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.14);
        }

        /* Keep the bottom edge visible even though the fixed image + content heights
           consume the card height. This does not alter the card dimensions. */
        .recent-project-card::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: -10px;
            height: 10px;
            background: transparent;
            pointer-events: none;
            z-index: 40;
            box-shadow: 0 7px 12px -10px rgba(15, 23, 42, 0.55);
        }

        .recent-project-image {
            position: relative;
            width: 100%;
            height: 299.141px;
            overflow: hidden;
            background: #e5e7eb;
            flex: 0 0 299.141px;
        }

        .recent-project-image-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .recent-project-image-track > .zoom-wrapper {
            width: 100%;
            min-width: 100%;
            height: 299.141px;
            min-height: 299.141px;
        }

        .recent-project-image-track img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .recent-project-bottom {
            width: 100%;
            height: 118.7298px;
            min-height: 118.7298px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            background: #fff;
        }

        .recent-project-info {
            height: 72px;
            min-height: 72px;
            padding: 10px 19px 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
        }

        .recent-project-info-left {
            min-width: 0;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .recent-project-title {
            margin: 0 0 2px;
            font-size: 15px;
            line-height: 20px;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: #111827;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-project-location {
            margin-top: 0;
            font-size: 11px;
            line-height: 16px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: rgba(0, 0, 0, 0.7);
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-project-code {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            line-height: 16px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }

        .recent-project-code .code-divider {
            width: 1px;
            height: 14px;
            background: rgba(0, 0, 0, 0.2);
            flex: 0 0 auto;
        }

        .recent-project-actions {
            height: 46.7298px;
            min-height: 46.7298px;
            border-top: none;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
            box-sizing: border-box;
            gap: 0;
        }

        .recent-project-action {
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 3px;
            border-radius: 4px;
            font-size: 10px;
            line-height: 1;
            font-weight: 600;
            letter-spacing: 0.015em;
            white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .recent-project-action.docs {
            color: rgba(37, 99, 235, 0.70);
        }

        .recent-project-action.docs:hover {
            color: #fff;
            background: #2563eb;
        }

        .recent-project-action.media {
            color: rgba(217, 119, 6, 0.72);
            border: none;
            background: transparent;
        }

        .recent-project-action.media:hover {
            color: #fff;
            background: #d97706;
        }

        .recent-project-action.location {
            color: rgba(71, 85, 105, 0.78);
        }

        .recent-project-action.location:hover {
            color: #fff;
            background: #334155;
        }

        /* Reference-style side arrows: simple thin chevrons, no circular button. */
        .recent-project-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #a5a5a5;
            cursor: pointer;
            z-index: 30;
            padding: 0;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .recent-project-nav:hover {
            color: #7c7c7c;
        }

        .recent-project-nav.left {
            left: -28.8px;
        }

        .recent-project-nav.right {
            right: -28.8px;
        }

        .recent-project-nav svg {
            width: 22px;
            height: 15px;
            display: block;
        }

        /* Dots: tightened to sit directly under the heading, matching the
           reference mock (small gap under "OUR RECENT PROJECTS...", not the
           large gap that used to separate them from the carousel below). */
        /* Recent Projects divider/stroke is visible only in dark mode. */
        #projects::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 1px;
            background: transparent;
            pointer-events: none;
        }
        body.theme-effective-dark #projects::before {
            background: rgba(148, 163, 184, 0.28);
        }
body.theme-effective-dark #projectLocationHeading {
    color: #f8fafc !important;
}
        .recent-project-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 6px auto 0;
        }

        .recent-project-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #d1d5db;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .recent-project-dot:hover {
            background: #a5a5a5;
        }

        .recent-project-dot.active {
            background: #4b5563;
            transform: scale(1.15);
        }


        /* ================================================================
           INDEX-MATCHED HEADER / THEME / RECENT PROJECTS
           ================================================================ */
        #mainNav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255,255,255,.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e5e7eb;
            transition: transform .35s cubic-bezier(.4,0,.2,1),
                        background-color .35s ease,
                        border-color .35s ease,
                        box-shadow .35s ease;
        }
        #mainNav.nav-hidden { transform: translateY(-100%); }
        #mainNav.nav-solid {
            background-color: #ffffff;
            border-bottom-color: #e5e7eb;
            box-shadow: 0 6px 18px rgba(15,23,42,.08);
        }
        #mainNav .nav-adaptive { color:#1b1d1d; transition:color .35s ease; }
        #mainNav .nav-adaptive-muted { color:#3a3c3c; transition:color .35s ease; }
        #mainNav .nav-icon-btn {
            background: #f1f5f9;
            border:1px solid #e2e8f0;
            transition: background-color .25s ease, color .25s ease, border-color .25s ease,
                        transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
        }
        #mainNav .nav-icon-btn:hover {
            background:#d97706; border-color:#d97706; color:#fff !important;
            transform:translateY(-3px) scale(1.08);
            box-shadow:0 8px 20px rgba(217,119,6,.35);
        }
        .theme-mode-switch {
            --theme-index:1;
            position:relative; display:flex; align-items:center; gap:2px; padding:3px;
            border:1px solid currentColor; border-radius:999px; opacity:.9;
        }
        .theme-mode-switch::before {
            content:""; position:absolute; top:3px; left:3px;
            width:28px; height:28px; border-radius:999px;
            background:#d97706;
            transform:translateX(calc(var(--theme-index) * 30px));
            transition:transform .3s cubic-bezier(.4,0,.2,1);
        }
        .theme-mode-btn {
            position:relative; z-index:1; width:28px; height:28px;
            display:flex; align-items:center; justify-content:center;
            border-radius:999px; border:none; background:transparent;
            color:inherit; opacity:.7; cursor:pointer; font-size:.72rem;
            transition:color .35s ease, opacity .25s ease, transform .25s ease;
        }
        .theme-mode-btn:hover { opacity:1; transform:scale(1.08); }
        .theme-mode-btn.active { color:#fff !important; opacity:1; }

        body.theme-light { background:#fff; color:#2a2c2c; }
        body.theme-effective-dark {
            background:#131414 !important; color:#e2e8f0 !important;
        }
        body.theme-effective-dark #mainNav,
        body.theme-effective-dark #mainNav.nav-solid {
            background:#131414 !important; border-bottom-color:#3a3c3c !important;
        }
        body.theme-effective-dark #mainNav .nav-adaptive { color:#fff !important; }
        body.theme-effective-dark #mainNav .nav-adaptive-muted { color:#c7c5c2 !important; }
        body.theme-effective-dark #mainNav .nav-icon-btn,
        body.theme-effective-dark #mainNav .theme-mode-switch {
            background:#2a2c2c; border-color:#3a3c3c;
        }
        body.theme-effective-dark .bg-white { background:#232525 !important; }
        body.theme-effective-dark .bg-slate-50 { background:#232525 !important; }
        body.theme-effective-dark .text-slate-900,
        body.theme-effective-dark .text-slate-800,
        body.theme-effective-dark .text-slate-700,
        body.theme-effective-dark .text-gray-900,
        body.theme-effective-dark .text-gray-800 {
            color:#fff !important;
        }
        body.theme-effective-dark .text-slate-600,
        body.theme-effective-dark .text-slate-500,
        body.theme-effective-dark .text-slate-400 {
            color:#c7c5c2 !important;
        }
        body.theme-effective-dark .border-slate-100,
        body.theme-effective-dark .border-slate-200,
        body.theme-effective-dark .border-slate-300 {
            border-color:#3a3c3c !important;
        }
        body.theme-transition,
        body.theme-transition * {
            transition-property:color,background-color,border-color,fill,stroke !important;
            transition-duration:.45s !important;
            transition-timing-function:ease !important;
        }
        .overview-recent-section {
            position:relative;
            padding:48px 0 64px;
            background:#fff;
            text-align:center;
        }
        body.theme-effective-dark .overview-recent-section { background:#131414; }
        .overview-recent-section::before {
            content:""; position:absolute; left:0; right:0; top:0; height:1px;
            background:transparent;
        }
        body.theme-effective-dark .overview-recent-section::before {
            background:rgba(148,163,184,.28);
        }
        .overview-recent-section h2 {
            color:rgba(0,0,0,.7);
            margin:0 0 calc(.75rem + .3in);
        }
        body.theme-effective-dark .overview-recent-section h2 { color:#fff !important; }

        #overviewRecentSlider {
            scroll-snap-type:none !important;
            scroll-behavior:auto !important;
            overscroll-behavior-x:contain;
        }
        @media (max-width:900px) {
            #overviewRecentSlider .recent-project-card { width:calc(50% - 12px); min-width:calc(50% - 12px); flex-basis:calc(50% - 12px); }
        }
        @media (max-width:560px) {
            #overviewRecentSlider .recent-project-card { width:100%; min-width:100%; flex-basis:100%; }
        }

        /* Scroll-triggered fade-in, sliding left -> right into place */
        .reveal-fade-left {
            opacity: 0;
            transform: translateX(-40px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .reveal-fade-left.revealed {
            opacity: 1;
            transform: translateX(0);
        }

        @media (max-width: 1200px) {

            transform-origin: left center;
            transition: transform 0.3s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .nav-graph-link:hover::after {
            transform: scaleX(1);
        }

        /* MEDIA dropdown (card bottom bar): click opens OPENING / ONGOING /
           PROPOSAL list; hovering (or clicking, for touch devices) any of
           those rows flies out its VIDEO/RAW PHOTO/RAW VIDEO submenu to the
           right. */
        .media-menu-wrap { position: relative; }

        .media-menu {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, .18);
            min-width: 140px;
            padding: 6px;
            z-index: 60;
            text-align: left;
        }
        .media-menu.hidden { display: none; }

        .media-menu-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 9px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .04em;
            color: #334155;
            border-radius: 5px;
            cursor: default;
            transition: background .15s ease, color .15s ease;
        }
        .media-menu-item:hover,
        .media-menu-item.open {
            background: #fffbeb;
            color: #b45309;
        }
        .media-menu-item i {
            font-size: 8px;
            color: #94a3b8;
        }
        .media-menu-item:hover i,
        .media-menu-item.open i {
            color: #d97706;
        }

        .media-submenu {
            position: absolute;
            left: calc(100% + 6px);
            top: -6px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, .18);
            min-width: 120px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 1px;
            z-index: 61;
        }
        .media-menu-item:hover .media-submenu,
        .media-menu-item.open .media-submenu {
            display: flex;
        }
        /* If the submenu would run off the right edge of the viewport, this
           class (applied by JS at open-time) flips it to fly out to the
           LEFT of the row instead, so it's never cut off. */
        .media-submenu.flip-left {
            left: auto;
            right: calc(100% + 6px);
        }
        .media-submenu a {
            display: block;
            padding: 6px 9px;
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: .03em;
            color: #475569;
            border-radius: 5px;
            text-decoration: none;
            white-space: nowrap;
            transition: background .15s ease, color .15s ease;
        }
        .media-submenu a:hover {
            background: #d97706;
            color: #fff;
        }
    </style>
</head>
<body class="bg-white text-slate-800">

    <nav id="mainNav" class="px-8 py-4 flex justify-between items-center nav-solid">
        <a href="index.html" class="flex items-center gap-4">
            <div class="text-2xl font-bold tracking-widest nav-adaptive uppercase">
                YNAD <span class="text-amber-500 font-light">Construction</span>
            </div>
        </a>
        <div class="flex items-center gap-3 md:gap-4">
            <a href="index.html" title="Home" class="nav-icon-btn nav-adaptive w-10 h-10 rounded-full flex items-center justify-center cursor-pointer">
                <i class="fa-solid fa-house text-sm"></i>
            </a>
            <a href="all-projects.html" title="All Projects" class="nav-icon-btn nav-adaptive w-10 h-10 rounded-full flex items-center justify-center cursor-pointer">
                <i class="fa-solid fa-layer-group text-sm"></i>
            </a>
            <div id="themeModeSwitch" class="theme-mode-switch nav-adaptive" role="group" aria-label="Theme mode">
                <button type="button" class="theme-mode-btn" data-mode="light" onclick="setThemeMode('light')" title="Light mode"><i class="fa-solid fa-sun"></i></button>
                <button type="button" class="theme-mode-btn active" data-mode="dynamic" onclick="setThemeMode('dynamic')" title="Dynamic mode"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <button type="button" class="theme-mode-btn" data-mode="dark" onclick="setThemeMode('dark')" title="Dark mode"><i class="fa-solid fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <div class="bg-slate-50 border-b px-6 py-10 text-center">
        <h1 class="text-2xl md:text-4xl font-light tracking-widest uppercase text-slate-900 mb-8">Project Status Overview</h1>

        <div id="statusTabsContainer" class="flex flex-wrap justify-center gap-3 mb-6"></div>

        <button onclick="toggleFilterPanel()" id="filterToggleBtn" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-amber-600 hover:text-amber-700 transition cursor-pointer">
            <i class="fa-solid fa-sliders"></i> <span id="filterToggleLabel">Show Filters</span>
        </button>
    </div>

    <div id="filterPanel" class="bg-white border-b">
        <div>
            <div class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Category</label>
                    <select id="filterCategory" onchange="applyFilters()" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500 bg-white">
                        <option value="">All Categories</option>
                        <option value="Masjid">Masjid</option>
                        <option value="Madrasa">Madrasa</option>
                        <option value="Markaz">Markaz</option>
                        <option value="Orphanage">Orphanage</option>
                        <option value="Ablution">Ablution</option>
                        <option value="Water Well">Water Well</option>
                        <option value="Clinic">Clinic</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1.5">Organization</label>
                    <input type="text" id="filterOrganization" onkeyup="applyFilters()" placeholder="e.g. WAMY" class="filter-input-caps w-full text-xs border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">

        function getNonStatusFilteredProjects() {
            const category = document.getElementById('filterCategory').value.toLowerCase();
            const organization = document.getElementById('filterOrganization').value.toLowerCase();
            const donor = document.getElementById('filterDonor').value.toLowerCase();
            const country = document.getElementById('filterCountry').value.toLowerCase();
            const district = document.getElementById('filterDistrict').value.toLowerCase();
            const engineer = document.getElementById('filterEngineer').value.toLowerCase();

            const costMode = document.getElementById('costMode').value;
            const costExact = parseFloat(document.getElementById('filterCostExact').value);
            const costMin = parseFloat(document.getElementById('filterCostMin').value);
            const costMax = parseFloat(document.getElementById('filterCostMax').value);

            const dateMode = document.getElementById('dateMode').value;
            const dateExact = document.getElementById('filterDateExact').value;
            const dateMin = document.getElementById('filterDateMin').value;
            const dateMax = document.getElementById('filterDateMax').value;

            return allProjects.filter(p => {
                if (category && (p.category || '').toLowerCase() !== category) return false;
                if (organization && !(p.organization || '').toLowerCase().includes(organization)) return false;
                if (donor && !(`${p.donor_name || ''} ${p.donor_id || ''}`).toLowerCase().includes(donor)) return false;
                if (country && !(p.donated_country || '').toLowerCase().includes(country)) return false;
                if (district && !(p.district || '').toLowerCase().includes(district)) return false;
                if (engineer && !(`${p.engineer_name || ''} ${p.engineer_id || ''}`).toLowerCase().includes(engineer)) return false;

                if (costMode === 'exact') {
                    if (!isNaN(costExact) && (p.cost === null || p.cost === undefined || Number(p.cost) !== costExact)) return false;
                } else {
                    if (!isNaN(costMin) && (p.cost === null || p.cost === undefined || p.cost < costMin)) return false;
                    if (!isNaN(costMax) && (p.cost === null || p.cost === undefined || p.cost > costMax)) return false;
                }

                if (dateMode === 'exact') {
                    if (dateExact && p.opening_date !== dateExact) return false;
                } else {
                    if (dateMin && (!p.opening_date || p.opening_date < dateMin)) return false;
                    if (dateMax && (!p.opening_date || p.opening_date > dateMax)) return false;
                }

                return true;
            });
        }

        let tabButtonsBuilt = false;

        // FIX (bug 1): each tab button now carries "relative z-20" so its
        // label text always renders ABOVE #statusTabIndicator (z-index 10,
        // set in the <style> block). Previously neither element had an
        // explicit stacking order, so a stale/mis-measured indicator
        // position could visually sit on top of a tab's own text and make
        // it look invisible — this is what happened to "All" in the
        // reported bug.
        function ensureTabButtonsBuilt() {
            if (tabButtonsBuilt) return;
            const container = document.getElementById('statusTabsContainer');
            container.classList.add('relative');

            const indicatorHtml = `<div id="statusTabIndicator" class="absolute top-0 left-0 rounded-full bg-amber-600 transition-all duration-300 ease-out" style="width:0;height:0;"></div>`;
            const buttonsHtml = STATUS_TAB_DEFS.map(t => `
                <button data-status-tab="${escapeHtml(t.key)}" class="status-tab relative z-20 px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest text-slate-700 transition-colors duration-300 cursor-pointer">
                    <span class="tab-label">${escapeHtml(t.label)}</span> <span class="tab-count">(0)</span>
                </button>`).join('');

            container.innerHTML = indicatorHtml + buttonsHtml;

            container.querySelectorAll('.status-tab').forEach(btn => {
                btn.addEventListener('click', () => setStatusTab(btn.getAttribute('data-status-tab')));
            });

            window.addEventListener('resize', moveTabIndicator);
            tabButtonsBuilt = true;
        }

        const TAB_INDICATOR_TRANSITION_MS = 300;
        let pendingActiveTextTimeout = null;

        function moveTabIndicator() {
            const container = document.getElementById('statusTabsContainer');
            const indicator = document.getElementById('statusTabIndicator');
            if (!container || !indicator) return;

            const buttons = Array.from(container.querySelectorAll('.status-tab'));
            const activeBtn = buttons.find(b => b.getAttribute('data-status-tab') === activeTab);
            if (!activeBtn) return;

            buttons.forEach(b => { if (b !== activeBtn) b.classList.remove('text-white'); });

            indicator.style.width = activeBtn.offsetWidth + 'px';
            indicator.style.height = activeBtn.offsetHeight + 'px';
            indicator.style.transform = `translate(${activeBtn.offsetLeft}px, ${activeBtn.offsetTop}px)`;

            clearTimeout(pendingActiveTextTimeout);
            pendingActiveTextTimeout = setTimeout(() => {
                activeBtn.classList.add('text-white');
            }, TAB_INDICATOR_TRANSITION_MS);
        }

        function renderTabs(nonStatusFiltered) {
            ensureTabButtonsBuilt();

            const counts = { all: nonStatusFiltered.length };
            STATUS_TAB_DEFS.forEach(t => { if (t.key !== 'all') counts[t.key] = 0; });
            nonStatusFiltered.forEach(p => {
                const s = computeProjectStatus(p);
                if (counts[s] !== undefined) counts[s]++;
            });

            const container = document.getElementById('statusTabsContainer');
            container.querySelectorAll('.status-tab').forEach(btn => {
                const key = btn.getAttribute('data-status-tab');
                const count = counts[key] !== undefined ? counts[key] : 0;
                btn.querySelector('.tab-count').textContent = `(${count})`;
            });

            moveTabIndicator();
        }

        function applyFilters() {
            const nonStatusFiltered = getNonStatusFilteredProjects();
            renderTabs(nonStatusFiltered);

            const finalFiltered = activeTab === 'all'
                ? nonStatusFiltered
                : nonStatusFiltered.filter(p => computeProjectStatus(p) === activeTab);

            renderGrid(finalFiltered);
        }

        function renderGrid(projects) {
            const wrapper = document.getElementById('statusResultsWrapper');
            const grid = document.getElementById('statusProjectGrid');
            const empty = document.getElementById('statusEmptyState');

            wrapper.classList.add('opacity-0', 'translate-y-2');

            setTimeout(() => {
                Object.keys(statusCardImageIndices).forEach(k => delete statusCardImageIndices[k]);

                if (projects.length === 0) {
                    grid.innerHTML = '';
                    empty.classList.remove('hidden');
                } else {
                    empty.classList.add('hidden');
                    grid.innerHTML = projects.map((p, i) => buildStatusCardHTML(p, i)).join('');
                }

                requestAnimationFrame(() => {
                    wrapper.classList.remove('opacity-0', 'translate-y-2');
                });
            }, 180);
        }

        async function loadStatusOverview() {
            const grid = document.getElementById('statusProjectGrid');

            populateReferenceLists();

            const { data, error } = await supabaseClient
                .from('projects')
                .select('*')
                .order('opening_date', { ascending: false, nullsFirst: false });

            if (error) {
                console.error(error);
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-red-500 text-sm">Failed to load projects: ${escapeHtml(error.message)}</div>`;
                return;
            }

            allProjects = data || [];
            window.allProjects = allProjects;
            applyFilters();
            if (window.renderOverviewRecentProjects) window.renderOverviewRecentProjects(allProjects);
        }

        function initPageTransitions() {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => document.body.classList.add('page-ready'));
            });

            document.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('http') || link.target === '_blank') return;
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.body.classList.remove('page-ready');
                    setTimeout(() => { window.location.href = href; }, 400);
                });
            });
        }

        window.addEventListener('DOMContentLoaded', loadStatusOverview);
        window.addEventListener('load', initPageTransitions);

        // FIX (bug 2): re-sync the sliding indicator once web fonts have
        // actually swapped in. Montserrat loads via a separate Google Fonts
        // <link>, and Tailwind loads via CDN <script> — both can finish
        // applying AFTER moveTabIndicator() first measures button
        // widths/positions (which happens as soon as Supabase data arrives).
        // If that first measurement runs before fonts swap in, the tab
        // row's layout shifts afterward and the indicator is left
        // sized/positioned for the OLD layout — which is what caused the
        // pill to appear under the wrong tab on first load / hard reload.
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                requestAnimationFrame(moveTabIndicator);
            });
        }
        window.addEventListener('load', () => {
            setTimeout(moveTabIndicator, 350);
        });
    </script>

<script>
(function(){
    function escapeRecentHtml(str){
        if (str === null || str === undefined) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function normalizeRecentPhotos(raw){
        if(!raw) return [];
        if(Array.isArray(raw)) return raw.filter(Boolean);
        if(typeof raw==='string'){
            try{
                const p=JSON.parse(raw);
                return Array.isArray(p)?p.filter(Boolean):[raw];
            }catch(e){
                return raw.includes(',')?raw.split(',').map(s=>s.trim()).filter(Boolean):[raw];
            }
        }
        return [];
    }
    const RECENT_FALLBACK='https://images.unsplash.com/photo-1590381105924-c72589b9ef3f?auto=format&fit=crop&w=600&q=80';
    const recentImageIndices={};
    function recentCard(project,index){
        const photos=normalizeRecentPhotos(project.photo_urls);
        const images=(photos.length?photos:[RECENT_FALLBACK]).map(url=>`<div class="zoom-wrapper flex-shrink-0 w-full h-full cursor-pointer"><img src="${escapeRecentHtml(url)}" class="project-img-item" alt="${escapeRecentHtml(project.project_name||'Project image')}" loading="lazy"></div>`).join('');
        return `
        <div id="overview-recent-card-${index}" class="recent-project-card reveal-fade-left" style="transition-delay:${Math.min(index,3)*.12}s;">
            <div class="recent-project-image zoom-container">
                <div id="overviewRecentImages-${index}" class="recent-project-image-track">${images}</div>
            </div>
            <div class="recent-project-bottom">
                <div class="recent-project-info">
                    <div class="recent-project-info-left">
                        <h4 class="recent-project-title">${escapeRecentHtml(project.project_name||'')}</h4>
                        <div class="recent-project-location">${escapeRecentHtml(project.district||'')}</div>
                    </div>
                    ${(project.bd_number||project.ho_number)?`<div class="recent-project-code">
                        ${project.bd_number?`<span>${escapeRecentHtml(project.bd_number)}</span>`:''}
                        ${(project.bd_number&&project.ho_number)?'<span class="code-divider"></span>':''}
                        ${project.ho_number?`<span>HO-${escapeRecentHtml(project.ho_number)}</span>`:''}
                    </div>`:''}
                </div>
                <div class="recent-project-actions">
                    <a href="${project.documents_url?escapeRecentHtml(project.documents_url):'#'}" target="${project.documents_url?'_blank':'_self'}" class="recent-project-action docs" ${project.documents_url?'':'onclick="return false;"'}>
                        <i class="fa-solid fa-file-lines"></i><span>DOCUMENTS</span>
                    </a>
                    <div class="media-menu-wrap relative">
                        <button type="button" onclick="toggleOverviewMediaMenu(event,${index})" class="recent-project-action media w-full cursor-pointer">
                            <i class="fa-solid fa-photo-film"></i><span>MEDIA</span>
                        </button>
                        <div id="overviewMediaMenu-${index}" class="media-menu hidden">
                            <div class="media-menu-item"><span>OPENING</span><i class="fa-solid fa-chevron-right"></i><div class="media-submenu"><a href="#" onclick="return false;">VIDEO</a><a href="#" onclick="return false;">RAW PHOTO</a><a href="#" onclick="return false;">RAW VIDEO</a></div></div>
                            <div class="media-menu-item"><span>ONGOING</span><i class="fa-solid fa-chevron-right"></i><div class="media-submenu"><a href="#" onclick="return false;">VIDEO</a><a href="#" onclick="return false;">RAW PHOTO</a><a href="#" onclick="return false;">RAW VIDEO</a></div></div>
                            <div class="media-menu-item"><span>PROPOSAL</span><i class="fa-solid fa-chevron-right"></i><div class="media-submenu"><a href="#" onclick="return false;">VIDEO</a><a href="#" onclick="return false;">RAW PHOTO</a><a href="#" onclick="return false;">RAW VIDEO</a></div></div>
                        </div>
                    </div>
                    <a href="${project.location_link?escapeRecentHtml(project.location_link):'#'}" target="${project.location_link?'_blank':'_self'}" class="recent-project-action location" ${project.location_link?'':'onclick="return false;"'}>
                        <i class="fa-solid fa-location-dot"></i><span>LOCATION</span>
                    </a>
                </div>
            </div>
        </div>`;
    }

    function toggleOverviewMediaMenu(event,index){
        event.stopPropagation();
        const menu=document.getElementById('overviewMediaMenu-'+index);
        if(!menu) return;
        const wasOpen=!menu.classList.contains('hidden');
        document.querySelectorAll('#overviewRecentProjects .media-menu').forEach(m=>m.classList.add('hidden'));
        menu.classList.toggle('hidden',wasOpen);
    }
    window.toggleOverviewMediaMenu=toggleOverviewMediaMenu;

    document.addEventListener('click',function(e){
        const item=e.target.closest('#overviewRecentProjects .media-menu-item');
        if(item && !e.target.closest('.media-submenu')){
            e.stopPropagation();
            item.parentElement.querySelectorAll('.media-menu-item.open').forEach(x=>{if(x!==item)x.classList.remove('open');});
            item.classList.toggle('open');
        }else if(!e.target.closest('#overviewRecentProjects .media-menu')){
            document.querySelectorAll('#overviewRecentProjects .media-menu').forEach(m=>m.classList.add('hidden'));
        }
    });

    function updateRecentDots(){
        const slider=document.getElementById('overviewRecentSlider'), dots=document.getElementById('overviewRecentDots');
        if(!slider||!dots) return;
        const cards=slider.querySelectorAll('.recent-project-card');
        if(!cards.length) return;
        dots.innerHTML='';
        for(let i=0;i<3;i++){
            const d=document.createElement('button');
            d.className='recent-project-dot'+(i===1?' active':'');
            d.setAttribute('aria-label','Recent project indicator '+(i+1));
            d.addEventListener('click',()=> {
                const card=slider.querySelector('.recent-project-card');
                if(!card) return;
                const gap=parseFloat(getComputedStyle(slider).gap||'24')||24;
                const step=card.getBoundingClientRect().width+gap;
                const target=i===1?0:(i===2?step*2:step*4);
                slider.scrollTo({left:Math.min(target,slider.scrollWidth-slider.clientWidth),behavior:'smooth'});
            });
            dots.appendChild(d);
        }
        slider.addEventListener('scroll',function(){
            const card=slider.querySelector('.recent-project-card');
            if(!card) return;
            const gap=parseFloat(getComputedStyle(slider).gap||'24')||24;
            const step=card.getBoundingClientRect().width+gap;
            const group=Math.max(0,Math.round((slider.scrollLeft/Math.max(step,1))/2));
            const active=(group+1)%3;
            dots.querySelectorAll('.recent-project-dot').forEach((d,j)=>d.classList.toggle('active',j===active));
        },{passive:true});
    }

    let overviewRecentAnim=null;
    function scrollOverviewRecent(direction){
        const slider=document.getElementById('overviewRecentSlider');
        if(!slider) return;
        const card=slider.querySelector('.recent-project-card');
        if(!card) return;
        const gap=parseFloat(getComputedStyle(slider).gap||'24')||24;
        const step=card.getBoundingClientRect().width+gap;
        const target=Math.max(0,Math.min(slider.scrollWidth-slider.clientWidth,slider.scrollLeft+(direction==='left'?-step*2:step*2)));
        const start=slider.scrollLeft, dist=target-start, duration=950, startTime=performance.now();
        if(overviewRecentAnim) cancelAnimationFrame(overviewRecentAnim);
        function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
        function frame(now){
            const t=Math.min((now-startTime)/duration,1);
            slider.scrollLeft=start+dist*ease(t);
            if(t<1) overviewRecentAnim=requestAnimationFrame(frame); else overviewRecentAnim=null;
        }
        overviewRecentAnim=requestAnimationFrame(frame);
    }
    window.scrollOverviewRecent=scrollOverviewRecent;

    window.renderOverviewRecentProjects=function(projects){
        const slider=document.getElementById('overviewRecentSlider');
        if(!slider) return;
        const recent=(projects||[]).slice(0,12);
        slider.innerHTML=recent.length?recent.map((p,i)=>recentCard(p,i)).join(''):
            '<div class="w-full text-center py-16 text-slate-400 text-sm tracking-wide uppercase">No projects yet.</div>';
        recent.forEach((p,i)=>recentImageIndices[i]=0);
        updateRecentDots();
        const targets=slider.querySelectorAll('.reveal-fade-left');
        if('IntersectionObserver' in window){
            const obs=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('revealed');obs.unobserve(entry.target);}}),{threshold:.12});
            targets.forEach(t=>obs.observe(t));
        }else targets.forEach(t=>t.classList.add('revealed'));
    };

    window.changeOverviewRecentImage=function(index,direction){
        const slider=document.getElementById('overviewRecentImages-'+index);
        if(!slider) return;
        const total=slider.children.length;
        recentImageIndices[index]=((recentImageIndices[index]||0)+direction+total)%total;
        slider.style.transform=`translateX(-${recentImageIndices[index]*100}%)`;
    };

    window.setThemeMode=function(mode){
        const valid=['light','dynamic','dark']; if(!valid.includes(mode)) mode='dynamic';
        const indexMap={light:0,dynamic:1,dark:2};
        const switcher=document.getElementById('themeModeSwitch');
        document.querySelectorAll('.theme-mode-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===mode));
        if(switcher) switcher.style.setProperty('--theme-index',indexMap[mode]);
        const body=document.body;
        body.classList.add('theme-transition');
        body.classList.remove('theme-light','theme-dynamic','theme-dark','theme-effective-dark');
        body.classList.add('theme-'+mode);
        const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark=mode==='dark'||(mode==='dynamic'&&prefersDark);
        if(isDark) body.classList.add('theme-effective-dark');
        document.documentElement.classList.toggle('dark',isDark);
        clearTimeout(window.__overviewThemeTimer);
        window.__overviewThemeTimer=setTimeout(()=>body.classList.remove('theme-transition'),500);
        try{localStorage.setItem('ynad-theme-mode',mode);}catch(e){}
    };

    function initOverviewTheme(){
        let saved='dynamic'; try{saved=localStorage.getItem('ynad-theme-mode')||'dynamic';}catch(e){}
        setThemeMode(saved);
        if(window.matchMedia){
            const media=window.matchMedia('(prefers-color-scheme: dark)');
            const sync=()=>{if(document.body.classList.contains('theme-dynamic'))setThemeMode('dynamic');};
            if(media.addEventListener) media.addEventListener('change',sync); else if(media.addListener) media.addListener(sync);
        }
    }

    function initOverviewNav(){
        const nav=document.getElementById('mainNav');
        if(!nav)return;
        let lastY=window.scrollY;
        window.addEventListener('scroll',()=>{
            const y=window.scrollY;
            if(y<=8){nav.classList.remove('nav-hidden');}
            else if(y>lastY+5){nav.classList.add('nav-hidden');}
            else if(y<lastY-5){nav.classList.remove('nav-hidden');}
            if(y>12) nav.classList.add('nav-solid'); else nav.classList.add('nav-solid');
            lastY=y;
        },{passive:true});
    }

    const recentWait=setInterval(()=>{
        if(Array.isArray(window.allProjects)){
            clearInterval(recentWait);
            window.renderOverviewRecentProjects(window.allProjects);
        }
    },200);
    window.addEventListener('beforeunload',()=>clearInterval(recentWait));
    document.addEventListener('DOMContentLoaded',initOverviewTheme);
    window.addEventListener('load',initOverviewNav);
})();
</script>

</body>
