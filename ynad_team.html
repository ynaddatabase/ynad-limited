<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YNAD Team | YNAD Construction</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',sans-serif;overflow-x:hidden;background:#fff;color:#1e293b}

/* ---------- loading bar + shared header ---------- */
#pageLoadingBar{position:fixed;top:0;left:0;right:0;height:3px;z-index:99999;pointer-events:none;overflow:hidden}
#pageLoadingProgress{width:8%;height:100%;background:linear-gradient(90deg,#b45309,#d97706,#f59e0b,#d97706,#b45309);box-shadow:0 0 10px rgba(217,119,6,.7);transition:width .45s ease,opacity .35s ease}
#mainNav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(0,0,0,.48);border-bottom:1px solid rgba(255,255,255,.1);transition:transform .35s cubic-bezier(.4,0,.2,1),background-color .35s,border-color .35s,box-shadow .35s}
#mainNav.nav-hidden{transform:translateY(-100%)}
#mainNav.nav-solid{background:#fff;border-bottom-color:#e5e7eb;box-shadow:0 6px 18px rgba(15,23,42,.08)}
#mainNav .nav-adaptive{color:#fff;transition:color .35s}
#mainNav.nav-solid .nav-adaptive{color:#1b1d1d}
#mainNav .nav-adaptive-muted{color:rgba(255,255,255,.85);transition:color .35s}
#mainNav.nav-solid .nav-adaptive-muted{color:#3a3c3c}
#mainNav .nav-icon-btn{background:rgba(255,255,255,.1);border:1px solid transparent;transition:background-color .25s,color .25s,border-color .25s,transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
#mainNav.nav-solid .nav-icon-btn{background:#f1f5f9;border-color:#e2e8f0}
#mainNav .nav-icon-btn:hover{background:#d97706;border-color:#d97706;color:#fff!important;transform:translateY(-3px) scale(1.08);box-shadow:0 8px 20px rgba(217,119,6,.35)}
#mainNav #searchIconBtn:hover{transform:scale(1.05)}
#userProfileBtn{background:#fff;color:#64748b;border-color:#d97706}
#userProfileBtn.is-authenticated{background:transparent}
#userProfileBtn img{display:block;width:100%;height:100%;object-fit:cover}
#userProfileBtn .profile-fallback-icon{font-size:15px;line-height:1}
#userProfileBtn .profile-fallback-icon[hidden],#userProfileBtn img[hidden]{display:none!important}
#userDropdownMenu .profile-avatar-large{background:#fff;color:#64748b}
#userDropdownMenu .profile-user-name{color:#1b1d1d}
#userDropdownMenu .profile-user-email{color:#64748b}
#userDropdownMenu .auth-action{background:#fff;color:#55575a;border:1px solid #e2e8f0}
#userDropdownMenu .auth-action:hover{background:#d97706;color:#fff;border-color:#d97706}
.hamburger-icon{transition:transform .2s cubic-bezier(.4,0,.2,1);display:inline-block}
.hamburger-icon.clicked{transform:scale(1.25)}
#pageContentWrapper{transition:filter .6s ease-in-out}
#pageContentWrapper.blurred{filter:blur(6px);pointer-events:none}
#menuOverlay{position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-end;background:rgba(0,0,0,.4);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;pointer-events:none}
#menuOverlay.open{opacity:1;visibility:visible;pointer-events:auto}
#menuBox{transform:translateX(100%);transition:transform .7s cubic-bezier(.16,1,.3,1)}
#menuOverlay.open #menuBox{transform:translateX(0)}
#settingsDropdownMenu,#userDropdownMenu{opacity:0;visibility:hidden;transform:translateY(12px) scale(.96);transition:all .25s cubic-bezier(.16,1,.3,1);pointer-events:none}
#settingsDropdownMenu.open,#userDropdownMenu.open{opacity:1;visibility:visible;transform:none;pointer-events:auto}
#settingsDropdownMenu a{transition:background-color .22s,color .22s}
#settingsDropdownMenu a:hover{background:#d97706!important;color:#fff!important}
#searchBoxWrap{height:40px;padding-right:2px}
#homeContactLoginGroup{position:relative;z-index:5;will-change:transform;transition:transform .45s cubic-bezier(.4,0,.2,1)}
#homeContactLoginGroup.icons-pushed{transform:translateX(-270px)}
#searchDropdownMenu{position:absolute;right:0;top:50%;transform:translateY(-50%) translateX(12px);width:40px;height:40px;border-radius:999px;opacity:0;visibility:hidden;overflow:hidden;transition:width .4s cubic-bezier(.16,1,.3,1),opacity .3s,visibility .4s,transform .4s cubic-bezier(.16,1,.3,1);pointer-events:none;white-space:nowrap}
#searchDropdownMenu.open{right:0;width:250px;opacity:1;visibility:visible;transform:translateY(-50%);pointer-events:auto}
@media(min-width:640px){#searchDropdownMenu.open{width:270px}}
#searchDropdownMenu input{padding-right:38px}
#searchIconBtn{transition:width .3s cubic-bezier(.34,1.56,.64,1),height .3s cubic-bezier(.34,1.56,.64,1),background-color .25s,color .25s,border-color .25s,transform .3s,box-shadow .3s}
#searchBoxWrap.search-open #searchIconBtn{width:30px;height:30px;background:#d97706!important;color:#fff!important;border-color:#d97706!important;transform:translateX(-5px)}
.theme-mode-switch{--theme-index:1;position:relative;display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid transparent;transition:background-color .45s,border-color .45s}
.theme-mode-switch::before{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:999px;background:#d97706;transform:translateX(calc(var(--theme-index)*30px));transition:transform .45s cubic-bezier(.4,0,.2,1);z-index:0;pointer-events:none}
#mainNav.nav-solid .theme-mode-switch{background:#f1f5f9;border-color:#e2e8f0}
.theme-mode-btn{position:relative;z-index:1;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:none;background:transparent;color:inherit;opacity:.7;cursor:pointer;font-size:.72rem;transition:color .35s,opacity .25s,transform .25s}
.theme-mode-btn:hover{opacity:1;transform:scale(1.08)}
.theme-mode-btn.active{color:#fff!important;opacity:1}
body.theme-transition,body.theme-transition *{transition-property:color,background-color,border-color,fill,stroke!important;transition-duration:.45s!important}

/* header dark mode */
body.theme-effective-dark{background:#131414!important;color:#e2e8f0}
body.theme-effective-dark #settingsDropdownMenu,body.theme-effective-dark #userDropdownMenu,body.theme-effective-dark #searchDropdownMenu,body.theme-effective-dark #menuBox{background:#232525!important;border-color:#3a3c3c!important}
body.theme-light #settingsDropdownMenu,body.theme-light #userDropdownMenu,body.theme-light #searchDropdownMenu,body.theme-light #menuBox{background:#fff!important;border-color:#e2e8f0!important}
body.theme-effective-dark .text-slate-900,body.theme-effective-dark .text-slate-800,body.theme-effective-dark .text-slate-700,body.theme-effective-dark .text-black{color:#fff!important}
body.theme-effective-dark .text-slate-600,body.theme-effective-dark .text-slate-500,body.theme-effective-dark .text-slate-400{color:#c7c5c2!important}
body.theme-effective-dark .border-slate-100,body.theme-effective-dark .border-slate-200,body.theme-effective-dark .border-slate-300{border-color:#3a3c3c!important}
body.theme-effective-dark .bg-slate-50,body.theme-effective-dark .bg-white{background:#232525!important}
body.theme-effective-dark #searchDropdownMenu input{color:#fff!important}
body.theme-effective-dark #settingsDropdownMenu a{color:#e2e8f0!important}
body.theme-effective-dark #mainNav.nav-solid{background:#131414!important;border-bottom-color:#3a3c3c!important}
body.theme-effective-dark #mainNav.nav-solid .nav-icon-btn,body.theme-effective-dark #mainNav.nav-solid .theme-mode-switch{background:#2a2c2c!important;border-color:#3a3c3c!important}
body.theme-effective-dark #mainNav.nav-solid .nav-adaptive{color:#fff!important}
body.theme-effective-dark #userProfileBtn{background:#2a2c2c;border-color:#f59e0b;color:#c7c5c2}
body.theme-effective-dark #userDropdownMenu .profile-avatar-large{background:#2a2c2c;color:#c7c5c2}
body.theme-effective-dark #userDropdownMenu .profile-user-name{color:#fff!important}
body.theme-effective-dark #userDropdownMenu .profile-user-email{color:#a8a6a3!important}
body.theme-effective-dark #userDropdownMenu .auth-action{background:#2a2c2c;color:#c7c5c2;border-color:#3a3c3c}

/* ---------- page layout ---------- */
.pg-head{position:relative;padding:112px 24px 44px;text-align:center;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.pg-head h1{margin:0;font-size:24px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;color:rgba(0,0,0,.7);animation:headIn 1.2s cubic-bezier(.22,.61,.36,1) .25s backwards}
@keyframes headIn{from{opacity:0;transform:translateY(24px);letter-spacing:.5em;filter:blur(8px)}to{opacity:1;transform:none;letter-spacing:.2em;filter:blur(0)}}
.manage-wrap{display:none;position:absolute;top:120px;right:24px;gap:10px;align-items:center}
.manage-wrap.show{display:flex}
@media(max-width:767px){.manage-wrap{position:static;justify-content:center;margin-top:18px}}
.pg-main{padding:48px 24px 40px;min-height:40vh}
.empty{grid-column:1/-1;text-align:center;padding:96px 0;color:#94a3b8;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:44px;background:#e5e7eb}
.tools{display:none;position:absolute;top:10px;right:10px;z-index:40;gap:6px}
body.manage-on .tools{display:flex}
.tools button{width:30px;height:30px;border:0;border-radius:6px;background:rgba(15,23,42,.78);color:#fff;cursor:pointer;font-size:11px}
.tools button:hover{background:#d97706}
.tools .del:hover{background:#dc2626}
body.theme-effective-dark .pg-head{background:#131414;border-color:#2a2c2c}
body.theme-effective-dark .pg-head h1{color:#fff}

/* ---------- buttons / modal / toast ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font:700 11px 'Poppins',sans-serif;letter-spacing:.05em;text-transform:uppercase;border:1px solid #d97706;color:#d97706;background:transparent;cursor:pointer;transition:background-color .2s,color .2s}
.btn:hover,.btn.on,.btn.solid{background:#d97706;color:#fff}
.btn.solid:hover{background:#b45309;border-color:#b45309}
.btn.danger{border-color:#dc2626;color:#dc2626}
.btn.danger:hover{background:#dc2626;color:#fff}
.btn.icon{width:38px;height:38px;padding:0;justify-content:center;font-size:14px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.md-bg{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.6);backdrop-filter:blur(8px)}
.md-bg.open{display:flex;animation:mdIn .25s ease}
@keyframes mdIn{from{opacity:0}}
.md-box{width:min(640px,100%);max-height:90vh;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.3)}
.md-box.sm{width:min(400px,100%)}
.md-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:inherit;z-index:2}
.md-head h3{margin:0;font-size:18px;font-weight:600;color:#0f172a}
.md-x{width:32px;height:32px;border:0;border-radius:50%;background:#f1f5f9;color:#64748b;font-size:18px;cursor:pointer}
.md-x:hover{background:#d97706;color:#fff}
.md-body{padding:20px 24px 6px}
.md-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px 22px}
.fld{margin-bottom:16px}
.fld>label{display:flex;justify-content:space-between;margin-bottom:7px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#475569}
.fld em{font-style:normal;color:#d97706}
.fld small{font-weight:600;text-transform:none;letter-spacing:0;color:#94a3b8}
.fld input,.fld textarea,.fld select{width:100%;padding:11px 13px;border:1.5px solid #e2e8f0;border-radius:9px;font:14px/1.55 'Poppins',sans-serif;color:#0f172a;background:#fff;outline:0;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:#d97706;box-shadow:0 0 0 3px rgba(217,119,6,.15)}
.fld textarea{resize:vertical;min-height:90px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.err{display:none;color:#dc2626;font-size:12px;font-weight:500;margin:0 0 12px}
.pick{display:inline-flex;gap:8px;align-items:center;padding:9px 14px;border:1.5px dashed #cbd5e1;border-radius:9px;background:transparent;font:600 12px 'Poppins',sans-serif;color:#64748b;cursor:pointer}
.pick:hover{border-color:#d97706;color:#d97706}
.toast{position:fixed;right:24px;bottom:24px;z-index:600;padding:11px 16px;border-radius:10px;font:600 13px 'Poppins',sans-serif;color:#fff;background:#16a34a;box-shadow:0 10px 28px rgba(0,0,0,.22);opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;pointer-events:none}
.toast.show{opacity:1;transform:none}.toast.bad{background:#dc2626}
body.theme-effective-dark .md-box{background:#232525}
body.theme-effective-dark .md-head{border-color:#3a3c3c}
body.theme-effective-dark .md-head h3{color:#fff}
body.theme-effective-dark .md-x{background:#131414;color:#c7c5c2}
body.theme-effective-dark .fld>label{color:#c7c5c2}
body.theme-effective-dark .fld input,body.theme-effective-dark .fld textarea,body.theme-effective-dark .fld select{background:#131414;border-color:#3a3c3c;color:#fff}
body.theme-effective-dark .pick{border-color:#3a3c3c;color:#c7c5c2}
</style>
<style>
/* ---------- team grid (active members) ---------- */
.team-grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:36px 28px}
@media(max-width:1000px){.team-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.team-grid{grid-template-columns:repeat(2,1fr);gap:28px 16px}}
.card{position:relative;opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .6s cubic-bezier(.22,.61,.36,1)}
.card.revealed{opacity:1;transform:none}
.tphoto{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#e5e7eb;cursor:pointer;border:1.5px solid #dbe1e8;transition:border-color .3s}
.tphoto:hover{border-color:#d97706}
body.theme-effective-dark .tphoto{border-color:#3a3c3c}
.tphoto img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s cubic-bezier(.22,.61,.36,1)}
.tphoto::after{content:"";position:absolute;inset:0;background:rgba(217,119,6,.14);opacity:0;transition:opacity .3s;pointer-events:none}
.tphoto:hover img{transform:scale(1.06)}
.tphoto:hover::after{opacity:1}
.tbody{padding:14px 2px 0}
.tname{margin:0;font-size:15px;line-height:20px;font-weight:600;letter-spacing:.01em;color:#232525}
.tdesig{margin-top:3px;font-size:12.5px;font-weight:400;color:#d97706}
body.theme-effective-dark .tname{color:#fff}

/* ---------- resigned employees (auto-scroll right to left) ---------- */
.resigned{max-width:1300px;margin:0 auto;padding:30px 0 72px;display:none}
.resigned.show{display:block}
.rs-head{display:flex;align-items:center;gap:18px;max-width:1100px;margin:0 auto 30px;padding:0 24px}
.rs-head::before,.rs-head::after{content:"";flex:1;height:1px;background:#e2e8f0}
.rs-head h2{margin:0;font-size:14px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(0,0,0,.6)}
body.theme-effective-dark .rs-head::before,body.theme-effective-dark .rs-head::after{background:#3a3c3c}
body.theme-effective-dark .rs-head h2{color:#c7c5c2}
.mq{overflow:hidden;padding:22px 0 14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq-track{display:flex;width:max-content;animation:mqMove var(--dur,30s) linear infinite}
.mq:hover .mq-track,body.manage-on .mq-track{animation-play-state:paused}
@keyframes mqMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mq-group{display:flex;flex:0 0 auto;gap:34px;padding-right:34px}
.ritem{position:relative;width:118px;text-align:center;cursor:pointer}
.rphoto{position:relative;width:92px;height:92px;margin:0 auto;border-radius:50%;overflow:hidden;background:#e5e7eb;border:1.5px solid #cbd5e1;transition:border-color .3s,transform .3s}
.rphoto img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;filter:grayscale(.35)}
.rphoto .noimg{font-size:30px}
.ritem:hover .rphoto{border-color:#d97706;transform:scale(1.06)}
.ritem .tools{top:-4px;right:2px}
.ritem .tools button{width:24px;height:24px;font-size:9px;border-radius:50%}
.rname{margin-top:10px;font-size:12.5px;font-weight:600;line-height:1.3;color:#232525}
.rdesig{margin-top:2px;font-size:10.5px;color:#d97706}
body.theme-effective-dark .rname{color:#fff}
body.theme-effective-dark .rphoto{border-color:#3a3c3c}
.avatar-row{display:flex;gap:14px;align-items:center}
.avatar-prev{flex:0 0 auto;width:84px;height:104px;border-radius:8px;overflow:hidden;background:#e5e7eb;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:28px}
.avatar-prev img{width:100%;height:100%;object-fit:cover;object-position:top}
.avatar-btns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- member viewer (photo 2/3 + info 1/3) ---------- */
.tv{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s;overflow:hidden}
.tv.open{opacity:1;visibility:visible;pointer-events:auto}
.tv:focus{outline:none}
.tv-top{position:absolute;top:0;left:0;right:0;height:52px;z-index:8;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(0,0,0,.38);color:#fff}
.tv-count{font-size:13px;font-weight:500;letter-spacing:.12em;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.9)}
.tv-btn{width:38px;height:38px;border-radius:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .22s,border-color .22s,transform .22s,opacity .25s}
.tv-btn:hover{background:#d97706;border-color:#d97706}
.tv-stage{position:absolute;left:0;top:0;bottom:0;width:66.6667%;padding:76px 70px 36px;display:flex;align-items:center;justify-content:center}
.tv-img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.18)}
.tv-no{display:none;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);color:rgba(255,255,255,.35);font-size:90px;align-items:center;justify-content:center}
@keyframes tvIn{from{opacity:0;transform:translateX(var(--x,0)) scale(.82);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.tv.open .tv-img.in,.tv.open .tv-no.in{animation:tvIn .85s cubic-bezier(.22,.61,.36,1) both}
.tv-nav{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:44px;height:44px;opacity:.6;background:rgba(0,0,0,.35)}
.tv-nav:hover{opacity:1}
#tvPrev{left:16px}#tvNext{right:16px}
.tv-text{position:absolute;top:0;right:0;bottom:0;width:33.3333%;padding:90px 40px 32px 38px;overflow-y:auto;color:#fff;background:rgba(0,0,0,.3);border-left:1px solid rgba(255,255,255,.1);scrollbar-width:thin;transform:translateX(30px);opacity:0;transition:opacity .6s ease .15s,transform .8s cubic-bezier(.22,.61,.36,1) .15s}
.tv.open .tv-text{transform:none;opacity:1}
@keyframes tvUp{from{opacity:0;transform:translateY(20px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
.tv.open .tv-text .t{animation:tvUp .75s cubic-bezier(.22,.61,.36,1) both}
.tv.open .tv-text .t:nth-child(1){animation-delay:.3s}
.tv.open .tv-text .t:nth-child(2){animation-delay:.42s}
.tv.open .tv-text .t:nth-child(3){animation-delay:.54s}
.tv.open .tv-text .t:nth-child(4){animation-delay:.66s}
.tv.open .tv-text .t:nth-child(5){animation-delay:.78s}
.tvt-status{display:inline-block;margin-bottom:14px;padding:3px 11px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:rgba(34,197,94,.18);color:#4ade80}
.tvt-status.off{background:rgba(239,68,68,.18);color:#f87171}
.tvt-name{margin:0;font-size:26px;line-height:1.25;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.tvt-desig{margin-top:8px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#f59e0b}
.tvt-line{width:44px;height:2px;background:#d97706;margin:20px 0}
.tvt-desc{margin:0;font-size:14px;line-height:1.9;color:rgba(255,255,255,.82);white-space:pre-line}

/* ---------- image upload (Supabase Storage) ---------- */
async function compressImage(file) {
  const keep = { body: file, type: file.type || 'image/jpeg', ext: ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg' };
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return keep;
  try {
    const bmp = await createImageBitmap(file), s = Math.min(1, 1800 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    return blob && blob.size < file.size ? { body: blob, type: 'image/jpeg', ext: 'jpg' } : keep;
  } catch (e) { return keep; }
}
async function uploadImage(file, folder) {
  const c = await compressImage(file);
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${c.ext}`;
  const { error } = await supabaseClient.storage.from(MEDIA_BUCKET).upload(path, c.body, { contentType: c.type, cacheControl: '31536000' });
  if (error) throw error;
  return supabaseClient.storage.from(MEDIA_BUCKET).getPublicUrl(path).data.publicUrl;
}
async function removeFiles(urls) {
  const k = `/object/public/${MEDIA_BUCKET}/`;
  const paths = (urls || []).map(u => { const i = String(u || '').indexOf(k); return i < 0 ? null : decodeURIComponent(u.slice(i + k.length).split('?')[0]); }).filter(Boolean);
  if (paths.length) try { await supabaseClient.storage.from(MEDIA_BUCKET).remove(paths); } catch (e) { console.warn(e); }
}

function setThemeMode(mode) {
  if (!['light', 'dynamic', 'dark'].includes(mode)) mode = 'dynamic';
  const sw = $('themeModeSwitch'), idx = { light: 0, dynamic: 1, dark: 2 };
  document.querySelectorAll('.theme-mode-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-mode') === mode));
  if (sw) sw.style.setProperty('--theme-index', idx[mode]);
  const body = document.body; body.classList.add('theme-transition');
  body.classList.remove('theme-light', 'theme-dynamic', 'theme-dark', 'theme-effective-dark'); body.classList.add('theme-' + mode);
  const dark = mode === 'dark' || (mode === 'dynamic' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) body.classList.add('theme-effective-dark');
  document.documentElement.classList.toggle('dark', dark);

  clearTimeout(window.__ynadThemeTimer); window.__ynadThemeTimer = setTimeout(() => body.classList.remove('theme-transition'), 500);

    <button class="del" title="Delete" onclick="deleteMember('${esc(m.id)}')"><i class="fa-solid fa-trash"></i></button></div>`;
}
function cardHtml(m, i) {
  return `
  <article class="card" style="transition-delay:${(i % 4) * .08}s">
    <div class="tphoto" onclick="openViewer('${esc(m.id)}','active')">
      ${m.photo_url ? `<img src="${esc(m.photo_url)}" alt="${esc(m.name)}" loading="lazy">` : '<div class="noimg"><i class="fa-solid fa-user"></i></div>'}
      ${toolsHtml(m)}
    </div>
    <div class="tbody">
      <h3 class="tname">${esc(m.name)}</h3>
      ${m.designation ? `<div class="tdesig">${esc(m.designation)}</div>` : ''}
    </div>
  </article>`;
}
function resignedItem(m) {
  return `<div class="ritem" onclick="openViewer('${esc(m.id)}','resigned')">
    <div class="rphoto">${m.photo_url ? `<img src="${esc(m.photo_url)}" alt="${esc(m.name)}" loading="lazy">` : '<div class="noimg"><i class="fa-solid fa-user"></i></div>'}</div>
    ${toolsHtml(m)}
    <div class="rname">${esc(m.name)}</div>
    ${m.designation ? `<div class="rdesig">${esc(m.designation)}</div>` : ''}
  </div>`;
}
function renderResigned() {
  const list = resignedList(), sec = $('resignedSec');
  sec.classList.toggle('show', list.length > 0);
  if (!list.length) { $('resignedMq').innerHTML = ''; return; }
  const rep = Math.max(1, Math.ceil(10 / list.length));               /* enough items to fill the screen */
  const items = Array.from({ length: rep }).flatMap(() => list).map(resignedItem).join('');
  const dur = Math.max(24, list.length * rep * 4);
  $('resignedMq').innerHTML = `<div class="mq-track" style="--dur:${dur}s"><div class="mq-group">${items}</div><div class="mq-group" aria-hidden="true">${items}</div></div>`;
}
function render() {
  const g = $('grid'), list = activeList();
  g.innerHTML = list.length ? list.map(cardHtml).join('') : '<div class="empty">No team members added yet.</div>';
  observeCards(g); renderResigned();
}
async function load() {
  if (DEMO_MODE) { members = DEMO_MEMBERS.map(m => ({ ...m })); render(); return; }
  const { data, error } = await supabaseClient.from('team_members').select('*')
    .order('sort_order', { ascending: true }).order('created_at', { ascending: true });
  if (error) { console.error(error); $('grid').innerHTML = `<div class="empty" style="color:#ef4444">Failed to load: ${esc(error.message)}</div>`; return; }
  members = (data || []).map(m => ({ ...m, status: m.status === 'resigned' ? 'resigned' : 'active' })); render();
}

/* ================= MEMBER VIEWER (photo 2/3 + info 1/3) ================= */
let vList = [], vI = 0;
function tvShow(dir) {
  const m = vList[vI], img = $('tvImg'), no = $('tvNo');
  img.classList.remove('in'); no.classList.remove('in'); void img.offsetWidth;
  const x = dir > 0 ? '90px' : dir < 0 ? '-90px' : '0px';
  img.style.setProperty('--x', x); no.style.setProperty('--x', x);
  if (m.photo_url) { img.style.display = 'block'; no.style.display = 'none'; img.src = m.photo_url; img.alt = m.name; img.classList.add('in'); }
  else { img.style.display = 'none'; img.removeAttribute('src'); no.style.display = 'flex'; no.classList.add('in'); }
  $('tvText').innerHTML =
    `<span class="t tvt-status ${isResigned(m) ? 'off' : ''}">${isResigned(m) ? 'Ex-Employee' : 'Active'}</span>` +
    `<h2 class="t tvt-name">${esc(m.name)}</h2>` +
    (m.designation ? `<div class="t tvt-desig">${esc(m.designation)}</div>` : '<div class="t"></div>') +
    `<div class="t tvt-line"></div>` +
    (m.description ? `<p class="t tvt-desc">${esc(m.description)}</p>` : '');
  $('tvText').scrollTop = 0;
  $('tvCount').textContent = vList.length > 1 ? (vI + 1) + ' / ' + vList.length : '';
  $('tvPrev').style.display = vI <= 0 ? 'none' : 'flex';
  $('tvNext').style.display = vI >= vList.length - 1 ? 'none' : 'flex';
}
function openViewer(id, which) {
  vList = which === 'resigned' ? resignedList() : activeList();
  vI = vList.findIndex(x => x.id === id); if (vI < 0) return;
  const box = $('tv'); tvShow(0); void box.offsetWidth;
  box.classList.add('open'); box.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden';
  try { box.focus({ preventScroll: true }); } catch (e) {}
}
function closeViewer() { const b = $('tv'); b.classList.remove('open'); b.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
function tvStep(d) { const n = vI + d; if (n < 0 || n >= vList.length) return; vI = n; tvShow(d); }
(() => { let x = 0, b = $('tv');
  b.addEventListener('touchstart', e => { x = e.changedTouches[0].clientX; }, { passive: true });
  b.addEventListener('touchend', e => { if (e.target.closest('.tv-text')) return; const d = e.changedTouches[0].clientX - x; if (Math.abs(d) > 50) tvStep(d < 0 ? 1 : -1); }, { passive: true }); })();
$('tv').addEventListener('click', e => { if (e.target.id === 'tv' || e.target.id === 'tvStage') closeViewer(); });

/* keyboard: Esc closes viewer -> closes popup -> leaves manage mode ; arrows = previous / next */
document.addEventListener('keydown', e => {
  const viewerOpen = $('tv').classList.contains('open');
  if (e.key === 'Escape') {
    if (viewerOpen) { e.preventDefault(); closeViewer(); return; }
    const md = document.querySelector('.md-bg.open');
    if (md) { e.preventDefault(); closeModal(md.id); return; }
    if (manage) toggleManage();
    return;
  }
  if (!viewerOpen) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); tvStep(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); tvStep(-1); }
});

/* ---- add / edit ---- */
function descCount() { $('descCount').textContent = $('fDesc').value.length + ' / 400'; }
function showAvatar() {
  const url = editing.preview || (editing.keep ? editing.photoUrl : '');
  $('avatarPrev').innerHTML = url ? `<img src="${esc(url)}" alt="">` : '<i class="fa-solid fa-user"></i>';
  $('rmPhoto').style.display = url ? 'inline-flex' : 'none';
}
function openForm(id) {
  const m = id ? members.find(x => x.id === id) : null;
  editing = { id: m ? m.id : null, photoUrl: m ? m.photo_url : null, keep: !!(m && m.photo_url), file: null, preview: null };
  $('fName').value = m ? m.name : ''; $('fDesig').value = (m && m.designation) || ''; $('fDesc').value = (m && m.description) || '';
  $('fStatus').value = m && isResigned(m) ? 'resigned' : 'active';          /* default = Active */
  $('fOrder').value = m ? m.sort_order : members.length + 1;
  $('formTitle').textContent = m ? 'Edit Member' : 'Add Member'; $('fErr').style.display = 'none';
  descCount(); showAvatar(); openModal('formModal');
}
function pickPhoto(input) {
  const f = input.files[0]; input.value = ''; if (!f || !f.type.startsWith('image/')) return;
  editing.file = f; editing.preview = URL.createObjectURL(f); showAvatar();
}
function clearPhoto() { editing.file = null; editing.preview = null; editing.keep = false; showAvatar(); }

async function saveMember() {
  const err = $('fErr'), btn = $('saveBtn'), name = $('fName').value.trim();
  if (!name) { err.textContent = 'Name is required.'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  const status = $('fStatus').value === 'resigned' ? 'resigned' : 'active';
  if (DEMO_MODE) {
    const row = { name, designation: $('fDesig').value.trim(), description: $('fDesc').value.trim(), status,
                  photo_url: editing.preview || (editing.keep ? editing.photoUrl : null), sort_order: parseInt($('fOrder').value, 10) || members.length + 1 };
    const wasEdit = !!editing.id;
    if (wasEdit) members = members.map(m => m.id === editing.id ? { ...m, ...row } : m);
    else members.push({ id: 'demo-' + Date.now(), ...row });
    members.sort((a, b) => a.sort_order - b.sort_order);
    closeModal('formModal'); toast(wasEdit ? 'Member updated (demo)' : 'Member added (demo)'); render(); return;
  }
  btn.disabled = true;
  try {
    let url = editing.keep ? editing.photoUrl : null;
    if (editing.file) { btn.textContent = 'Uploading...'; url = await uploadImage(editing.file, 'team'); }
    btn.textContent = 'Saving...';
    const row = { name, designation: $('fDesig').value.trim() || null, description: $('fDesc').value.trim() || null, status,
                  photo_url: url, sort_order: parseInt($('fOrder').value, 10) || members.length + 1 };
    const wasEdit = !!editing.id;
    const q = wasEdit ? supabaseClient.from('team_members').update(row).eq('id', editing.id) : supabaseClient.from('team_members').insert(row);
    const { data, error } = await q.select();
    if (error) throw error;
    if (!data || !data.length) throw new Error('Not allowed - please log in again.');
    if (editing.photoUrl && editing.photoUrl !== url) await removeFiles([editing.photoUrl]);
    closeModal('formModal'); toast(wasEdit ? 'Member updated' : 'Member added'); await load();
  } catch (e) { console.error(e); err.textContent = 'Save failed - ' + (e.message || 'please try again.'); err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Save'; }
}
async function deleteMember(id) {
  const m = members.find(x => x.id === id); if (!m) return;
  if (!await askConfirm(`Delete "${m.name}" from the team? This cannot be undone.`)) return;
  if (DEMO_MODE) { members = members.filter(x => x.id !== id); render(); toast('Member deleted (demo)'); return; }
  const { data, error } = await supabaseClient.from('team_members').delete().eq('id', id).select();
  if (error || !data || !data.length) { toast('Delete failed', true); return; }
  await removeFiles([m.photo_url]); toast('Member deleted'); load();
}

if (DEMO_MODE) document.querySelector('.pg-head').insertAdjacentHTML('beforeend',
  '<p style="margin:14px 0 0;font-size:11px;color:#d97706;letter-spacing:.06em;text-transform:uppercase">Demo mode - sample data, changes are not saved</p>');
initManage(DEMO_MODE); load();
</script>
</body>
