<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YNAD Team | YNAD Construction</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',sans-serif;overflow-x:hidden;background:#fff;color:#1e293b}

/* ---------- loading bar + shared header ---------- */
#pageLoadingBar{position:fixed;top:0;left:0;right:0;height:3px;z-index:99999;pointer-events:none;overflow:hidden}
#pageLoadingProgress{width:8%;height:100%;background:linear-gradient(90deg,#b45309,#d97706,#f59e0b,#d97706,#b45309);box-shadow:0 0 10px rgba(217,119,6,.7);transition:width .45s ease,opacity .35s ease}
#mainNav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(0,0,0,.48);border-bottom:1px solid rgba(255,255,255,.1);transition:transform .35s cubic-bezier(.4,0,.2,1),background-color .35s,border-color .35s,box-shadow .35s}
#mainNav.nav-hidden{transform:translateY(-100%)}
#mainNav.nav-solid{background:#fff;border-bottom-color:#e5e7eb;box-shadow:0 6px 18px rgba(15,23,42,.08)}
#mainNav .nav-adaptive{color:#fff;transition:color .35s}
#mainNav.nav-solid .nav-adaptive{color:#1b1d1d}
#mainNav .nav-adaptive-muted{color:rgba(255,255,255,.85);transition:color .35s}
#mainNav.nav-solid .nav-adaptive-muted{color:#3a3c3c}
#mainNav .nav-icon-btn{background:rgba(255,255,255,.1);border:1px solid transparent;transition:background-color .25s,color .25s,border-color .25s,transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
#mainNav.nav-solid .nav-icon-btn{background:#f1f5f9;border-color:#e2e8f0}
#mainNav .nav-icon-btn:hover{background:#d97706;border-color:#d97706;color:#fff!important;transform:translateY(-3px) scale(1.08);box-shadow:0 8px 20px rgba(217,119,6,.35)}
#mainNav #searchIconBtn:hover{transform:scale(1.05)}
#userProfileBtn{background:#fff;color:#64748b;border-color:#d97706}
#userProfileBtn.is-authenticated{background:transparent}
#userProfileBtn img{display:block;width:100%;height:100%;object-fit:cover}
#userProfileBtn .profile-fallback-icon{font-size:15px;line-height:1}
#userProfileBtn .profile-fallback-icon[hidden],#userProfileBtn img[hidden]{display:none!important}
#userDropdownMenu .profile-avatar-large{background:#fff;color:#64748b}
#userDropdownMenu .profile-user-name{color:#1b1d1d}
#userDropdownMenu .profile-user-email{color:#64748b}
#userDropdownMenu .auth-action{background:#fff;color:#55575a;border:1px solid #e2e8f0}
#userDropdownMenu .auth-action:hover{background:#d97706;color:#fff;border-color:#d97706}
.hamburger-icon{transition:transform .2s cubic-bezier(.4,0,.2,1);display:inline-block}
.hamburger-icon.clicked{transform:scale(1.25)}
#pageContentWrapper{transition:filter .6s ease-in-out}
#pageContentWrapper.blurred{filter:blur(6px);pointer-events:none}
#menuOverlay{position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-end;background:rgba(0,0,0,.4);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;pointer-events:none}
#menuOverlay.open{opacity:1;visibility:visible;pointer-events:auto}
#menuBox{transform:translateX(100%);transition:transform .7s cubic-bezier(.16,1,.3,1)}
#menuOverlay.open #menuBox{transform:translateX(0)}
#settingsDropdownMenu,#userDropdownMenu{opacity:0;visibility:hidden;transform:translateY(12px) scale(.96);transition:all .25s cubic-bezier(.16,1,.3,1);pointer-events:none}
#settingsDropdownMenu.open,#userDropdownMenu.open{opacity:1;visibility:visible;transform:none;pointer-events:auto}
#settingsDropdownMenu a{transition:background-color .22s,color .22s}
#settingsDropdownMenu a:hover{background:#d97706!important;color:#fff!important}
#searchBoxWrap{height:40px;padding-right:2px}
#homeContactLoginGroup{position:relative;z-index:5;will-change:transform;transition:transform .45s cubic-bezier(.4,0,.2,1)}
#homeContactLoginGroup.icons-pushed{transform:translateX(-270px)}
#searchDropdownMenu{position:absolute;right:0;top:50%;transform:translateY(-50%) translateX(12px);width:40px;height:40px;border-radius:999px;opacity:0;visibility:hidden;overflow:hidden;transition:width .4s cubic-bezier(.16,1,.3,1),opacity .3s,visibility .4s,transform .4s cubic-bezier(.16,1,.3,1);pointer-events:none;white-space:nowrap}
#searchDropdownMenu.open{right:0;width:250px;opacity:1;visibility:visible;transform:translateY(-50%);pointer-events:auto}
@media(min-width:640px){#searchDropdownMenu.open{width:270px}}
#searchDropdownMenu input{padding-right:38px}
#searchIconBtn{transition:width .3s cubic-bezier(.34,1.56,.64,1),height .3s cubic-bezier(.34,1.56,.64,1),background-color .25s,color .25s,border-color .25s,transform .3s,box-shadow .3s}
#searchBoxWrap.search-open #searchIconBtn{width:30px;height:30px;background:#d97706!important;color:#fff!important;border-color:#d97706!important;transform:translateX(-5px)}
.theme-mode-switch{--theme-index:1;position:relative;display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid transparent;transition:background-color .45s,border-color .45s}
.theme-mode-switch::before{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:999px;background:#d97706;transform:translateX(calc(var(--theme-index)*30px));transition:transform .45s cubic-bezier(.4,0,.2,1);z-index:0;pointer-events:none}
#mainNav.nav-solid .theme-mode-switch{background:#f1f5f9;border-color:#e2e8f0}
.theme-mode-btn{position:relative;z-index:1;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:none;background:transparent;color:inherit;opacity:.7;cursor:pointer;font-size:.72rem;transition:color .35s,opacity .25s,transform .25s}
.theme-mode-btn:hover{opacity:1;transform:scale(1.08)}
.theme-mode-btn.active{color:#fff!important;opacity:1}
body.theme-transition,body.theme-transition *{transition-property:color,background-color,border-color,fill,stroke!important;transition-duration:.45s!important}

/* header dark mode */
body.theme-effective-dark{background:#131414!important;color:#e2e8f0}
body.theme-effective-dark #settingsDropdownMenu,body.theme-effective-dark #userDropdownMenu,body.theme-effective-dark #searchDropdownMenu,body.theme-effective-dark #menuBox{background:#232525!important;border-color:#3a3c3c!important}
body.theme-light #settingsDropdownMenu,body.theme-light #userDropdownMenu,body.theme-light #searchDropdownMenu,body.theme-light #menuBox{background:#fff!important;border-color:#e2e8f0!important}
body.theme-effective-dark .text-slate-900,body.theme-effective-dark .text-slate-800,body.theme-effective-dark .text-slate-700,body.theme-effective-dark .text-black{color:#fff!important}
body.theme-effective-dark .text-slate-600,body.theme-effective-dark .text-slate-500,body.theme-effective-dark .text-slate-400{color:#c7c5c2!important}
body.theme-effective-dark .border-slate-100,body.theme-effective-dark .border-slate-200,body.theme-effective-dark .border-slate-300{border-color:#3a3c3c!important}
body.theme-effective-dark .bg-slate-50,body.theme-effective-dark .bg-white{background:#232525!important}
body.theme-effective-dark #searchDropdownMenu input{color:#fff!important}
body.theme-effective-dark #settingsDropdownMenu a{color:#e2e8f0!important}
body.theme-effective-dark #mainNav.nav-solid{background:#131414!important;border-bottom-color:#3a3c3c!important}
body.theme-effective-dark #mainNav.nav-solid .nav-icon-btn,body.theme-effective-dark #mainNav.nav-solid .theme-mode-switch{background:#2a2c2c!important;border-color:#3a3c3c!important}
body.theme-effective-dark #mainNav.nav-solid .nav-adaptive{color:#fff!important}
body.theme-effective-dark #userProfileBtn{background:#2a2c2c;border-color:#f59e0b;color:#c7c5c2}
body.theme-effective-dark #userDropdownMenu .profile-avatar-large{background:#2a2c2c;color:#c7c5c2}
body.theme-effective-dark #userDropdownMenu .profile-user-name{color:#fff!important}
body.theme-effective-dark #userDropdownMenu .profile-user-email{color:#a8a6a3!important}
body.theme-effective-dark #userDropdownMenu .auth-action{background:#2a2c2c;color:#c7c5c2;border-color:#3a3c3c}

/* ---------- page layout ---------- */
.pg-head{position:relative;padding:112px 24px 44px;text-align:center;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.pg-head h1{margin:0;font-size:24px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;color:rgba(0,0,0,.7);animation:headIn 1.2s cubic-bezier(.22,.61,.36,1) .25s backwards}
@keyframes headIn{from{opacity:0;transform:translateY(24px);letter-spacing:.5em;filter:blur(8px)}to{opacity:1;transform:none;letter-spacing:.2em;filter:blur(0)}}
.manage-wrap{display:none;position:absolute;top:120px;right:24px;gap:10px;align-items:center}
.manage-wrap.show{display:flex}
@media(max-width:767px){.manage-wrap{position:static;justify-content:center;margin-top:18px}}
.pg-main{padding:48px 24px 40px;min-height:40vh}
.empty{grid-column:1/-1;text-align:center;padding:96px 0;color:#94a3b8;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:44px;background:#e5e7eb}
.tools{display:none;position:absolute;top:10px;right:10px;z-index:40;gap:6px}
body.manage-on .tools{display:flex}
.tools button{width:30px;height:30px;border:0;border-radius:6px;background:rgba(15,23,42,.78);color:#fff;cursor:pointer;font-size:11px}
.tools button:hover{background:#d97706}
.tools .del:hover{background:#dc2626}
.tools .drag{cursor:grab;touch-action:none}
.tools .drag:active{cursor:grabbing}
body.theme-effective-dark .pg-head{background:#131414;border-color:#2a2c2c}
body.theme-effective-dark .pg-head h1{color:#fff}

/* ---------- buttons / modal / toast ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font:700 11px 'Poppins',sans-serif;letter-spacing:.05em;text-transform:uppercase;border:1px solid #d97706;color:#d97706;background:transparent;cursor:pointer;transition:background-color .2s,color .2s}
.btn:hover,.btn.on,.btn.solid{background:#d97706;color:#fff}
.btn.solid:hover{background:#b45309;border-color:#b45309}
.btn.danger{border-color:#dc2626;color:#dc2626}
.btn.danger:hover{background:#dc2626;color:#fff}
.btn.icon{width:38px;height:38px;padding:0;justify-content:center;font-size:14px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.md-bg{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.6);backdrop-filter:blur(8px)}
.md-bg.open{display:flex;animation:mdIn .25s ease}
@keyframes mdIn{from{opacity:0}}
.md-box{width:min(640px,100%);max-height:90vh;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.3)}
.md-box.sm{width:min(400px,100%)}
.md-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:inherit;z-index:2}
.md-head h3{margin:0;font-size:18px;font-weight:600;color:#0f172a}
.md-x{width:32px;height:32px;border:0;border-radius:50%;background:#f1f5f9;color:#64748b;font-size:18px;cursor:pointer}
.md-x:hover{background:#d97706;color:#fff}
.md-body{padding:20px 24px 6px}
.md-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px 22px}
.fld{margin-bottom:16px}
.fld>label{display:flex;justify-content:space-between;margin-bottom:7px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#475569}
.fld em{font-style:normal;color:#d97706}
.fld small{font-weight:600;text-transform:none;letter-spacing:0;color:#94a3b8}
.fld input,.fld textarea,.fld select{width:100%;padding:11px 13px;border:1.5px solid #e2e8f0;border-radius:9px;font:14px/1.55 'Poppins',sans-serif;color:#0f172a;background:#fff;outline:0;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:#d97706;box-shadow:0 0 0 3px rgba(217,119,6,.15)}
.fld textarea{resize:vertical;min-height:90px}
.err{display:none;color:#dc2626;font-size:12px;font-weight:500;margin:0 0 12px}
.pick{display:inline-flex;gap:8px;align-items:center;padding:9px 14px;border:1.5px dashed #cbd5e1;border-radius:9px;background:transparent;font:600 12px 'Poppins',sans-serif;color:#64748b;cursor:pointer}
.pick:hover{border-color:#d97706;color:#d97706}
.toast{position:fixed;right:24px;bottom:24px;z-index:600;padding:11px 16px;border-radius:10px;font:600 13px 'Poppins',sans-serif;color:#fff;background:#16a34a;box-shadow:0 10px 28px rgba(0,0,0,.22);opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;pointer-events:none}
.toast.show{opacity:1;transform:none}.toast.bad{background:#dc2626}
body.theme-effective-dark .md-box{background:#232525}
body.theme-effective-dark .md-head{border-color:#3a3c3c}
body.theme-effective-dark .md-head h3{color:#fff}
body.theme-effective-dark .md-x{background:#131414;color:#c7c5c2}
body.theme-effective-dark .fld>label{color:#c7c5c2}
body.theme-effective-dark .fld input,body.theme-effective-dark .fld textarea,body.theme-effective-dark .fld select{background:#131414;border-color:#3a3c3c;color:#fff}
body.theme-effective-dark .pick{border-color:#3a3c3c;color:#c7c5c2}
</style>
<style>
/* ---------- photo loading (shimmer + blur-in, same as project gallery) ---------- */
@keyframes shimmerMove{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes lbSpin{to{transform:rotate(360deg)}}

/* ---------- team grid (active members) ---------- */
.team-grid{position:relative;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:36px 28px}
@media(max-width:1000px){.team-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.team-grid{grid-template-columns:repeat(2,1fr);gap:28px 16px}}
.card{position:relative;opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .6s cubic-bezier(.22,.61,.36,1)}
.card.revealed{opacity:1;transform:none}
.card.dragging-src{opacity:.25!important}
.tphoto{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;cursor:pointer;border:1.5px solid #dbe1e8;transition:border-color .3s;
  background:linear-gradient(100deg,#e5e7eb 30%,#f3f4f6 50%,#e5e7eb 70%);background-size:200% 100%;animation:shimmerMove 1.5s linear infinite}
.tphoto.img-loaded{animation:none;background:#e5e7eb}
.tphoto:hover{border-color:#d97706}
body.theme-effective-dark .tphoto{border-color:#3a3c3c;background:linear-gradient(100deg,#222 30%,#343434 50%,#222 70%);background-size:200% 100%}
body.theme-effective-dark .tphoto.img-loaded{animation:none;background:#2a2c2c}
.tphoto img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;
  opacity:0;filter:blur(16px);transform:scale(1.06);
  transition:opacity .9s ease,filter 1s ease,transform 1s cubic-bezier(.16,1,.3,1)}
.tphoto.img-loaded img{opacity:1;filter:blur(0);transform:scale(1)}
.tphoto.img-loaded:hover img{transform:scale(1.06)}
.tphoto::after{content:"";position:absolute;inset:0;background:rgba(217,119,6,.14);opacity:0;transition:opacity .3s;pointer-events:none}
.tphoto:hover::after{opacity:1}
.tbody{padding:14px 2px 0}
.tname{margin:0;font-size:14px;line-height:20px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#232525}
.tdesig{margin-top:3px;font-size:12.5px;font-weight:400;color:#d97706}
body.theme-effective-dark .tname{color:#fff}

/* drag & drop reorder */
body.dragging-card{user-select:none;-webkit-user-select:none;cursor:grabbing}
.drag-ghost{position:fixed;left:0;top:0;z-index:700;margin:0;pointer-events:none;opacity:.94!important;transition:none!important;animation:none!important;will-change:transform;
  transform:translate3d(var(--gx,0px),var(--gy,0px),0) scale(1.04) rotate(1.5deg)!important;box-shadow:0 18px 34px rgba(0,0,0,.3);border-radius:18px}
.card.dragging-src .tphoto{animation:none}
.drag-ghost .tools{display:none!important}

/* ---------- resigned employees (auto-scroll right to left) ---------- */
.resigned{max-width:1300px;margin:0 auto;padding:46px 0 72px;display:none}
.resigned.show{display:block}
.rs-head{display:flex;align-items:center;gap:18px;max-width:1100px;margin:0 auto 14px;padding:0 24px}
.rs-head::before,.rs-head::after{content:"";flex:1;height:1px;background:#e2e8f0}
.rs-head h2{margin:0;font-size:14px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(0,0,0,.6)}
body.theme-effective-dark .rs-head::before,body.theme-effective-dark .rs-head::after{background:#3a3c3c}
body.theme-effective-dark .rs-head h2{color:#c7c5c2}
.mq{overflow:hidden;padding:22px 0 14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq-track{display:flex;width:max-content;animation:mqMove var(--dur,30s) linear infinite}
.mq:hover .mq-track,body.manage-on .mq-track{animation-play-state:paused}
@keyframes mqMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mq-group{display:flex;flex:0 0 auto;gap:34px;padding-right:34px}
.ritem{position:relative;width:118px;text-align:center;cursor:pointer}
.rphoto{position:relative;width:92px;height:92px;margin:0 auto;border-radius:50%;overflow:hidden;border:1.5px solid #cbd5e1;transition:border-color .3s,transform .3s;
  background:linear-gradient(100deg,#e5e7eb 30%,#f3f4f6 50%,#e5e7eb 70%);background-size:200% 100%;animation:shimmerMove 1.5s linear infinite}
.rphoto.img-loaded{animation:none;background:#e5e7eb}
body.theme-effective-dark .rphoto{border-color:#3a3c3c;background:linear-gradient(100deg,#222 30%,#343434 50%,#222 70%);background-size:200% 100%}
body.theme-effective-dark .rphoto.img-loaded{animation:none;background:#2a2c2c}
.rphoto img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;
  opacity:0;filter:blur(10px) grayscale(.35);transform:scale(1.06);
  transition:opacity .8s ease,filter .9s ease,transform .9s cubic-bezier(.16,1,.3,1)}
.rphoto.img-loaded img{opacity:1;filter:blur(0) grayscale(.35);transform:scale(1)}
.rphoto .noimg{font-size:30px}
.ritem:hover .rphoto{border-color:#d97706;transform:scale(1.06)}
.ritem .tools{top:-4px;right:2px}
.ritem .tools button{width:24px;height:24px;font-size:9px;border-radius:50%}
.rname{margin-top:10px;font-size:11.5px;font-weight:600;line-height:1.3;letter-spacing:.04em;text-transform:uppercase;color:#232525}
.rdesig{margin-top:2px;font-size:10.5px;color:#d97706}
body.theme-effective-dark .rname{color:#fff}

/* ---------- SEARCH FEEDBACK (search bar er thik niche) ---------- */
#searchResultFeedback{
  position:absolute;top:calc(100% + 10px);right:0;z-index:60;
  padding:6px 14px;border-radius:8px;background:#fff;border:1px solid #e2e8f0;
  box-shadow:0 10px 26px rgba(15,23,42,.18);
  font-size:11px;font-weight:600;line-height:1.4;white-space:nowrap;pointer-events:none;
  transform-origin:top right;animation:searchFbIn .35s cubic-bezier(.22,1,.36,1) both;
}
#searchResultFeedback.hidden{display:none}
#searchResultFeedback::before{
  content:"";position:absolute;top:-5px;right:22px;width:8px;height:8px;background:inherit;
  border-left:1px solid #e2e8f0;border-top:1px solid #e2e8f0;transform:rotate(45deg);
}
body.theme-effective-dark #searchResultFeedback{background:#232525;border-color:#3a3c3c}
body.theme-effective-dark #searchResultFeedback::before{border-left-color:#3a3c3c;border-top-color:#3a3c3c}
@keyframes searchFbIn{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.avatar-row{display:flex;gap:14px;align-items:center}
.avatar-prev{flex:0 0 auto;width:96px;height:96px;border-radius:14px;overflow:hidden;background:#e5e7eb;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:28px}
.avatar-prev img{width:100%;height:100%;object-fit:cover;object-position:top}
.avatar-btns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- photo crop popup (square frame = same shape as the card photo) ---------- */
.avatar-note{margin-top:6px;font-size:11px;color:#94a3b8;width:100%}
.crop-bg{position:fixed;inset:0;z-index:450;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.6);backdrop-filter:blur(8px)}
.crop-bg.open{display:flex;animation:mdIn .25s ease}
.crop-card{width:100%;max-width:400px;padding:22px;background:#fff;border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.35)}
.crop-card h3{margin:0;font-size:17px;font-weight:600;color:#0f172a}
.crop-card>p{margin:4px 0 0;font-size:12px;color:#64748b;line-height:1.5}
.crop-stage{position:relative;width:340px;height:340px;margin:16px auto 0;overflow:hidden;border-radius:10px;background:#0b1020;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.crop-stage.dragging{cursor:grabbing}
.crop-stage img{position:absolute;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* slide animation: old photo shrinks + slides away, new photo slides in and grows */

<script>
/* ================= YNAD shared script ================= */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

const SUPABASE_URL = 'https://zjbvnwawdgdncthktqtx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_KLOwVeJVKzC8Lo2slNnH0A_PdhW5BlT';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const MEDIA_BUCKET = 'ynad-media';
const REQUIRE_LOGIN_TO_MANAGE = true;     // false = show the manage icon to everyone
let canManage = false, manage = false;

const $ = id => document.getElementById(id);
function esc(v) {
  return (v === null || v === undefined ? '' : String(v))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ---------- shared header (index.html) + footer (footer.html) ---------- */
window.__indexHeaderReady = (async () => {
  const c = $('indexHeaderContainer'); if (!c) return;
  try {
    const r = await fetch('index.html', { cache: 'no-store' }); if (!r.ok) throw new Error('index.html');
    const nav = new DOMParser().parseFromString(await r.text(), 'text/html').querySelector('#mainNav');
    if (!nav) throw new Error('#mainNav not found');
    c.replaceChildren(nav.cloneNode(true));
    const g = c.querySelector('#homeContactLoginGroup');
    const home = g && g.querySelector('a[title="Home"]'), contact = g && g.querySelector('a[title="Contact"]');
    if (home) home.href = 'index.html';
    if (contact) {
      contact.href = 'index.html#siteFooterContainer';
      contact.addEventListener('click', e => { const f = $('siteFooterContainer'); if (f) { e.preventDefault(); f.scrollIntoView({ behavior: 'smooth' }); } });
    }
  } catch (e) { console.error('Shared header failed to load:', e); }
})();

(async () => {
  const c = $('siteFooterContainer'); if (!c) return;
  try {
    const r = await fetch('footer.html', { cache: 'no-store' }); if (!r.ok) throw new Error('footer.html');
    const t = document.createElement('template'); t.innerHTML = await r.text();
    const scripts = [...t.content.querySelectorAll('script')]; scripts.forEach(s => s.remove());
    c.replaceChildren(t.content.cloneNode(true));
    scripts.forEach(o => { const n = document.createElement('script'); for (const a of o.attributes) n.setAttribute(a.name, a.value); n.textContent = o.textContent; document.body.appendChild(n); n.remove(); });
  } catch (e) { console.error(e); c.innerHTML = '<div style="padding:32px;text-align:center;color:#a8a6a3;background:#1b1d1d;">Footer failed to load.</div>'; }
})();

/* ---------- injected UI: menu overlay, member viewer, confirm dialog, toast ---------- */
document.body.insertAdjacentHTML('beforeend', `
<div id="menuOverlay" onclick="handleOverlayClick(event)">
  <div id="menuBox" class="bg-white w-full max-w-sm h-full shadow-2xl flex flex-col justify-between p-8 relative overflow-y-auto">
    <button onclick="closeMenuWithEffect()" class="absolute top-6 right-6 w-10 h-10 border border-slate-300 flex items-center justify-center text-slate-900 hover:bg-amber-600 hover:text-white hover:border-amber-600 transition cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
    <div class="mt-20 flex-1 flex flex-col"><iframe id="menuLinksFrame" src="about:blank" title="Menu Links" style="border:none;width:100%;height:260px;"></iframe></div>
    <div class="pb-10"></div>
  </div>
</div>
<div id="tv" class="tv" aria-hidden="true" tabindex="-1">
  <div class="tv-top"><div id="tvCount" class="tv-count"></div>
    <button class="tv-btn" type="button" title="Close" aria-label="Close" onclick="closeViewer()"><i class="fa-solid fa-xmark"></i></button></div>
  <div id="tvStage" class="tv-stage">
    <div id="tvSlideA" class="tv-slide is-active"></div>
    <div id="tvSlideB" class="tv-slide is-hidden"></div>
    <button id="tvPrev" class="tv-btn tv-nav" type="button" aria-label="Previous" onclick="tvStep(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <button id="tvNext" class="tv-btn tv-nav" type="button" aria-label="Next" onclick="tvStep(1)"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
  <aside id="tvText" class="tv-text"></aside>
</div>
<div id="confirmModal" class="md-bg"><div class="md-box sm">
  <div class="md-head"><h3>Are you sure?</h3><button class="md-x" onclick="$('confirmNo').click()">&times;</button></div>
  <div class="md-body"><p id="confirmText" style="margin:0 0 10px;font-size:13px;color:#64748b;line-height:1.7"></p></div>
  <div class="md-foot"><button class="btn" id="confirmNo">Cancel</button><button class="btn danger" id="confirmYes">Delete</button></div>
</div></div>
<div id="toast" class="toast"></div>`);

function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function openModal(id) { $(id).classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeModal(id) { $(id).classList.remove('open'); if (!document.querySelector('.md-bg.open')) document.body.style.overflow = ''; }
function askConfirm(text) {
  return new Promise(res => {
    $('confirmText').textContent = text; openModal('confirmModal');
    const done = v => { closeModal('confirmModal'); res(v); };
    $('confirmYes').onclick = () => done(true); $('confirmNo').onclick = () => done(false);
  });
}

/* ---------- image upload (Supabase Storage) ---------- */
async function compressImage(file) {
  const keep = { body: file, type: file.type || 'image/jpeg', ext: ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg' };
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return keep;
  try {
    const bmp = await createImageBitmap(file), s = Math.min(1, 1800 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    return blob && blob.size < file.size ? { body: blob, type: 'image/jpeg', ext: 'jpg' } : keep;
  } catch (e) { return keep; }
}
async function uploadImage(file, folder) {
  const c = await compressImage(file);
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${c.ext}`;
  const { error } = await supabaseClient.storage.from(MEDIA_BUCKET).upload(path, c.body, { contentType: c.type, cacheControl: '31536000' });
  if (error) throw error;
  return supabaseClient.storage.from(MEDIA_BUCKET).getPublicUrl(path).data.publicUrl;
}
async function removeFiles(urls) {
  const k = `/object/public/${MEDIA_BUCKET}/`;
  const paths = (urls || []).map(u => { const i = String(u || '').indexOf(k); return i < 0 ? null : decodeURIComponent(u.slice(i + k.length).split('?')[0]); }).filter(Boolean);
  if (paths.length) try { await supabaseClient.storage.from(MEDIA_BUCKET).remove(paths); } catch (e) { console.warn(e); }
}

/* ---------- manage mode (edit / delete / reorder icon) ---------- */
function setManageUI() {
  $('manageWrap').classList.toggle('show', canManage);
  $('addBtn').style.display = manage ? 'inline-flex' : 'none';
  $('manageBtn').classList.toggle('on', manage);
  $('manageBtn').title = manage ? 'Done' : 'Manage (edit / delete / reorder)';
  $('manageBtn').innerHTML = `<i class="fa-solid ${manage ? 'fa-check' : 'fa-pen-to-square'}"></i>`;
  document.body.classList.toggle('manage-on', manage);
}
function toggleManage() { if (!canManage) return; manage = !manage; setManageUI(); }
async function initManage(force) {
  const apply = s => { canManage = !!force || !REQUIRE_LOGIN_TO_MANAGE || !!s; if (!canManage) manage = false; setManageUI(); };
  try {
    const { data: { session } } = await supabaseClient.auth.getSession(); apply(session);
    supabaseClient.auth.onAuthStateChange((_e, s) => apply(s));
  } catch (e) { apply(null); }
}
const revealIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('revealed'); revealIO.unobserve(e.target); } }), { threshold: .12 });
function observeCards(root) { root.querySelectorAll('.card').forEach(el => revealIO.observe(el)); }

/* ---------- header: profile, dropdowns, search, theme, menu ---------- */
function getUserAvatarUrl(u) {
  if (!u) return ''; const m = u.user_metadata || {}, i = (u.identities && u.identities[0] && u.identities[0].identity_data) || {};
  return m.avatar_url || m.picture || m.profile_image || m.photo_url || i.avatar_url || i.picture || '';
}
function getUserDisplayName(u) {
  if (!u) return 'Guest User'; const m = u.user_metadata || {};
  return m.full_name || m.name || m.user_name || m.username || (u.email ? u.email.split('@')[0] : 'User');
}
function setProfileImage(img, fb, url) {
  if (!img || !fb) return;
  if (!url) { img.hidden = true; img.removeAttribute('src'); fb.hidden = false; return; }
  img.onload = () => { img.hidden = false; fb.hidden = true; };
  img.onerror = () => { img.hidden = true; img.removeAttribute('src'); fb.hidden = false; };
  img.src = url;
}
function updateProfileUI(user) {
  const on = !!user, btn = $('userProfileBtn');
  if (btn) { btn.classList.toggle('is-authenticated', on); btn.title = on ? 'Profile' : 'Log in'; }
  const av = getUserAvatarUrl(user);
  setProfileImage($('userProfileImage'), $('userProfileFallback'), av);
  setProfileImage($('userDropdownImage'), $('userDropdownFallback'), av);
  if ($('profileUserName')) $('profileUserName').textContent = on ? getUserDisplayName(user) : 'Guest User';
  if ($('profileUserEmail')) $('profileUserEmail').textContent = on ? (user.email || 'Signed in') : 'Not logged in';
  const a = $('profileAuthAction'); if (!a) return;
  if (on) { a.href = '#'; a.title = 'Log out'; $('profileAuthActionIcon').className = 'fa-solid fa-right-from-bracket'; $('profileAuthActionText').textContent = 'LOG OUT'; a.onclick = handleLogout; }
  else { a.href = 'login.html'; a.title = 'Log in'; $('profileAuthActionIcon').className = 'fa-solid fa-right-to-bracket'; $('profileAuthActionText').textContent = 'LOG IN'; a.onclick = null; }
}
async function handleLogout(e) {
  if (e) e.preventDefault();
  try { const { error } = await supabaseClient.auth.signOut(); if (error) throw error; updateProfileUI(null); const d = $('userDropdownMenu'); if (d) d.classList.remove('open'); } catch (err) { console.error(err); }
}
async function initAuthState() {
  try {
    await window.__indexHeaderReady;
    const { data: { session } } = await supabaseClient.auth.getSession(); updateProfileUI(session ? session.user : null);
    supabaseClient.auth.onAuthStateChange((_e, s) => updateProfileUI(s ? s.user : null));
  } catch (e) { updateProfileUI(null); }
}
function closeHeaderPanels(except) {
  ['settingsDropdownMenu', 'userDropdownMenu', 'searchDropdownMenu'].forEach(id => { if (id !== except && $(id)) $(id).classList.remove('open'); });
  if (except !== 'searchDropdownMenu') { if ($('searchBoxWrap')) $('searchBoxWrap').classList.remove('search-open'); if ($('homeContactLoginGroup')) $('homeContactLoginGroup').classList.remove('icons-pushed'); }
}
function toggleSettingsDropdown(e) { e.stopPropagation(); closeHeaderPanels('settingsDropdownMenu'); $('settingsDropdownMenu').classList.toggle('open'); }
function toggleUserDropdown(e) { e.stopPropagation(); closeHeaderPanels('userDropdownMenu'); $('userDropdownMenu').classList.toggle('open'); }
function toggleSearchDropdown(e) {
  e.stopPropagation(); closeHeaderPanels('searchDropdownMenu');
  const dd = $('searchDropdownMenu'), wrap = $('searchBoxWrap'), grp = $('homeContactLoginGroup');
  if (!dd.classList.contains('open')) { dd.classList.add('open'); wrap.classList.add('search-open'); if (grp) grp.classList.add('icons-pushed'); $('projectSearchInput').focus(); }
  else if ($('projectSearchInput').value.trim()) executeSearch();
  else { dd.classList.remove('open'); wrap.classList.remove('search-open'); if (grp) grp.classList.remove('icons-pushed'); }
}
window.addEventListener('click', e => {
  [['userDropdownMenu', 'userProfileBtn'], ['settingsDropdownMenu', 'settingsIconBtn']].forEach(([m, b]) => {
    const menu = $(m), btn = $(b); if (menu && menu.classList.contains('open') && !menu.contains(e.target) && !(btn && btn.contains(e.target))) menu.classList.remove('open');
  });
  const wrap = $('searchBoxWrap'), dd = $('searchDropdownMenu');
  if (dd && dd.classList.contains('open') && wrap && !wrap.contains(e.target)) closeHeaderPanels();
});
/* ---------- team search (token wise, shob field e) ---------- */
let searchQ = '';
let searchMouseDownInside = false;

/* member er shob text field ke ekta searchable string e convert kore */
function buildMemberSearchText(m) {
  const status = m.status === 'resigned' ? 'ex-employee resigned ex employee' : 'active';
  const parts = [m.name, m.designation, m.description, status];
  return parts.filter(v => v !== null && v !== undefined && String(v).trim()).map(v => String(v).toLowerCase()).join(' | ');
}
function matchMember(m) {
  if (!searchQ) return true;
  const text = buildMemberSearchText(m);
  return searchQ.split(/\s+/).filter(Boolean).every(t => text.includes(t));
}

function setThemeMode(mode) {

  const sw = $('themeModeSwitch'), idx = { light: 0, dynamic: 1, dark: 2 };
  document.querySelectorAll('.theme-mode-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-mode') === mode));
  if (sw) sw.style.setProperty('--theme-index', idx[mode]);
  const body = document.body; body.classList.add('theme-transition');
  body.classList.remove('theme-light', 'theme-dynamic', 'theme-dark', 'theme-effective-dark'); body.classList.add('theme-' + mode);
  const dark = mode === 'dark' || (mode === 'dynamic' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) body.classList.add('theme-effective-dark');
  document.documentElement.classList.toggle('dark', dark);
  try { const f = $('menuLinksFrame'); if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'ynad-theme', dark }, '*'); } catch (e) {}
  clearTimeout(window.__ynadThemeTimer); window.__ynadThemeTimer = setTimeout(() => body.classList.remove('theme-transition'), 500);
  try { localStorage.setItem('ynad-theme-mode', mode); } catch (e) {}
}

/* ================= DRAG TO REORDER (grip icon in manage mode) ================= */
let dg = null;
function startDrag(e) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const card = e.currentTarget.closest('.card'); if (!card) return;
  const r = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.classList.add('drag-ghost', 'revealed'); ghost.removeAttribute('data-id');
  ghost.style.cssText = `width:${r.width}px;--gx:${r.left}px;--gy:${r.top}px;`;
  document.body.appendChild(ghost);
  card.classList.add('dragging-src'); document.body.classList.add('dragging-card');
  dg = { card, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, x: e.clientX, y: e.clientY, raf: 0 };
  addEventListener('pointermove', dragMove); addEventListener('pointerup', dragEnd); addEventListener('pointercancel', dragEnd);
  dg.raf = requestAnimationFrame(dragTick);
}
function dragMove(e) { if (!dg) return; dg.x = e.clientX; dg.y = e.clientY; }
function moveCard(card, target, after) {
  const grid = $('grid'), all = [...grid.querySelectorAll('.card')];
  const first = new Map(all.map(c => [c, c.getBoundingClientRect()]));
  after ? target.after(card) : target.before(card);
  all.forEach(c => {
    const a = first.get(c), b = c.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    c.style.transition = 'none'; c.style.transform = `translate(${dx}px,${dy}px)`; void c.offsetWidth;
    c.style.transition = 'transform .3s cubic-bezier(.22,.61,.36,1)'; c.style.transform = '';
    clearTimeout(c._ft); c._ft = setTimeout(() => { c.style.transition = ''; }, 340);
  });
}
function dragTick() {
  if (!dg) return;
  dg.ghost.style.setProperty('--gx', (dg.x - dg.dx) + 'px'); dg.ghost.style.setProperty('--gy', (dg.y - dg.dy) + 'px');
  if (dg.y < 90) scrollBy(0, -14); else if (dg.y > innerHeight - 90) scrollBy(0, 14);
  const grid = $('grid'), all = [...grid.querySelectorAll('.card')];
  /* hit-test against the stable LAYOUT position (offset*), which ignores the slide animations of other cards.
     This stops the card from flipping back and forth while neighbours are still moving. */
  const gr = grid.getBoundingClientRect(), px = dg.x - gr.left, py = dg.y - gr.top;
  const target = all.find(c => {
    if (c === dg.card) return false;
    const w = c.offsetWidth, h = c.offsetHeight, px0 = c.offsetLeft + w * .2, py0 = c.offsetTop + h * .2;
    return px >= px0 && px <= c.offsetLeft + w * .8 && py >= py0 && py <= c.offsetTop + h * .8;
  });
  if (target) moveCard(dg.card, target, all.indexOf(target) > all.indexOf(dg.card));
  dg.raf = requestAnimationFrame(dragTick);
}
function dragEnd() {
  if (!dg) return;
  cancelAnimationFrame(dg.raf);
  removeEventListener('pointermove', dragMove); removeEventListener('pointerup', dragEnd); removeEventListener('pointercancel', dragEnd);
  dg.ghost.remove(); dg.card.classList.remove('dragging-src'); document.body.classList.remove('dragging-card');
  dg = null;
  saveOrder([...$('grid').querySelectorAll('.card')].map(c => c.dataset.id));
}
async function saveOrder(ids) {

  members.sort((a, b) => a.sort_order - b.sort_order);
  if (!changed.length) return;

    const res = await Promise.all(changed.map(m => supabaseClient.from('team_members').update({ sort_order: m.sort_order }).eq('id', m.id).select()));

/* ================= MEMBER VIEWER (photo 2/3 + info 1/3) ================= */
let vList = [], vI = 0;
let tvCur = $('tvSlideA'), tvInc = $('tvSlideB');
let tvAnim = false, tvTok = 0, tvTimer = null, tvTarget = 0, tvPend = 0;
const TV_FALLBACK_MS = 1000;   /* a bit longer than the .8s CSS transition */

function tvBusy(b) { $('tvStage').classList.toggle('is-busy', !!b); }
function tvFill(el, m) {
  el.innerHTML = m.photo_url
    ? `<img class="tv-img is-loading" src="${esc(m.photo_url)}" alt="${esc(m.name)}" draggable="false" decoding="async">`
    : '<div class="tv-no"><i class="fa-solid fa-user"></i></div>';
}
function tvCounter(i) {
  $('tvCount').textContent = vList.length > 1 ? (i + 1) + ' / ' + vList.length : '';
  $('tvPrev').style.display = i <= 0 ? 'none' : 'flex';
  $('tvNext').style.display = i >= vList.length - 1 ? 'none' : 'flex';
}
function tvInfo(i) {
  const m = vList[i];
  $('tvText').innerHTML =
    `<span class="t tvt-status ${isResigned(m) ? 'off' : ''}">${isResigned(m) ? 'Ex-Employee' : 'Active'}</span>` +
    `<h2 class="t tvt-name">${esc(m.name)}</h2>` +
    (m.designation ? `<div class="t tvt-desig">${esc(m.designation)}</div>` : '<div class="t"></div>') +
    `<div class="t tvt-line"></div>` +
    (m.description ? `<p class="t tvt-desc">${esc(m.description)}</p>` : '');
  $('tvText').scrollTop = 0;
  tvCounter(i);
}
function tvCancel() {
  tvTok++; clearTimeout(tvTimer); tvTimer = null; tvAnim = false; tvPend = 0; tvBusy(false);
  tvCur.className = 'tv-slide is-active'; tvInc.className = 'tv-slide is-hidden'; tvInc.innerHTML = '';
}
function tvInit(i) {
  vI = i; tvTarget = i;
  tvFill(tvCur, vList[i]);
  const img = tvCur.querySelector('img');
  if (img) {
    tvBusy(true);
    const done = () => { img.onload = null; img.onerror = null; img.classList.remove('is-loading'); tvBusy(false); };
    img.onload = done; img.onerror = done;
    if (img.complete && img.naturalWidth > 0) done();
  }
  tvInfo(i);
}
function tvRunQueue() {
  if (!tvPend) return;
  const d = Math.sign(tvPend); tvPend -= d;
  setTimeout(() => tvGo(vI + d, d), 35);
}
/* direction 1 = new photo enters from the right, -1 = from the left; the old photo shrinks while sliding away */
function tvGo(next, dir) {
  if (next < 0 || next >= vList.length || next === vI) return;
  const cur = tvCur, inc = tvInc, tok = ++tvTok;
  let started = false, finished = false, onEnd = null;
  tvAnim = true; tvTarget = next;
  tvFill(inc, vList[next]);
  inc.className = 'tv-slide no-anim ' + (dir > 0 ? 'is-entering-right' : 'is-entering-left');
  const img = inc.querySelector('img');
  const finish = () => {
    if (finished || tok !== tvTok) return; finished = true;
    clearTimeout(tvTimer); tvTimer = null; inc.removeEventListener('transitionend', onEnd);
    cur.innerHTML = ''; cur.className = 'tv-slide is-hidden';
    tvCur = inc; tvInc = cur; inc.className = 'tv-slide is-active';
    vI = next; tvAnim = false; tvRunQueue();
  };
  const start = () => {
    if (started || tok !== tvTok) return; started = true; tvBusy(false);
    if (img) { img.onload = null; img.onerror = null; img.classList.remove('is-loading'); }
    void inc.offsetWidth; inc.classList.remove('no-anim'); void inc.offsetWidth;
    tvInfo(next);                                 /* text + counter + arrows change together with the photo */
    requestAnimationFrame(() => {
      if (tok !== tvTok) return;
      cur.classList.remove('is-active'); cur.classList.add(dir > 0 ? 'is-leaving-left' : 'is-leaving-right');
      inc.classList.remove('is-entering-right', 'is-entering-left'); inc.classList.add('is-active');
    });
    onEnd = e => { if (e.target === inc && e.propertyName === 'transform') finish(); };
    inc.addEventListener('transitionend', onEnd);
    tvTimer = setTimeout(finish, TV_FALLBACK_MS);
  };
  tvBusy(true);
  if (!img || (img.complete && img.naturalWidth > 0)) start();
  else { img.onload = start; img.onerror = start; }
}
function tvStep(d) {
  if (!vList.length || !d) return;
  const s = d > 0 ? 1 : -1, base = tvAnim ? tvTarget : vI, target = base + tvPend + s;
  if (target < 0 || target >= vList.length) return;     /* no looping */
  if (tvAnim) { tvPend += s; tvCounter(target); return; }
  tvGo(vI + s, s);
}
function openViewer(id, which) {
  vList = which === 'resigned' ? resignedList() : activeList();
  const i = vList.findIndex(x => x.id === id); if (i < 0) return;
  vList.forEach(m => { if (m.photo_url) { const im = new Image(); im.decoding = 'async'; im.src = m.photo_url; } });   /* preload so next/prev is instant */
  tvCancel();
  const box = $('tv'); tvInit(i); void box.offsetWidth;
  box.classList.add('open'); box.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden';
  try { box.focus({ preventScroll: true }); } catch (e) {}
}
function closeViewer() { const b = $('tv'); b.classList.remove('open'); b.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; tvCancel(); }
(() => { let x = 0, b = $('tv');
  b.addEventListener('touchstart', e => { x = e.changedTouches[0].clientX; }, { passive: true });
  b.addEventListener('touchend', e => { if (e.target.closest('.tv-text')) return; const d = e.changedTouches[0].clientX - x; if (Math.abs(d) > 50) tvStep(d < 0 ? 1 : -1); }, { passive: true }); })();
$('tv').addEventListener('click', e => { if (e.target.id === 'tv' || e.target.id === 'tvStage') closeViewer(); });

/* keyboard: Esc closes viewer -> closes popup -> leaves manage mode ; arrows = previous / next */
document.addEventListener('keydown', e => {
  const viewerOpen = $('tv').classList.contains('open');
  if (e.key === 'Escape') {
    if (viewerOpen) { e.preventDefault(); closeViewer(); return; }
    const md = document.querySelector('.md-bg.open');
    if (md) { e.preventDefault(); closeModal(md.id); return; }
    if (manage) toggleManage();
    return;
  }
  if (!viewerOpen) return;

  else if (e.key === 'ArrowLeft') { e.preventDefault(); tvStep(-1); }

/* ---- add / edit ----

function descCount() { $('descCount').textContent = $('fDesc').value.length + ' / 400'; }
function showAvatar() {
  const url = editing.preview || (editing.keep ? editing.photoUrl : '');
  $('avatarPrev').innerHTML = url ? `<img src="${esc(url)}" alt="">` : '<i class="fa-solid fa-user"></i>';
  $('rmPhoto').style.display = url ? 'inline-flex' : 'none';
  $('editPhoto').style.display = url ? 'inline-flex' : 'none';
  $('pickLabel').textContent = url ? 'Change photo' : 'Choose photo';
}
function openForm(id) {
  const m = id ? members.find(x => x.id === id) : null;
  editing = { id: m ? m.id : null, photoUrl: m ? m.photo_url : null, keep: !!(m && m.photo_url), file: null, preview: null,
              orig: (m && m.photo_orig_url) || null, origUrl: (m && m.photo_orig_url) || null, prevOrig: (m && m.photo_orig_url) || null,
              origFile: null, crop: (m && m.photo_crop) || null, sort: m ? m.sort_order : nextOrder() };
  $('fName').value = m ? m.name : ''; $('fDesig').value = (m && m.designation) || ''; $('fDesc').value = (m && m.description) || '';
  $('fStatus').value = m && isResigned(m) ? 'resigned' : 'active';          /* default = Active */
  $('formTitle').textContent = m ? 'Edit Member' : 'Add Member'; $('fErr').style.display = 'none';
  descCount(); showAvatar(); openModal('formModal');
}

/* ---------- photo pick + crop (square frame = card photo shape) ---------- */
const MAX_PHOTO = 2 * 1024 * 1024, OK_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
const CROP = { sw: 340, sh: 340, fw: 260, fh: 260, out: [800, 800] };   /* sizes are re-calculated in layoutCrop() */
let cr = { nw: 0, nh: 0, base: 1, zoom: 1, ox: 0, oy: 0, url: null, drag: null, file: null };

function layoutCrop() {
  const S = Math.max(240, Math.min(340, innerWidth - 40 - 44)), F = Math.round(S * .765), o = Math.round((S - F) / 2);
  CROP.sw = CROP.sh = S; CROP.fw = CROP.fh = F;
  const st = $('cropStage'); st.style.width = S + 'px'; st.style.height = S + 'px';
  st.querySelector('.crop-frame').style.cssText = `left:${o}px;top:${o}px;width:${F}px;height:${F}px`;
  $('cropZoomRow').style.width = S + 'px';
}
function pickPhoto(input) {
  const f = input.files[0]; input.value = ''; if (!f) return;
  if (OK_TYPES.indexOf(f.type) < 0) { toast('Please choose a JPG, PNG or WEBP image.', true); return; }
  if (f.size > MAX_PHOTO) { toast('Photo is ' + (f.size / 1048576).toFixed(2) + ' MB. Max allowed is 2 MB.', true); return; }
  cr.file = f;
  openCrop(URL.createObjectURL(f), null);
}
function editPhoto() {
  /* always re-open the FULL original photo with the previously saved position */
  const src = editing.orig || editing.preview || editing.photoUrl;
  if (src) openCrop(src, editing.orig ? editing.crop : null);
}
function clearPhoto() {
  editing.file = null; editing.preview = null; editing.keep = false;
  editing.orig = null; editing.origFile = null; editing.origUrl = null; editing.crop = null;
  showAvatar();
}
function cropClamp() {
  const sc = cr.base * cr.zoom;
  const mx = Math.max(0, (cr.nw * sc - CROP.fw) / 2), my = Math.max(0, (cr.nh * sc - CROP.fh) / 2);
  cr.ox = Math.min(mx, Math.max(-mx, cr.ox)); cr.oy = Math.min(my, Math.max(-my, cr.oy));
}
function cropRender() {
  cropClamp();
  const sc = cr.base * cr.zoom, w = cr.nw * sc, h = cr.nh * sc, im = $('cropImg');
  im.style.width = w + 'px'; im.style.height = h + 'px';
  im.style.left = (CROP.sw / 2 - w / 2 + cr.ox) + 'px'; im.style.top = (CROP.sh / 2 - h / 2 + cr.oy) + 'px';
}
function cropSetZoom(z) {
  z = Math.min(4, Math.max(1, z)); const r = z / cr.zoom;
  cr.ox *= r; cr.oy *= r; cr.zoom = z; $('cropRange').value = z; cropRender();
}
function cropZoomBy(d) { cropSetZoom(cr.zoom + d); }
function openCrop(url, state) {
  layoutCrop();
  const im = $('cropImg'); cr.url = url;
  if (!url.startsWith('blob:')) im.crossOrigin = 'anonymous'; else im.removeAttribute('crossorigin');
  im.onload = () => {
    cr.nw = im.naturalWidth; cr.nh = im.naturalHeight; if (!cr.nw) return;
    cr.base = Math.max(CROP.fw / cr.nw, CROP.fh / cr.nh);
    if (state) { cr.zoom = Math.min(4, Math.max(1, +state.z || 1)); cr.ox = (+state.x || 0) * CROP.fw; cr.oy = (+state.y || 0) * CROP.fh; }
    else { cr.zoom = 1; cr.ox = 0; cr.oy = 0; }
    $('cropRange').value = cr.zoom; cropRender(); openModal('cropModal');
  };
  im.onerror = () => { toast('This image could not be loaded.', true); closeCrop(); };
  im.src = url;
}
function closeCrop() {
  closeModal('cropModal');
  if (cr.url && cr.url.startsWith('blob:') && cr.url !== editing.orig) URL.revokeObjectURL(cr.url);
  cr.url = null; cr.file = null;
}
function saveCrop() {
  const sc = cr.base * cr.zoom, w = cr.nw * sc, h = cr.nh * sc;
  const imgL = CROP.sw / 2 - w / 2 + cr.ox, imgT = CROP.sh / 2 - h / 2 + cr.oy;
  const fl = (CROP.sw - CROP.fw) / 2, ft = (CROP.sh - CROP.fh) / 2;
  const c = document.createElement('canvas'); c.width = CROP.out[0]; c.height = CROP.out[1];
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  try {
    ctx.drawImage($('cropImg'), (fl - imgL) / sc, (ft - imgT) / sc, CROP.fw / sc, CROP.fh / sc, 0, 0, c.width, c.height);
    c.toBlob(b => {
      if (!b) { toast('Could not save the photo.', true); return; }
      if (editing.preview && editing.preview.startsWith('blob:')) URL.revokeObjectURL(editing.preview);
      editing.orig = cr.url;                                   /* full original stays available for the next edit */
      if (cr.file) { editing.origFile = cr.file; editing.origUrl = null; cr.file = null; }
      editing.crop = { z: cr.zoom, x: cr.ox / CROP.fw, y: cr.oy / CROP.fh };
      editing.file = new File([b], 'photo.jpg', { type: 'image/jpeg' });
      editing.preview = URL.createObjectURL(b); editing.keep = false;
      cr.url = null; closeModal('cropModal'); showAvatar();
    }, 'image/jpeg', .9);
  } catch (e) { console.error(e); toast('This photo cannot be edited (CORS). Please upload it again.', true); }
}
(() => {
  const st = $('cropStage'), rg = $('cropRange');
  st.addEventListener('pointerdown', e => { cr.drag = { x: e.clientX, y: e.clientY, ox: cr.ox, oy: cr.oy }; st.setPointerCapture(e.pointerId); st.classList.add('dragging'); });
  st.addEventListener('pointermove', e => { if (!cr.drag) return; cr.ox = cr.drag.ox + e.clientX - cr.drag.x; cr.oy = cr.drag.oy + e.clientY - cr.drag.y; cropRender(); });
  const end = () => { cr.drag = null; st.classList.remove('dragging'); };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  st.addEventListener('wheel', e => { e.preventDefault(); cropSetZoom(cr.zoom - e.deltaY * .002); }, { passive: false });
  rg.addEventListener('input', () => cropSetZoom(parseFloat(rg.value)));
  $('cropModal').addEventListener('click', e => { if (e.target.id === 'cropModal') closeCrop(); });
  /* Esc closes the crop popup first (before the form popup) */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('cropModal').classList.contains('open')) { e.stopPropagation(); closeCrop(); }
  }, true);
})();

async function writeRow(row, id) {
  const run = r => (id ? supabaseClient.from('team_members').update(r).eq('id', id) : supabaseClient.from('team_members').insert(r)).select();
  let res = await run(row);
  /* if the two new columns were not added yet, save without them */
  if (res.error && /photo_orig_url|photo_crop/.test(res.error.message || '')) {
    const { photo_orig_url, photo_crop, ...rest } = row; res = await run(rest);
  }
  return res;
}
async function saveMember() {
  const err = $('fErr'), btn = $('saveBtn'), name = $('fName').value.trim();
  if (!name) { err.textContent = 'Name is required.'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  const status = $('fStatus').value === 'resigned' ? 'resigned' : 'active';
  if (DEMO_MODE) {
    const hasOrig = !!(editing.orig && editing.orig !== editing.photoUrl);
    const row = { name, designation: $('fDesig').value.trim(), description: $('fDesc').value.trim(), status,
                  photo_url: editing.preview || (editing.keep ? editing.photoUrl : null),
                  photo_orig_url: hasOrig ? editing.orig : null, photo_crop: hasOrig ? editing.crop : null, sort_order: editing.sort };
    const wasEdit = !!editing.id;
    if (wasEdit) members = members.map(m => m.id === editing.id ? { ...m, ...row } : m);
    else members.push({ id: 'demo-' + Date.now(), ...row });
    members.sort((a, b) => a.sort_order - b.sort_order);
    closeModal('formModal'); toast(wasEdit ? 'Member updated (demo)' : 'Member added (demo)'); render(); return;
  }
  btn.disabled = true;
  try {
    let url = editing.keep ? editing.photoUrl : null, origUrl = editing.origUrl;
    if (editing.file) { btn.textContent = 'Uploading...'; url = await uploadImage(editing.file, 'team'); }
    if (editing.origFile) { btn.textContent = 'Uploading...'; origUrl = await uploadImage(editing.origFile, 'team'); }
    if (!url) origUrl = null;
    btn.textContent = 'Saving...';
    const row = { name, designation: $('fDesig').value.trim() || null, description: $('fDesc').value.trim() || null, status,
                  photo_url: url, photo_orig_url: origUrl || null, photo_crop: origUrl ? editing.crop : null, sort_order: editing.sort };
    const wasEdit = !!editing.id;
    const { data, error } = await writeRow(row, editing.id);
    if (error) throw error;
    if (!data || !data.length) throw new Error('Not allowed - please log in again.');
    const old = [];
    if (editing.photoUrl && editing.photoUrl !== url) old.push(editing.photoUrl);
    if (editing.prevOrig && editing.prevOrig !== origUrl) old.push(editing.prevOrig);
    if (old.length) await removeFiles(old);
    closeModal('formModal'); toast(wasEdit ? 'Member updated' : 'Member added'); await load();
  } catch (e) { console.error(e); err.textContent = 'Save failed - ' + (e.message || 'please try again.'); err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Save'; }
}
async function deleteMember(id) {
  const m = members.find(x => x.id === id); if (!m) return;
  if (!await askConfirm(`Delete "${m.name}" from the team? This cannot be undone.`)) return;
  if (DEMO_MODE) { members = members.filter(x => x.id !== id); render(); toast('Member deleted (demo)'); return; }
  const { data, error } = await supabaseClient.from('team_members').delete().eq('id', id).select();
  if (error || !data || !data.length) { toast('Delete failed', true); return; }
  await removeFiles([m.photo_url, m.photo_orig_url]); toast('Member deleted'); load();
}

initManage(DEMO_MODE); load();
</script>
</body>
