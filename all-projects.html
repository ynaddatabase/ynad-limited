<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects — YNAD Construction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }

        /* Top page loading progress bar */
        #pageLoadingBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 99999;
            pointer-events: none;
            overflow: hidden;
        }

        #pageLoadingProgress {
            width: 8%;
            height: 100%;
            background: linear-gradient(90deg, #b45309, #d97706, #f59e0b, #d97706, #b45309);
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.70);
            transition: width 0.45s ease, opacity 0.35s ease;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Individual Image Zoom and Darken Overlay */
        .zoom-container {
            position: relative;
        }
        .zoom-wrapper {
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .zoom-wrapper::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.48);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 10;
        }
        .zoom-wrapper:hover::after,
        .recent-project-card:hover .zoom-wrapper::after {
            opacity: 1;
        }
        .zoom-wrapper img {
            transition: transform 0.3s ease-in-out;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .zoom-wrapper:hover img {
            transform: scale(1.05);
        }

        /* Animated Corner Strokes strictly on Image/Zoom-Container Hover */
        .zoom-container::before,
        .zoom-container::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border: 2px solid transparent;
            transition: width 0.3s ease, height 0.3s ease;
            pointer-events: none;
            z-index: 30;
        }
        .zoom-container::before {
            top: 8px;
            left: 8px;
        }
        .zoom-container::after {
            bottom: 8px;
            right: 8px;
        }
        .zoom-container:hover::before {
            width: 40px;
            height: 40px;
            border-top-color: #d97706;
            border-left-color: #d97706;
            border-bottom-color: transparent;
            border-right-color: transparent;
        }
        .zoom-container:hover::after {
            width: 40px;
            height: 40px;
            border-bottom-color: #d97706;
            border-right-color: #d97706;
            border-top-color: transparent;
            border-left-color: transparent;
        }

        /* ================================================================
           PROJECT GRID CARDS — same visual spec as index.html's Recent
           Projects cards, but laid out in a wrapping grid instead of a
           horizontal carousel.
           ================================================================ */
        .recent-project-card {
            width: 100%;
            height: 417.8708px;
            min-height: 417.8708px;
            position: relative;
            overflow: visible;
            background: #ffffff;
            border: 1px solid transparent;
            box-sizing: border-box;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.10),
                        0 10px 12px -12px rgba(15, 23, 42, 0.42);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: left;
        }

        .recent-project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.14);
        }

        .recent-project-card::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: -10px;
            height: 10px;
            background: transparent;
            pointer-events: none;
            z-index: 40;
            box-shadow: 0 7px 12px -10px rgba(15, 23, 42, 0.55);
        }

        .recent-project-image {
            position: relative;
            width: 100%;
            height: 299.141px;
            overflow: hidden;
            background: #e5e7eb;
            flex: 0 0 299.141px;
        }

        .recent-project-image-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .recent-project-image-track > .zoom-wrapper {
            width: 100%;
            min-width: 100%;
            height: 299.141px;
            min-height: 299.141px;
        }

        .recent-project-image-track img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .recent-project-bottom {
            width: 100%;
            height: 118.7298px;
            min-height: 118.7298px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            background: #fff;
        }

        .recent-project-info {
            height: 72px;
            min-height: 72px;
            padding: 10px 19px 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
        }

        .recent-project-info-left {
            min-width: 0;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .recent-project-title {
            margin: 0 0 2px;
            font-size: 15px;
            line-height: 20px;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: #111827;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-project-location {
            margin-top: 0;
            font-size: 11px;
            line-height: 16px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: rgba(0, 0, 0, 0.7);
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-project-code {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            line-height: 16px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }

        .recent-project-code .code-divider {
            width: 1px;
            height: 14px;
            background: rgba(0, 0, 0, 0.2);
            flex: 0 0 auto;
        }

        .recent-project-actions {
            height: 46.7298px;
            min-height: 46.7298px;
            border-top: none;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
            box-sizing: border-box;
            gap: 0;
        }

        .recent-project-action {
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 3px;
            border-radius: 4px;
            font-size: 10px;
            line-height: 1;
            font-weight: 600;
            letter-spacing: 0.015em;
            white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .recent-project-action.docs {
            color: rgba(37, 99, 235, 0.70);
        }

        .recent-project-action.docs:hover {
            color: #fff;
            background: #2563eb;
        }

        .recent-project-action.media {
            color: rgba(217, 119, 6, 0.72);
            border: none;
            background: transparent;
        }

        .recent-project-action.media:hover {
            color: #fff;
            background: #d97706;
        }

        .recent-project-action.location {
            color: rgba(71, 85, 105, 0.78);
        }

        .recent-project-action.location:hover {
            color: #fff;
            background: #334155;
        }

        /* Reveal fade-in, sliding left -> right into place */
        .reveal-fade-left {
            opacity: 0;
            transform: translateX(-40px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .reveal-fade-left.revealed {
            opacity: 1;
            transform: translateX(0);
        }

        /* MEDIA dropdown (card bottom bar) */
        .media-menu-wrap { position: relative; }

        .media-menu {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, .18);
            min-width: 140px;
            padding: 6px;
            z-index: 60;
            text-align: left;
        }
        .media-menu.hidden { display: none; }

        .media-menu-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 9px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .04em;
            color: #334155;
            border-radius: 5px;
            cursor: default;
            transition: background .15s ease, color .15s ease;
        }
        .media-menu-item:hover,
        .media-menu-item.open {
            background: #fffbeb;
            color: #b45309;
        }
        .media-menu-item i {
            font-size: 8px;
            color: #94a3b8;
        }
        .media-menu-item:hover i,
        .media-menu-item.open i {
            color: #d97706;
        }

        .media-submenu {
            position: absolute;
            left: calc(100% + 6px);
            top: -6px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, .18);
            min-width: 120px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 1px;
            z-index: 61;
        }
        .media-menu-item:hover .media-submenu,
        .media-menu-item.open .media-submenu {
            display: flex;
        }
        .media-submenu.flip-left {
            left: auto;
            right: calc(100% + 6px);
        }
        .media-submenu a {
            display: block;
            padding: 6px 9px;
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: .03em;
            color: #475569;
            border-radius: 5px;
            text-decoration: none;
            white-space: nowrap;
            transition: background .15s ease, color .15s ease;
        }
        .media-submenu a:hover {
            background: #d97706;
            color: #fff;
        }

        /* Header: floats over the page (transparent, light icons/text) at
           the very top, then turns solid white with shadow once scrolled.
           Hides on scroll-down and reappears on scroll-up. */
        #mainNav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.48);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        background-color 0.35s ease,
                        border-color 0.35s ease,
                        box-shadow 0.35s ease;
            transform: translateY(0);
        }
        #mainNav.nav-hidden {
            transform: translateY(-100%);
        }
        #mainNav.nav-solid {
            background-color: #ffffff;
            border-bottom-color: #e5e7eb;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        }
        #mainNav .nav-adaptive {
            color: #ffffff;
            transition: color 0.35s ease;
        }
        #mainNav.nav-solid .nav-adaptive {
            color: #0f172a;
        }
        #mainNav .nav-adaptive-muted {
            color: rgba(255, 255, 255, 0.85);
            transition: color 0.35s ease;
        }
        #mainNav.nav-solid .nav-adaptive-muted {
            color: #334155;
        }
        #mainNav .nav-icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid transparent;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease,
                        transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        #mainNav.nav-solid .nav-icon-btn {
            background: #f1f5f9;
            border-color: #e2e8f0;
        }
        #mainNav .nav-icon-btn:hover {
            background-color: #d97706;
            border-color: #d97706;
            color: #ffffff !important;
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
        }
        #mainNav #searchIconBtn:hover {
            transform: scale(1.05);
        }
        #searchBoxWrap.search-open #searchIconBtn:hover {
            transform: translateX(2px) scale(1.05);
        }

        /* Light / dynamic / dark palette (mirrors index.html) */
        body.theme-light {
            background-color: #ffffff;
            color: #1e293b;
        }

        body.theme-light .recent-project-bottom,
        body.theme-light #pageHeaderSection {
            background-color: #ffffff !important;
        }

        body.theme-light .recent-project-card,
        body.theme-light #settingsDropdownMenu,
        body.theme-light #userDropdownMenu,
        body.theme-light #searchDropdownMenu,
        body.theme-light #menuBox {
            background-color: #ffffff !important;
            border-color: #e2e8f0 !important;
        }

        body.theme-effective-dark {
            background-color: #0f172a !important;
            color: #e2e8f0;
        }

        body.theme-effective-dark .recent-project-bottom,
        body.theme-effective-dark #pageHeaderSection {
            background-color: #0f172a !important;
        }

        body.theme-effective-dark .recent-project-card,
        body.theme-effective-dark #settingsDropdownMenu,
        body.theme-effective-dark #userDropdownMenu,
        body.theme-effective-dark #searchDropdownMenu,
        body.theme-effective-dark #menuBox {
            background-color: #111827 !important;
            border-color: #334155 !important;
        }

        body.theme-effective-dark .recent-project-title,
        body.theme-effective-dark .text-slate-900,
        body.theme-effective-dark .text-slate-800 {
            color: #f8fafc !important;
        }

        body.theme-effective-dark .recent-project-location,
        body.theme-effective-dark .text-slate-600,
        body.theme-effective-dark .text-slate-500,
        body.theme-effective-dark .text-slate-400 {
            color: #cbd5e1 !important;
        }

        body.theme-effective-dark #pageHeaderSection h1,
        body.theme-effective-dark #pageHeaderSection .filter-tab {
            color: #f8fafc;
        }
        body.theme-effective-dark .recent-project-code {
            color: #94a3b8 !important;
        }
        body.theme-effective-dark .recent-project-code .code-divider {
            background: #475569 !important;
        }
        body.theme-effective-dark .recent-project-action.docs {
            color: #60a5fa !important;
        }
        body.theme-effective-dark .recent-project-action.media {
            color: #f59e0b !important;
        }
        body.theme-effective-dark .recent-project-action.location {
            color: #94a3b8 !important;
        }

        body.theme-effective-dark .recent-project-action.docs:hover,
        body.theme-effective-dark .recent-project-action.docs:hover span,
        body.theme-effective-dark .recent-project-action.docs:hover i,
        body.theme-effective-dark .recent-project-action.media:hover,
        body.theme-effective-dark .recent-project-action.media:hover span,
        body.theme-effective-dark .recent-project-action.media:hover i,
        body.theme-effective-dark .recent-project-action.location:hover,
        body.theme-effective-dark .recent-project-action.location:hover span,
        body.theme-effective-dark .recent-project-action.location:hover i {
            color: #ffffff !important;
        }

        body.theme-effective-dark .recent-project-action.docs:hover {
            background: #2563eb !important;
        }
        body.theme-effective-dark .recent-project-action.media:hover {
            background: #d97706 !important;
        }
        body.theme-effective-dark .recent-project-action.location:hover {
            background: #334155 !important;
        }

        body.theme-light .recent-project-card {
            border-color: transparent !important;
        }
        body.theme-light .recent-project-card::after {
            background: transparent !important;
            box-shadow: 0 7px 12px -10px rgba(15, 23, 42, 0.55);
        }

        body.theme-effective-dark .recent-project-card {
            border-color: #334155 !important;
            border-bottom-color: #334155 !important;
            box-shadow:
                inset 0 -1px 0 #334155,
                0 6px 18px rgba(15, 23, 42, 0.10),
                0 10px 12px -12px rgba(15, 23, 42, 0.78);
        }
        body.theme-effective-dark .recent-project-card::after {
            background: #334155 !important;
            left: 0;
            right: 0;
            bottom: 0;
            height: 1px;
            box-shadow: none !important;
        }

        body.theme-effective-dark #searchDropdownMenu input {
            color: #f8fafc !important;
        }
        body.theme-effective-dark #searchDropdownMenu input::placeholder {
            color: #94a3b8;
        }

        body.theme-effective-dark .border-slate-100,
        body.theme-effective-dark .border-slate-200,
        body.theme-effective-dark .border-slate-300 {
            border-color: #334155 !important;
        }
        body.theme-effective-dark .bg-slate-50 {
            background-color: #111827 !important;
        }
        body.theme-effective-dark .bg-white {
            background-color: #111827 !important;
        }
        body.theme-effective-dark .hover\\:bg-slate-100:hover {
            background-color: #1e293b !important;
        }

        #settingsDropdownMenu a {
            transition: background-color 0.22s ease, color 0.22s ease;
        }
        body.theme-effective-dark #settingsDropdownMenu a {
            color: #e2e8f0 !important;
        }
        body.theme-effective-dark #settingsDropdownMenu a:hover,
        body.theme-light #settingsDropdownMenu a:hover {
            background-color: #d97706 !important;
            color: #ffffff !important;
        }

        body.theme-effective-dark #mainNav.nav-solid {
            background-color: #0f172a;
            border-bottom-color: #334155;
        }
        body.theme-effective-dark #mainNav.nav-solid .nav-icon-btn,
        body.theme-effective-dark #mainNav.nav-solid .theme-mode-switch {
            background-color: #1e293b;
            border-color: #334155;
        }
        body.theme-effective-dark #mainNav.nav-solid .nav-adaptive {
            color: #f8fafc;
        }
        body.theme-effective-dark #mainNav.nav-solid .nav-adaptive-muted {
            color: #cbd5e1;
        }
        body.theme-effective-dark .theme-mode-btn.active {
            color: #ffffff !important;
        }

        body.theme-effective-dark .text-black,
        body.theme-effective-dark .text-slate-700,
        body.theme-effective-dark .text-slate-800,
        body.theme-effective-dark .text-slate-900,
        body.theme-effective-dark .text-gray-900,
        body.theme-effective-dark .text-gray-800,
        body.theme-effective-dark .text-gray-700 {
            color: #f8fafc !important;
        }

        /* AUTH-AWARE PROFILE UI */
        #userProfileBtn {
            background: #ffffff;
            color: #64748b;
            border-color: #d97706;
        }
        #userProfileBtn .profile-fallback-icon {
            font-size: 15px;
            line-height: 1;
            transition: color 0.35s ease, transform 0.25s ease;
        }
        #userProfileBtn:hover .profile-fallback-icon {
            transform: scale(1.05);
        }
        #userProfileBtn.is-authenticated {
            background: transparent;
        }
        #userProfileBtn img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #userProfileBtn .profile-fallback-icon[hidden],
        #userProfileBtn img[hidden] {
            display: none !important;
        }
        #userDropdownMenu .profile-avatar-large {
            background: #f8fafc;
            color: #64748b;
        }
        #userDropdownMenu .profile-user-name {
            color: #0f172a;
        }
        #userDropdownMenu .profile-user-email {
            color: #64748b;
        }
        #userDropdownMenu .auth-action {
            background: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
        }
        #userDropdownMenu .auth-action:hover {
            background: #d97706;
            color: #ffffff;
            border-color: #d97706;
        }
        body.theme-effective-dark #userProfileBtn {
            background: #1e293b;
            border-color: #f59e0b;
            color: #cbd5e1;
        }
        body.theme-effective-dark #userDropdownMenu .profile-avatar-large {
            background: #1e293b;
            color: #cbd5e1;
            border-color: #475569 !important;
        }
        body.theme-effective-dark #userDropdownMenu .profile-user-name {
            color: #f8fafc !important;
        }
        body.theme-effective-dark #userDropdownMenu .profile-user-email {
            color: #94a3b8 !important;
        }
        body.theme-effective-dark #userDropdownMenu .auth-action {
            background: #1e293b;
            color: #cbd5e1;
            border-color: #334155;
        }
        body.theme-effective-dark #userDropdownMenu .auth-action:hover {
            background: #d97706;
            color: #ffffff;
            border-color: #d97706;
        }

        body.theme-transition,
        body.theme-transition * {
            transition-property: color, background-color, border-color, fill, stroke !important;
            transition-duration: 0.45s !important;
            transition-timing-function: ease !important;
        }

        /* Push page content below the fixed nav */
        #pageHeaderSection {
            padding-top: 112px;
        }

        /* 3-Line Hamburger Icon Click Animation */
        .hamburger-icon {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
        }
        .hamburger-icon.clicked {
            transform: scale(1.25);
        }

        /* Main Page Blur Wrapper */
        #pageContentWrapper {
            transition: filter 0.6s ease-in-out;
        }
        #pageContentWrapper.blurred {
            filter: blur(6px);
            pointer-events: none;
        }

        /* Right Overlay Menu */
        #menuOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: flex-end;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.7s ease, visibility 0.7s ease;
            pointer-events: none;
        }
        #menuOverlay.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        #menuBox {
            transform: translateX(100%);
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #menuOverlay.open #menuBox {
            transform: translateX(0);
        }

        /* Settings Dropdown */
        #settingsDropdownMenu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(0.96);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        #settingsDropdownMenu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;

                .then(response => {
                    if (!response.ok) throw new Error('Unable to load footer.html');
                    return response.text();
                })
                .then(html => {
                    const template = document.createElement('template');
                    template.innerHTML = html;

                    const scripts = Array.from(template.content.querySelectorAll('script'));
                    scripts.forEach(script => script.remove());

                    container.replaceChildren(template.content.cloneNode(true));

                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        for (const attr of oldScript.attributes) {
                            newScript.setAttribute(attr.name, attr.value);
                        }
                        newScript.textContent = oldScript.textContent;
                        document.body.appendChild(newScript);
                        newScript.remove();
                    });
                })
                .catch(error => {
                    console.error(error);
                    container.innerHTML = '<div style="padding:32px;text-align:center;color:#94a3b8;background:#0f172a;">Footer failed to load.</div>';

    <script>

        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        // Supabase Connection
        const SUPABASE_URL = 'https://zjbvnwawdgdncthktqtx.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_KLOwVeJVKzC8Lo2slNnH0A_PdhW5BlT';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        /* ---- Header scroll behavior (same as index.html) ---- */
        (function () {
            const nav = document.getElementById('mainNav');
            if (!nav) return;

            let lastScrollY = window.scrollY;
            let ticking = false;

            function handleNavScroll() {
                const currentScrollY = window.scrollY;
                const pastTop = currentScrollY > 4;

                nav.classList.toggle('nav-solid', pastTop);

                if (currentScrollY <= 4) {
                    nav.classList.remove('nav-hidden');
                } else if (currentScrollY > lastScrollY) {
                    nav.classList.add('nav-hidden');
                } else if (currentScrollY < lastScrollY) {
                    nav.classList.remove('nav-hidden');
                }

                lastScrollY = currentScrollY;
                ticking = false;
            }

            window.addEventListener('scroll', function () {
                if (!ticking) {
                    window.requestAnimationFrame(handleNavScroll);
                    ticking = true;
                }
            }, { passive: true });

            handleNavScroll();
        })();

        // ================================================================
        // Supabase AUTH -> PROFILE BUTTON / DROPDOWN (identical to index.html)
        // ================================================================
        function getUserAvatarUrl(user) {
            if (!user) return '';
            const metadata = user.user_metadata || {};
            const identities = Array.isArray(user.identities) ? user.identities : [];
            const identityData = identities[0] && identities[0].identity_data ? identities[0].identity_data : {};
            return metadata.avatar_url ||
                   metadata.picture ||
                   metadata.profile_image ||
                   metadata.photo_url ||
                   identityData.avatar_url ||
                   identityData.picture ||
                   '';
        }

        function getUserDisplayName(user) {
            if (!user) return 'Guest User';
            const metadata = user.user_metadata || {};
            return metadata.full_name ||
                   metadata.name ||
                   metadata.user_name ||
                   metadata.username ||
                   (user.email ? user.email.split('@')[0] : 'User');
        }

        function setProfileImage(img, fallback, url) {
            if (!img || !fallback) return;
            if (!url) {
                img.hidden = true;
                img.removeAttribute('src');
                fallback.hidden = false;
                return;
            }
            img.onload = function () {
                img.hidden = false;
                fallback.hidden = true;
            };
            img.onerror = function () {
                img.hidden = true;
                img.removeAttribute('src');
                fallback.hidden = false;
            };
            img.src = url;
        }

        function updateProfileUI(user) {
            const profileBtn = document.getElementById('userProfileBtn');
            const profileImg = document.getElementById('userProfileImage');
            const profileFallback = document.getElementById('userProfileFallback');
            const dropdownImg = document.getElementById('userDropdownImage');
            const dropdownFallback = document.getElementById('userDropdownFallback');
            const nameEl = document.getElementById('profileUserName');
            const emailEl = document.getElementById('profileUserEmail');
            const authAction = document.getElementById('profileAuthAction');
            const authIcon = document.getElementById('profileAuthActionIcon');
            const authText = document.getElementById('profileAuthActionText');

            const loggedIn = !!user;

            if (profileBtn) {
                profileBtn.classList.toggle('is-authenticated', loggedIn);
                profileBtn.title = loggedIn ? 'Profile' : 'Log in';
            }

            const avatarUrl = getUserAvatarUrl(user);
            setProfileImage(profileImg, profileFallback, avatarUrl);
            setProfileImage(dropdownImg, dropdownFallback, avatarUrl);

            if (nameEl) nameEl.textContent = loggedIn ? getUserDisplayName(user) : 'Guest User';
            if (emailEl) emailEl.textContent = loggedIn ? (user.email || 'Signed in') : 'Not logged in';

            if (authAction && authIcon && authText) {
                if (loggedIn) {
                    authAction.href = '#';
                    authAction.title = 'Log out';
                    authIcon.className = 'fa-solid fa-right-from-bracket';
                    authText.textContent = 'LOG OUT';
                    authAction.onclick = handleLogout;
                } else {
                    authAction.href = 'login.html';
                    authAction.title = 'Log in';
                    authIcon.className = 'fa-solid fa-right-to-bracket';
                    authText.textContent = 'LOG IN';
                    authAction.onclick = null;
                }
            }
        }

        async function handleLogout(event) {
            if (event) event.preventDefault();
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                updateProfileUI(null);
                const dropdown = document.getElementById('userDropdownMenu');
                if (dropdown) dropdown.classList.remove('open');
            } catch (error) {
                console.error('Logout failed:', error);
            }
        }

        async function initAuthState() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                updateProfileUI(session ? session.user : null);
                supabaseClient.auth.onAuthStateChange(function (_event, newSession) {
                    updateProfileUI(newSession ? newSession.user : null);
                });
            } catch (error) {
                console.error('Auth state initialization failed:', error);
                updateProfileUI(null);
            }
        }

        // Toggle Settings Dropdown Box with Animation
        function toggleSettingsDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('settingsDropdownMenu');
            const userDropdown = document.getElementById('userDropdownMenu');
            const searchDropdown = document.getElementById('searchDropdownMenu');
            const searchBoxWrap = document.getElementById('searchBoxWrap');
            const iconGroup = document.getElementById('homeContactLoginGroup');
            if(userDropdown) userDropdown.classList.remove('open');
            if(searchDropdown) searchDropdown.classList.remove('open');
            if(searchBoxWrap) searchBoxWrap.classList.remove('search-open');
            if(iconGroup) iconGroup.classList.remove('icons-pushed');
            dropdown.classList.toggle('open');
        }

        // Toggle User Profile Dropdown Box with Animation
        function toggleUserDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('userDropdownMenu');
            const searchDropdown = document.getElementById('searchDropdownMenu');
            const searchBoxWrap = document.getElementById('searchBoxWrap');
            const settingsDropdown = document.getElementById('settingsDropdownMenu');
            const iconGroup = document.getElementById('homeContactLoginGroup');
            if(searchDropdown) searchDropdown.classList.remove('open');
            if(searchBoxWrap) searchBoxWrap.classList.remove('search-open');
            if(settingsDropdown) settingsDropdown.classList.remove('open');
            if(iconGroup) iconGroup.classList.remove('icons-pushed');
            dropdown.classList.toggle('open');
        }

        // Toggle Search Box
        function toggleSearchDropdown(event) {
            event.stopPropagation();
            const wrap = document.getElementById('searchBoxWrap');
            const searchDropdown = document.getElementById('searchDropdownMenu');
            const userDropdown = document.getElementById('userDropdownMenu');
            const settingsDropdown = document.getElementById('settingsDropdownMenu');
            const iconGroup = document.getElementById('homeContactLoginGroup');
            if(userDropdown) userDropdown.classList.remove('open');
            if(settingsDropdown) settingsDropdown.classList.remove('open');

            const isOpen = searchDropdown.classList.contains('open');

            if (!isOpen) {
                searchDropdown.classList.add('open');
                wrap.classList.add('search-open');
                if(iconGroup) iconGroup.classList.add('icons-pushed');
                document.getElementById('projectSearchInput').focus();
            } else {
                const query = document.getElementById('projectSearchInput').value.trim();
                if (query) {
                    executeSearch();
                } else {
                    searchDropdown.classList.remove('open');
                    wrap.classList.remove('search-open');
                    if(iconGroup) iconGroup.classList.remove('icons-pushed');
                }
            }
        }

        // Window click handler
        window.addEventListener('click', function(e) {
            const userDropdown = document.getElementById('userDropdownMenu');
            const profileBtn = document.getElementById('userProfileBtn');
            if (userDropdown && userDropdown.classList.contains('open')) {
                if (!userDropdown.contains(e.target) && !profileBtn.contains(e.target)) {
                    userDropdown.classList.remove('open');
                }
            }

            const settingsDropdown = document.getElementById('settingsDropdownMenu');
            const settingsBtn = document.getElementById('settingsIconBtn');
            if (settingsDropdown && settingsDropdown.classList.contains('open')) {
                if (!settingsDropdown.contains(e.target) && !settingsBtn.contains(e.target)) {
                    settingsDropdown.classList.remove('open');
                }
            }

            const searchBoxWrap = document.getElementById('searchBoxWrap');
            const searchDropdown = document.getElementById('searchDropdownMenu');
            if (searchDropdown && searchDropdown.classList.contains('open')) {
                if (searchBoxWrap && !searchBoxWrap.contains(e.target)) {
                    searchDropdown.classList.remove('open');
                    searchBoxWrap.classList.remove('search-open');
                    const iconGroup = document.getElementById('homeContactLoginGroup');
                    if(iconGroup) iconGroup.classList.remove('icons-pushed');
                }
            }

            document.querySelectorAll('.media-menu:not(.hidden)').forEach(function(menu) {
                const wrap = menu.closest('.media-menu-wrap');
                if (wrap && !wrap.contains(e.target)) {
                    menu.classList.add('hidden');
                    menu.querySelectorAll('.media-menu-item.open').forEach(function(item) {
                        item.classList.remove('open');
                    });
                }
            });
        });

        // Toggle a project card's MEDIA dropdown (OPENING / ONGOING / PROPOSAL)
        function toggleMediaMenu(event, index) {
            event.stopPropagation();
            const menu = document.getElementById('mediaMenu-' + index);
            if (!menu) return;
            const isOpen = !menu.classList.contains('hidden');

            document.querySelectorAll('.media-menu').forEach(function(m) {
                if (m !== menu) {
                    m.classList.add('hidden');
                    m.querySelectorAll('.media-menu-item.open').forEach(function(item) { item.classList.remove('open'); });
                }
            });

            menu.classList.toggle('hidden', isOpen);

            if (isOpen) {
                menu.querySelectorAll('.media-menu-item.open').forEach(function(item) { item.classList.remove('open'); });
            } else {
                requestAnimationFrame(function() {
                    menu.querySelectorAll('.media-submenu').forEach(function(sub) {
                        sub.classList.remove('flip-left');
                        const rect = sub.getBoundingClientRect();
                        if (rect.right > window.innerWidth - 8) {
                            sub.classList.add('flip-left');
                        }
                    });
                });
            }
        }

        document.addEventListener('click', function(e) {
            const item = e.target.closest('.media-menu-item');
            if (!item) return;
            if (e.target.closest('.media-submenu')) return;
            e.stopPropagation();
            const menu = item.closest('.media-menu');
            menu.querySelectorAll('.media-menu-item').forEach(function(i) {
                if (i !== item) i.classList.remove('open');
            });
            item.classList.toggle('open');

            const sub = item.querySelector('.media-submenu');
            if (sub && item.classList.contains('open')) {
                requestAnimationFrame(function() {
                    sub.classList.remove('flip-left');
                    const rect = sub.getBoundingClientRect();
                    if (rect.right > window.innerWidth - 8) {
                        sub.classList.add('flip-left');
                    }
                });
            }
        });

        document.addEventListener('mouseover', function(e) {
            const item = e.target.closest('.media-menu-item');
            if (!item) return;
            const sub = item.querySelector('.media-submenu');
            if (!sub) return;
            requestAnimationFrame(function() {
                sub.classList.remove('flip-left');
                const rect = sub.getBoundingClientRect();
                if (rect.right > window.innerWidth - 8) {
                    sub.classList.add('flip-left');
                }
            });
        });

        // Search Projects Functionality
        function executeSearch() {
            const query = document.getElementById('projectSearchInput').value.trim().toUpperCase();
            const feedback = document.getElementById('searchResultFeedback');

            if(!query) {
                feedback.textContent = "Please enter project details.";
                feedback.classList.remove('hidden');
                feedback.className = "absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-red-500 z-50";
                return;
            }

            const cards = document.querySelectorAll('#allProjectsGrid > div[data-project-code]');
            let matchCount = 0;

            cards.forEach(card => {
                const code = card.getAttribute('data-project-code') || '';
                const hoNum = card.getAttribute('data-ho-number') || '';
                const pName = card.getAttribute('data-project-name') || '';
                const org = card.getAttribute('data-org') || '';
                const donor = card.getAttribute('data-donor') || '';
                const country = card.getAttribute('data-country') || '';
                const location = card.getAttribute('data-location') || '';

                if(
                    code.toUpperCase().includes(query) ||
                    hoNum.toUpperCase().includes(query) ||
                    pName.toUpperCase().includes(query) ||
                    org.toUpperCase().includes(query) ||
                    donor.toUpperCase().includes(query) ||
                    country.toUpperCase().includes(query) ||
                    location.toUpperCase().includes(query)
                ) {
                    matchCount++;
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    card.classList.add('ring-4', 'ring-amber-500', 'scale-[1.02]');
                    setTimeout(() => {
                        card.classList.remove('ring-4', 'ring-amber-500', 'scale-[1.02]');
                    }, 3000);
                }
            });

            feedback.classList.remove('hidden');
            if(matchCount > 0) {
                feedback.className = "absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-emerald-600 font-semibold z-50";
                feedback.textContent = `Found ${matchCount} matching project(s)!`;

                setTimeout(() => {
                    document.getElementById('searchDropdownMenu').classList.remove('open');
                    document.getElementById('searchBoxWrap').classList.remove('search-open');
                    const iconGroup = document.getElementById('homeContactLoginGroup');
                    if(iconGroup) iconGroup.classList.remove('icons-pushed');
                    feedback.classList.add('hidden');
                }, 3000);
            } else {
                feedback.className = "absolute right-24 top-16 text-[11px] bg-white px-3 py-1 rounded shadow-md border text-red-500 font-semibold z-50";
                feedback.textContent = `No match found for "${query}".`;
            }
        }

        function handleProjectSearch(event) {
            if(event.key === 'Enter') {
                executeSearch();
            }
        }

        // Light / Dynamic / Dark theme mode switch (identical to index.html)
        function setThemeMode(mode) {
            const validModes = ['light', 'dynamic', 'dark'];
            if (!validModes.includes(mode)) mode = 'dynamic';

            const switcher = document.getElementById('themeModeSwitch');
            const buttons = document.querySelectorAll('.theme-mode-btn');
            const indexMap = { light: 0, dynamic: 1, dark: 2 };

            buttons.forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
            });

            if (switcher) {
                switcher.style.setProperty('--theme-index', indexMap[mode]);
            }

            const body = document.body;
            body.classList.add('theme-transition');
            body.classList.remove('theme-light', 'theme-dynamic', 'theme-dark', 'theme-effective-dark');
            body.classList.add('theme-' + mode);

            const prefersDark = window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches;

            const isEffectiveDark = mode === 'dark' || (mode === 'dynamic' && prefersDark);

            if (isEffectiveDark) {
                body.classList.add('theme-effective-dark');
            }

            document.documentElement.classList.toggle('dark', isEffectiveDark);

            try {
                const menuFrame = document.getElementById('menuLinksFrame');
                if (menuFrame && menuFrame.contentWindow) {
                    menuFrame.contentWindow.postMessage({ type: 'ynad-theme', dark: isEffectiveDark }, '*');
                }
            } catch (e) {}

            window.clearTimeout(window.__ynadThemeTransitionTimer);
            window.__ynadThemeTransitionTimer = window.setTimeout(function() {
                body.classList.remove('theme-transition');
            }, 500);

            try { localStorage.setItem('ynad-theme-mode', mode); } catch (e) {}
        }

        window.addEventListener('message', function(e) {
            if (!e.data || typeof e.data !== 'object') return;
            if (e.data.type === 'ynad-request-theme') {
                const isEffectiveDark = document.body.classList.contains('theme-effective-dark');
                try {
                    const menuFrame = document.getElementById('menuLinksFrame');
                    if (menuFrame && menuFrame.contentWindow && e.source === menuFrame.contentWindow) {
                        menuFrame.contentWindow.postMessage({ type: 'ynad-theme', dark: isEffectiveDark }, '*');
                    }
                } catch (err) {}
            }
        });

        (function initThemeMode() {
            let saved = 'dynamic';
            try { saved = localStorage.getItem('ynad-theme-mode') || 'dynamic'; } catch (e) {}

            document.addEventListener('DOMContentLoaded', function() {
                setThemeMode(saved);

                if (window.matchMedia) {
                    const media = window.matchMedia('(prefers-color-scheme: dark)');
                    const syncDynamicTheme = function() {
                        if (document.body.classList.contains('theme-dynamic')) {
                            setThemeMode('dynamic');
                        }
                    };

                    if (media.addEventListener) {
                        media.addEventListener('change', syncDynamicTheme);
                    } else if (media.addListener) {
                        media.addListener(syncDynamicTheme);
                    }
                }
            });
        })();

        // Open Menu with Blur Effect
        function openMenuWithEffect() {
            const icon = document.getElementById('hamburgerBtnIcon');
            const pageWrapper = document.getElementById('pageContentWrapper');
            const overlay = document.getElementById('menuOverlay');
            const menuFrame = document.getElementById('menuLinksFrame');

            icon.classList.add('clicked');

            setTimeout(() => {
                icon.classList.remove('clicked');
                pageWrapper.classList.add('blurred');

                setTimeout(() => {
                    menuFrame.src = 'menu.html';
                    overlay.classList.add('open');
                    document.body.style.overflow = 'hidden';

                    menuFrame.onload = function () {
                        try {
                            menuFrame.contentWindow.postMessage({ type: 'ynad-menu-open' }, '*');
                        } catch (e) {}
                    };
                }, 200);

            }, 200);
        }

        // Close Menu
        function closeMenuWithEffect() {
            const overlay = document.getElementById('menuOverlay');
            const pageWrapper = document.getElementById('pageContentWrapper');
            const menuFrame = document.getElementById('menuLinksFrame');

            try{
                if(menuFrame && menuFrame.contentWindow){
                    menuFrame.contentWindow.postMessage({
                        type:'ynad-menu-closing'
                    }, '*');
                }
            }catch(e){}

            setTimeout(() => {
                overlay.classList.remove('open');

                setTimeout(() => {
                    pageWrapper.classList.remove('blurred');
                    document.body.style.overflow = 'auto';
                    menuFrame.src = 'about:blank';
                }, 400);

            }, 380);
        }

        function handleOverlayClick(event) {
            if (event.target === document.getElementById('menuOverlay')) {
                closeMenuWithEffect();
            }
        }

        // Project Card Image Slider Function
        const cardImageIndices = {};
        function changeCardImage(cardId, direction) {
            const slider = document.getElementById('cardImages-' + cardId);
            const totalImages = slider.children.length;
            cardImageIndices[cardId] = ((cardImageIndices[cardId] || 0) + direction + totalImages) % totalImages;
            slider.style.transform = `translateX(-${cardImageIndices[cardId] * 100}%)`;
        }

        /* ---- Scroll-triggered fade-in (left -> right) for cards ---- */
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                } else {
                    entry.target.classList.remove('revealed');
                }
            });
        }, { threshold: 0.15 });

        function observeRevealTargets(root) {
            root.querySelectorAll('.reveal-fade-left').forEach(el => revealObserver.observe(el));
        }

        const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1590381105924-c72589b9ef3f?auto=format&fit=crop&w=600&q=80';

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function ordinalSuffix(n) {
            const rem100 = n % 100;
            if (rem100 >= 11 && rem100 <= 13) return n + 'th';
            switch (n % 10) {
                case 1: return n + 'st';
                case 2: return n + 'nd';
                case 3: return n + 'rd';
                default: return n + 'th';
            }
        }

        function buildOngoingVideoLinksHtml(totalOngoingVideos) {
            const count = Number(totalOngoingVideos) || 0;
            if (count <= 0) return '';
            let html = '';
            for (let n = count; n >= 1; n--) {
                html += `<a href="#" onclick="return false;">${ordinalSuffix(n)} video</a>\n`;
            }
            return html;
        }

        function normalizePhotoUrls(raw) {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw.filter(Boolean);
            if (typeof raw === 'string') {
                try {
                    const parsed = JSON.parse(raw);
                    return Array.isArray(parsed) ? parsed.filter(Boolean) : [raw];
                } catch (e) {
                    return raw.includes(',') ? raw.split(',').map(s => s.trim()).filter(Boolean) : [raw];
                }
            }
            return [];
        }

        // Identical card markup/behavior to index.html's Recent Projects cards
        function buildProjectCardHTML(project, index) {
            const parsedPhotos = normalizePhotoUrls(project.photo_urls);
            const photos = parsedPhotos.length > 0 ? parsedPhotos : [FALLBACK_IMAGE];

            const imagesHtml = photos.map(url => `
                <div class="zoom-wrapper flex-shrink-0 w-full h-full cursor-pointer">
                    <img src="${escapeHtml(url)}" class="project-img-item" alt="${escapeHtml(project.project_name || 'Project image')}" loading="lazy">
                </div>
            `).join('');

            return `
            <div id="project-card-${index}"
                 data-project-code="${escapeHtml(project.bd_number)}"
                 data-ho-number="${escapeHtml(project.ho_number)}"
                 data-project-name="${escapeHtml(project.project_name)}"
                 data-org="${escapeHtml(project.organization)}"
                 data-donor="${escapeHtml(project.donor_name)}"
                 data-country="${escapeHtml(project.donated_country)}"
                 data-location="${escapeHtml(project.district)}"
                 class="recent-project-card reveal-fade-left"
                 style="transition-delay: ${Math.min(index, 3) * 0.08}s;">

                <div class="recent-project-image zoom-container">
                    <div id="cardImages-${index}" class="recent-project-image-track">
                        ${imagesHtml}
                    </div>
                </div>

                <div class="recent-project-bottom">
                    <div class="recent-project-info">
                        <div class="recent-project-info-left">
                            <h4 class="recent-project-title">${escapeHtml(project.project_name || '')}</h4>
                            <div class="recent-project-location">${escapeHtml(project.district || '')}</div>
                        </div>
                        ${(project.bd_number || project.ho_number) ? `
                        <div class="recent-project-code">
                            ${project.bd_number ? `<span>${escapeHtml(project.bd_number)}</span>` : ''}
                            ${(project.bd_number && project.ho_number) ? `<span class="code-divider"></span>` : ''}
                            ${project.ho_number ? `<span>HO-${escapeHtml(project.ho_number)}</span>` : ''}
                        </div>` : ''}
                    </div>

                    <div class="recent-project-actions">
                        <a href="${project.documents_url ? escapeHtml(project.documents_url) : '#'}"
                           target="${project.documents_url ? '_blank' : '_self'}"
                           class="recent-project-action docs"
                           ${project.documents_url ? '' : 'onclick="return false;"'}>
                            <i class="fa-solid fa-file-lines"></i>
                            <span>DOCUMENTS</span>
                        </a>

                        <div class="media-menu-wrap relative">
                            <button type="button" onclick="toggleMediaMenu(event, ${index})" class="recent-project-action media w-full cursor-pointer">
                                <i class="fa-solid fa-photo-film"></i>
                                <span>MEDIA</span>
                            </button>

                            <div id="mediaMenu-${index}" class="media-menu hidden">
                                <div class="media-menu-item" data-sub="opening-${index}">
                                    <span>OPENING</span><i class="fa-solid fa-chevron-right"></i>
                                    <div class="media-submenu">
                                        <a href="#" onclick="return false;">VIDEO</a>
                                        <a href="#" onclick="return false;">RAW PHOTO</a>
                                        <a href="#" onclick="return false;">RAW VIDEO</a>
                                    </div>
                                </div>
                                <div class="media-menu-item" data-sub="ongoing-${index}">
                                    <span>ONGOING</span><i class="fa-solid fa-chevron-right"></i>
                                    <div class="media-submenu">
                                        ${buildOngoingVideoLinksHtml(project.ongoing_video_count ?? 3)}
                                        <a href="#" onclick="return false;">RAW PHOTO</a>
                                        <a href="#" onclick="return false;">RAW VIDEO</a>
                                    </div>
                                </div>
                                <div class="media-menu-item" data-sub="proposal-${index}">
                                    <span>PROPOSAL</span><i class="fa-solid fa-chevron-right"></i>
                                    <div class="media-submenu">
                                        <a href="#" onclick="return false;">VIDEO</a>
                                        <a href="#" onclick="return false;">RAW PHOTO</a>
                                        <a href="#" onclick="return false;">RAW VIDEO</a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <a href="${project.location_link ? escapeHtml(project.location_link) : '#'}"
                           target="${project.location_link ? '_blank' : '_self'}"
                           class="recent-project-action location"
                           ${project.location_link ? '' : 'onclick="return false;"'}>
                            <i class="fa-solid fa-location-dot"></i>
                            <span>LOCATION</span>
                        </a>
                    </div>
                </div>
            </div>`;
        }

        let currentFilter = 'all';

        async function loadAllProjects() {
            const grid = document.getElementById('allProjectsGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-16 text-slate-400 text-sm tracking-wide uppercase">Loading projects...</div>';

            let query = supabaseClient
                .from('projects')
                .select('*')
                .order('opening_date', { ascending: false, nullsFirst: false });

            if (currentFilter !== 'all') {
                query = query.eq('status', currentFilter);
            }

            const { data, error } = await query;

            if (error) {
                console.error(error);
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-red-500 text-sm">Failed to load projects: ${escapeHtml(error.message)}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-16 text-slate-400 text-sm tracking-wide uppercase">No projects found.</div>';
                return;
            }

            grid.innerHTML = '';
            data.forEach((project, index) => {
                grid.insertAdjacentHTML('beforeend', buildProjectCardHTML(project, index));
                cardImageIndices[index] = 0;
            });

            observeRevealTargets(grid);
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-filter') === filter);
            });
            loadAllProjects();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadAllProjects();
            observeRevealTargets(document);
            initAuthState();

            const loadingProgress = document.getElementById('pageLoadingProgress');
            const finishPageLoad = () => {
                if (!loadingProgress) return;
                loadingProgress.style.width = '100%';
                setTimeout(() => {
                    loadingProgress.style.opacity = '0';
                }, 250);
                setTimeout(() => {
                    const bar = document.getElementById('pageLoadingBar');
                    if (bar) bar.style.display = 'none';
                }, 650);
            };

            if (loadingProgress) {
                requestAnimationFrame(() => {
                    loadingProgress.style.width = '72%';
                });
            }

            if (document.readyState === 'complete') {
                finishPageLoad();
            } else {
                window.addEventListener('load', finishPageLoad, { once: true });
            }
        });
    </script>
</body>
</html>
